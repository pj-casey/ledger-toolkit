        ? <div style={{display:'flex',alignItems:'center',gap:6,minWidth:0}}>
            <span className="mono" style={{fontSize:9,color:'var(--bi-fg-3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1,minWidth:0}}>{acct.addr||(acct.cid+'…')}</span>
            {/* Compact fiat — restores the sort-by-fiat value dropped from the narrow-column grid */}
            <span className="mono" style={{fontSize:10,color:'var(--bi-fg-3)',flexShrink:0,whiteSpace:'nowrap'}}>{fiat!=null&&fiat>0?fmtFiat(fiat):'—'}</span>
          </div>
        : <span className="mono" style={{fontSize:9,color:'var(--bi-fg-3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{acct.addr||(acct.cid+'…')}</span>}
    </div>
    {/* Balance + fiat — hidden in narrow-column (wide side-by-side) mode; this data stays visible in the inspector header for the selected account */}
    {!isNarrowCol&&<div className={'mono'+(settle?' bi-settle-slow':'')} style={{textAlign:'right',minWidth:0}}>
      {liveBalance?.status==='loading'
        ?<span className="bi-skel" style={{width:48,height:9}}/>
        :bal!=null
          ?<>
            <div style={{fontSize:11,color:liveFunded?'var(--bi-positive)':'var(--bi-fg-2)',fontWeight:500,lineHeight:1.1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{bal.toLocaleString(undefined,{maximumFractionDigits:bal>=1?4:6})} <span style={{color:'var(--bi-fg-4)',fontWeight:400}}>{ch.ticker}</span></div>
            {fiat!=null&&fiat>0&&<div style={{fontSize:9,color:'var(--bi-fg-3)',marginTop:1}}>{fmtFiat(fiat)}</div>}
          </>
          :<span style={{fontSize:10,color:'var(--bi-fg-3)'}}>—</span>}
    </div>}
    {/* Ops — hidden in narrow-column mode (same rationale as balance) */}
    {!isNarrowCol&&<span className="mono" style={{fontSize:10,color:acct.ops>0?'var(--bi-cat-3)':'var(--bi-fg-4)',textAlign:'right'}}>
      {acct.ops>0?acct.ops+' op'+(acct.ops!==1?'s':''):'—'}
    </span>}
    {/* Error indicator */}
    <span style={{width:8,height:8,borderRadius:'50%',background:errCount>0?'#D94747':'transparent',flexShrink:0}} title={errCount>0?errCount+' error'+(errCount!==1?'s':''):''}/>
  </div>;
}

// fullHeight (wide side-by-side mode): the inspector fills its column. The existing two-row split already
// satisfies this — root is height:100%, Row 1 is flex '0 0 140px' when tokens/xpub, Row 2 is flex '1 1 0'
// with internal overflow:auto — so no change to the protected two-row internals is needed to honor it.
function AcctDrill({acct,errCount,deviceApps,liveBalance,liveTokenBalance,setLiveTokenBalances,versionCheck,onErrClick,onTimelineClick,onFocus,focusedAcct,fullHeight}){
  const[tokV,setTokV]=useState(0);
  const settle=useSettleFlash(liveBalance?.status,{slow:true});   // Q2: 700ms arrival flash (single inspector value)
  // Token loading: re-fires when the selected acct.id changes (replaces the old `open` trigger).
  useEffect(()=>{
    if(!acct)return;
    if(!EVM_CHAIN_IDS[acct.cid])return;
    let cancelled=false;
    (async()=>{
      setLiveTokenBalances?.(p=>({...p,[acct.id]:{status:'loading',tokens:p[acct.id]?.tokens||{}}}));
      if(acct.toks.length===0&&/^0x[0-9a-fA-F]{40}$/.test(acct.addr||'')){
        const discovered=await discoverTokensOnChain(acct.cid,acct.addr);
        if(cancelled)return;
        for(const d of discovered){
          const tid=`${acct.cid}/erc20/${d.contract}`;
          TOKEN_METADATA[tid]={contractAddress:d.contract,ticker:d.symbol,name:d.name,decimals:d.decimals,delisted:false};
          TOKEN_CONTRACTS[tid]=d.contract;
          acct.toks.push({tokenId:tid,tokenTicker:d.symbol,operationsLength:0,parentCurrencyName:null,parentDerivationMode:'',votesCount:0,_discovered:true});
        }
        if(discovered.length>0){
          if(!acct.tokSource||acct.tokSource==='none')acct.tokSource='discovered';
          setTokV(v=>v+1);
        }
      }
      const evmTokenIds=acct.toks.map(tk=>tk.tokenId||'').filter(id=>{
        const ch=id.split('/')[0];
        return id&&EVM_CHAIN_IDS[ch];
      });
      if(!evmTokenIds.length){
        if(!cancelled)setLiveTokenBalances?.(p=>({...p,[acct.id]:{status:'ok',tokens:{}}}));
        return;
      }
      const iconPromise=ICON_INDEX?null:fetchIconIndex();
      const newMeta=await fetchTokenMetadata(evmTokenIds.filter(id=>!TOKEN_METADATA[id]));
      if(cancelled)return;
      if(newMeta)setTokV(v=>v+1);
      if(iconPromise){iconPromise.then(()=>{if(!cancelled)setTokV(v=>v+1);});}
      const contractsByTokenId={};
      for(const id of evmTokenIds){const ca=TOKEN_METADATA[id]?.contractAddress;if(ca)contractsByTokenId[id]=ca;}
      const contracts=Object.values(contractsByTokenId);
      if(!contracts.length){
        if(!cancelled)setLiveTokenBalances?.(p=>({...p,[acct.id]:{status:'ok',tokens:{}}}));
        return;
      }
      const chain=acct.cid,owner=acct.addr;
      const[balRes,fiatRes]=await Promise.allSettled([
        fetchTokenBalances(chain,owner,contracts).catch(()=>new Map()),
        fetchTokenFiat(chain,contracts).catch(()=>new Map()),
      ]);
      if(cancelled)return;
      const bals=balRes.status==='fulfilled'?balRes.value:new Map();
      const fiats=fiatRes.status==='fulfilled'?fiatRes.value:new Map();
      const tokens={};
      for(const[tokenId,ca] of Object.entries(contractsByTokenId)){
        const lc='0x'+ca.replace(/^0x/i,'').toLowerCase();
        const rawBal=bals.get(lc);
        const fiatEntry=fiats.get(lc);
        const dec=getTokenInfo(tokenId,acct.cid).decimals;
        const bal=rawBal!=null?Number(rawBal)/Math.pow(10,dec):null;
        const price=fiatEntry?.price??null;
        const liquidity=fiatEntry?.liquidity||0;
        const fiat=bal!=null&&price!=null?bal*price:null;
        tokens[tokenId]={bal,fiat,rawBal:rawBal!=null?String(rawBal):null,liquidity,price,status:rawBal==null?'error':'ok'};
      }
      setLiveTokenBalances?.(p=>({...p,[acct.id]:{status:'ok',tokens}}));
    })();
    return()=>{cancelled=true;};
  },[acct?.id]);

  if(!acct){
    return <div style={{padding:'40px 24px',textAlign:'center',color:'var(--bi-fg-3)'}}>
      <div style={{fontSize:13,color:'var(--bi-fg-2)',fontWeight:500,marginBottom:4}}>No account selected</div>
      <div style={{fontSize:11}}>Click a row above to inspect</div>
    </div>;
  }
  const ch=acct.ch;
  const liveFunded=liveBalance&&liveBalance.status==='ok'&&liveBalance.bal>0;
  let eUrl=null;try{eUrl=ch.url?.(acct.addr);}catch{}
  const hasExp=eUrl&&eUrl!=='#';
  const canX=acct.isXpub&&ch.xc;
  const isFocused=focusedAcct&&focusedAcct.addr===acct.addr&&focusedAcct.cid===acct.cid;
  const appBadge=(()=>{
    const appName=CURRENCY_TO_APP[acct.cid];
    if(!appName||!deviceApps)return null;
    let status=null,latestVer=null;
    const vcApp=versionCheck?.status==='ok'&&versionCheck.apps?.find(a=>a.name.toLowerCase()===appName.toLowerCase());
    if(vcApp){
      if(vcApp.installed===null)status='missing';
      else if(vcApp.outdated){status='outdated';latestVer=vcApp.latest;}
      else status='current';
    }else if(deviceApps.source==='manager-result'){
      const inst=deviceApps.installed?.find(i=>i.name.toLowerCase()===appName.toLowerCase());
      if(!inst)status='missing';
      else if(!inst.updated)status='outdated';
      else status='current';
    }
    if(!status||status==='current')return null;
    const hasErrors=errCount>0;
    const sev=status==='missing'?{c:'#D94747',l:`Can't transact · ${appName} not installed`}:{c:hasErrors?'#D94747':'#E88A4A',l:`${appName} outdated${latestVer?' · latest v'+latestVer:''}`};
    return <span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 8px',borderRadius:2,fontSize:10,fontWeight:600,background:sev.c+'14',color:sev.c,border:'1px solid '+sev.c+'40'}}>⚠ {sev.l}</span>;
  })();

  /* ── 4-COLUMN DRILL — spec layout (0.9fr 1fr 1fr 1.1fr).
     Each column scrolls independently so heavy content in one (e.g. 12 tokens
     on an EVM account) doesn't push the other columns below the fold. ── */
  const colStyle={padding:'10px 14px',display:'flex',flexDirection:'column',minHeight:0,overflow:'auto'};
  const colDivider={borderRight:'1px solid var(--bi-border)'};
  const emptyState=msg=><div style={{fontSize:10,color:'var(--bi-fg-3)',fontStyle:'italic',padding:'4px 0'}}>{msg}</div>;
  const kvRow=(k,v,opts={})=>{
    const{mono=false,c='var(--bi-fg-1)',full=null}=opts;
    return <div key={k} style={{display:'flex',justifyContent:'space-between',gap:8,fontSize:11,lineHeight:1.45}}>
      <span style={{color:'var(--bi-fg-3)',flexShrink:0}}>{k}</span>
      <span className={mono?'mono':''} title={full||v} style={{color:c,fontSize:mono?10:11,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',textAlign:'right',minWidth:0}}>{v}</span>
    </div>;
  };

  /* Row 2 visibility — render the full-width tokens/UTXO detail only for chains
     that actually carry that data. Simple chains (SOL native, XTZ, ATOM, DOT,
     NEAR, ADA, etc.) skip it entirely, leaving the drill at ~140px. */
  const showRow2=acct.toks.length>0||canX;

  return <div key={acct.id} className="bi-slide-down" style={{
    display:'flex',
    flexDirection:'column',
    height:'100%',
    minHeight:0,
    overflow:'hidden',
    borderTop:'1px solid var(--bi-border)',
    background:'var(--bi-bg-strip,var(--bi-bg-card))',
  }}>

    {/* ═══ ROW 1 — 4-column summary grid (~140px; 170px in fullHeight/wide mode so the Tokens chip + Address line don't clip) ═══ */}
    <div style={{
      display:'grid',
      gridTemplateColumns:'0.9fr 1fr 1fr 1.1fr',
      flex:showRow2?(fullHeight?'0 0 170px':'0 0 140px'):'1 1 0',
      minHeight:0,
      overflow:'hidden',
    }}>

    {/* ═══ Col 1 — Identity & technicals ═══ */}
    <div style={{...colStyle,...colDivider,borderLeft:'3px solid '+ch.color}}>
      {/* Header — chain swatch + name + ticker */}
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6,flexShrink:0}}>
        <div style={{width:20,height:20,borderRadius:2,background:ch.color+'20',display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',flexShrink:0}}>
          {(()=>{const u=chainIconUrl(acct.cid);return u?<img src={u} alt={ch.ticker} width={14} height={14} style={{borderRadius:2}} onError={e=>{e.target.style.display='none';if(e.target.nextSibling)e.target.nextSibling.style.display='inline-flex';}}/>:null;})()}
          <span className="mono" style={{display:chainIconUrl(acct.cid)?'none':'inline-flex',fontWeight:700,fontSize:8,color:ch.color,letterSpacing:'0.04em'}}>{ch.ticker.slice(0,3)}</span>
        </div>
        <span style={{fontSize:13,fontWeight:600,color:'var(--bi-fg-1)',letterSpacing:'-0.005em',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1,minWidth:0}}>{ch.name}</span>
        <span className="mono" style={{fontSize:10,fontWeight:700,color:ch.color,letterSpacing:'0.02em',flexShrink:0}}>{ch.ticker}</span>
      </div>

      {/* App-version warning chip (e.g. "⚠ Ethereum outdated · latest v1.22.0") */}
      {appBadge&&<div style={{marginBottom:8,flexShrink:0}}>{appBadge}</div>}

      {/* Key/value identity rows */}
      <div style={{display:'flex',flexDirection:'column',gap:3,flexShrink:0}}>
        {kvRow('Chain',ch.name)}
        {kvRow('Derivation',acct.dm||'default',{mono:true})}
        {kvRow('Address',trunc(acct.addr||acct.cid,18),{mono:true,full:acct.addr||acct.cid})}
        {acct.fp&&kvRow('Path',acct.fp,{mono:true,full:acct.fp})}
        {kvRow('Account ID',acct.id?(acct.id.length>20?acct.id.slice(0,16)+'…':acct.id):'—',{mono:true,full:acct.id})}
        {kvRow('Sync time',acct.dur?acct.dur.toFixed(2)+'s':'—',{mono:true})}
        {kvRow('Operations',String(acct.ops||0),{mono:true,c:acct.ops>0?'var(--bi-cat-3)':'var(--bi-fg-3)'})}
      </div>

      {/* Derived address (when chain converts xpub → address) */}
      {ch.convert&&(()=>{
        const derived=ch.convert(acct.addr);
        if(!derived)return <div style={{marginTop:8,padding:'6px 8px',background:'rgba(245,158,11,0.06)',border:'1px solid rgba(245,158,11,0.2)',borderRadius:2,fontSize:10,color:'var(--bi-fg-3)',lineHeight:1.45,flexShrink:0}}>Cannot derive explorer address — ask customer.</div>;
        return <div style={{marginTop:8,padding:'6px 8px',background:'var(--bi-bg-card-alt)',border:'1px solid var(--bi-border)',borderLeft:'2px solid '+ch.color,borderRadius:2,flexShrink:0}}>
          <div className="bi-sublabel" style={{fontSize:9,marginBottom:3}}>Derived address</div>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <span className="mono" style={{wordBreak:'break-all',flex:1,fontSize:10,color:'var(--bi-fg-1)'}}>{derived}</span>
            <CopyBtn text={derived}/>
          </div>
        </div>;
      })()}

      {/* Note-only chains (no explorer) */}
      {ch.note&&!hasExp&&<div style={{marginTop:8,padding:'6px 8px',background:'rgba(91,159,232,0.08)',border:'1px solid rgba(91,159,232,0.25)',borderRadius:2,fontSize:10,color:'var(--bi-fg-2)',lineHeight:1.45,flexShrink:0}}>{ch.note}</div>}

      {/* Action buttons — Explorer / Timeline / Focus / Copy */}
      <div style={{marginTop:'auto',paddingTop:10,display:'flex',flexWrap:'wrap',gap:6,alignItems:'center'}}>
        {hasExp&&!acct.isXpub&&<a href={eUrl} target="_blank" rel="noopener noreferrer" style={{padding:'3px 8px',borderRadius:2,fontSize:10,fontWeight:600,background:ch.color+'14',color:ch.color,border:'1px solid '+ch.color+'40',textDecoration:'none',whiteSpace:'nowrap'}}>Explorer ↗</a>}
        {onTimelineClick&&<button onClick={onTimelineClick} style={{padding:'3px 8px',borderRadius:2,fontSize:10,fontWeight:600,border:'1px solid var(--bi-border)',background:'var(--bi-bg-card-alt)',color:'var(--bi-fg-2)',cursor:'pointer',whiteSpace:'nowrap'}}>Timeline →</button>}
        <button onClick={()=>onFocus(acct)} title={isFocused?'Clear focus':'Focus on this account (shift+click row)'} style={{padding:'3px 8px',borderRadius:2,fontSize:10,fontWeight:600,border:'1px solid '+(isFocused?ch.color+'60':'var(--bi-border)'),background:isFocused?ch.color+'18':'var(--bi-bg-card-alt)',color:isFocused?ch.color:'var(--bi-fg-2)',cursor:'pointer',whiteSpace:'nowrap',letterSpacing:'0.04em',textTransform:'uppercase'}}>{isFocused?'Unfocus':'Focus'}</button>
        <CopyBtn text={acct.addr||acct.cid}/>
      </div>
    </div>

    {/* ═══ Col 2 — Balance & Tokens ═══ */}
    <div style={{...colStyle,...colDivider}}>
      <div className="bi-sublabel" style={{fontSize:9,marginBottom:5,flexShrink:0}}>Balance · live</div>

      {/* Live balance — fontSize:22 per spec, with ticker + fiat */}
      <div style={{display:'flex',alignItems:'baseline',gap:6,flexWrap:'wrap',flexShrink:0}}>
        {liveBalance&&liveBalance.status==='loading'&&<span className="bi-skel" style={{width:90,height:16}}/>}
        {liveBalance&&liveBalance.status==='ok'&&<>
          <span className={'mono'+(settle?' bi-settle-slow':'')} style={{fontSize:22,fontWeight:700,color:'var(--bi-fg-1)',lineHeight:1.05}}>{liveBalance.bal!=null?liveBalance.bal.toLocaleString(undefined,{maximumFractionDigits:liveBalance.bal>=1?4:6}):'0'}</span>
          <span style={{fontSize:11,fontWeight:700,color:ch.color}}>{ch.ticker}</span>
          {liveBalance.fiat!=null&&<span style={{fontSize:11,color:'var(--bi-fg-3)'}}>≈ <span className="mono" style={{color:'var(--bi-fg-1)'}}>{fmtFiat(liveBalance.fiat)}</span></span>}
        </>}
        {(!liveBalance||liveBalance.status==='error'||liveBalance.status==='unsupported')&&acct.bal!=null&&<>
          <span className="mono" style={{fontSize:22,fontWeight:700,color:'var(--bi-cat-3)',lineHeight:1.05}}>{Number(acct.bal).toLocaleString(undefined,{maximumFractionDigits:6})}</span>
          <span style={{fontSize:11,fontWeight:700,color:ch.color}}>{ch.ticker}</span>
        </>}
        {(!liveBalance||liveBalance.status==='error'||liveBalance.status==='unsupported')&&acct.bal==null&&<span className="mono" style={{fontSize:14,color:'var(--bi-fg-3)'}}>—</span>}
      </div>

      {/* Status line — log↔chain reconciliation */}
      <div style={{fontSize:10,color:'var(--bi-fg-3)',marginTop:3,flexShrink:0}}>
        {(()=>{
          const live=liveBalance&&liveBalance.status==='ok'?liveBalance.bal:null;
          const logBal=acct.bal!=null?Number(acct.bal):null;
          if(live!=null&&logBal!=null){
            const diff=Math.abs(live-logBal);
            const tol=Math.max(0.0000001,logBal*0.001);
            if(diff<tol)return <>log matches chain{acct.dur?' · synced '+acct.dur.toFixed(2)+'s':''}</>;
            return <span style={{color:'var(--bi-negative)',fontWeight:600}}>⚠ log shows {logBal.toLocaleString(undefined,{maximumFractionDigits:6})} {ch.ticker} — mismatch</span>;
          }
          if(live!=null)return 'live only · no log balance';
          if(logBal!=null)return 'log-only · '+(liveBalance?.status==='error'?'live fetch failed':liveBalance?.status==='unsupported'?'live unsupported':'live not fetched');
          return 'no balance data';
        })()}
      </div>

      {/* Compact log/spendable comparison strip */}
      {(acct.bal!=null||acct.spendBal!=null)&&<div style={{display:'grid',gridTemplateColumns:acct.spendBal!=null?'1fr 1fr':'1fr',gap:6,marginTop:8,flexShrink:0}}>
        {acct.bal!=null&&<div style={{padding:'5px 8px',background:'var(--bi-bg-card-alt)',border:'1px solid var(--bi-border)',borderRadius:2}}>
          <div className="bi-sublabel" style={{fontSize:8,marginBottom:2}}>Balance (log)</div>
          <div className="mono" style={{fontSize:10,color:'var(--bi-cat-3)',fontWeight:500}}>{Number(acct.bal).toLocaleString(undefined,{maximumFractionDigits:6})} {ch.ticker}</div>
        </div>}
        {acct.spendBal!=null&&<div style={{padding:'5px 8px',background:'var(--bi-bg-card-alt)',border:'1px solid var(--bi-border)',borderRadius:2}}>
          <div className="bi-sublabel" style={{fontSize:8,marginBottom:2}}>Spendable</div>
          <div className="mono" style={{fontSize:10,color:'var(--bi-cat-3)',fontWeight:500}}>{Number(acct.spendBal).toLocaleString(undefined,{maximumFractionDigits:6})} {ch.ticker}</div>
        </div>}
      </div>}

      {/* Tokens / UTXO indicator — actual content lives in Row 2 below the 4-col grid.
         A subtle badge connects the agent's eye from balance summary down to the detail row. */}
      {(acct.toks.length>0||canX)&&<div style={{marginTop:'auto',paddingTop:10,flexShrink:0,display:'flex',gap:6,flexWrap:'wrap'}}>
        {acct.toks.length>0&&<div style={{
          display:'inline-flex',alignItems:'center',gap:6,
          padding:'3px 8px',borderRadius:2,
          fontSize:10,fontWeight:600,letterSpacing:'0.02em',
          background:'rgba(155,123,217,0.10)',
          color:'#9B7BD9',
          border:'1px solid rgba(155,123,217,0.30)',
        }}>
          <span>Tokens · {acct.toks.length}</span>
          {(acct.tokSource==='discovered'||acct.tokSource==='mixed')&&<span style={{fontSize:8,padding:'1px 4px',borderRadius:2,background:'rgba(232,138,74,0.18)',color:'#E88A4A',letterSpacing:0.3,textTransform:'uppercase'}}>{acct.tokSource==='mixed'?'partial':'from log'}</span>}
          <span style={{fontSize:9,opacity:0.7}}>▼</span>
        </div>}
        {canX&&<div style={{
          display:'inline-flex',alignItems:'center',gap:6,
          padding:'3px 8px',borderRadius:2,
          fontSize:10,fontWeight:600,letterSpacing:'0.02em',
          background:ch.color+'14',
          color:ch.color,
          border:'1px solid '+ch.color+'40',
        }}>
          <span>UTXO scanner</span>
          <span style={{fontSize:9,opacity:0.7}}>▼</span>
        </div>}
        {acct.isXpub&&!canX&&hasExp&&<a href={eUrl} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',padding:'3px 8px',borderRadius:2,fontSize:10,fontWeight:600,background:ch.color+'14',color:ch.color,border:'1px solid '+ch.color+'40',textDecoration:'none'}}>Search xpub on explorer ↗</a>}
      </div>}
    </div>

    {/* ═══ Col 3 — Errors ═══ */}
    <div style={{...colStyle,...colDivider}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6,flexShrink:0}}>
        <span className="bi-sublabel" style={{fontSize:9}}>Errors</span>
        {errCount>0&&<span style={{fontSize:9,color:'#D94747',fontWeight:700,letterSpacing:'0.06em',textTransform:'uppercase'}}>{errCount} event{errCount!==1?'s':''}</span>}
      </div>
      {errCount===0
        ?emptyState('No errors linked to this account')
        :<>
          <div style={{fontSize:10,color:'var(--bi-fg-2)',lineHeight:1.5,marginBottom:8,padding:'6px 8px',background:'rgba(217,71,71,0.06)',border:'1px solid rgba(217,71,71,0.20)',borderRadius:2}}>
            {errCount} log event{errCount!==1?'s':''} reference{errCount===1?'s':''} this account's address. Open the Errors tab for severity, timestamps, and recommended actions.
          </div>
          {onErrClick&&<button onClick={onErrClick} style={{padding:'4px 9px',borderRadius:2,fontSize:11,fontWeight:600,border:'1px solid rgba(217,71,71,0.40)',background:'rgba(217,71,71,0.14)',color:'#D94747',cursor:'pointer',whiteSpace:'nowrap',alignSelf:'flex-start'}}>Open in Errors →</button>}
        </>}
      {/* Operations-derived signals: pending / failed counts surfaced from app.json */}
      {(()=>{
        const ops=acct.ajOperations||[];
        const pending=ops.filter(o=>o.blockHeight==null||o.blockHeight===0).length;
        const failed=ops.filter(o=>o.hasFailed===true).length;
        if(pending===0&&failed===0)return null;
        return <div style={{marginTop:10,paddingTop:8,borderTop:'1px solid var(--bi-border)',flexShrink:0}}>
          <div className="bi-sublabel" style={{fontSize:9,marginBottom:4}}>Operation status</div>
          {pending>0&&<div style={{fontSize:11,color:'var(--bi-fg-2)',padding:'3px 0',display:'flex',alignItems:'center',gap:6}}>

          {activeRows.length>0&&inactiveRows.length>0&&<span style={{fontSize:9,color:'var(--bi-fg-3)',marginLeft:tokStatus==='loading'?0:'auto'}}>{activeRows.length} active · {inactiveRows.length} discovered</span>}
        </div>

</div>;

function _sfylGroupDests(marked){
  const dests={};
  marked.forEach(r=>{
    const k=((r.to||'(unknown)')+'').toLowerCase();
    if(!dests[k])dests[k]={addr:r.to||'(unknown)',cid:(r.acct&&r.acct.cid)||'',label:null,scam:false,txs:[],accounts:{},byAsset:{},firstTs:Infinity,lastTs:0};
    const d=dests[k];
    d.txs.push(r);
    if(r.scamTo)d.scam=true;
    if(r.labelTo&&!d.label)d.label=r.labelTo;
    if(r.acct)d.accounts[r.key]=r.acct;
    d.byAsset[r.asset]=(d.byAsset[r.asset]||0)+(r.value||0);
    if(r.ts&&r.ts<d.firstTs)d.firstTs=r.ts;
    if(r.ts>d.lastTs)d.lastTs=r.ts;
  });
  return Object.values(dests).sort((a,b)=>a.firstTs-b.firstTs);
}
const _sfylIso=ts=>ts?new Date(ts).toISOString():'(no timestamp)';
const _sfylRptVal=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:4}):String(+v.toFixed(8));
function _sfylReportText(marked,trace,usd,comp){

  const byAsset={};marked.forEach(r=>{byAsset[r.asset]=(byAsset[r.asset]||0)+(r.value||0);});
  const srcAccts={};marked.forEach(r=>{if(r.acct)srcAccts[r.key]=r.acct;});
  const chrono=[...marked].sort((a,b)=>(a.ts||0)-(b.ts||0));
  const L=[];
  L.push('UNAUTHORIZED TRANSACTION SUMMARY — generated '+new Date().toISOString()+' (all times UTC)');
  L.push('Prepared with Ledger Diagnostic Toolkit / SFYL mode. Data sourced live from public blockchain APIs.');
  L.push('');
  L.push('SCOPE');
  L.push('  Theft transactions marked: '+marked.length);
  L.push('  Victim accounts affected: '+Object.keys(srcAccts).length);
  L.push('  Destination addresses: '+dests.length);
  L.push('  Assets: '+Object.entries(byAsset).map(([a,v])=>_sfylRptVal(v)+' '+a).join(', '));
  if(usd&&usd.priced>0)L.push('  Estimated USD value at time of transactions: '+fmtFiat(usd.total)+(usd.unpriced>0?(' (excludes '+usd.unpriced+' transaction(s) with no historical price data)'):'')+' — source: DefiLlama coins API (on-chain/aggregated prices at each transaction timestamp). Verify independently before official use.');
  if(chrono.length>0){
    L.push('  First theft: '+_sfylIso(chrono[0].ts));
    L.push('  Last theft:  '+_sfylIso(chrono[chrono.length-1].ts));
  }
  L.push('');
  L.push('VICTIM ACCOUNTS');
  Object.values(srcAccts).forEach((a,i)=>{

    L.push('  '+(i+1)+'. ['+((a.ch&&a.ch.name)||a.cid)+'] '+a.addr+(url?('\n     explorer: '+url):''));
  });
  L.push('');
  L.push('DESTINATION ADDRESSES (order of first theft)');
  dests.forEach((d,i)=>{
    let url=null;try{url=CHAINS[d.cid]&&CHAINS[d.cid].url?CHAINS[d.cid].url(d.addr):null;}catch(_){}
    const _ent=!d.label?sfylEntityLabel(d.cid,d.addr):null;
    L.push('  '+(i+1)+'. '+d.addr+(d.label?('  ["'+d.label+'" — label source: Blockscout]'):(_ent&&_ent.label?('  ["'+_ent.label+'" — label source: '+_ent.src+']'):''))+(d.scam?'  [FLAGGED AS SCAM — source: Blockscout, community-reported, not independently confirmed]':'')+(sfylSanctioned(d.addr)?('  [OFAC SDN-LISTED — US Treasury sanctions list via '+(_SFYL_SANCTIONS.src||'0xB10C dataset')+', fetched '+(_SFYL_SANCTIONS.fetchedAt||'this session')+']'):''));
    L.push('     received: '+Object.entries(d.byAsset).map(([a,v])=>_sfylRptVal(v)+' '+a).join(', ')+' across '+d.txs.length+' tx');

    if(url)L.push('     explorer: '+url);
  });
  L.push('');
  L.push('TRANSACTIONS (chronological)');
  chrono.forEach((r,i)=>{
    const ch=(r.acct&&r.acct.ch)||{};
    let turl=null;try{turl=r.hash&&TX_EXPLORERS[r.acct.cid]?TX_EXPLORERS[r.acct.cid](r.hash):null;}catch(_){}
    L.push('  '+(i+1)+'. '+_sfylIso(r.ts)+' | '+(ch.name||'')+' | '+_sfylRptVal(r.value)+' '+r.asset);
    L.push('     from: '+(r.from||'(unknown)'));
    L.push('     to:   '+(r.to||'(unknown)'));
    L.push('     tx:   '+(r.hash||'(no hash)')+(turl?('\n     link: '+turl):''));
  });
  if(trace&&Object.keys(trace).length>0){
    L.push('');
    L.push('ONWARD FUND FLOW (agent-traced, hop by hop)');
    const walk=(cid,addr,depth,path)=>{
      const k=cid+':'+((addr||'')+'').toLowerCase();
      if(path.indexOf(k)>=0){L.push('  '.repeat(depth+1)+'[circular — returns to earlier address in path]');return;}
      const rec=trace[k];
      if(!rec||rec.status!=='done')return;
      if(rec.terminal==='dormant'){L.push('  '.repeat(depth+1)+'[terminal] no onward transfers — funds appear to remain here');return;}
      rec.outflows.forEach(o=>{
        const bits=['  '.repeat(depth+1)+'-> '+_sfylRptVal(o.value)+' '+o.asset+(o.count>1?(' ('+o.count+' tx)'):'')+' to '+(o.to||'(unknown)')];
        if(o.label)bits.push('     '.repeat(1)+'  label: "'+o.label+'"');
        if(o.swapRecv)bits.push('       swap detected — '+o.swapRecv+' received in same transaction');
        if(o.kind==='exchange')bits.push('       [TERMINAL: exchange/service — on-chain trace ends; continue via legal process]');
        if(o.bridge&&o.bridge.dstAddr){
          bits.push('       [CROSS-CHAIN HOP — resolved via '+o.bridge.src+']');
          bits.push('       -> landed on '+(o.bridge.dstCid?((CHAINS[o.bridge.dstCid]||{}).name||o.bridge.dstCid):(o.bridge.dstChainLabel||'unknown chain'))+' at '+o.bridge.dstAddr);
          if(o.bridge.dstTx)bits.push('          destination tx: '+o.bridge.dstTx);
          if(o.bridge.dstAsset)bits.push('          received as: '+(o.bridge.dstAmount!=null?(_sfylRptVal(o.bridge.dstAmount)+' '):'')+o.bridge.dstAsset);
        }else if(o.bridge){
          bits.push('       [CROSS-CHAIN HOP via '+o.bridge.via+' — resolved by '+o.bridge.src+'; destination tx '+(o.bridge.dstTx||'(not returned)')+' on '+(o.bridge.dstChainLabel||'another chain')+'; recipient not returned by the API — continue manually]');
        }else if(o.kind==='bridge'){
          bits.push('       [TERMINAL: bridge — funds left this chain; no public bridge API confirmed the destination]');
        }
        if(o.scam)bits.push('       [address flagged as scam by Blockscout]');
        bits.push('       first '+_sfylIso(o.firstTs));
        bits.forEach(b=>L.push(b));
        if(depth<6){
          if(o.bridge&&o.bridge.dstAddr&&o.bridge.dstCid)walk(o.bridge.dstCid,o.bridge.dstAddr,depth+1,path.concat([k]));
          else if(!(o.kind==='exchange'||o.kind==='bridge'))walk(cid,o.to,depth+1,path.concat([k]));
        }
      });
    };
    dests.forEach((d,i)=>{
      const k=d.cid+':'+((d.addr||'')+'').toLowerCase();
      if(!trace[k])return;
      L.push('  From destination #'+(i+1)+' ('+d.addr+'):');
      walk(d.cid,d.addr,1,[]);
    });
  }
  if(comp&&comp.status==='done'&&comp.verdict!=='unknown'){
    L.push('');
    L.push('COMPROMISE-TYPE ASSESSMENT (heuristic — signer analysis of marked EVM transactions)');
    L.push('  Assessment: '+_SFYL_COMPROMISE_WORDING[comp.verdict].title+' — '+comp.victimSigned+' tx signed by the victim\'s key, '+comp.thirdParty+' tx signed by a third party.');
    comp.rows.forEach(r2=>{L.push('  '+r2.hash+' — '+(r2.cls==='victim'?'signed by victim\'s key':(r2.cls==='third-party'?('signed by third party '+(r2.signer||'')):'signer not established'))+(r2.method?(' (method: '+r2.method+')'):''));});
    if(comp.skippedNonEvm>0)L.push('  '+comp.skippedNonEvm+' non-EVM transaction(s) not assessable by this method.');
    if(comp.budgetHit)L.push('  Assessment capped at 12 transactions.');
    L.push('  This is a heuristic based on who signed each transaction — verify before official use.');
  }
  L.push('');
  L.push('LABEL PROVENANCE: exchange/bridge/scam labels come from public explorer APIs (Blockscout). OFAC matches come from the US Treasury SDN list (public domain), fetched live this session. Scam flags are community-reported and advisory; OFAC matches are authoritative.');
  L.push('XRP ACCOUNT NAMES: sourced from XRPScan (xrpscan.com) well-known accounts data, CC BY-NC-SA 4.0 — attribution required on redistribution.');
  L.push('CROSS-CHAIN HOPS: a hop between chains is asserted ONLY when the bridge\'s own public API (THORChain Midgard, LI.FI, LayerZero Scan, Wormholescan, Axelarscan, deBridge DLN) explicitly returned the destination transaction and/or recipient, fetched live this session. Bridge deposits that no public resolver confirmed are reported as terminal, not inferred.');
  L.push('NOTE: Transactions were individually reviewed and marked by a support agent. Verify all data against the linked block explorers before official submission (e.g. IC3 / law enforcement).');
  return L.join('\n');
}

/* ═══ Compromise-type classification (EVM only, heuristic) — distinguishes

   token transaction BY HASH and reading the actual signer + decoded method —
   an attacker-signed transferFrom never appears in the victim's own tx list,
   so list absence alone would be ambiguous. Native OUT rows are victim-signed

const _sfylMarkSig=marked=>marked.map(r=>r.rowKey).sort().join(',');

  });

  const tokRows=evm.filter(r=>r.token&&r.hash);

/* ═══ SFYL Stage B — full-width trace canvas: victims → destinations → hops → endpoints.
   Layout is deterministic (fixed slots per column, SVG edges behind absolutely-positioned
   node cards) — no DOM measuring, so it renders identically on first paint.
   Balance checks show NATIVE coin balance only (tokens are not summed — labeled honestly). ═══ */
async function _sfylNativeBal(cid,addr,prio){
  /* Routed through the request core on a per-chain virtual host (each chain's
     balance source is one real host, so per-cid pacing ≈ per-host pacing).
     30s cache + in-flight dedupe: re-renders and repeat clicks are free. */
  const key='bal|'+cid+':'+((addr||'')+'').toLowerCase();
  const c=_SFYL_Q.cache[key];
  if(c&&c.exp>Date.now()){_SFYL_Q.stats.cached++;return JSON.parse(c.txt);}
  if(_SFYL_Q.inflight[key]){_SFYL_Q.stats.deduped++;return _SFYL_Q.inflight[key];}
  const p=_sfylQEnqueue('balance:'+cid,prio==null?2:prio,async()=>{
    let v;
    if(BALANCE_APIS[cid])v=await BALANCE_APIS[cid](addr);
    else if(EVM_RPCS[cid])v=await fetchEvmBalance(EVM_RPCS[cid],addr);
    else throw new Error('no keyless balance source');
    _SFYL_Q.cache[key]={exp:Date.now()+30000,txt:JSON.stringify(v)};
    return v;
  });
  _SFYL_Q.inflight[key]=p;
  const clear=()=>{delete _SFYL_Q.inflight[key];};
  p.then(clear,clear);
  return p;
}
function _sfylBuildGraph(marked,trace){
  const NODE_W=236,NODE_H=98,GAP_X=72,GAP_Y=18,PAD=20,TOP=16;
  /* Level 0 — victims (unique accounts among marks) */
  const vics={};
  marked.forEach(r=>{
    if(!r.acct)return;
    if(!vics[r.key])vics[r.key]={key:'V|'+r.key,type:'victim',acct:r.acct,cid:r.acct.cid,addr:r.acct.addr,byAsset:{}};
    vics[r.key].byAsset[r.asset]=(vics[r.key].byAsset[r.asset]||0)+(r.value||0);
  });
  const nodes={},cols=[[]];
  Object.values(vics).forEach(v=>{nodes[v.key]=v;cols[0].push(v.key);});
  /* Amount weighting — deterministic, USD-free. Share = fraction of the total
     stolen amount OF THAT ASSET (native units). Used for edge thickness and
     trace prioritization. Assets that appear via swap/bridge (not in the marked
     set) inherit a damped share from their parent node instead. */
  const totalByAsset={};marked.forEach(r=>{totalByAsset[r.asset]=(totalByAsset[r.asset]||0)+(r.value||0);});
  const shareOf=byAsset=>{let s=0,sa=null,raw=0;Object.entries(byAsset||{}).forEach(([a,v])=>{if(totalByAsset[a]>0){const r=v/totalByAsset[a];if(r>raw)raw=r;const f=Math.min(1,r);if(f>s){s=f;sa=a;}}});return{s,sa,raw};};
  /* Per victim→destination amounts (for edge weights) */
  const pairAmt={};marked.forEach(r=>{if(!r.acct)return;const dk=((r.to||'(unknown)')+'').toLowerCase();const pk=r.key+'|'+dk;if(!pairAmt[pk])pairAmt[pk]={};pairAmt[pk][r.asset]=(pairAmt[pk][r.asset]||0)+(r.value||0);});
  /* Level 1 — marked destinations */
  const dests=_sfylGroupDests(marked);
  cols.push([]);
  const edges=[];
  dests.forEach(d=>{
    const dkLower=((d.addr||'(unknown)')+'').toLowerCase();
    const k='N|'+d.cid+':'+((d.addr||'')+'').toLowerCase();
    if(!nodes[k]){
      const sh=shareOf(d.byAsset);
      /* Hop-1 taint is EXACT: byAsset sums the marked theft transactions themselves. */
      nodes[k]={key:k,type:'dest',cid:d.cid,addr:d.addr,label:d.label,scam:d.scam,byAsset:d.byAsset,taint:d.byAsset,flow:d.byAsset,commingled:false,comRatio:1,firstTs:d.firstTs,convergeN:Object.keys(d.accounts).length,kind:(!d.addr||d.addr==='(unknown)')?'unknown':null,share:sh.s,shareAsset:sh.sa};
      cols[1].push(k);
    }
    Object.keys(d.accounts).forEach(ak=>{if(vics[ak])edges.push({from:'V|'+ak,to:k,w:shareOf(pairAmt[ak+'|'+dkLower]).s});});
  });
  /* Levels 2+ — walk trace records breadth-first; never place a node twice (cycle guard). */
  let frontier=cols[1].slice();
  for(let lvl=2;lvl<=7&&frontier.length;lvl++){
    const next=[];
    frontier.forEach(pk=>{
      const n=nodes[pk];
      const rec=trace[n.cid+':'+((n.addr||'')+'').toLowerCase()];
      if(!rec||rec.status!=='done'||!rec.outflows)return;
      rec.outflows.forEach(o=>{
        if(!o.to)return;
        /* E2 — resolved cross-chain hop: place the node on the DESTINATION
           chain (traceable there) instead of the bridge deposit address.
           A hit without a recipient address stays on the deposit address
           and only gets an annotation — never a guessed node. */
        const br=(o.bridge&&o.bridge.dstAddr)?o.bridge:null;
        const hopCid=(br&&br.dstCid)?br.dstCid:n.cid;
        const hopAddr=br?br.dstAddr:o.to;
        const ck='N|'+hopCid+':'+((hopAddr||'')+'').toLowerCase();
        /* Taint (upper bound): a flow can carry at most min(flow value, what the
           parent could hold of the stolen asset). Weight/share come from TAINT —
           never from raw flow volume, which may be overwhelmingly other money. */
        const hopFlow=br?(br.dstAmount!=null?{[br.dstAsset||o.asset]:br.dstAmount}:{}):{[o.asset]:o.value};
        const pT=n.taint||{};
        let hopTaint=null,tUnknown=false;
        if(!br&&pT[o.asset]>0)hopTaint={[o.asset]:Math.min(o.value||0,pT[o.asset])};
        else tUnknown=true; /* asset changed (bridge/swap) or parent taint unknown */
        const tsh=hopTaint?shareOf(hopTaint):{s:0,sa:null};
        let hw=tsh.s;
        if(!hw)hw=(n.share||0.3)*0.8; /* taint unknown — inherit damped parent share */
        const _tV=hopTaint?Object.values(hopTaint)[0]:0;
        const comRatio=(_tV>0)?(o.value||0)/_tV:0;
        if(nodes[ck]){edges.push({from:pk,to:ck,back:true,via:br?br.via:undefined,w:hw});return;}
        nodes[ck]={key:ck,type:'hop',cid:hopCid,addr:hopAddr,label:br?null:o.label,scam:!br&&!!o.scam,
          kind:br?(br.dstCid?'bridge-hop':'bridge'):(o.kind||null),swapRecv:o.swapRecv||null,
          via:br?br.via:null,viaSrc:br?br.src:null,dstChainLabel:br?br.dstChainLabel:null,dstTx:br?br.dstTx:null,
          bridgeNote:(o.bridge&&!br)?o.bridge:null,
          byAsset:hopFlow,flow:hopFlow,taint:hopTaint||{},taintUnknown:tUnknown,commingled:comRatio>1.05,comRatio:comRatio,firstTs:o.firstTs,convergeN:1,share:hw,shareAsset:tsh.sa};
        if(!cols[lvl])cols.push([]);
        cols[lvl].push(ck);
        next.push(ck);
        edges.push({from:pk,to:ck,via:br?br.via:undefined,w:hw});
      });
    });
    frontier=next;
  }
  /* Order each column so nodes sit near the nodes that feed them (barycenter) —
     eliminates criss-crossing edges. Column 0 (victims) keeps mark order; every
     later column sorts by the average row of its parents in the previous column. */
  for(let ci=1;ci<cols.length;ci++){
    const prevRow={};cols[ci-1].forEach((k,ri)=>{prevRow[k]=ri;});
    const bary={};
    cols[ci].forEach((k,ri)=>{
      const parents=edges.filter(e=>e.to===k&&prevRow[e.from]!=null).map(e=>prevRow[e.from]);
      bary[k]=parents.length?parents.reduce((s,v)=>s+v,0)/parents.length:1e9+ri;
    });
    cols[ci].sort((a,b)=>bary[a]-bary[b]);
  }
  /* Positions */
  cols.forEach((col,ci)=>col.forEach((k,ri)=>{
    nodes[k].x=PAD+ci*(NODE_W+GAP_X);
    nodes[k].y=TOP+ri*(NODE_H+GAP_Y);
  }));
  const maxRows=Math.max.apply(null,cols.map(c=>c.length).concat([1]));
  return{nodes,edges,cols,W:PAD*2+cols.length*(NODE_W+GAP_X)-GAP_X,H:TOP+maxRows*(NODE_H+GAP_Y)+40,NODE_W,NODE_H};
}
function SfylTraceMap({marked,sfylTrace,onTrace,fmtVal,fmtTs,usd,onBack}){
  const R='#F04F52';
  const[insp,setInsp]=React.useState(null);   /* CO-3: clicked node key for the inspector panel */
  const[bal,setBal]=React.useState({});
  const[batch,setBatch]=React.useState(null);
  const balRunRef=React.useRef(false);
  const[qs,setQs]=React.useState(()=>_sfylQState());
  React.useEffect(()=>{ /* live queue status for the header chip */
    const f=()=>setQs(_sfylQState());
    _SFYL_Q.listeners.add(f);
    const t=setInterval(f,1000); /* keep cooldown countdowns ticking */
    return()=>{_SFYL_Q.listeners.delete(f);clearInterval(t);};
  },[]);
  const g=React.useMemo(()=>_sfylBuildGraph(marked,sfylTrace),[marked,sfylTrace]);
  const dests=React.useMemo(()=>_sfylGroupDests(marked),[marked]);
  /* Auto balance-check level-1 destinations (≤12, sequential, 300ms gap, once per mount). */
  React.useEffect(()=>{
    if(balRunRef.current)return;balRunRef.current=true;
    let dead=false;
    /* Fire all at once at background priority — the request core paces per host.
       No more fixed 300ms sleeps; multi-chain cases run in parallel. */
    dests.slice(0,24).forEach(d=>{
      if(!d.addr||d.addr==='(unknown)')return; /* no address to check */
      const k='N|'+d.cid+':'+((d.addr||'')+'').toLowerCase();
      setBal(p=>p[k]?p:Object.assign({},p,{[k]:{status:'loading'}}));
      _sfylNativeBal(d.cid,d.addr,2)
        .then(v=>{if(!dead)setBal(p=>Object.assign({},p,{[k]:{status:'done',val:v}}));})
        .catch(()=>{if(!dead)setBal(p=>Object.assign({},p,{[k]:{status:'error'}}));});
    });
    return()=>{dead=true;};
  },[dests]);
  const checkBal=async n=>{
    setBal(p=>Object.assign({},p,{[n.key]:{status:'loading'}}));
    try{const v=await _sfylNativeBal(n.cid,n.addr);setBal(p=>Object.assign({},p,{[n.key]:{status:'done',val:v}}));}
    catch(e){setBal(p=>Object.assign({},p,{[n.key]:{status:'error'}}));}
  };
  const traceAll=async()=>{
    const todo=dests.filter(d=>d.addr&&d.addr!=='(unknown)'&&!sfylTrace[d.cid+':'+((d.addr||'')+'').toLowerCase()]);
    /* Priority order: largest amount share + convergence first, so if the agent
       stops early (or hits the trace budget) the important ones are already done. */
    const score=d=>{const n=g.nodes['N|'+d.cid+':'+((d.addr||'')+'').toLowerCase()]||{};return(n.share||0)+((n.convergeN>1)?0.5:0);};
    todo.sort((a,b)=>score(b)-score(a));
    setBatch({done:0,total:todo.length});
    /* Parallel: the request core paces per host, so BTC/XRP/EVM traces overlap
       instead of waiting on each other. Sort order above = queue order. */
    let done=0;const tick=()=>{done++;setBatch({done,total:todo.length});};
    await Promise.all(todo.map(d=>Promise.resolve(onTrace(d.cid,d.addr,d.firstTs)).then(tick,tick)));
    setTimeout(()=>setBatch(null),1500);
  };
  const untraced=dests.filter(d=>!sfylTrace[d.cid+':'+((d.addr||'')+'').toLowerCase()]).length;
  /* ═══ AUTO-TRACE — one click follows the money to its endpoints. ═══
     Loop: build graph → find the untraced frontier worth following (taint share
     ≥ 10% of a stolen asset, not an exchange/bridge/unknown terminal, not a
     high-volume service ×50+) → trace those in parallel (request core paces) →
     merge results → repeat. Stops when every path hits a terminal, at hop
     depth ≤6 (graph cap), or at 25 traces per run so one click can't eat the
     whole budget. Deliberately NOT run on view-load: spending API budget is
     the agent's call — but it's one click, not thirty. */
  const[auto,setAuto]=React.useState(null);
  const autoStopRef=React.useRef(false);
  const autoTrace=async()=>{
    if(auto&&auto.running)return;
    autoStopRef.current=false;
    const AUTO_MAX=25,SHARE_MIN=0.1,PER_ROUND=8,COM_MAX=4;
    let merged=Object.assign({},sfylTrace),used=0,comUsed=0;
    const retried=new Set();
    const kk=n=>n.cid+':'+((n.addr||'')+'').toLowerCase();
    setAuto({running:true,traces:0});
    for(let round=0;round<8;round++){
      if(autoStopRef.current)break;
      const g2=_sfylBuildGraph(marked,merged);
      const pool=Object.values(g2.nodes).filter(n=>{
        if(n.type==='victim'||n.kind==='exchange'||n.kind==='bridge'||n.kind==='unknown')return false;
        const rec=merged[kk(n)];
        if(rec&&!(rec.status==='error'&&!retried.has(kk(n))))return false; /* one retry for transient failures */
        if((n.share||0)<SHARE_MIN)return false;
        if(n.comRatio>50){
          /* Volume alone is NOT service evidence — attacker consolidation wallets
             (many victims swept into one address) look exactly like this on BTC,
             and they're the most important nodes to follow. Only a LABEL (node
             label or entity-store hit) makes a high-volume node a real endpoint. */
          let ent=null;try{ent=sfylEntityLabel(n.cid,n.addr);}catch(_){ }
          if(n.label||(ent&&ent.label))return false;
        }
        return true;
      }).sort((a,b)=>((a.comRatio>50)-(b.comRatio>50))||((b.share||0)-(a.share||0))); /* clean leads first */
      const cands=[];
      for(const n of pool){
        if(cands.length>=Math.min(PER_ROUND,AUTO_MAX-used))break;
        if(n.comRatio>50){if(comUsed>=COM_MAX)continue;comUsed++;} /* bounded benefit of the doubt */
        if(merged[kk(n)])retried.add(kk(n));
        cands.push(n);
      }
      if(cands.length===0)break;
      const recs=await Promise.all(cands.map(n=>Promise.resolve(onTrace(n.cid,n.addr,n.firstTs)).catch(()=>({status:'error',error:'trace failed'}))));

      if(used>=AUTO_MAX)break;
    }
    /* Transparency: never end silently — count meaningful nodes left untraced
       (labeled services, over-cap high-volume, errored twice) so the agent
       knows the map is not exhaustively expanded. */
    const gf=_sfylBuildGraph(marked,merged);
    const left=Object.values(gf.nodes).filter(n=>{
      if(n.type==='victim'||n.kind==='exchange'||n.kind==='bridge'||n.kind==='unknown')return false;
      const rec=merged[kk(n)];
      return(!rec||rec.status==='error')&&(n.share||0)>=SHARE_MIN;

    setTimeout(()=>setAuto(a=>(a&&a.done)?null:a),8000);
  };
  /* TRACE NEXT — the one untraced, non-terminal node an agent should expand first.
     Score = taint share (upper-bound stolen amount, native units) + 0.5 convergence
     + 0.4 nonzero checked balance (untraced + balance = possibly the resting place)
     − penalties for commingling: heavily-mixed flows are usually services, where
     tracing burns budget on other people's money. Exchange/unresolved-bridge/unknown
     nodes are terminals, never suggested. */
  const traceNextKey=React.useMemo(()=>{
    let best=null,bs=0;
    Object.values(g.nodes).forEach(n=>{
      if(n.type==='victim'||n.kind==='exchange'||n.kind==='bridge'||n.kind==='unknown')return;
      if(sfylTrace[n.cid+':'+((n.addr||'')+'').toLowerCase()])return;
      const b=bal[n.key];
      const tNat=(n.taint||{})[(CHAINS[n.cid]||{}).ticker]||0;
      /* Balance bonus scales with what it could mean: covering the stolen amount
         = possible resting place (strong); reserve dust left = emptied (nothing). */
      const balBonus=(b&&b.status==='done'&&b.val>0)?((tNat>0&&b.val>=tNat)?0.5:(tNat>0&&b.val<tNat*0.05?0:0.1)):0;
      const s=(n.share||0)+(n.convergeN>1?0.5:0)+balBonus-(n.comRatio>50?0.6:(n.commingled?0.3:0));
      if(s>bs){bs=s;best=n.key;}
    });
    return best;
  },[g,sfylTrace,bal]);
  /* Edge anchor fan-out: edges sharing a node get distinct connection points spread
     over the card's height (ordered by the far end's vertical position), instead of
     all braiding through the single midpoint. */
  const edgeAnchors=React.useMemo(()=>{
    const src={},dst={},byFrom={},byTo={};
    g.edges.forEach((e,i)=>{(byFrom[e.from]=byFrom[e.from]||[]).push(i);(byTo[e.to]=byTo[e.to]||[]).push(i);});
    Object.values(byFrom).forEach(idxs=>{idxs.sort((p,q)=>((g.nodes[g.edges[p].to]||{}).y||0)-((g.nodes[g.edges[q].to]||{}).y||0));idxs.forEach((ei,r)=>src[ei]=[r,idxs.length]);});
    Object.values(byTo).forEach(idxs=>{idxs.sort((p,q)=>((g.nodes[g.edges[p].from]||{}).y||0)-((g.nodes[g.edges[q].from]||{}).y||0));idxs.forEach((ei,r)=>dst[ei]=[r,idxs.length]);});
    return{src,dst};
  },[g]);
  /* Per-destination USD at theft time — TRIAGE DISPLAY ONLY. Tracing logic stays
     native-unit; fiat exists so an agent can tell a $6,400 drain from $0.001 dust. */
  const destUsd=React.useMemo(()=>{
    const m={};if(!usd||!usd.perRow)return m;
    dests.forEach(d=>{
      const k='N|'+d.cid+':'+((d.addr||'')+'').toLowerCase();
      let sum=0,missing=0;

    const items=[];
    dests.forEach(d=>{
      const k='N|'+d.cid+':'+((d.addr||'')+'').toLowerCase();
      const n=g.nodes[k];if(!n)return;
      const rec=sfylTrace[d.cid+':'+((d.addr||'')+'').toLowerCase()];

      const short=_sfylTrunc(n.addr,18);
      const tNat=(n.taint||{})[ch.ticker]||0;
      if(n.kind==='unknown'){items.push({p:2,icon:'?',color:'#8A8A8E',text:'One destination could not be resolved by the explorer — open the raw theft transaction to identify the recipient manually.'});return;}
      if(u&&u.v!=null&&u.missing===0&&u.v<1){items.push({p:3,icon:'·',color:'#8A8A8E',text:short+' received ≈'+fmtFiat(u.v)+' — dust. Double-check this mark before it goes in the report.'});return;}
      if(rec)return; /* traced — the map speaks for itself downstream */
      if(b&&b.status==='done'&&tNat>0&&b.val>=tNat){items.push({p:0,icon:'●',color:'#F04F52',text:short+' still holds '+fmtVal(b.val)+' '+(ch.ticker||'')+' — more than the stolen amount. The coins may not have moved yet: trace this first.'});return;}
      if(b&&b.status==='done'&&tNat>0&&b.val<tNat*0.05){items.push({p:1,icon:'▸',color:'#FFBD42',text:short+' was emptied — '+fmtVal(b.val)+' '+(ch.ticker||'')+' left of '+fmtVal(tNat)+' stolen. Funds are moving: trace to follow them.'});return;}
      items.push({p:1,icon:'▸',color:'#C8C8CC',text:'Trace '+short+' to see where the stolen '+((n.shareAsset)||'funds')+' went.'});
    });
    items.sort((a,b)=>a.p-b.p);
    return items.slice(0,3);

  const colTitle=ci=>ci===0?'VICTIM ACCOUNTS':ci===1?'HOP 1 — DESTINATIONS':'HOP '+ci;
  if(marked.length===0)return <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:40}}>
    <div style={{textAlign:'center',maxWidth:420}}>

      <div style={{fontSize:11,color:'#8A8A8E',lineHeight:1.6}}>Go back to the ledger and click <span style={{color:R,fontWeight:700}}>MARK</span> on the theft transactions — the trace canvas builds from those marks.</div>
    </div>
  </div>;

        {n.type!=='victim'&&n.comRatio>50&&<span className="mono" style={{fontSize:7,fontWeight:700,padding:'1px 4px',borderRadius:2,background:'rgba(255,189,66,0.2)',color:'#FFBD42'}} title="Flow volume vastly exceeds the stolen amount — this pattern usually means a high-volume service (exchange sweep, payment processor, mixer). Tracing it yields mostly unrelated flows; identify the entity instead (label, explorer, compliance channel).">high-volume — likely service</span>}
        {n.type!=='victim'&&!n.commingled&&!n.taintUnknown&&n.share>=0.01&&n.shareAsset&&<span className="mono" style={{fontSize:7,fontWeight:700,padding:'1px 4px',borderRadius:2,background:'rgba(240,79,82,'+(0.1+0.25*Math.min(1,n.share)).toFixed(2)+')',color:n.share>=0.5?'#FFFFFF':'#C8C8CC'}} title={(n.type==='dest'?'This address received ~':'At most ~')+Math.round(n.share*100)+'% of the total stolen '+n.shareAsset+' (native units — no pricing involved'+(n.type==='dest'?'; these are the marked theft transactions themselves':'; account-model hops are upper bounds')+')'}>{n.type==='dest'?'':'≤ '}{Math.round(n.share*100)}% of stolen {n.shareAsset}</span>}
        {n.type==='dest'&&(()=>{const u=destUsd[n.key];if(!u||u.v==null||(u.v===0&&u.missing>0))return null;const dust=u.v<1&&!u.missing;return <span className="mono" style={{fontSize:7,padding:'1px 4px',borderRadius:2,background:'rgba(255,255,255,0.05)',color:dust?'#8A8A8E':'#C8C8CC'}} title={'Approximate USD value of the marked thefts to this address, priced at each transaction timestamp (DefiLlama). Display only — tracing uses native units.'+(u.missing?' Some transactions had no historical price; this is a partial figure.':'')}>{dust?'≈ <$1 — dust':'≈ '+fmtFiat(u.v)+(u.missing?'+':'')+' at theft'}</span>;})()}
        {n.label&&<span style={{fontSize:8,color:'#FFBD42',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:110}}>"{n.label}"</span>}

        {n.kind==='bridge-hop'&&<span style={{fontSize:7,fontWeight:700,padding:'1px 4px',borderRadius:2,background:'rgba(255,189,66,0.12)',color:'#FFBD42'}} title={'Cross-chain hop resolved by '+(n.viaSrc||n.via)+(n.dstTx?(' — destination tx '+n.dstTx):'')}>⤫ via {n.via} — arrived on {(CHAINS[n.cid]||{}).name||n.dstChainLabel||n.cid}</span>}

          /* Balance is the address's TOTAL native balance — not proof the customer's

          const traced=rec&&rec.status==='done';
          const forwarded=traced&&rec.outflows&&rec.outflows.length>0;
          const dormant=traced&&!forwarded;
          const tNat=(n.taint||{})[ch.ticker]||0; /* stolen amount possible here, in native units */
          if(b.val===0)return <span className="mono" style={{fontSize:8,color:'#7AC26C'}} title="Native coin only — token balances not included">holds 0 (native) — forwarded</span>;
          if(dormant)return <span className="mono" style={{fontSize:8,fontWeight:700,color:'#FFBD42'}} title="Traced: no onward transfers found, and the address holds a balance — the funds appear to remain here. Native coin only.">● funds appear to remain — {fmtVal(b.val)} {ch.ticker||''} (native)</span>;
          if(forwarded&&tNat>0&&b.val>=tNat)return <span className="mono" style={{fontSize:8,fontWeight:700,color:'#FFBD42'}} title={'Traced: this address sent funds onward AND still holds more than the stolen amount ('+fmtVal(b.val)+' vs ≤ '+fmtVal(tNat)+' stolen). Address-level data cannot tell whether the stolen coins left or stayed — both the residual and the outflows are candidates.'}>◐ undetermined — holds {fmtVal(b.val)} {ch.ticker||''}, ≥ stolen amount</span>;
          if(forwarded)return <span className="mono" style={{fontSize:8,color:'#8A8A8E'}} title="Traced: funds were sent onward (follow the lines right). This balance is what's left at the address now — it may be unrelated money. Native coin only.">residual {fmtVal(b.val)} {ch.ticker||''} (native) — forwarded →</span>;
          if(tNat>0&&b.val>=tNat)return <span className="mono" style={{fontSize:8,fontWeight:700,color:'#FFBD42'}} title={'Untraced, but the balance ('+fmtVal(b.val)+') covers the stolen amount ('+fmtVal(tNat)+') — the coins may still be sitting here. Trace to confirm whether they moved. Native coin only.'}>● holds {fmtVal(b.val)} {ch.ticker||''} — ≥ stolen amount, trace now</span>;

          return <span className="mono" style={{fontSize:8,color:'#C8C8CC'}} title="Address balance right now (native coin only). Not yet traced — trace to see whether the stolen funds are still here or moved on.">holds {fmtVal(b.val)} {ch.ticker||''} (native) — untraced</span>;
        })()}</span>

        {(!b||b.status==='error')&&<span onClick={e=>{e.stopPropagation();checkBal(n);}} className="mono" style={{fontSize:8,color:'#8A8A8E',textDecoration:'underline',cursor:'pointer'}}>{b&&b.status==='error'?'balance failed — retry':'check balance'}</span>}
        {n.kind!=='exchange'&&n.kind!=='bridge'&&(

            :{marginLeft:'auto',flexShrink:0,fontSize:8,fontWeight:700,color:R,cursor:'pointer',border:'1px solid rgba(240,79,82,0.4)',borderRadius:2,padding:'1px 6px'}}>{isNext?'◉ TRACE NEXT ▸':'Trace ▸'}</span>

          :rec.status==='error'?<span onClick={e=>{e.stopPropagation();onTrace(n.cid,n.addr,n.firstTs);}} style={{marginLeft:'auto',fontSize:8,color:R,textDecoration:'underline',cursor:'pointer'}} title={rec.error}>trace failed — retry</span>

      </div>}

  };
  return <div style={{flex:1,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden',position:'relative'}}>
    <div style={{padding:'8px 16px',borderBottom:'1px solid rgba(255,255,255,0.07)',display:'flex',alignItems:'center',gap:12,flexShrink:0}}>
      <button onClick={onBack} style={{padding:'4px 10px',borderRadius:2,border:'1px solid rgba(255,255,255,0.15)',background:'transparent',color:'#C8C8CC',fontSize:10,fontWeight:700,cursor:'pointer'}}>← Back to ledger</button>

            {qs.queued>0?('queue '+qs.queued):''}{qs.queued>0&&cool?' · ':''}{cool?(cool[0].replace(/^www\./,'')+' cooling '+cool[1]+'s'):''}

        {batch&&<span className="mono bi-activity-pulse" style={{fontSize:9,color:'#FFBD42'}}>tracing {batch.done}/{batch.total}…</span>}

        {untraced>0&&!batch&&!(auto&&auto.running)&&<button onClick={autoTrace} className="sfyl-cta" style={{padding:'4px 12px',fontSize:10}} title="Follows the stolen funds automatically: traces the highest-taint untraced address, expands what it finds, and repeats until every path ends at an exchange, bridge, dormant wallet, or high-volume service. Skips dust branches (<10% of a stolen asset) and services — those stay manual. Capped at 25 traces per run.">⚡ Auto-trace path</button>}
        {untraced>0&&!batch&&!(auto&&auto.running)&&<button onClick={traceAll} style={{padding:'4px 10px',borderRadius:2,border:'1px solid rgba(240,79,82,0.5)',background:'transparent',color:R,fontSize:10,fontWeight:700,cursor:'pointer'}}>Trace all destinations ({untraced})</button>}

        {n.type!=='victim'&&n.kind!=='unknown'&&<div style={{borderTop:'1px solid rgba(255,255,255,0.08)',margin:'8px 0'}}/>}
        {n.type!=='victim'&&n.kind==='unknown'&&<div style={{fontSize:10,color:'#8A8A8E',lineHeight:1.6,marginTop:8}}>The explorer did not return a destination address for this transaction — open the raw transaction on the explorer to identify the recipient manually. Trace and balance checks are unavailable without an address.</div>}
        {n.type!=='victim'&&n.kind!=='unknown'&&(!rec

function SfylAcctRow({a,rec,active,onSelect,onRetry}){
  const R='#F04F52';
  const st=(rec||{}).status;
  /* Quiet-tier arrival flash — same idiom as Accounts-tab balance arrivals (Q2). */
  const settle=useSettleFlash(st==='done'?'ok':(st==='loading'?'loading':(st||'idle')),{slow:true});

      if((rec||{}).histNote)return <span className={'mono'+(settle?' bi-settle-slow':'')} style={{fontSize:9,color:'#FFBD42',fontWeight:700}} title={(rec||{}).histNote}>⚠ {((rec||{}).txs||[]).length} tx (fallback)</span>;
      return <span className={'mono'+(settle?' bi-settle-slow':'')} style={{fontSize:9,color:'#7AC26C',fontWeight:700}}>{((rec||{}).txs||[]).length} tx</span>;

    if(st==='error')return <span className="mono" style={{fontSize:9,color:R,cursor:'pointer',textDecoration:'underline'}} title={(rec||{}).error} onClick={e=>{e.stopPropagation();onRetry(a);}}>retry</span>;

  })();
  return <div className="sfyl-acct-row" onClick={onSelect}
    style={{padding:'6px 8px',borderRadius:2,marginBottom:2,background:active?'rgba(240,79,82,0.10)':'transparent',border:'1px solid '+(active?'rgba(240,79,82,0.4)':'transparent')}}>

      <span style={{width:7,height:7,borderRadius:'50%',background:ch.color||'#8A8A90',flexShrink:0}}/>

    <div className="mono" style={{fontSize:9,color:'#8A8A8E',marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.addr}</div>
  </div>;
}

              {hits.map((h,i)=><span key={h.key}>{i>0?' · ':''}{(CHAINS[h.a.cid]||{}).name||h.a.cid}: newest {h.ht.fetched} of {h.ht.total}{h.ht.cap?'+':''} transactions fetched{CHAINS[h.a.cid]&&CHAINS[h.a.cid].url?<span> — <a href={CHAINS[h.a.cid].url(h.a.addr)} target="_blank" rel="noreferrer" style={{color:'#FFBD42'}}>check the explorer</a></span>:null}</span>)}

              <span style={{fontSize:10,color:'#C8C8CC',flex:1,minWidth:0}}>Money leaving multiple accounts around the same time, or going to one place. Review each amber row and click MARK to confirm it as theft — nothing is marked automatically.</span>
              <button onClick={()=>setDirFilter('suggested')} style={{padding:'3px 10px',borderRadius:2,border:'1px solid rgba(255,189,66,0.5)',background:'transparent',color:'#FFBD42',fontSize:10,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>Show suggested only</button>

              <button onClick={()=>setSug(null)} style={{padding:'3px 10px',borderRadius:2,border:'1px solid rgba(255,255,255,0.15)',background:'transparent',color:'#C8C8CC',fontSize:10,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>Dismiss</button>
            </React.Fragment>}

        <div style={{flex:1,overflowY:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr style={{position:'sticky',top:0,background:'#151518',zIndex:2}}>
              {['Time (UTC)','Account','Dir','Amount','Counterparty','Tx','Theft'].map(h=>
                <th key={h} style={{textAlign:h==='Theft'?'center':'left',padding:'6px 10px',fontSize:9,fontWeight:700,letterSpacing:'0.06em',textTransform:'uppercase',color:'#8A8A8E',borderBottom:'1px solid rgba(255,255,255,0.08)'}}>{h}</th>)}

            <tbody>

              {rows.length===0&&<tr><td colSpan={7} style={{padding:'40px 16px',textAlign:'center',fontSize:12,color:'#8A8A8E'}}>
                {busy?'Fetching live transaction history from public chain APIs — accounts populate as results arrive…'
                  :(dirFilter==='suggested'?'No suggestions in this view — run Find suspicious transactions, or switch to OUTGOING.'
                  :'No transactions loaded for this selection. Check per-account status on the left (retry failed accounts, or the chain may not have a keyless data source yet).')}
              </td></tr>}
            </tbody>
          </table>
        </div>
        <div style={{padding:'8px 16px',borderTop:'1px solid rgba(255,255,255,0.08)',background:'#111114',display:'flex',alignItems:'center',gap:16,flexShrink:0,minHeight:40}}>
          {marked.length===0
            ?<span style={{fontSize:10,color:'#8A8A8E'}}>No theft transactions marked yet. Click MARK on outgoing rows — marks build the live flow map and the report.</span>
            :<React.Fragment>

              {usd.priced>0&&<span className="mono" style={{fontSize:11,fontWeight:700,color:'#FFFFFF'}} title={'USD at transaction time, DefiLlama coins API'+(usd.unpriced>0?(' · '+usd.unpriced+' row(s) unpriced'):'')}>≈ {fmtFiat(usd.total)}{usd.unpriced>0?'*':''}</span>}
              <span style={{fontSize:10,color:'#C8C8CC'}}>{markedDests.length} destination{markedDests.length!==1?'s':''}</span>
              <span className="mono" style={{fontSize:10,color:'#C8C8CC',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>
                {Object.entries(byAsset).map(([a2,v])=>fmtVal(v)+' '+a2).join(' · ')}
              </span>
              <button className="sfyl-cta" onClick={()=>{try{navigator.clipboard.writeText(_sfylReportText(marked,sfylTrace,usd,(sfylCompromise&&sfylCompromise.status==='done'&&sfylCompromise.sig===_sfylMarkSig(marked))?sfylCompromise:null));}catch(_){ }setRptOk('copy');setTimeout(()=>setRptOk(null),900);}}>
                {rptOk==='copy'?'✓ Copied':'Copy report'}</button>
              <button onClick={()=>{
                const blob=new Blob([_sfylReportCsv(marked,sfylTrace)],{type:'text/csv'});
                const u=URL.createObjectURL(blob);const el=document.createElement('a');
                el.href=u;el.download='sfyl-report-'+new Date().toISOString().slice(0,16).replace(/[T:]/g,'-')+'.csv';
                document.body.appendChild(el);el.click();document.body.removeChild(el);
                setTimeout(()=>URL.revokeObjectURL(u),2000);
                setRptOk('csv');setTimeout(()=>setRptOk(null),900);
              }} style={{padding:'5px 12px',borderRadius:2,border:'1px solid rgba(255,255,255,0.15)',background:'transparent',color:rptOk==='csv'?'#7AC26C':'#C8C8CC',fontSize:10,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>{rptOk==='csv'?'✓ Saved':'Download CSV'}</button>
            </React.Fragment>}
        </div>
      </div>
      {/* ── Right: live flow map — builds as marks land ── */}
      <div style={{width:'36%',minWidth:330,maxWidth:520,flexShrink:0,borderLeft:'1px solid rgba(255,255,255,0.07)',display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}}>
        <div style={{padding:'8px 14px',borderBottom:'1px solid rgba(255,255,255,0.07)',display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
          <span className="mono" style={{fontSize:9,fontWeight:700,letterSpacing:'0.08em',color:'#8A8A8E'}}>LIVE FLOW — BUILDS AS YOU MARK</span>
          {marked.length>0&&<span className="mono" style={{marginLeft:'auto',fontSize:9,color:'#C8C8CC'}}>{markedDests.length} destination{markedDests.length!==1?'s':''}{convCount>0?' · '+convCount+' convergence':''}</span>}
        </div>
        <SfylFlow marked={marked} fmtVal={fmtVal} fmtTs={fmtTs} sfylTrace={sfylTrace} onTrace={onTrace}/>

    </div>
  </div>;
}
