                    <span style={{color:'var(--bi-fg-2)'}}>status.ledger.com:</span>
                    <span style={{color:'var(--bi-fg-1)',fontWeight:500,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                      {ledgerStatus===null?'checking…':(parseStatusData?.(ledgerStatus,logData)||[]).length>0?'services degraded':'all systems operational'}
                    </span>
                    <a href="https://status.ledger.com" target="_blank" rel="noopener" className="bi-link" onClick={e=>e.stopPropagation()}>open ↗</a>
                  </div>
                </Card>
              </div>

              {/* ═══════ Col 3 — Portfolio + Timeline ═══════ */}
              <div style={{display:'grid',gridTemplateRows:'1fr 240px',gap:12,minHeight:0}}>

                {/* Portfolio */}
                <Card i={3}>
                  <div className="bi-card-hd">
                    <div>
                      <div className="bi-title">Portfolio</div>
                      <div className="bi-sub" style={{fontVariantNumeric:'tabular-nums'}}><CountUp value={totalFiat} fmt={v=>v>=0.005?fmtFiat(v,true):accts.length+' accounts'}/> · {chains.length} chain{chains.length!==1?'s':''}{totalFiat===0?' · live balances pending':''}</div>
                    </div>
                    <span className="bi-link" onClick={()=>setSection('accounts')}>Open Accounts →</span>
                  </div>
                  {/* Treemap row */}
                  <div style={{padding:'10px 12px 6px',flexShrink:0}}>
                    <OvTreemap chains={chainsForTm.slice(0,8)} onPick={c=>{setSection('accounts');setAcctFilter(c.name);}} onMore={()=>setSection('accounts')}/>
                  </div>
                  {/* Top accounts list */}
                  <div style={{flex:1,overflow:'auto',minHeight:0,borderTop:'1px solid var(--bi-border)'}}>
                    {topAccts.map((a,i)=>{
                      const lb=liveBalances[a.id];
                      const fiat=lb?.fiat||0;
                      const shortAddr=a.addr?(a.addr.length>20?a.addr.slice(0,10)+'…'+a.addr.slice(-6):a.addr):'';
                      const noSync=a.dur==null&&a.bal==null&&lb?.status!=='ok';
                      const isFocDimmed=focusedAcct&&!(focusedAcct.addr===a.addr&&focusedAcct.cid===a.cid);
                      return <div key={a.id} className="bi-tr" onClick={()=>{setSelectedDiagAcct(a);setSection('accounts');}} style={{'--i':i+1,'--bi-row-pad':'14px',padding:'5px 14px',borderBottom:i<topAccts.length-1?'1px solid var(--bi-border)':'none',opacity:isFocDimmed?0.35:1,transition:'opacity 200ms ease',cursor:'pointer'}}>
                        <div style={{display:'flex',alignItems:'center',gap:8,fontSize:12}}>
                          <Swatch color={a.ch.color}/>
                          <span style={{color:'var(--bi-fg-1)',minWidth:64,whiteSpace:'nowrap'}}>{a.ch.name}</span>
                          <span className="mono" style={{fontSize:10,color:'var(--bi-fg-3)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{shortAddr}</span>
                          <span className="mono" style={{fontSize:10,color:'var(--bi-fg-3)',minWidth:32,textAlign:'right'}}>{a.ops||0} ops</span>
                          <span className="mono" style={{color:noSync?'var(--bi-rank-3)':fiat>0?'var(--bi-fg-1)':'var(--bi-fg-4)',minWidth:72,textAlign:'right',fontSize:11,fontWeight:600}}>{lb?.status==='loading'?<span className="bi-skel" style={{width:44,height:8}}/>:noSync?'no sync':fiat>0?fmtFiat(fiat):'—'}</span>
                        </div>
                      </div>;
                    })}
                    {accts.length===0&&<div style={{padding:'18px 14px',fontSize:12,color:'var(--bi-fg-3)',textAlign:'center'}}>No accounts found in this log.</div>}
                  </div>
                </Card>

                {/* Timeline mini */}
                <Card i={4}>
                  <div className="bi-card-hd">
                    <div>
                      <div className="bi-title">Session timeline</div>
                      <div className="bi-sub"><CountUp value={ents.length} fmt={v=>Math.round(v).toLocaleString()}/> events{ents.length>1?(() => { const t0=new Date(ents[0].timestamp||ents[0].date).getTime(),t1=new Date(ents[ents.length-1].timestamp||ents[ents.length-1].date).getTime(),s=Math.round((t1-t0)/1000); return ' · '+fmtDur(s); })():''}</div>
                    </div>
                    <span className="bi-link" onClick={()=>setSection('timeline')}>Open Timeline →</span>
                  </div>
                  <div style={{padding:'8px 12px 4px',flexShrink:0,display:'flex',alignItems:'flex-end',gap:1,height:60}}>
                    {tlBuckets.map((b,i)=>{
                      const h1=(b.network/tlMax)*48;
                      const h2=(b.action/tlMax)*48;
                      const h3=(b.apdu/tlMax)*48;
                      const h4=(b.other/tlMax)*48;
                      const hE=b.error>0?6:0;
                      return <div key={i} style={{flex:1,display:'flex',flexDirection:'column',justifyContent:'flex-end',alignItems:'stretch',gap:0,height:54,position:'relative'}}>
                        {b.error>0&&<div style={{height:hE,background:'#D94747',borderRadius:1,boxShadow:'0 0 4px #D94747'}}/>}
                        <div style={{height:h4,background:'var(--bi-cat-7)'}}/>
                        <div style={{height:h3,background:'var(--bi-cat-4)'}}/>
                        <div style={{height:h2,background:'var(--bi-cat-1)'}}/>
                        <div style={{height:h1,background:'var(--bi-cat-3)'}}/>
                      </div>;
                    })}
                  </div>
                  <div style={{padding:'0 12px 4px',display:'flex',gap:10,fontSize:9,color:'var(--bi-fg-3)',flexShrink:0}}>
                    <span><Swatch color="var(--bi-cat-3)" size={6}/> network</span>
                    <span><Swatch color="var(--bi-cat-1)" size={6}/> action</span>
                    <span><Swatch color="var(--bi-cat-4)" size={6}/> apdu</span>
                    <span><Swatch color="var(--bi-cat-7)" size={6}/> other</span>
                    <span><Swatch color="#D94747" size={6}/> error</span>
                  </div>
                  <div style={{flex:1,overflow:'auto',minHeight:0,borderTop:'1px solid var(--bi-border)'}}>
                    {keyEvents.slice(0,4).map((e,i)=>(
                      <div key={i} className="bi-tr" style={{'--i':i+1,'--bi-row-pad':'14px',display:'flex',alignItems:'center',gap:10,padding:'4px 14px',fontSize:11,borderBottom:i<3?'1px solid var(--bi-border)':'none'}}>
                        <span className="mono" style={{color:'var(--bi-fg-3)',minWidth:60,fontSize:10}}>{e.t||''}</span>
                        <Dot color={e.c} size={6}/>
                        <span style={{color:'var(--bi-fg-1)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.l}</span>
                      </div>
                    ))}
                  </div>
                </Card>
              </div>
            </div>
          </div>;
        })()}

        {/* Timeline */}
        {section==='timeline'&&(()=>{
          const ents=logData.entries;
          if(ents.length<2)return <div className="bi-overview" style={{padding:'12px 16px'}}><div className="bi-card bi-mount-up" style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:40,textAlign:'center'}}><div><div style={{fontSize:14,color:'var(--bi-fg-1)',marginBottom:6}}>Not enough events to render a timeline</div><div style={{fontSize:12,color:'var(--bi-fg-3)'}}>This log has {ents.length} entries.</div></div></div></div>;

          const t0=new Date(ents[0].timestamp||ents[0].date).getTime();
          const t1=new Date(ents[ents.length-1].timestamp||ents[ents.length-1].date).getTime();
          const span=t1-t0;
          const durSec=span/1000;
          const durLabel=fmtDur(durSec);

          const N=80;
          const buckets=Array.from({length:N},()=>({types:{},total:0,samples:[]}));
          const typeTotals={};
          for(const e of ents){
            const idx=Math.min(Math.floor((((new Date(e.timestamp||e.date).getTime())-t0)/span)*N),N-1);
            const b=buckets[idx];if(!b)continue;
            const tp=e.type||'unknown';
            b.types[tp]=(b.types[tp]||0)+1;
            b.total++;
            typeTotals[tp]=(typeTotals[tp]||0)+1;
            if(b.samples.length<2)b.samples.push(e);
          }
          const maxTotal=Math.max(...buckets.map(b=>b.total),1);
          const sortedTypes=Object.keys(typeTotals).sort((a,b)=>{
            if(a==='error')return -1;if(b==='error')return 1;
            return typeTotals[b]-typeTotals[a];
          });
          tlTimeRef.current={t0,t1,ents};

          // Error dots data
          const errDots=[];
          for(const e of ents){
            const isErr=e.level==='error'||e.type==='error'||(e.error&&typeof e.error==='object'&&Object.keys(e.error).length>0)||((e.message||'').toLowerCase().includes('rejected'));
            if(isErr){
              const pct=(((new Date(e.timestamp||e.date).getTime())-t0)/span)*100;
              const isCrit=(e.level==='error'||e.type==='error');
              errDots.push({pct,li:e.logIndex,ts:e.timestamp||e.date,msg:trunc(e.message||'Error',50),crit:isCrit});
            }
          }

          const scrollToEntry=li=>{
            setExpandedRow(li);
            setTimeout(()=>{const el=timelineScrollRef.current?.querySelector(`[data-li="${li}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},50);
          };

          const handleBarHover=ev=>{
            const rect=ev.currentTarget.getBoundingClientRect();
            const idx=Math.min(Math.floor(((ev.clientX-rect.left)/rect.width)*N),N-1);
            setTlHoveredBucket(idx>=0?{idx,x:ev.clientX-rect.left,cw:rect.width}:null);
          };

          const fmtT=t=>{try{return new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});}catch{return '—';}};

          return <div className="bi-overview" style={{padding:'12px 16px 16px',display:'flex',flexDirection:'column',gap:10,height:'100%',minHeight:0}}>

            {/* ── Active filters chip row ── single source of truth for what's narrowing the view.
               Hides entirely when nothing is filtering. Each chip's × removes that one; "Clear all" wipes them in lockstep. ── */}
            {(()=>{
              const chips=[];
              if(tlBrush){
                const bs=Math.min(tlBrush.start,tlBrush.end);
                const be=Math.max(tlBrush.start,tlBrush.end);
                const lbl=fmtT(new Date(t0+bs*span).toISOString())+'–'+fmtT(new Date(t0+be*span).toISOString());
                chips.push({k:'range',label:'range: '+lbl,color:'#E85A1A',clear:()=>setTlBrush(null)});
              }
              if(tlAcctFilter){
                chips.push({k:'account',label:'account: '+tlAcctFilter.name,color:tlAcctFilter.color||'#E85A1A',clear:()=>setTlAcctFilter(null)});
              }
              if(typeFilter&&typeFilter!=='all'){
                const c=TC[typeFilter.toLowerCase()]||'#717070';
                chips.push({k:'type',label:'type: '+typeFilter,color:c,clear:()=>setTypeFilter('all')});
              }
              if(searchTerm){
                chips.push({k:'search',label:'search: '+searchTerm,color:'#4FBFE8',clear:()=>setSearchTerm('')});
              }
              if(chips.length===0)return null;
              return <div className="bi-slide-down" style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',padding:'6px 10px',background:'var(--bi-bg-card-alt)',border:'1px solid var(--bi-border)',borderRadius:2,flexShrink:0}}>
                <span style={{fontSize:9,color:'var(--bi-fg-3)',letterSpacing:'0.08em',textTransform:'uppercase',fontWeight:700,marginRight:4}}>Active filters</span>
                {chips.map(c=><span key={c.k} style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 4px 2px 8px',borderRadius:2,fontSize:10,fontWeight:500,background:c.color+'18',border:'1px solid '+c.color+'45',color:c.color}}>
                  <span className="mono">{c.label}</span>
                  <button onClick={c.clear} title="Remove" style={{border:'none',background:'transparent',color:'inherit',cursor:'pointer',fontSize:12,padding:'0 3px',lineHeight:1,opacity:0.75}}>×</button>
                </span>)}
                <span style={{flex:1}}/>
                <span onClick={()=>{setTlBrush(null);setTlAcctFilter(null);setTypeFilter('all');setSearchTerm('');}} style={{fontSize:11,color:'var(--bi-orange)',cursor:'pointer',padding:'0 6px'}}>Clear all</span>
              </div>;
            })()}

            {/* ── Density chart ── Single-mode (Stacked). The Stacked/Lanes toggle was removed;
               the swimlane panel below provides the per-type breakdown the Lanes mode used to.
               An inline legend in the header (6 dots) names the visible series. ── */}
            <div className="bi-card bi-mount-up" style={{'--i':0,padding:0,flexShrink:0,overflow:'hidden'}}>
              <div className="bi-card-hd" style={{flexWrap:'wrap',gap:8}}>
                <div>
                  <div className="bi-title">Event density{tlBrush?' · brushed':''}</div>
                  <div className="bi-sub">{fmtT(ents[0].timestamp||ents[0].date)} → {fmtT(ents[ents.length-1].timestamp||ents[ents.length-1].date)} · {ents.length.toLocaleString()} events · {durLabel} · drag to zoom · click to jump</div>
                </div>
                <div style={{display:'inline-flex',alignItems:'center',gap:10,flexWrap:'wrap',justifyContent:'flex-end',marginLeft:'auto'}}>
                  {sortedTypes.slice(0,6).map(tp=>{
                    const color=TC[tp.toLowerCase()]||'#717070';
                    return <span key={tp} style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:9,color:'var(--bi-fg-3)',letterSpacing:'0.02em'}}>
                      <span style={{width:6,height:6,borderRadius:1,background:color,flexShrink:0}}/>{tp}
                    </span>;
                  })}
                </div>
              </div>

              {/* Histogram body — Stacked only. Brush, error ticks, type-highlight cross-link to swimlane + chips preserved. */}
              <div style={{height:120,display:'flex',alignItems:'flex-end',background:'var(--bi-bg-strip)',cursor:'crosshair',userSelect:'none',position:'relative',padding:'0 1px'}}
                onMouseDown={ev=>{const rect=ev.currentTarget.getBoundingClientRect();const start=(ev.clientX-rect.left)/rect.width;tlBrushRef.current={start,end:start,rect};setTlBrushing(true);setTlBrush({start,end:start});ev.preventDefault();}}
                onMouseMove={handleBarHover}
                onMouseLeave={()=>setTlHoveredBucket(null)}>
                {buckets.map((b,i)=>{
                  const h=Math.max(2,(b.total/maxTotal)*114);
                  const isHov=tlHoveredBucket?.idx===i;
                  const segs=[];
                  for(const tp of sortedTypes){
                    if(b.types[tp])segs.push({type:tp,count:b.types[tp],pct:(b.types[tp]/b.total)*100});
                  }
                  return <div key={i} className="bar-v" style={{flex:1,height:h,alignSelf:'flex-end',display:'flex',flexDirection:'column',opacity:isHov?1:(tlHighlightType&&!b.types[tlHighlightType])?0.15:0.92,transition:'opacity 80ms linear',borderRadius:'1px 1px 0 0',overflow:'hidden','--i':Math.min(i,30)}}>
                    {segs.map((s,si)=>{
                      const color=TC[s.type.toLowerCase()]||'#717070';
                      const dimmed=tlHighlightType&&s.type!==tlHighlightType;
                      return <div key={si} style={{flex:s.pct,background:color,opacity:dimmed?0.15:1,minHeight:1}}/>;
                    })}
                  </div>;
                })}
                {/* Datum line — hairline + mono tick label tracking the cursor (positional, not animated). */}
                {tlHoveredBucket&&(()=>{
                  const dt=t0+(tlHoveredBucket.x/tlHoveredBucket.cw)*span;const lx=tlHoveredBucket.x;
                  return <React.Fragment>
                    <div style={{position:'absolute',left:lx,top:0,bottom:0,width:1,background:'var(--bi-border-strong)',pointerEvents:'none',zIndex:20}}/>
                    <div className="mono" style={{position:'absolute',top:2,left:Math.min(lx+4,tlHoveredBucket.cw-50),fontSize:9,color:'var(--bi-fg-2)',background:'var(--bi-bg-card)',border:'1px solid var(--bi-border)',borderRadius:2,padding:'0 3px',pointerEvents:'none',zIndex:20,whiteSpace:'nowrap'}}>{isNaN(dt)?'—':fmtTime(new Date(dt).toISOString(),{ms:false})}</div>
                  </React.Fragment>;
                })()}
                {tlHoveredBucket&&(()=>{
                  const b=buckets[tlHoveredBucket.idx];
                  if(!b||b.total===0)return null;
                  const bTime=t0+(tlHoveredBucket.idx/N)*span;
                  const topTypes=Object.entries(b.types).sort((a,bb)=>bb[1]-a[1]).slice(0,4);
                  const sample=b.samples[0];
                  const tipW=220;
                  const left=tlHoveredBucket.x+tipW>tlHoveredBucket.cw?Math.max(0,tlHoveredBucket.x-tipW):tlHoveredBucket.x;
                  return <div style={{position:'absolute',left,bottom:'calc(100% + 6px)',width:tipW,background:'var(--bi-bg-card)',border:'1px solid var(--bi-border-strong)',borderRadius:2,boxShadow:'0 4px 12px rgba(0,0,0,0.5)',padding:'8px 10px',zIndex:30,pointerEvents:'none',fontSize:10}}>
                    <div className="mono" style={{color:'var(--bi-fg-3)',marginBottom:4}}>{isNaN(bTime)?'—':fmtT(new Date(bTime).toISOString())} · {b.total} event{b.total!==1?'s':''}</div>
                    <div style={{display:'flex',flexDirection:'column',gap:2}}>
                      {topTypes.map(([tp,ct])=>(
                        <div key={tp} style={{display:'flex',alignItems:'center',gap:5}}>
                          <div style={{width:6,height:6,borderRadius:1,background:TC[tp.toLowerCase()]||'#717070',flexShrink:0}}/>
                          <span style={{color:'var(--bi-fg-1)'}}>{tp}</span>
                          <span style={{color:'var(--bi-fg-3)',marginLeft:'auto'}}>{ct}</span>
                        </div>
                      ))}
                    </div>
                    {sample&&<div className="mono" style={{color:'var(--bi-fg-3)',marginTop:4,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',borderTop:'1px solid var(--bi-border)',paddingTop:4}}>{trunc(sample.message,40)}</div>}
                  </div>;
                })()}
                {tlBrush&&(()=>{
                  const bleft=Math.min(tlBrush.start,tlBrush.end)*100;
                  const bright=(1-Math.max(tlBrush.start,tlBrush.end))*100;
                  return <>
                    <div style={{position:'absolute',top:0,bottom:0,left:0,width:bleft+'%',background:'rgba(0,0,0,0.5)',pointerEvents:'none',zIndex:5}}/>
                    <div style={{position:'absolute',top:0,bottom:0,right:0,width:bright+'%',background:'rgba(0,0,0,0.5)',pointerEvents:'none',zIndex:5}}/>
                    <div style={{position:'absolute',top:0,bottom:0,left:bleft+'%',right:bright+'%',border:'1px solid var(--bi-orange)',pointerEvents:'none',zIndex:6}}/>
                  </>;
                })()}
              </div>

              {/* Error dots row — unchanged. */}
              <div style={{height:22,position:'relative',borderTop:'1px solid var(--bi-border)',background:'var(--bi-bg-strip)'}}>
                {errDots.length>0&&<div style={{position:'absolute',top:3,left:8,fontSize:9,color:'#D94747',fontWeight:700,letterSpacing:'0.04em',pointerEvents:'none'}}>{errDots.length} ERROR{errDots.length!==1?'S':''}</div>}
                {errDots.map((d,i)=>(
                  <div key={i} onClick={()=>scrollToEntry(d.li)} title={fmtT(d.ts)+' — '+d.msg}
                    style={{position:'absolute',left:d.pct+'%',top:'50%',width:d.crit?10:8,height:d.crit?10:8,borderRadius:'50%',background:d.crit?'#D94747':'#E88A4A',transform:'translate(-50%,-50%)',cursor:'pointer',zIndex:2,border:'2px solid var(--bi-bg-strip)',transition:'transform 120ms var(--bi-ease)'}}
                    onMouseEnter={e=>e.currentTarget.style.transform='translate(-50%,-50%) scale(1.3)'}
                    onMouseLeave={e=>e.currentTarget.style.transform='translate(-50%,-50%) scale(1)'}
                  />
                ))}
                {errDots.length===0&&<div style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',fontSize:10,color:'var(--bi-fg-4)'}}>No errors</div>}
              </div>
              {/* (Brush footer removed — brush range surfaces in the active-filters chip row above.) */}
            </div>

            {/* ── Below-chart: swimlane panel (left) + event log (right) ── 5fr/7fr gives the log enough room for two-line enriched rows. Each side scrolls independently. ── */}
            <div style={{display:'grid',gridTemplateColumns:'5fr 7fr',gap:12,flex:1,minHeight:0}}>

              {/* Swimlane panel — one lane per event type, ticks marked within current brush (or full session). Click a lane to filter; hover a tick for ts + sample. */}
              <div className="bi-card bi-mount-up" style={{'--i':1,padding:0,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}}>
                <div className="bi-card-hd">
                  <div>
                    <div className="bi-title">Swimlane · by event type</div>
                    <div className="bi-sub">click a lane to filter · {tlBrush?'within current brush':'full session'}</div>
                  </div>
                </div>
                <div style={{flex:1,overflow:'auto',minHeight:0,padding:'8px 0'}}>
                  {(()=>{
                    /* Lane window: brush range if set, else full session. */
                    const laneT0=tlBrush?(t0+Math.min(tlBrush.start,tlBrush.end)*span):t0;
                    const laneT1=tlBrush?(t0+Math.max(tlBrush.start,tlBrush.end)*span):t1;
                    const laneSpan=laneT1-laneT0||1;
                    /* Filter to lane window + account filter. NOT typeFilter / searchTerm —
                       those would empty out lanes; the lane panel exists to show the type breakdown
                       for the current spatial slice. */
                    let laneEnts=ents;
                    if(tlBrush){
                      laneEnts=laneEnts.filter(x=>{const et=new Date(x.timestamp||x.date).getTime();return et>=laneT0&&et<=laneT1;});
                    }
                    if(tlAcctFilter&&tlAcctFilter.addr){
                      const filt=tlAcctFilter.addr.toLowerCase();
                      laneEnts=laneEnts.filter(x=>((x.message||'')+JSON.stringify(x.data||'')).toLowerCase().includes(filt));
                    }
                    const byType={};
                    for(const e of laneEnts){
                      const tp=e.type||'unknown';
                      if(!byType[tp])byType[tp]=[];
                      const pct=(((new Date(e.timestamp||e.date).getTime())-laneT0)/laneSpan)*100;
                      byType[tp].push({pct,e});
                    }
                    const laneTypes=Object.keys(byType).sort((a,b)=>byType[b].length-byType[a].length);
                    if(laneTypes.length===0)return <div style={{padding:24,textAlign:'center',fontSize:11,color:'var(--bi-fg-3)',fontStyle:'italic'}}>No events matching current filters</div>;
                    return laneTypes.map(tp=>{
                      const color=TC[tp.toLowerCase()]||'#717070';
                      const ticks=byType[tp];
                      const isActive=typeFilter===tp;
                      const isDimmed=typeFilter!=='all'&&typeFilter&&!isActive;
                      return <div key={tp}
                        onClick={()=>setTypeFilter(isActive?'all':tp)}
                        onMouseEnter={()=>setTlHighlightType(tp)}
                        onMouseLeave={()=>setTlHighlightType(null)}
                        style={{display:'grid',gridTemplateColumns:'130px 1fr 50px',alignItems:'center',gap:8,padding:'5px 14px',cursor:'pointer',opacity:isDimmed?0.35:1,background:isActive?'rgba(232,90,26,0.06)':'transparent',transition:'background 80ms linear, opacity 80ms linear',borderLeft:isActive?'2px solid var(--bi-orange)':'2px solid transparent'}}>
                        <div style={{display:'flex',alignItems:'center',gap:6,overflow:'hidden'}}>
                          <span style={{width:8,height:8,borderRadius:2,background:color,flexShrink:0}}/>
                          <span className="mono" style={{fontSize:10,color:isActive?color:'var(--bi-fg-2)',fontWeight:isActive?700:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={tp}>{tp}</span>
                        </div>
                        <div style={{position:'relative',height:16,background:'rgba(255,255,255,0.025)',borderRadius:1,overflow:'hidden'}}>
                          {ticks.slice(0,300).map((tk,i)=><div key={i}
                            title={fmtT(tk.e.timestamp||tk.e.date)+' · '+trunc(tk.e.message||tk.e.type,60)}
                            onClick={ev=>{ev.stopPropagation();scrollToEntry(tk.e.logIndex);}}
                            style={{position:'absolute',left:tk.pct+'%',top:2,bottom:2,width:1.5,background:color,opacity:0.85,cursor:'pointer'}}/>)}
                        </div>
                        <span className="mono" style={{fontSize:10,color:'var(--bi-fg-3)',textAlign:'right'}}>{ticks.length.toLocaleString()}</span>
                      </div>;
                    });
                  })()}
                </div>
              </div>

              {/* Event log — enriched two-line rows: severity bar + mono ms timestamp + primary line + secondary metadata + severity badge + account context. */}
              <div className="bi-card bi-mount-up" style={{'--i':2,padding:0,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}}>
                <div className="bi-card-hd" style={{flexWrap:'wrap',gap:8,rowGap:6}}>
                  <div style={{display:'flex',alignItems:'baseline',gap:8,flexShrink:0}}>
                    <div className="bi-title">Event log</div>
                    <span className="mono" style={{fontSize:10,color:'var(--bi-fg-3)'}}>{filtered.length.toLocaleString()}{filtered.length!==ents.length?' of '+ents.length.toLocaleString():''}</span>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:6,marginLeft:'auto',flexWrap:'wrap'}}>
                    <input value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} placeholder="Search messages…" className="mono" style={{padding:'4px 10px',background:'var(--bi-bg-card-alt)',border:'1px solid var(--bi-border)',borderRadius:2,color:'var(--bi-fg-1)',fontSize:11,width:180,outline:'none'}}/>
                    <div style={{display:'inline-flex',borderRadius:2,overflow:'hidden',border:'1px solid var(--bi-border)'}}>
                      <button onClick={()=>{setTlGrouping(false);setExpandedGroups({});}} style={{padding:'3px 10px',border:'none',background:!tlGrouping?'var(--bi-bg-card-alt)':'transparent',color:!tlGrouping?'var(--bi-fg-1)':'var(--bi-fg-3)',fontFamily:'var(--bi-font-mono)',fontSize:10,cursor:'pointer'}}>List</button>
                      <button onClick={()=>{setTlGrouping(true);setExpandedGroups({});}} style={{padding:'3px 10px',border:'none',background:tlGrouping?'var(--bi-bg-card-alt)':'transparent',color:tlGrouping?'var(--bi-fg-1)':'var(--bi-fg-3)',fontFamily:'var(--bi-font-mono)',fontSize:10,cursor:'pointer'}}>Grouped</button>
                    </div>
                    <span onClick={()=>downloadJSON(filtered,'filtered-logs.json')} className="bi-link" style={{fontSize:11}}>Export →</span>
                  </div>
                </div>
                <div ref={timelineScrollRef} style={{flex:1,overflow:'auto',minHeight:0}}>
                  {filtered.length===0
                    ?<div style={{padding:24,textAlign:'center',fontSize:11,color:'var(--bi-fg-3)',fontStyle:'italic'}}>No events matching current filters</div>
                    :(()=>{
                      /* Pre-build an account address → label lookup once per render so per-row enrichment is cheap. */
                      const acctLookup=(logData.accts||[]).filter(a=>a.addr&&a.addr.length>=10).map(a=>({addr:a.addr.toLowerCase(),label:a.ch.ticker+' · '+(a.addr.length>12?a.addr.slice(0,4)+'…'+a.addr.slice(-4):a.addr),color:a.ch.color}));
                      const fmtTsMs=ts=>{const d=new Date(ts);return isNaN(d)?'—':String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')+'.'+String(d.getMilliseconds()).padStart(3,'0');};
                      const enrich=e=>{
                        const ts=e.timestamp||e.date;
                        const tsMs=fmtTsMs(ts);
                        const tp=e.type||'';
                        const status=e.data?.status??e.status??null;
                        const isCrit=e.level==='error'||e.type==='error';
                        const isWarn=!isCrit&&((status!=null&&Number(status)>=400)||(e.message||'').toLowerCase().includes('rejected')||(e.error&&typeof e.error==='object'&&Object.keys(e.error).length>0));
                        const sev=isCrit?'CRITICAL':isWarn?'WARNING':null;
                        const sevColor=isCrit?'#D94747':isWarn?'#E88A4A':null;
                        let primary=e.message||tp;
                        let secondary=null;
                        if(tp==='network'){
                          const method=e.data?.method||e.method||'';
                          const url=e.data?.url||e.url||'';
                          let urlShort=url;
                          try{const u=new URL(url);urlShort=u.host+u.pathname;}catch{}
                          primary=(method?method+' ':'')+(urlShort||e.message||'');
                          const bits=[];
                          if(status!=null)bits.push(String(status));
                          if(e.data?.retry)bits.push('retry '+e.data.retry);
                          const dur=e.data?.duration||e.data?.latency||e.data?.responseTime;
                          if(dur)bits.push(dur<1000?Math.round(dur)+'ms':(dur/1000).toFixed(1)+'s');
                          if(bits.length)secondary=bits.join(' · ');
                        }else if(tp==='apdu'){
                          const dirM=(e.message||'').match(/\b(rx|tx|in|out)\b/i);
                          const dir=e.data?.dir||(dirM?dirM[0]:'');
                          primary=(dir?dir.toUpperCase()+' · ':'')+(e.message||'APDU');
                          if(e.data?.apdu)secondary=String(e.data.apdu).slice(0,80);
                        }else if(e.data&&typeof e.data==='object'){
                          const k=Object.keys(e.data);
                          if(k.length>0&&k.length<=6){
                            const s=JSON.stringify(e.data);
                            if(s.length>2&&s.length<160)secondary=s;
                            else if(s.length>=160)secondary=s.slice(0,156)+'…';
                          }
                        }
                        let acctCtx=null;
                        if(acctLookup.length>0){
                          const hay=(primary+' '+(secondary||'')).toLowerCase();
                          for(const a of acctLookup){if(hay.includes(a.addr)){acctCtx=a;break;}}
                        }
                        return{tsMs,primary,secondary,sev,sevColor,acctCtx};
                      };
                      const renderSingle=(e,idx)=>{
                        const isExp=expandedRow===e.logIndex;
                        const tp=e.type||'';
                        const color=TC[tp.toLowerCase()]||'#717070';
                        const en=enrich(e);
                        const barColor=en.sevColor||(isExp?'var(--bi-orange)':'transparent');
                        const rowBg=en.sev==='CRITICAL'?'rgba(217,71,71,0.05)':en.sev==='WARNING'?'rgba(232,138,74,0.04)':isExp?'rgba(232,90,26,0.06)':'transparent';
                        const isFocDimmed=focusedAcct&&!focusAcctMatchesEntry(e,focusedAcct);
                        return <div key={'row-'+e.logIndex} data-li={e.logIndex}>
                          <div onClick={()=>setExpandedRow(isExp?null:e.logIndex)}
                            style={{padding:'7px 12px 7px 14px',borderBottom:'1px solid var(--bi-border)',background:rowBg,borderLeft:'2px solid '+barColor,cursor:'pointer',display:'grid',gridTemplateColumns:'88px 1fr auto',gap:10,alignItems:'flex-start',opacity:isFocDimmed?0.35:1,transition:'background 80ms linear, opacity 200ms ease'}}>
                            <div className="mono" style={{fontSize:10,color:'var(--bi-fg-3)',paddingTop:1,whiteSpace:'nowrap'}}>{en.tsMs}</div>
                            <div style={{minWidth:0,display:'flex',flexDirection:'column',gap:2}}>
                              <div style={{display:'flex',alignItems:'center',gap:6,minWidth:0}}>
                                <span style={{width:7,height:7,borderRadius:2,background:color,flexShrink:0}}/>
                                <span className="mono" style={{fontSize:11,color:'var(--bi-fg-1)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:500}} title={en.primary}>{en.primary}</span>
                              </div>
                              {en.secondary&&<div className="mono" style={{fontSize:10,color:'var(--bi-fg-3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',paddingLeft:13}} title={en.secondary}>{en.secondary}</div>}
                            </div>
                            <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:3,flexShrink:0}}>
                              {en.sev&&<span style={{fontSize:8,color:en.sevColor,fontWeight:700,letterSpacing:'0.08em',padding:'1px 5px',borderRadius:2,background:en.sevColor+'14',border:'1px solid '+en.sevColor+'40'}}>{en.sev}</span>}
                              {en.acctCtx&&<span className="mono" style={{fontSize:9,color:en.acctCtx.color||'var(--bi-fg-3)',whiteSpace:'nowrap'}} title={en.acctCtx.label}>{en.acctCtx.label}</span>}
                            </div>
                          </div>
                          <Expando open={isExp}><pre style={{padding:'10px 14px',margin:0,fontFamily:'var(--bi-font-mono)',fontSize:11,color:'var(--bi-fg-2)',background:'var(--bi-bg-page)',whiteSpace:'pre-wrap',borderBottom:'1px solid var(--bi-border)',borderLeft:'2px solid var(--bi-orange)',lineHeight:1.55,maxHeight:240,overflow:'auto'}}>{JSON.stringify(e,null,2)}</pre></Expando>
                        </div>;
                      };
                      let rowCount=0;
                      const MAX_ROWS=500;
                      return <>{groupedTimeline.slice(0,500).map((item,gi)=>{
                        if(rowCount>=MAX_ROWS)return null;
                        if(item.type==='single'){
                          rowCount++;
                          return renderSingle(item.entry,gi);
                        }
                        const isOpen=expandedGroups[item.firstIndex];
                        rowCount+=isOpen?Math.min(item.count,12):1;
                        const color=TC[item.eventType.toLowerCase()]||'#717070';
                        return <div key={'grp-'+item.firstIndex}>
                          <div onClick={()=>setExpandedGroups(g=>({...g,[item.firstIndex]:!g[item.firstIndex]}))}
                            style={{padding:'7px 12px 7px 14px',borderBottom:'1px solid var(--bi-border)',background:'rgba(255,255,255,0.015)',borderLeft:'2px solid transparent',cursor:'pointer',display:'grid',gridTemplateColumns:'88px auto 1fr auto',gap:10,alignItems:'center'}}>
                            <span className="mono" style={{fontSize:10,color:'var(--bi-fg-3)',whiteSpace:'nowrap'}}>{fmtTsMs(item.firstTs)}</span>
                            <span style={{fontSize:9,color:'var(--bi-fg-3)'}}>{isOpen?'▾':'▸'}</span>
                            <div style={{display:'flex',alignItems:'center',gap:6,minWidth:0}}>
                              <span style={{width:7,height:7,borderRadius:2,background:color,flexShrink:0}}/>
                              <span className="mono" style={{fontSize:11,color:color,fontWeight:600}}>{item.eventType}</span>
                              <span style={{fontSize:10,color:'var(--bi-fg-3)',marginLeft:4}}>×{item.count} events</span>
                            </div>
                            <span style={{fontSize:9,color:'var(--bi-fg-4)',fontStyle:'italic',whiteSpace:'nowrap'}}>{isOpen?'collapse':'expand'}</span>
                          </div>
                          <Expando open={!!isOpen}>{item.entries.slice(0,12).map((e,j)=>renderSingle(e,gi+'-'+j))}</Expando>
                        </div>;
                      })}
                      {groupedTimeline.length>500&&<div style={{padding:12,textAlign:'center',color:'var(--bi-fg-3)',fontSize:11}}>Showing first 500 of {groupedTimeline.length.toLocaleString()} rows — narrow with filters, search, or the brush</div>}
                      </>;
                    })()}
                </div>
              </div>

            </div>
          </div>;
        })()}
        {/* Accounts */}
        {section==='accounts'&&(()=>{
          const allAccts=sortedAccts;
          const lbVals=Object.values(liveBalances);
          const totalFiat=lbVals.reduce((s,lb)=>s+(lb?.fiat||0),0);
          const fundedCount=logData.accts.filter(a=>a.ops>0||(liveBalances[a.id]&&liveBalances[a.id].status==='ok'&&liveBalances[a.id].bal>0)).length;
          const noSyncShown=logData.accts.length>0&&!logData.accts.some(a=>a.dur!=null)&&!logData.sync;
          const isLoading=lbVals.some(lb=>lb?.status==='loading');

          // ── Per-account error counts (preserved) ──
          const errCounts={};
          for(const e of logData.errs){
            const hay=((e.msg||'')+' '+JSON.stringify(e.raw||'')).toLowerCase();
            for(const a of logData.accts){if(a.addr&&a.addr.length>8&&hay.includes(a.addr.toLowerCase())){errCounts[a.id]=(errCounts[a.id]||0)+1;}}
          }

          // ── Chain aggregation (preserved) ──
          const byChain={};
          for(const a of logData.accts){
            const k=a.ch.name;
            if(!byChain[k])byChain[k]={name:k,color:a.ch.color,ticker:a.ch.ticker,count:0,ops:0,fiat:0};
            byChain[k].count++;
            byChain[k].ops+=a.ops||0;
            byChain[k].fiat+=liveBalances[a.id]?.fiat||0;
          }
          const chains=Object.values(byChain).sort((a,b)=>(b.fiat-a.fiat)||(b.ops-a.ops));

          const isFocActive=!!focusedAcct;
          const matchesFocus=(a)=>!isFocActive||(focusedAcct.addr===a.addr&&focusedAcct.cid===a.cid);

          // ── Chip filters (layered on top of the existing acctFilter free-text + acctSort) ──
          const chipMatch=(a)=>{
            if(chainFilter&&a.ch.name!==chainFilter)return false;
            if(syncFilter==='synced'&&(a.ops||0)===0)return false;
            if(syncFilter==='unsynced'&&(a.ops||0)>0)return false;
            if(tokensFilter==='yes'&&a.toks.length===0)return false;
            if(tokensFilter==='no'&&a.toks.length>0)return false;
            if(errorsFilter==='yes'&&(errCounts[a.id]||0)===0)return false;
            if(errorsFilter==='no'&&(errCounts[a.id]||0)>0)return false;
            return true;
          };
          const visibleAccts=allAccts.filter(chipMatch);
          const hasChipFilters=chainFilter||syncFilter!=='all'||tokensFilter!=='all'||errorsFilter!=='all';

          // ── Resolve the selected account: explicit pick > first-by-fiat from visible list ──
          const resolvedSelectedAcct=(()=>{
            if(selectedDiagAcct){
              const live=logData.accts.find(a=>a.addr===selectedDiagAcct.addr&&a.cid===selectedDiagAcct.cid);
              if(live)return live;
            }
            return visibleAccts[0]||allAccts[0]||null;
          })();

          const sortLabel={fiat:'Fiat value',balance:'Core balance',activity:'Activity',health:'Health',chain:'Chain',alpha:'Alphabetical'}[acctSort]||acctSort;
          const syncLabel={all:'All',synced:'Synced',unsynced:'Not synced'}[syncFilter];
          const tokensLabel={all:'All',yes:'Has tokens',no:'No tokens'}[tokensFilter];
          const errorsLabel={all:'All',yes:'Has errors',no:'No errors'}[errorsFilter];

          return <div className="bi-overview" style={{padding:'12px 16px 16px',gap:10}}>

            {/* No-sync banner (preserved) */}
            {noSyncShown&&(logData.isMobile
              ? <div className="bi-slide-down" style={{background:'rgba(91,159,232,0.10)',border:'1px solid rgba(91,159,232,0.30)',borderLeft:'3px solid var(--bi-cat-3)',borderRadius:2,padding:'8px 14px',fontSize:12,color:'var(--bi-fg-2)',lineHeight:1.5,flexShrink:0}}>
                  <strong style={{color:'var(--bi-fg-1)'}}>Mobile logs don't include operation counts or balances.</strong> Accounts show chains and addresses only.
                </div>
              : <div className="bi-slide-down" style={{background:'rgba(232,138,74,0.10)',border:'1px solid rgba(232,138,74,0.30)',borderLeft:'3px solid var(--bi-rank-3)',borderRadius:2,padding:'8px 14px',fontSize:12,color:'var(--bi-fg-2)',lineHeight:1.5,flexShrink:0}}>
                  <strong style={{color:'var(--bi-fg-1)'}}>No sync activity captured.</strong> Operation counts may show as 0. Ask the customer to export logs after triggering a manual sync.
                </div>
            )}

            {/* Focus mode banner (preserved) */}
            {isFocActive&&<div className="bi-slide-down" style={{background:focusedAcct.color+'15',border:'1px solid '+focusedAcct.color+'40',borderLeft:'3px solid '+focusedAcct.color,borderRadius:2,padding:'7px 12px',fontSize:12,color:'var(--bi-fg-2)',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
              <span style={{width:8,height:8,borderRadius:2,background:focusedAcct.color,flexShrink:0}}/>
              <span style={{flex:1}}>
                <strong style={{color:focusedAcct.color}}>Focused on {focusedAcct.name}</strong>
                <span style={{color:'var(--bi-fg-3)',marginLeft:8}}>Errors and Timeline are filtered to this account. Accounts list dims non-matches.</span>

                  const listRegion=(

                      {/* Address lookup — small inline search bar (not a chip; lives in the row-table region) */}
                      <div style={{display:'flex',alignItems:'center',gap:8,padding:'5px 12px',borderBottom:'1px solid var(--bi-border)',flexShrink:0,background:'var(--bi-bg-card)'}}>

                      </div>
                      {/* Row table */}
                      <div ref={acctScrollRef} data-accounts-scroll style={{flex:1,overflow:'auto',minHeight:0}}>
                        {visibleAccts.length===0?(
                          <div style={{padding:'24px 14px',textAlign:'center',color:'var(--bi-fg-3)'}}>

                            <div style={{fontSize:11,marginBottom:10}}>Adjust filters or clear the address lookup</div>

                        ):visibleAccts.map((a)=>{

                            onSelect={(acct)=>setSelectedDiagAcct(acct)}
                            onFocus={(acct)=>{

                              if(isCur)setFocusedAcct(null);

                      </div>

                  // ── Region 3 — the inspector (single AcctDrill instance, one source of truth). fullHeight in wide mode. ──
                  const drillEl=(
                    <AcctDrill
                      acct={resolvedSelectedAcct}
                      errCount={resolvedSelectedAcct?(errCounts[resolvedSelectedAcct.id]||0):0}
                      deviceApps={logData.deviceApps}

                      onFocus={(acct)=>{

                      focusedAcct={focusedAcct}/>
                  );

                  // ── Wide (side-by-side): chips span full width above the split (they filter the whole tab), then list column + full-height inspector, no splitter ──
                  if(acctPaneWide){
                    return <React.Fragment>

                      <div style={{display:'flex',flex:1,minHeight:0}}>

                          {listRegion}

                  // ── Narrow (stacked): chips → list → splitter → drill. The drill takes its height from acctSplitPx (flex '0 1', can shrink under the list to its own 140px min). Simple chains ignore the splitter and stay at 140px. ──
                  return <React.Fragment>
                    {chipsRegion}
                    {listRegion}
                    {hasRow2&&<div
                      className="bi-acct-split"
                      role="separator" aria-orientation="horizontal" tabIndex={0}
                      onMouseDown={beginDrag}
                      onDoubleClick={()=>{setAcctSplitPx(null);try{localStorage.removeItem('ldt_acct_split_v1');}catch{}}}
                      onKeyDown={(e)=>{if(e.key==='ArrowUp'){e.preventDefault();nudge(1);}else if(e.key==='ArrowDown'){e.preventDefault();nudge(-1);}}}
                      onKeyUp={(e)=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){try{localStorage.setItem('ldt_acct_split_v1',String(Math.round(acctSplitPx??drillDefault)));}catch{}}}}
                      style={{flex:'0 0 10px',display:'flex',alignItems:'center',justifyContent:'center',cursor:'row-resize',outline:'none'}}

                    </div>}
                    {/* Drill takes its height from acctSplitPx (flex '0 1', can shrink to its 140px min under the list). No flex-basis transition: on a space-constrained flex item it freezes mid-animation, leaving the panel at a stale height — the drag is instant, so resize stays correct and snappy. */}
                    <div ref={acctDrillRef} style={{flex:'0 1 '+drillPx+'px',minHeight:140,overflow:'hidden',display:'flex',flexDirection:'column'}}>

        {/* Errors */}
        {section==='errors'&&(()=>{
          const allErrs=logData.errs;

          const titleCounts={};for(const e of baseDg){const t=e.dg.t;titleCounts[t]=(titleCounts[t]||0)+1;}
          const enrichedErrs=baseDg.map(e=>{const c=titleCounts[e.dg.t];return c>1?{...e,dg:{...e.dg,repeatCount:c-1}}:e;});
          const displayErrs=errAcctFilter?enrichedErrs.filter(e=>{const hay=((e.msg||'')+' '+JSON.stringify(e.raw||'')).toLowerCase();return hay.includes(errAcctFilter.toLowerCase());}):enrichedErrs;
          const errAcctMap=new Map();
          for(const e of enrichedErrs){
            const haystack=[e.dg?.r||'',e.raw?.message||'',e.raw?.error||'',JSON.stringify(e.raw?.data||'')].join(' ').toLowerCase();
            for(const a of logData.accts){if(a.addr&&a.addr.length>8&&haystack.includes(a.addr.toLowerCase())){errAcctMap.set(e.li,a);break;}}
          }

          // ── Investigation flow: trigger → error → account causation ──
          const sevColorFn=s=>s==='high'?'#D94747':s==='medium'?'#E88A4A':'#5B9FE8';
          const errFlows=enrichedErrs.map(e=>{
            const errIdx=logData.entries.findIndex(ent=>ent.logIndex===e.li||ent.id===e.li);
            const triggers=[];
            if(errIdx>0){
              const errTime=new Date(e.ts).getTime();
              const preceding=[];
              for(let i=errIdx-1;i>=0;i--){
                const t=new Date(logData.entries[i].timestamp||logData.entries[i].date).getTime();
                if(errTime-t>5000)break;
                preceding.push(logData.entries[i]);
              }
              const netFails=preceding.filter(ent=>ent.type==='network'&&((ent.data?.status>=400)||(ent.level==='error')||(ent.message||'').toLowerCase().includes('fail')));
              const apduRejects=preceding.filter(ent=>{const msg=((ent.message||'')+(JSON.stringify(ent.data||''))).toLowerCase();return(ent.type||'').toLowerCase().includes('apdu')&&(/6985|6982|6a82|6984|5515/.test(msg));});
              const syncActive=preceding.some(ent=>(ent.message||'').toLowerCase().includes('sync'));
              const otherErrors=preceding.filter(ent=>ent.level==='error'&&(ent.logIndex||ent.id)!==e.li);
              if(netFails.length>0)triggers.push({type:'network',count:netFails.length,label:`${netFails.length} network failure${netFails.length>1?'s':''}`,color:'#5B9FE8',go:()=>setSection('network')});
              if(apduRejects.length>0)triggers.push({type:'apdu',count:apduRejects.length,label:`${apduRejects.length} APDU rejection${apduRejects.length>1?'s':''}`,color:'#9B7BD9',go:()=>setSection('apdu')});
              if(syncActive)triggers.push({type:'sync',count:1,label:'Sync active',color:'#3FC0B5',go:()=>{const syncEv=preceding.find(ent=>(ent.message||'').toLowerCase().includes('sync'));if(syncEv)jumpTo(syncEv.logIndex||syncEv.id||e.li);}});
              if(otherErrors.length>0&&triggers.length===0)triggers.push({type:'error',count:otherErrors.length,label:`${otherErrors.length} prior error${otherErrors.length>1?'s':''}`,color:'#D94747',go:()=>{}});
            }
            return{error:e,triggers,account:errAcctMap.get(e.li)||null,sevColor:sevColorFn(e.dg.s)};
          });
          // Deduplicate by error title — same title with same triggers gets merged
          const deduped=[];const titleMap=new Map();
          for(const flow of errFlows){
            const title=flow.error.dg.t;
            if(titleMap.has(title)){
              const ex=titleMap.get(title);
              ex.count++;
              for(const t of flow.triggers){if(!ex.triggers.some(et=>et.type===t.type))ex.triggers.push(t);}
              if(!ex.account&&flow.account)ex.account=flow.account;
              const ts=flow.error.ts?new Date(flow.error.ts).getTime():NaN;
              if(!isNaN(ts)){ex.firstTs=Math.min(ex.firstTs,ts);ex.lastTs=Math.max(ex.lastTs,ts);}
            }else{
              const ts=flow.error.ts?new Date(flow.error.ts).getTime():NaN;
              const entry={...flow,count:1,firstTs:isNaN(ts)?Infinity:ts,lastTs:isNaN(ts)?-Infinity:ts};
              titleMap.set(title,entry);
              deduped.push(entry);
            }
          }
          // Group by trigger signature so identical trigger sets share a row
          const triggerGroups=[];const triggerSigMap=new Map();const ungrouped=[];
          for(const flow of deduped){
            if(flow.triggers.length===0){ungrouped.push(flow);continue;}
            const sig=flow.triggers.map(t=>t.type).sort().join(',');
            if(!triggerSigMap.has(sig))triggerSigMap.set(sig,{triggers:flow.triggers,errors:[]});
            triggerSigMap.get(sig).errors.push(flow);
          }
          for(const group of triggerSigMap.values())triggerGroups.push(group);

          const codeSummary=obj=>{const ent=Object.entries(obj).sort((a,b)=>b[1]-a[1]);if(ent.length===0)return null;const top=ent.slice(0,3).map(x=>x[0]).join(' · ');const extra=ent.length-3;return top+(extra>0?` +${extra}`:'');};

          // Recurring patterns
