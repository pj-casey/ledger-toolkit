<!-- ═══════════════ SESSION RECONSTRUCTION ═══════════════ -->
<h2 id="session-reconstruction">Session Reconstruction</h2>

<h3 id="event-classification">Temporal Event Classification</h3>
<div class="card">
  <p>Every log entry is classified by type: <span class="mono">action</span>, <span class="mono">analytics</span>, <span class="mono">bridge</span>, <span class="mono">countervalues</span>, <span class="mono">error</span>, <span class="mono">network</span>, <span class="mono">persistence</span>, <span class="mono">walletsync</span>, <span class="mono">live-dmk-logger</span>, and others. Each type is assigned a consistent color used identically across all visualizations — event-density histogram bars, swimlane ticks, row type badges, and ErrCard breadcrumbs.</p>
  <p><strong>Type color palette (<span class="mono">TC</span> constant):</strong></p>
  <ul class="def-list">
    <li><strong style="color:#808080">action</strong> — <span class="mono">#808080</span> gray — app startup, user interactions, navigation events</li>
    <li><strong style="color:#B49AFF">analytics</strong> — <span class="mono">#B49AFF</span> purple — session open, SyncSuccess, portfolio events</li>
    <li><strong style="color:#FFBD42">countervalues</strong> — <span class="mono">#FFBD42</span> amber — fiat price fetching activity</li>
    <li><strong style="color:#FF8C42">bridge</strong> — <span class="mono">#FF8C42</span> orange — wallet sync sessions, the dominant sync type</li>
    <li><strong style="color:#4FC3F7">network</strong> — <span class="mono">#4FC3F7</span> blue — HTTP requests to Ledger and external APIs</li>
    <li><strong style="color:#7AC26C">persistence</strong> — <span class="mono">#7AC26C</span> green — local storage reads and writes</li>
    <li><strong style="color:#D4A0FF">walletsync</strong> — <span class="mono">#D4A0FF</span> lavender — Ledger Sync cloud operations</li>
    <li><strong style="color:#E40046">error</strong> — <span class="mono">#E40046</span> crimson — all error-level log entries</li>
    <li><strong style="color:#FF5300">live-dmk-logger</strong> — <span class="mono">#FF5300</span> orange-red — Ledger Wallet 4.0 DMK device events</li>
  </ul>
  <p><strong>Per-entry metadata extraction:</strong> timestamp (normalized from <span class="mono">date</span> or <span class="mono">timestamp</span> field), type, log level, message string, structured data payload, query arguments, payload fields, and embedded error objects.</p>
  <p>Session boundary detection: first and last timestamps establish total session duration. Entry count and type diversity contribute to data quality scoring.</p>
</div>

<h3 id="session-viz">Session Visualization</h3>
<div class="card">
  <p>The session is divided into 80 equal time buckets. Each bucket renders as a stacked bar where bar height represents event density (total entry count) and color segments represent event type distribution, using the same canonical color map as row badges.</p>
  <p><strong>Visual treatment:</strong> Bar tops have rounded corners (<span class="mono">border-radius: 2px 2px 0 0</span>). The strip container has a flat background matching the panel color. Bars render at 0.92 opacity. The strip reveals left-to-right via <span class="mono">clip-path: inset()</span> animation (<span class="mono">stripDraw</span>) on tab enter.</p>
  <p><strong>Legend chips:</strong> One chip per event type present in the session, showing type name, color dot, and entry count. Each chip uses a tinted background and border in its own TC color at low opacity. Hovering a chip dims all non-matching bar segments to 15% opacity. Clicking a chip filters the entry list to that type. State is shared with the type dropdown filter — changes in either update both.</p>
  <p><strong>Error dot baseline:</strong> Error entries are rendered as individual colored dots on a dedicated baseline below the bars. Each dot is a clickable navigation target — click scrolls to and expands that entry in the list.</p>
  <p><strong>Bucket hover tooltip:</strong> Hovering any bar shows timestamp, total event count for that bucket, per-type breakdown, and sample message. Clicking the bar scrolls to and expands the nearest log entry to the bucket's midpoint.</p>
</div>

<h3 id="event-grouping">Event Grouping</h3>
<div class="card">
  <p>Consecutive same-type events within a 1.5-second temporal window are automatically collapsed into expandable group headers. Group headers display: event type, repeat count, time range, and total duration.</p>
  <p><strong>Minimum group size:</strong> 3 events — sequences smaller than this remain as individual rows. Error entries are unconditionally excluded from grouping and always appear as individual rows regardless of proximity or type match.</p>
  <p>Groups are keyed by the <span class="mono">logIndex</span> of the first entry in the group, allowing stable expand/collapse state across filter changes. Toggleable between Grouped (default) and Flat mode via a header button.</p>
  <p>Typical compression ratio: 50–70% reduction in visible rows on standard production logs (e.g., 2,500 raw entries → approximately 80 visible rows after grouping).</p>
</div>

<h3 id="acct-filter">Account-Correlated Filtering</h3>
<div class="card">
  <p>Filters the full event stream to entries that reference a specific account. The matcher performs case-insensitive substring search across five fields per entry: message string, type string, serialized data payload, serialized query arguments, and serialized payload fields.</p>
  <p><strong>Match criteria (OR logic across fields, AND with other filters):</strong></p>
  <ul class="def-list">
    <li><strong>Address</strong> — substring match when address length ≥ 8 characters</li>
    <li><strong>Currency ID</strong> — exact chain currency identifier (e.g., <span class="mono">ethereum</span>, <span class="mono">solana</span>)</li>
    <li><strong>Ticker symbol</strong> — 3–5 character ticker (e.g., <span class="mono">ETH</span>, <span class="mono">SOL</span>)</li>
    <li><strong>Chain name</strong> — human-readable chain name</li>
  </ul>
  <p>Activated from the Accounts section via Shift+click on a health tile or the Timeline button on account cards. A filter banner in the Timeline header displays the active account and provides one-click clear. Combines with type filter and text search as AND logic.</p>
</div>


<div class="section-divider"></div>

<!-- ═══════════════ ERROR ANALYSIS ═══════════════ -->
<h2 id="error-analysis">Error Analysis &amp; Diagnosis</h2>

<h3 id="pattern-classification">Pattern-Based Error Classification</h3>
<div class="card">
  <p>82-pattern error knowledge base. Each pattern specifies a matching strategy (regex or substring), category (Hardware / Software / Server), severity (Critical / Warning / Info), diagnostic title, recommended agent action, and list of common causes.</p>
  <p><strong>Priority matching:</strong> When multiple patterns match a single error entry, the highest severity match is selected. Within the same severity, the match with the longer match string wins (specificity tiebreaker).</p>
  <p><strong>APDU subcode extraction:</strong> When a generic transport error is detected, the system scans the error data and message for embedded hexadecimal status codes and attempts a secondary pattern match against the more specific code. This converts generic "device communication failed" errors into actionable diagnoses when the specific rejection code is present.</p>
  <p>Unmatched errors are classified as "Unexpected error" (Info severity) with full raw data preserved for manual inspection via the Raw JSON viewer.</p>
  <p><strong>ERR_DB text localization:</strong> All diagnostic advice text undergoes runtime substitution — "Ledger Live" is replaced with "Ledger Wallet" when the session brand is detected as the newer product, without modifying the knowledge base array itself.</p>
</div>

<h3 id="temporal-error">Temporal Error Analysis</h3>
<div class="card">
  <p>Error clustering analysis computes the time span between the first and last error relative to total session duration. Automatic plain-English interpretation is generated:</p>
  <ul class="def-list">
    <li><strong>Single error</strong> — position reported as a percentage into session (e.g., "at 73% of session")</li>
    <li><strong>All errors within 2 seconds</strong> — "All N errors within Xs — likely a single cascade event"</li>
    <li><strong>Errors within 30% of session span</strong> — "likely related"</li>
    <li><strong>Errors spread beyond 30%</strong> — "likely independent issues"</li>
  </ul>
  <p><strong>Repeat detection:</strong> Errors sharing the same diagnostic title are counted and grouped. When a pattern appears 2 or more times, it is surfaced as an interactive badge in the Issues header (e.g., "↻ Price data unavailable ×4"). Clicking a badge applies a pattern filter to the error list.</p>
</div>

<h3 id="breadcrumbs">Error Context Breadcrumbs</h3>
<div class="card">
  <p>For each error entry, the 5 immediately preceding log entries are locatable by scanning backward through the full entry array from the error's <span class="mono">logIndex</span>. These entries are renderable as a breadcrumb trail in the error detail panel.</p>
  <p>Each breadcrumb shows: relative time offset from the error (e.g., <span class="mono">−0.3s</span>), event type with a TC-colored badge matching the type badge system used throughout the tool, and a truncated message string. The final row in the trail is the error itself, highlighted in the error's severity color.</p>
  <p>One-click navigation from any error detail panel to the error's position in the full Timeline — this navigation clears all active Timeline filters and grouping to guarantee the target entry is visible, then scrolls to it.</p>
  <p>Below the breadcrumbs, a <strong>Diagnostic Pathways</strong> section renders correlated evidence from the pre-error window. See <a href="#diagnostic-pathways" style="color:var(--primary)">Diagnostic Pathways</a> for the computation details.</p>
</div>

<h3 id="error-acct">Error-to-Account Correlation</h3>
<div class="card">
  <p>Automatic scanning of error messages, structured data payloads, and raw payload fields for strings matching known account addresses. When a match is found (candidate string ≥ 8 characters), the error is linked to the corresponding account.</p>
  <p>Linked accounts appear as interactive navigation chips on error detail cards. Clicking an account chip navigates to that account in the Accounts section. The correlation map is computed once at log load time using a <span class="mono">Map&lt;logIndex, account&gt;</span> structure keyed on entry position.</p>
  <p>The reverse pathway also exists: clicking an error badge on an account card in the Accounts section navigates to the Issues section with a filter applied to show only errors associated with that account's address.</p>
</div>

<h3 id="sev-filter">Interactive Severity &amp; Category Filtering</h3>
<div class="card">
  <p>Severity tiles (Critical / Warning / Notice / Info) and category filter chips (Hardware / Software / Server) are rendered above the Errors list. Clicking a tile or chip applies that filter. Filters combine with AND logic — activating Critical + Hardware returns only errors that are simultaneously critical severity and hardware category. Each severity tile's subtitle lists the error-code patterns present in that bucket (top codes by frequency, then "+N"); the Info tile is always 0 because the diagnostic KB has no info-level class.</p>
  <p><strong>Pattern codes:</strong> a stable slug derived from each diagnosis title (e.g. <span class="mono">sync_rate_limit</span>) drives the tile subtitles, the "Find similar" action, and the ticket-reply template lookup.</p>
</div>


<div class="section-divider"></div>

<!-- ═══════════════ ACCOUNT & ASSET ═══════════════ -->
<h2 id="account-analysis">Account &amp; Asset Analysis</h2>

<h3 id="acct-extraction">Account Extraction</h3>
<div class="card">
  <p>Primary extraction from <span class="mono">SyncSuccess</span> analytics events (Ledger Live / Ledger Wallet 2.x–3.x format). Each event carries per-account sync duration, operation count, and reported balance. Secondary extraction from bridge sync sessions (Ledger Wallet 4.0 / LLv4 format).</p>
  <p><strong>LLv4 bridge sync fallback:</strong> When no <span class="mono">SyncSuccess</span> analytics events are present, the extractor scans for <span class="mono">type: "bridge"</span> entries containing "SyncSession finished". When found, the total session duration is applied as a sync duration across all accounts, preventing false "no sync data" alerts on newer log formats.</p>
  <p>Per-account data extracted: chain identification, address, derivation mode, operation count, log-reported balance, spendable balance, sync duration, token list with contract addresses and operation counts. Account IDs extracted from <span class="mono">exportLogsMeta.accountsIds</span> for cross-referencing with external systems.</p>
</div>

<h3 id="addr-derivation">Address Derivation &amp; Conversion</h3>
<div class="card">
  <p>Three chains store non-explorer-compatible credential formats in logs. The tool automatically converts these to usable addresses:</p>
  <ul class="def-list">
    <li><strong>Cardano</strong> — hex credential bytes → bech32 stake address (<span class="mono">stake1...</span>). Conversion via <span class="mono">cardanoCredToStake()</span>.</li>
    <li><strong>TON</strong> — 32-byte hash → user-friendly bounceable address (<span class="mono">UQ...</span>) with CRC16 checksum. Conversion via <span class="mono">tonHexToAddr()</span>.</li>
    <li><strong>Stacks</strong> — compressed public key → c32check mainnet address (<span class="mono">SP...</span>). Conversion via <span class="mono">stacksPubkeyToAddr()</span>.</li>
  </ul>
  <p>Derived addresses are surfaced with copy buttons and direct block explorer links. All three conversions run entirely client-side with no external API calls.</p>
  <div class="warn">Derived addresses are computed from log data — always verify with the customer before taking action based on derived values.</div>
</div>

<h3 id="xpub">UTXO Extended Public Key Analysis</h3>
<div class="card">
  <p>Full BIP32 hierarchical deterministic key derivation for Bitcoin, Litecoin, Dogecoin, Bitcoin Cash, and Zcash (transparent t1 only — Ledger does not support shielded signing). Derives individual addresses from <span class="mono">xpub</span>, <span class="mono">ypub</span>, and <span class="mono">zpub</span> keys along receive (<span class="mono">m/0/i</span>) and change (<span class="mono">m/1/i</span>) chains.</p>
  <p><strong>Supported derivation modes:</strong></p>
  <ul class="def-list">
    <li><strong>BIP84</strong> — Native SegWit (zpub, P2WPKH, bc1q... addresses)</li>
    <li><strong>BIP49</strong> — SegWit (ypub, P2SH-P2WPKH, 3... addresses)</li>
    <li><strong>BIP44</strong> — Legacy (xpub, P2PKH, 1... addresses)</li>
  </ul>
  <p>Per-address live balance query and transaction count via public blockchain APIs. Gap limit detection: scanning stops after consecutive unused addresses are found (gap limit = 20 for receive chain, configurable). Rate limiting handled with automatic retry up to 5 times with exponential backoff.</p>
  <p>Per-address explorer links for independent on-chain verification. Uses <span class="mono">bitcoinjs-lib</span> 5.2.0 for address derivation, running entirely in the browser via bundled library.</p>
</div>

<h3 id="evm-grouping">EVM Address Grouping</h3>
<div class="card">
  <p>Accounts sharing the same Ethereum-format address (hex strings ≥ 20 characters) are automatically identified as an EVM group. This is common when a customer uses Ethereum alongside L2 and EVM-compatible chains (Polygon, Arbitrum, Optimism, BSC, Base, etc.) that share the same address space.</p>
  <p>Group rendering: shared address header with copy button, chain tile count, and combined fiat value aggregated across all accounts in the group. The Ethereum account sorts first within each group; remaining chains sort by fiat value descending.</p>
  <p>Grouping is applied after the full account list is rendered — individual account cards within a group retain their full detail, error badges, and xpub scan buttons.</p>
</div>

<h3 id="health-viz">Account Health Visualization</h3>
<div class="card">
  <p>Per-account health tile with chain-colored background derived from the chain registry color. Each tile displays a brand icon loaded from CDN (<span class="mono">simplr-sh/coin-logos</span>, keyed by <span class="mono">COINGECKO_IDS</span>) with a 3-letter ticker label as fallback when no icon is available. Tile opacity reflects account status: funded (full), empty (reduced), no sync data (amber border).</p>
  <p><strong>Corner indicator system:</strong></p>
  <ul class="def-list">
    <li><strong>Red dot (top-right)</strong> — one or more errors are correlated to this account</li>
    <li><strong>Purple dot (bottom-right)</strong> — account has an xpub / is scannable via the UTXO scanner</li>
    <li><strong>? label</strong> — chain is not supported for live balance fetching</li>
  </ul>
  <p><strong>Hover popover:</strong> chain name, truncated address, live balance and fiat value, sync status (no sync / loading / empty), derivation mode, error count, and xpub/explorer availability flags. Popover has <span class="mono">onMouseEnter</span>/<span class="mono">onMouseLeave</span> handlers to stay visible when the cursor moves from the tile to the popover. Clamped to container width.</p>
  <p><strong>Adaptive dimming:</strong> When account focus is active, non-focused tiles dim to 25% opacity with a 0.2s transition. The focused tile displays a <span class="mono">focusPulse</span> CSS animation (scale + opacity breathing). See <a href="#adaptive-dimming" style="color:var(--primary)">Adaptive Dimming</a> for full details.</p>
</div>


<div class="section-divider"></div>

<!-- ═══════════════ ON-CHAIN VERIFICATION ═══════════════ -->
<h2 id="onchain">On-Chain Verification</h2>

<h3 id="live-balances">Live Blockchain Balance Fetching</h3>
<div class="card">
  <p>Automatic balance retrieval for 40+ blockchain networks from public APIs. No API keys, authentication, or server-side components required. All requests originate from the user's browser.</p>
  <p><strong>Coverage by tier:</strong></p>
  <ul class="def-list">
    <li><strong>EVM chains (23 networks)</strong> — Ethereum, Polygon, BSC, Arbitrum, Optimism, Avalanche, Base, Fantom, Celo, and others via JSON-RPC <span class="mono">eth_getBalance</span> against publicnode.com endpoints</li>
    <li><strong>UTXO chains</strong> — Bitcoin (mempool.space), Litecoin/Dogecoin (BlockCypher), Bitcoin Cash &amp; Zcash (Blockchair)</li>
    <li><strong>Major L1s</strong> — Solana, Tezos, Cosmos, XRP, Polkadot, Cardano, NEAR, Tron, TON, Stellar, Hedera, Algorand, and others via chain-specific REST/RPC APIs</li>
  </ul>
  <p><strong>Fiat pricing:</strong> CoinGecko API with chain currency IDs mapped via a 40+ entry <span class="mono">COINGECKO_IDS</span> constant. USD prices batch-fetched after balances complete.</p>
  <p>Request staggering at 150ms intervals to avoid rate limiting. Per-account status tracking: loading, ok, error, unsupported. Accounts with <span class="mono">unsupported</span> status are identified with a <span class="mono">?</span> indicator on health tiles.</p>
</div>

<h3 id="token-resolution">Token Resolution</h3>
<div class="card">
  <p>Token metadata is resolved on-demand from Ledger's CAL service (<span class="mono">crypto-assets-service.api.ledger.com/v1/tokens?id=…</span>) when an account card expands. Each token's <span class="mono">contract_address</span>, <span class="mono">decimals</span>, <span class="mono">ticker</span>, and <span class="mono">name</span> are cached in localStorage with a 24-hour per-token TTL (<span class="mono">ldt_tkm_v1</span>). Live token balances come from a single <span class="mono">Multicall3.aggregate3</span> call per chain (one round trip for N tokens). Live USD prices come from DexScreener (<span class="mono">/latest/dex/tokens/{contract}</span>) with concurrency 5, a 200ms minimum gap, and a session-scoped 5-minute price cache. Per-chain URL builders (<span class="mono">TOKEN_URLS</span>) generate direct explorer links; <span class="mono">TOKEN_SEARCH</span> handles search-fallback for chains without exact resolution.</p>
  <p>Token badges on account cards are rendered as clickable links. Token operation counts from log sync data are preserved per token per account. EVM chain IDs are mapped via a 22-entry <span class="mono">EVM_CHAIN_IDS</span> constant used to construct the correct explorer URL for each network.</p>
</div>


<div class="section-divider"></div>

<!-- ═══════════════ CROSS-DOMAIN CORRELATION ═══════════════ -->
<h2 id="cross-domain">Cross-Domain Correlation</h2>

<h3 id="connected-nav">Connected Navigation</h3>
<div class="card">
  <p>The following data correlation pathways are implemented as direct navigation actions:</p>
  <ul class="def-list">
    <li><strong>Error → Account</strong> — address matching in error data links errors to specific accounts; linked account chips navigate to the Accounts section</li>
    <li><strong>Error → Timeline</strong> — "Filter timeline →" opens the Timeline brushed to a ±60s window around the error (chronological); "Open raw at this path →" jumps to the Raw JSON tab and searches for the entry</li>
    <li><strong>Account → Errors</strong> — error badge on account cards applies an address filter to the Errors section, showing only errors referencing that account</li>
    <li><strong>Account → Timeline</strong> — Shift+click on a treemap tile or the Timeline button on account cards applies account-correlated filtering to the full event stream</li>
    <li><strong>Timeline → Entry detail</strong> — clicking the event-density histogram navigates to the corresponding raw event; dragging brushes a range</li>
    <li><strong>Overview → All sections</strong> — stat cards display Errors, Accounts, Network failure, and Log Quality counts that establish baseline expectations before investigation</li>
    <li><strong>Focus → All sections</strong> — <span class="mono">focusedAcct</span> state propagates to <span class="mono">tlAcctFilter</span>, <span class="mono">errAcctFilter</span>, and visual dimming across treemap tiles, account rows, and Errors / Timeline / Overview entries</li>
    <li><strong>Overview error tile → Focus + Errors</strong> — clicking an error tile with a linked account sets <span class="mono">focusedAcct</span> and navigates to Errors</li>
    <li><strong>ErrCard "Affected account" → Focus</strong> — clicking the linked account chip sets <span class="mono">focusedAcct</span> and navigates to Accounts</li>
    <li><strong>Context Ribbon → Navigation</strong> — each ribbon segment is a clickable navigation target (account → Accounts, error → Issues, timestamp → Timeline jumpTo)</li>
    <li><strong>Diagnostic Pathway → Section</strong> — "Related evidence" links navigate to Network, APDU, or Timeline with focus preserved</li>
  </ul>
</div>

<h3 id="focus-system">Account Focus System</h3>
<div class="card">
  <p>Single-account investigation mode controlled by the <span class="mono">focusedAcct</span> state variable in the App component. Holds the full account object (with <span class="mono">addr</span>, <span class="mono">ch.color</span>, <span class="mono">ch.ticker</span>) or null when inactive.</p>
  <p><strong>Activation triggers:</strong></p>
  <ul class="def-list">
    <li><strong>Shift+click health tile</strong> — toggles focus on/off for that account</li>
    <li><strong>Popover Focus button</strong> — on tile hover popover</li>
    <li><strong>ErrCard linked account click</strong> — sets focus and navigates to Accounts</li>
    <li><strong>Overview Focus Investigation dropdown</strong> — lists all accounts with chain colors, tickers, fiat values, error counts</li>
    <li><strong>Overview error tile click</strong> — when the error is linked to an account, sets focus and navigates to Issues</li>
  </ul>
  <p><strong>Downstream effects:</strong> A <span class="mono">useEffect</span> propagates <span class="mono">focusedAcct</span> to <span class="mono">tlAcctFilter</span> (Timeline account filter) and <span class="mono">errAcctFilter</span> (Issues account filter). Visual effects are applied via inline opacity styles on non-focused elements.</p>
  <p><strong>Visual indicators:</strong> Content area left border (3px, chain color), <span class="mono">focusPulse</span> CSS animation on the focused tile (scale 1→1.08 + opacity breathing at 2s interval).</p>
  <p><strong>Clear triggers:</strong> <kbd>Escape</kbd> key, ✕ on Context Ribbon, Shift+click same tile. State is also reset in <span class="mono">handleFile</span> and <span class="mono">clearLog</span>.</p>
  <div class="tip">For investigation workflows using Focus Mode, see the Agent Guide (📖 button) → Account Focus Mode.</div>
</div>

<h3 id="context-ribbon">Context Ribbon</h3>
<div class="card">
  <p>Computed navigation bar at the top of the content area. No dedicated state variable — rendered from existing <span class="mono">focusedAcct</span>, <span class="mono">selectedErr</span>, and <span class="mono">section</span> state.</p>
  <p><strong>Visibility condition:</strong> <span class="mono">focusedAcct</span> is set OR (<span class="mono">selectedErr</span> is set AND <span class="mono">section === 'errors'</span>).</p>
  <p><strong>Segments:</strong></p>
  <ul class="def-list">
    <li><strong>Account chip</strong> — chain color dot + ticker. Click navigates to Accounts section.</li>
    <li><strong>Error title chip</strong> — shows when <span class="mono">selectedErr</span> is set. Click navigates to Issues and selects that error.</li>
    <li><strong>Timestamp chip</strong> — shows when <span class="mono">selectedErr</span> is set. Click calls <span class="mono">jumpTo</span> to navigate to that moment in Timeline.</li>
  </ul>
  <p><strong>Clear button:</strong> Wipes both <span class="mono">focusedAcct</span> and <span class="mono">selectedErr</span>.</p>
</div>

<h3 id="diagnostic-pathways">Diagnostic Pathways</h3>
<div class="card">
  <p>Automatic correlation of pre-error events rendered within the ErrCard component. Implemented as a <span class="mono">useMemo</span> with dependencies <span class="mono">[entries, err.li, err.ts]</span>.</p>
  <p><strong>Computation:</strong> Scans a 5-second window before each error's timestamp. Counts events in four categories:</p>
  <ul class="def-list">
    <li><strong>Network failures</strong> — <span class="mono">type='network'</span> AND (<span class="mono">status ≥ 400</span> OR <span class="mono">level='error'</span> OR message includes 'fail')</li>
    <li><strong>APDU rejections</strong> — type includes <span class="mono">'apdu'</span> AND status codes <span class="mono">6985</span>, <span class="mono">6982</span>, <span class="mono">6a82</span>, <span class="mono">6984</span>, <span class="mono">5515</span></li>
    <li><strong>Sync entries</strong> — message includes <span class="mono">'sync'</span></li>
    <li><strong>Other errors</strong> — <span class="mono">level='error'</span>, excluding the current error entry</li>
  </ul>
  <p>Returns null if no correlated events are found in the window. When results exist, renders clickable "Related evidence" links: network failures → Network section (<span class="mono">onGoNetwork</span>), APDU rejections → APDU section (<span class="mono">onGoApdu</span>), sync entries → Timeline via <span class="mono">jumpTo(syncEntry.logIndex)</span>.</p>
  <div class="tip">For practical use in error investigation, see the Agent Guide (📖 button) → Errors: Tiles, Patterns &amp; Detail.</div>
</div>

<h3 id="adaptive-dimming">Adaptive Dimming</h3>
<div class="card">
  <p>Visual de-emphasis of non-focused elements when <span class="mono">focusedAcct</span> is active. Applied via inline <span class="mono">opacity</span> styles with <span class="mono">transition: opacity 0.2s</span>.</p>
  <p><strong>Opacity values by element type:</strong></p>
  <ul class="def-list">
    <li><strong>Health tiles</strong> — 0.25</li>
    <li><strong>AcctCards (single + grouped)</strong> — 0.25</li>
    <li><strong>Network entries</strong> — 0.3</li>
  </ul>
  <p>Content area receives a <span class="mono">3px</span> left border in the focused account's chain color. The focused tile gets the <span class="mono">focusPulse</span> keyframe animation (scale 1→1.08, opacity 0.85→1, 2s ease-in-out infinite).</p>
  <p><strong>Design principle:</strong> Non-focused elements dim but remain visible — context is preserved, not hidden. This allows peripheral awareness of the full dataset while directing attention to the investigation target.</p>
</div>

<h3 id="overview-arch">Overview Architecture</h3>
<div class="card">
  <p>Two-zone vertical layout within a flex column container (Zone 3 bottom bar was removed):</p>
  <p><strong>Zone 1 — Triage row (flexShrink:0):</strong> No-sync warning banner (conditional), device status line (compact one-liner: model · firmware status · app count status · sync status), stat badges row (Issues hero with severity-colored left border, Accounts, Network with failure count, Log Quality with score), action bar (Focus Investigation dropdown, Copy report dropdown, Guide 📖 button, activity badges).</p>
  <p><strong>Stat badge computation:</strong> Issues badge shows count with severity-based label and color. Network badge counts entries with <span class="mono">status ≥ 400</span> or <span class="mono">level='error'</span>. Quality badge shows the computed 0–100 score. All stat numbers use <span class="mono">clamp(28px, 4vh, 42px)</span> sizing.</p>
  <div class="tip">For step-by-step usage, see the Agent Guide (📖 button) → Quick Start.</div>
</div>

<h3 id="triangulation">Multi-Source Data Triangulation</h3>
<div class="card">
  <p>Three independent balance data sources are available simultaneously:</p>
  <ul class="def-list">
    <li><strong>Log-reported balance</strong> — from sync events captured in the log at the time of the session</li>
    <li><strong>Live blockchain balance</strong> — fetched from public APIs at the time of analysis</li>
    <li><strong>App.json balance</strong> — from the application's local state file, when loaded in Customer View</li>
  </ul>
  <p>Comparison across these sources enables detection of:</p>
  <ul class="def-list">
    <li><strong>Sync failures</strong> — log balance differs from live balance</li>
    <li><strong>Stale local cache</strong> — app.json balance differs from live balance</li>
    <li><strong>Missing accounts</strong> — accounts present in app.json but absent from the log</li>
    <li><strong>Unreported assets</strong> — live balance is positive but no sync data was captured</li>
  </ul>
  <p><strong>Customer View balance comparison model:</strong> Agent Insights implements a three-layer comparison: (1) crypto comparison using <span class="mono">spendableBalance</span> vs live balance, (2) fiat comparison using the customer's cached rate for both columns, and (3) market value via CoinGecko shown as supplementary. Staking detection prevents false positives on 18+ account types. See <a href="#agent-insights-engine" style="color:var(--primary)">Agent Insights Engine</a> for details.</p>
</div>


<div class="section-divider"></div>

<!-- ═══════════════ CUSTOMER VIEW ═══════════════ -->
<h2 id="customer-view-arch">Customer View Architecture</h2>

<h3 id="enrichment-pipeline">Account Enrichment Pipeline</h3>
<div class="card">
  <p>Customer View merges data from two sources: log-extracted accounts (<span class="mono">logData.accts</span>) and app.json accounts (<span class="mono">appJson.accounts</span>). The merge is performed in a <span class="mono">useMemo</span> inside the <span class="mono">CustomerView</span> component, producing <span class="mono">enrichedAccts</span>.</p>
  <p><strong>Merge strategy:</strong> Log accounts are the base. For each log account, the pipeline searches for a matching app.json account by <span class="mono">id</span>. When matched, the following fields are overlaid:</p>
  <ul class="def-list">
    <li><strong>ajBalance</strong> — raw balance string from app.json (includes staked funds)</li>
    <li><strong>ajSpendable</strong> — spendableBalance from app.json (excludes staked/frozen/reserved funds)</li>
    <li><strong>ajOperations</strong> — full operation history array</li>
    <li><strong>ajSubAccounts</strong> — token sub-accounts with balances and operation counts</li>
    <li><strong>ajPendingOps</strong> — pending (unconfirmed) operations</li>
    <li><strong>ajBlockHeight</strong> — last synced block number</li>
    <li><strong>ajStarred</strong> — customer's star/favorite flag</li>
    <li><strong>ajSwapHistory</strong> — swap operation history</li>
    <li><strong>ajFreshAddressPath</strong> — latest receive address derivation path</li>
  </ul>
  <p>When app.json contains accounts not present in the log, they are appended as app.json-only accounts with <span class="mono">enriched:true</span> and synthetic chain metadata derived from the <span class="mono">currencyId</span>.</p>
  <p><em>For investigation workflows, see the Agent Guide (📖 button) → Customer View.</em></p>
</div>

<h3 id="countervalue-system">Countervalue System</h3>
<div class="card">
  <p>The countervalue system extracts cached exchange rates from the customer's app.json to display fiat values exactly as the customer saw them.</p>
  <p><strong>Rate extraction:</strong> <span class="mono">cvGetRateMap(appJson)</span> builds a map of <span class="mono">{fiatCurrency} {cryptoId}</span> → <span class="mono">{date: rate}</span> from the app.json's countervalue cache. The latest rate per asset is retrieved by <span class="mono">cvLatestRate(appJson, cid)</span> which returns <span class="mono">{rate, date}</span>.</p>
  <p><strong>Fiat conversion:</strong> <span class="mono">cvFiatValue(appJson, cid, rawBalance)</span> computes the fiat value using the customer's cached rate. This produces the exact dollar amount the customer saw in their app — not the current market price.</p>
  <p><strong>Display formatting:</strong> <span class="mono">cvFmtFiat(value, appJson)</span> formats values using the customer's preferred fiat currency and locale settings. <span class="mono">countervalueFirst</span> setting is respected throughout — when enabled, fiat values appear above crypto values.</p>
  <p><strong>Rate-on-date:</strong> <span class="mono">cvRateOnDate(appJson, cid, dateStr)</span> retrieves the rate for a specific date, enabling per-operation fiat valuation in the transactions timeline.</p>
</div>

<h3 id="agent-insights-engine">Agent Insights — Findings Engine</h3>
<div class="card">
  <p>The Agent Insights findings engine is a single <span class="mono">useMemo</span> that produces a severity-sorted array of diagnostic findings from all available data sources.</p>
  <p><strong>Finding types:</strong></p>
  <ul class="def-list">
    <li><strong>Account findings</strong> (<span class="mono">kind:'account'</span>) — one per account with issues. Includes balance comparison data, staking context, pending/failed operation counts, and log error references. Accounts with &gt;90% balance drops are classified as <span class="mono">_isDrained</span> with escalation-specific messaging.</li>
    <li><strong>Drain findings</strong> (<span class="mono">kind:'drain'</span>) — aggregated alert when one or more accounts are drained. Contains operation-extracted drain transactions, deduplicated attacker recipient addresses, fund flow data, and a forensic copy report. See <a href="#drain-detection" style="color:var(--primary)">Drain Detection</a>.</li>
    <li><strong>System findings</strong> (<span class="mono">kind:'system'</span>) — countervalue drift, firmware status, app versions, developer mode, log errors, data confidence.</li>
  </ul>
  <p><strong>Balance comparison model:</strong></p>
  <ul class="def-list">
    <li><strong>Crypto comparison:</strong> uses <span class="mono">spendableBalance</span> (not <span class="mono">balance</span>) when staking is detected. This prevents false positives on accounts with staked/frozen funds.</li>
    <li><strong>Fiat comparison:</strong> both columns use the customer's cached countervalue rate. This isolates balance changes from price movement. The delta purely reflects crypto balance differences.</li>
    <li><strong>Time context:</strong> snapshot date derived from the latest countervalue rate date. Days-since-snapshot shown in finding detail. Agents are informed that differences may be from normal transactions since the export.</li>
    <li><strong>Market value:</strong> CoinGecko current price shown as secondary "at market" line. Useful for "what's it worth today?" but not used in the primary comparison.</li>
  </ul>
  <p><strong>Severity classification:</strong> <span class="mono">red</span> = balance mismatch or pending transactions. <span class="mono">amber</span> = failed transactions, log errors, developer mode, data issues. <span class="mono">green</span> = healthy checks. Sorted red → amber → green.</p>
  <p><strong>Visual elements:</strong> Health dots strip (one dot per account, colored by status, clickable), comparison bars (proportional width showing customer vs on-chain), portfolio donut (44×44px SVG with overlapping arcs).</p>
</div>

<h3 id="drain-detection">Drain Detection &amp; Forensic Analysis</h3>
<div class="card">
  <p>Automatic detection of account drains within the Agent Insights findings engine. A drain is classified when an account's live balance has dropped more than 90% compared to the customer's cached balance, and the cached balance had real value (above $50 fiat).</p>
  <p><strong>Per-account classification:</strong> Inside the existing per-account findings loop, each account is evaluated for drain status. Drained accounts receive a <span class="mono">_isDrained</span> flag, a "DRAINED" badge, and drain-specific detail text and escalation guidance replacing the generic "Balance changed" messaging.</p>
  <p><strong>Cross-account aggregation:</strong> After the per-account loop, all drained accounts are collected. If two or more accounts are drained, the system classifies this as a seed compromise — the recovery phrase is likely exposed. A summary <span class="mono">kind:'drain'</span> finding is created via <span class="mono">f.unshift()</span> to appear at the top of the findings list.</p>
  <p><strong>Operation scanning:</strong> For each drained account, the <span class="mono">ajOperations</span> array is scanned for OUT transactions. Each operation's <span class="mono">recipients[]</span>, <span class="mono">hash</span>, <span class="mono">date</span>, and <span class="mono">value</span> are extracted. Token sub-account operations are also scanned when the token balance is zero but operations exist.</p>
  <p><strong>Recipient aggregation:</strong> All recipient addresses from drain transactions across all drained accounts are collected and deduplicated (case-insensitive). On EVM chains, the same address receiving from multiple chains (e.g., ETH, Polygon, Arbitrum) is identified as a single collection wallet. The customer's own addresses are filtered out. Remaining addresses are the attacker's endpoints.</p>
  <p><strong>Fund flow visualization:</strong> A visual diagram renders in the drain detail panel: source accounts (chain-colored, left column) connected via gradient lines to destination addresses (red-tinted, right column). Multi-chain convergence to a single address is highlighted. Each connection includes transaction explorer links via <span class="mono">TX_EXPLORERS</span>, and each destination address includes an address explorer link via <span class="mono">CHAINS[].url</span>.</p>
  <p><strong>Forensic copy report:</strong> A formatted plain-text report optimized for law enforcement escalation. Includes: customer identity (user ID, device), per-account drain details (address, before/after balance, drain transaction hashes with explorer URLs, recipient addresses), total loss across all chains, and all attacker endpoint addresses with explorer links.</p>
  <p><strong>Staking chain guard:</strong> When drained accounts are on chains that support native staking (checked against <span class="mono">STAKING_APY</span>), an amber warning advises the agent to verify on the block explorer before escalating — the balance drop may be from post-export staking rather than theft.</p>
</div>

<h3 id="staking-detection">Staking Detection &amp; Chain-Specific Handling</h3>
<div class="card">
  <p>Staking is detected when <span class="mono">ajBalance ≠ ajSpendable</span> for an account. The staked amount is <span class="mono">balance - spendableBalance</span>. This affects 18 of 96 accounts in the test dataset.</p>
  <p><strong>Chain-specific handling:</strong></p>
  <ul class="def-list">
    <li><strong>Solana</strong> — staking uses separate stake accounts. Live <span class="mono">getBalance</span> RPC returns main account only. Label: "Staked / Delegated." Note: "Solana staking uses separate stake accounts — the live balance only reflects the main account."</li>
    <li><strong>Tron</strong> — frozen TRX for bandwidth/energy. Live <span class="mono">getaccount</span> API returns liquid balance only. Label: "Frozen (bandwidth/energy)."</li>

<h2 id="network-analysis">Network &amp; Protocol Analysis</h2>

<h3 id="http-analysis">HTTP Request Analysis</h3>
<div class="card">
  <p>Extraction and display of all HTTP requests captured in the log. Each request record includes URL, HTTP method, status code, and associated error data when present.</p>
  <p><strong>Status code classification:</strong> success (2xx), client error (4xx), server error (5xx). Error summarization at the section header level: total error count with server vs. client error breakdown. This enables rapid determination of whether failures were caused by server-side problems or client configuration issues.</p>
  <p>Request URLs are displayed in full and are useful for identifying which Ledger or third-party APIs were contacted during the session, including firmware update endpoints, Manager API calls, and pricing service requests.</p>
</div>

<h3 id="activity-detection">Session Activity Detection</h3>
<div class="card">
  <p>Automatic detection of significant user activities during the session based on analytics event and log entry patterns:</p>
  <ul class="def-list">
    <li><strong>Manager access</strong> — device app management session detected from manager-related events</li>
    <li><strong>Swap activity</strong> — swap browsing and execution events</li>
    <li><strong>Device scanning</strong> — transport scanning events indicating device connection attempts</li>
  </ul>
  <p><strong>Analytics event parsing:</strong> App Start metadata captures user ID, OS, platform, device model, and app version at session open. Portfolio analytics events record portfolio metrics at session time. SyncSuccess events capture per-account sync outcomes including operation count and balance.</p>
  <p><strong>Software version-aware branding:</strong> The tool detects whether the session originated from "Ledger Live" (versions 2.46–~2.131) or "Ledger Wallet" (versions ~2.132+, 4.0+). Detection uses <span class="mono">userAgent</span> string parsing from <span class="mono">exportLogsMeta</span> with version number fallback. All labels, error advice text, and session descriptions adjust to reflect the correct product name.</p>
</div>

<h3 id="sovereignty">Data Sovereignty</h3>
<div class="card">
  <p>All log parsing, analysis, pattern matching, and data correlation runs entirely in the browser via client-side JavaScript. No log data is transmitted to any server under any circumstance.</p>
  <p><strong>External contacts made during analysis (addresses only, no log content):</strong></p>
  <ul class="def-list">
    <li><strong>Public blockchain APIs</strong> — account addresses are sent to query on-chain balances. No log content, error data, or metadata is included.</li>

  </ul>
  <p>localStorage holds only a token-metadata cache (24-hour TTL) and UI layout preferences (accounts splitter position). No log content, addresses, or customer data is ever persisted. No cookies, no analytics, no telemetry. The tool can operate fully offline except for live balance fetching and fiat pricing — all other features function without network access.</p>
  <div class="tip">Log files may contain sensitive customer data including account addresses, device identifiers, and user IDs. Handle exported summaries and raw log data according to your organization's data handling and privacy policies.</div>

/* Address encoders: convert raw log credentials to explorer-ready addresses */

// Cardano: hex credential (payment_key_hash + stake_key_hash, or 64-byte xpub pair)
// → stake1... bech32 address using standard bech32 (not bech32m), HRP 'stake', header 0xe1.
// Rule: extract last 28 bytes as stake_key_hash regardless of total length (≥28B).
// Test vectors:
//   last28=0dda8b6667ffa204420be1f96f8319c9f7136d3df648d2a91c13f2e47f63c94c
//   → stake1u9nllgsygg97r7t0svvunacnd57lvjxj4ywp8uhy0a3ujnqmyjm9n (59 chars, mainnet stake key)
function cardanoCredToStake(hex){
  if(typeof hex!=='string'||hex.length<56||hex.length%2!==0)return null;
  const b=[];
  for(let i=0;i<hex.length;i+=2){const v=parseInt(hex.slice(i,i+2),16);if(isNaN(v))return null;b.push(v);}
  if(b.length<28)return null;
  const addrBytes=[0xe1,...b.slice(-28)]; // mainnet stake key header + last 28B as stake hash
  // 8-bit → 5-bit groups with padding
  const to5=data=>{let acc=0,bits=0,ret=[];for(const v of data){acc=(acc<<8)|v;bits+=8;while(bits>=5){bits-=5;ret.push((acc>>bits)&31);}}if(bits>0)ret.push((acc<<(5-bits))&31);return ret;};
  const d5=to5(addrBytes);
  // standard bech32 checksum (BIP-0173, constant ^1)
  const hrp='stake',C='qpzry9x8gf2tvdw0s3jn54khce6mua7l';
  const ex=[...[...hrp].map(c=>c.charCodeAt(0)>>5),0,...[...hrp].map(c=>c.charCodeAt(0)&31)];
  const G=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];
  const pm=vs=>{let c=1;for(const v of vs){const b=c>>25;c=((c&0x1ffffff)<<5)^v;for(let i=0;i<5;i++)if((b>>i)&1)c^=G[i];}return c;};
  const cs=pm([...ex,...d5,0,0,0,0,0,0])^1;
  const chk=Array.from({length:6},(_,p)=>(cs>>(5*(5-p)))&31);
  return hrp+'1'+[...d5,...chk].map(i=>C[i]).join('');
}

// Stacks: 33-byte compressed secp256k1 pubkey (hex, starts 02/03)
// → SP... c32check address (version 22 = mainnet P2PKH, alphabet 0123456789ABCDEFGHJKMNPQRSTVWXYZ).
// Requires bitcoinjs-lib (loaded via CDN) for hash160 and hash256.
// Test vector:
//   in: 036fcc9dc8811f227ff417bff1928540190e35d9a7800011ed123422666537a793
//   → SP... (41 chars: 'S' + c32[22]='P' + 39-char c32 of hash160+checksum)
function stacksPubkeyToAddr(hex){
  if(typeof hex!=='string'||hex.length!==66||!/^0[23][0-9a-f]{64}$/i.test(hex))return null;
  if(typeof bitcoinjsLib==='undefined')return null;
  const h160=bitcoinjsLib.crypto.hash160(Buffer.from(hex,'hex')); // 20B: RIPEMD160(SHA256(pubkey))
  const ver=22; // mainnet P2PKH → 'P' in c32 alphabet → addresses start SP
  // checksum = SHA256(SHA256([version, ...hash160]))[0:4]
  const cs=bitcoinjsLib.crypto.hash256(Buffer.concat([Buffer.from([ver]),h160])).slice(0,4);
  // c32-encode [hash160..., checksum...] (24 bytes) as 39 chars using Stacks alphabet
  const ALPHA='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  const payload=[...h160,...cs];
  let acc=0,bits=0,result='';
  for(const v of payload){acc=(acc<<8)|v;bits+=8;while(bits>=5){bits-=5;result+=ALPHA[(acc>>bits)&31];}}
  if(bits>0)result+=ALPHA[(acc<<(5-bits))&31];
  while(result.length<39)result='0'+result; // zero-pad to canonical 39 chars
  return 'S'+ALPHA[ver]+result;
}

// TON: 64-char hex (32-byte hash component of raw address, workchain 0)
// → UQ... user-friendly non-bounceable address (base64url, tag=0x51)
// Format: [0x51, 0x00, ...32-byte hash, CRC16-CCITT(34 bytes)] base64url-encoded
function tonHexToAddr(hex){
  if(typeof hex!=='string'||!/^[0-9a-f]{64}$/i.test(hex))return null;
  const hash=[];
  for(let i=0;i<64;i+=2)hash.push(parseInt(hex.slice(i,i+2),16));
  const addr=[0x51,0x00,...hash]; // non-bounceable mainnet tag + workchain 0 + hash
  let crc=0;
  for(const b of addr){crc^=(b<<8);for(let i=0;i<8;i++)crc=crc&0x8000?(crc<<1)^0x1021:(crc<<1);crc&=0xffff;}
  const full=[...addr,crc>>8,crc&0xff];
  return btoa(String.fromCharCode(...full)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

/* ─── ERC-20 token balances via Multicall3 ──────────────────────────────────
   One eth_call per chain returns N balanceOf reads in a single round trip.
   Calldata layout (encoder, Call3 has 3 fields → inner bytes offset = 0x60):
     selector(4) | outerOffset(32) | arrayLen(32) | tupleOffsets[N]*32
       | per-tuple: target(32) | allowFailure(32) | bytesOffset=0x60(32)
                  | calldataLen(32) | calldata padded
   Response (decoder, Result has 2 fields → inner bytes offset = 0x40):
     outerOffset(32) | arrayLen(32) | tupleOffsets[N]*32
       | per-tuple: success(32) | bytesOffset=0x40(32)
                  | retDataLen(32) | retData padded
*/
function _hex32(v){
  // v: BigInt | number | hex string (no 0x). Output: 64-hex-char (32-byte) word.
  if(typeof v==='bigint')return v.toString(16).padStart(64,'0');
  if(typeof v==='number')return v.toString(16).padStart(64,'0');
  return String(v).replace(/^0x/i,'').padStart(64,'0').toLowerCase();
}
function _padRightTo32(hex){
  const len=hex.length;
  const rem=len%64;
  return rem===0?hex:hex+'0'.repeat(64-rem);
}
function _encodeAggregate3(calls){
  // calls: [{target:'0x...', allowFailure:bool, callData:'0x...'}, ...]
  const N=calls.length;
  // Each tuple's body: 4 head words + padded callData
  const tupleBodies=calls.map(c=>{
    const data=c.callData.replace(/^0x/i,'').toLowerCase();
    const dataBytes=data.length/2;
    return _hex32(c.target.replace(/^0x/i,''))+_hex32(c.allowFailure?1:0)+_hex32(0x60)+_hex32(dataBytes)+_padRightTo32(data);
  });
  // Tuple offsets are byte offsets from the start of the outer array data
  // (i.e., after arrayLen). First tuple starts after the offset table.
  const offsetTableBytes=N*32;
  const offsets=[];
  let runningBytes=offsetTableBytes;
  for(const body of tupleBodies){offsets.push(runningBytes);runningBytes+=body.length/2;}
  const offsetWords=offsets.map(o=>_hex32(o)).join('');
  const outerOffset=_hex32(0x20);
  const arrayLen=_hex32(N);
  return'0x82ad56cb'+outerOffset+arrayLen+offsetWords+tupleBodies.join('');
}
function _decodeAggregate3Response(resultHex){
  // Returns array of {success:bool, returnData:hex without 0x} matching input order.
  const hex=(resultHex||'').replace(/^0x/i,'');
  if(hex.length<128)return[];
  const wordAt=i=>hex.slice(i*64,(i+1)*64);
  // word 0: outer offset (always 0x20). word 1: array length.
  const N=Number(BigInt('0x'+wordAt(1)));
  const out=[];
  // Tuple offsets are at words 2..2+N-1 (byte-offsets from start of array data,
  // which is at the beginning of the offset table itself — i.e., word 2).
  const arrayDataStart=2*32; // hex chars: 64 per word, so word 2 starts at 128 chars
  for(let i=0;i<N;i++){
    const tupleOffset=Number(BigInt('0x'+wordAt(2+i)));
    const tupleStart=(arrayDataStart+tupleOffset)*2; // byte→hex char index
    const success=BigInt('0x'+hex.slice(tupleStart,tupleStart+64))===1n;
    // Skip bytesOffset word (always 0x40 for Result struct)
    const retLen=Number(BigInt('0x'+hex.slice(tupleStart+128,tupleStart+192)));
    const retData=hex.slice(tupleStart+192,tupleStart+192+retLen*2);
    out.push({success,returnData:retData});
  }
  return out;
}
async function fetchTokenBalances(chain,owner,contracts){
  // contracts: array of contract addresses (with or without 0x prefix).
  // Returns Map<lowercaseContract, BigInt> for successful entries; failed entries omitted.
  const rpc=EVM_RPCS[chain];
  if(!rpc)throw new Error(`No RPC for chain ${chain}`);
  if(!Array.isArray(contracts)||!contracts.length)return new Map();
  const ownerHex=owner.replace(/^0x/i,'').toLowerCase();
  const balanceOfCalldata='0x70a08231'+_hex32(ownerHex);
  const calls=contracts.map(c=>({target:'0x'+c.replace(/^0x/i,'').toLowerCase(),allowFailure:true,callData:balanceOfCalldata}));
  const data=_encodeAggregate3(calls);
  const r=await fetch(rpc,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'eth_call',params:[{to:MULTICALL3_ADDRESS,data},'latest'],id:1})});
  const j=await r.json();
  if(j.error)throw new Error(j.error.message);
  const results=_decodeAggregate3Response(j.result);
  const out=new Map();
  results.forEach((res,i)=>{
    if(!res.success||!res.returnData||res.returnData.length<64)return;
    try{out.set(calls[i].target.toLowerCase(),BigInt('0x'+res.returnData.slice(0,64)));}catch{}
  });
  return out;
}

/* ─── ERC-20 fiat lookup via DexScreener ─────────────────────────────────────
   DexScreener (api.dexscreener.com) is the single source of truth for live
   token prices in this toolkit. Empirical verification (2026-05-09):
     • Per-contract endpoint /latest/dex/tokens/{c} returns up to 30 pairs
       across all chains. We filter by chainId AND baseToken === queried
       contract (some forked tokens like Polygon USDT crowd the response with
       "ANY/USDT" pairs where priceUsd is wrong), then sort by liquidity desc.
     • Concurrency 5 + 200ms gap is comfortable: 30 sequential requests with
       200ms gap completed in 7.4s with 0 × 429.
     • Free tier; no auth required.
   Pair-cap edge case: highly forked tokens (Ethereum USDT) may have all 30
   returned pairs come from forks (PulseChain, EthereumPoW), leaving no
   ethereum-chain entries despite real Uniswap pools existing. Those tokens
   render fiat=null. Acceptable; documented.

   Cache: in-memory only, keyed by '0x'+lowercase contract+'@'+chain (the
   chain qualifier matters because the same address may have different prices
   on different chains — same contract address, different deployments).
   5min TTL for hits, 1min for nulls so missing tokens get retried.            */
const _DS_MAX_CONCURRENT=5;
const _DS_MIN_GAP_MS=200;
const _DS_TTL_HIT=300000;
const _DS_TTL_MISS=60000;
const _DS_CACHE=new Map(); // 'chain:lc0xContract' → {price:number|null, liquidity:number, ts:number}
let _dsInFlight=0;
let _dsEarliestNext=0;
let _dsPausedUntil=0;
async function _dsAcquireSlot(){
  while(true){
    const now=Date.now();
    const wait=Math.max(_dsPausedUntil-now,_dsEarliestNext-now,0);
    if(wait>0||_dsInFlight>=_DS_MAX_CONCURRENT){
      await new Promise(r=>setTimeout(r,Math.max(wait,50)));
      continue;
    }
    _dsInFlight++;
    _dsEarliestNext=Date.now()+_DS_MIN_GAP_MS;
    return;
  }
}
function _dsReleaseSlot(){_dsInFlight--;}
async function _dsFetchOne(dsChainId,lcContract){
  // Returns {price:number|null, liquidity:number, rateLimited:bool}
  await _dsAcquireSlot();
  try{
    const url=`https://api.dexscreener.com/latest/dex/tokens/${lcContract}`;
    const r=await fetch(url);
    if(r.status===429){
      _dsPausedUntil=Math.max(_dsPausedUntil,Date.now()+30000);
      return{price:null,liquidity:0,rateLimited:true};
    }
    if(!r.ok)return{price:null,liquidity:0,rateLimited:false};
    const j=await r.json();
    const pairs=Array.isArray(j?.pairs)?j.pairs:[];
    // Pick best pair: chainId match AND queried token is the BASE token,
    // sorted by liquidity desc. Discards pairs below the display floor.
    const candidates=pairs
      .filter(p=>p.chainId===dsChainId&&p.baseToken?.address?.toLowerCase()===lcContract&&(p.liquidity?.usd||0)>=DEXSCREENER_DISPLAY_LIQUIDITY_FLOOR)
      .sort((a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0));
    if(!candidates.length)return{price:null,liquidity:0,rateLimited:false};
    const top=candidates[0];
    const price=parseFloat(top.priceUsd);
    if(!isFinite(price)||price<=0)return{price:null,liquidity:top.liquidity?.usd||0,rateLimited:false};
    return{price,liquidity:top.liquidity?.usd||0,rateLimited:false};
  }catch{return{price:null,liquidity:0,rateLimited:false};}
  finally{_dsReleaseSlot();}
}
/* ─── Layer 2 token discovery: proxyetherscan addresstokenbalance ───────────
   When an EVM account expands and Layer 1 (extractAccounts + discoverTokensFromLog)
   produced no tokens for it, we fall back to Ledger's etherscan-proxy backend
   which Ledger Live itself uses. No auth — Ledger's proxy adds the API key
   server-side. Verified 2026-05-09 with `0x0FED…D252` on Arbitrum: 200 OK,
   no rate-limit at 10× concurrent (~1s wall).

   Response shape (Etherscan v2 unified API):
     { status:'1', message:'OK', result:[
         {TokenAddress:'0x..', TokenName:'..', TokenSymbol:'..',
          TokenQuantity:'<raw>', TokenDivisor:'<decimals>', TokenPriceUSD:'..'},
         ...]}
   `status:'0'` is returned for unsupported chains or addresses with no holdings.
   The proxy does NOT filter spam/airdrop-bait tokens — symbols like
   "Claim rewards at https://…" are common. We filter URL-laden symbols/names
   client-side so they don't pollute the tile UI. Spam tokens that slip the
   filter still won't show fiat (their DEX liquidity is below our floor).      */
const PROXYETHERSCAN_BASE='https://proxyetherscan.api.live.ledger.com/v2/api';
const _PROXY_TTL=300000; // 5 min; matches DexScreener positive-cache TTL
const _PROXY_CACHE=new Map(); // 'chain:lcAddr' → {ts:number, tokens:[{contract,decimals,symbol,name,raw}]}
function _isLikelySpamToken(t){
  const sym=t.TokenSymbol||'',name=t.TokenName||'';
  // URL in symbol or name (most blatant tell)
  if(/https?:\/\//i.test(sym)||/https?:\/\//i.test(name))return true;
  // Domain-style symbols (e.g. "merge-eth.io", "centreusd.org") — real tickers
  // never contain a dot followed by a TLD-like 2+ letter sequence.
  if(/\.[a-z]{2,}/i.test(sym))return true;
  // Symbols with whitespace, or social/scam keywords
  if(/\s/.test(sym)||/\b(claim|airdrop|visit|reward|gift|swap|t\.me)\b/i.test(sym))return true;
  // Zero-width / formatting whitespace in symbol or name
  if(/[​-‏﻿]/.test(sym)||/[​-‏﻿]/.test(name))return true;
  // Symbol length: legit tickers are ≤12 chars (BTC, USDC, stETH, …)
  if(sym.length>14)return true;
  // Excessive whitespace padding in name (a.k.a. "rank manipulation" pattern)
  if(/\s{4,}/.test(name))return true;
  return false;
}
async function discoverTokensOnChain(chain,addr){
  // Returns Promise<Array<{contract, decimals, symbol, name, raw}>>; empty array on miss/error.
  const evmId=EVM_CHAIN_IDS[chain];
  if(!evmId||!addr)return[];
  const lcAddr='0x'+addr.replace(/^0x/i,'').toLowerCase();
  const cacheKey=chain+':'+lcAddr;
  const cached=_PROXY_CACHE.get(cacheKey);
  if(cached&&Date.now()-cached.ts<_PROXY_TTL)return cached.tokens;
  try{
    const url=`${PROXYETHERSCAN_BASE}/${evmId}?module=account&action=addresstokenbalance&address=${addr}&tag=latest&page=1&offset=100`;
    const r=await fetch(url);
    if(!r.ok){
      console.warn(`[token discovery] proxyetherscan ${chain}/${addr.slice(0,10)} returned ${r.status}`);
      _PROXY_CACHE.set(cacheKey,{ts:Date.now(),tokens:[]});
      return[];
    }
    const j=await r.json();
    if(j.status!=='1'||!Array.isArray(j.result)){
      _PROXY_CACHE.set(cacheKey,{ts:Date.now(),tokens:[]});
      return[];
    }
    const tokens=j.result
      .filter(t=>!_isLikelySpamToken(t))
      .map(t=>({
        contract:'0x'+(t.TokenAddress||'').replace(/^0x/i,'').toLowerCase(),
        decimals:parseInt(t.TokenDivisor||'18',10),
        symbol:t.TokenSymbol||'',
        name:t.TokenName||'',
        raw:t.TokenQuantity||'0',
      }))
      .filter(t=>/^0x[0-9a-f]{40}$/.test(t.contract));
    _PROXY_CACHE.set(cacheKey,{ts:Date.now(),tokens});
    return tokens;
  }catch(e){
    console.warn(`[token discovery] proxyetherscan ${chain} error:`,e.message);
    _PROXY_CACHE.set(cacheKey,{ts:Date.now(),tokens:[]});
    return[];
  }
}

async function fetchTokenFiat(chain,contracts){
  const dsChainId=DEXSCREENER_CHAIN_IDS[chain];
  // Output: Map<'0x'+lcContract → {price:number|null, liquidity:number}>
  const out=new Map();
  if(!Array.isArray(contracts)||!contracts.length)return out;
  if(!dsChainId){
    // Coverage gap: no DexScreener mapping for this chain. Return null entries.
    contracts.forEach(c=>out.set('0x'+c.replace(/^0x/i,'').toLowerCase(),{price:null,liquidity:0}));
    return out;
  }
  const now=Date.now();
  const lcKeys=[...new Set(contracts.map(c=>'0x'+c.replace(/^0x/i,'').toLowerCase()))];
  const toFetch=[];
  for(const k of lcKeys){
    const cacheKey=chain+':'+k;
    const cached=_DS_CACHE.get(cacheKey);
    if(cached){
      const ttl=cached.price==null?_DS_TTL_MISS:_DS_TTL_HIT;
      if(now-cached.ts<ttl){out.set(k,{price:cached.price,liquidity:cached.liquidity});continue;}
    }
    toFetch.push(k);
  }
  if(!toFetch.length)return out;
  const r1=await Promise.allSettled(toFetch.map(k=>_dsFetchOne(dsChainId,k)));
  const retry=[];
  r1.forEach((res,i)=>{
    const k=toFetch[i];
    const cacheKey=chain+':'+k;
    if(res.status!=='fulfilled'){_DS_CACHE.set(cacheKey,{price:null,liquidity:0,ts:Date.now()});out.set(k,{price:null,liquidity:0});return;}
    if(res.value.rateLimited){retry.push(k);return;}
    _DS_CACHE.set(cacheKey,{price:res.value.price,liquidity:res.value.liquidity,ts:Date.now()});
    out.set(k,{price:res.value.price,liquidity:res.value.liquidity});
  });
  if(retry.length){
    const r2=await Promise.allSettled(retry.map(k=>_dsFetchOne(dsChainId,k)));
    r2.forEach((res,i)=>{
      const k=retry[i];
      const cacheKey=chain+':'+k;
      const ok=res.status==='fulfilled'&&!res.value.rateLimited;
      const v=ok?{price:res.value.price,liquidity:res.value.liquidity}:{price:null,liquidity:0};
      _DS_CACHE.set(cacheKey,{...v,ts:Date.now()});
      out.set(k,v);
    });
  }
  return out;
}

/* Countervalue helpers — read historical rates from app.json */
const TOKEN_DECIMALS_PATTERNS=[
  [/\/usd[_-]?coin$/i,6],[/\/usdc/i,6],[/\/tether$/i,6],[/\/usdt/i,6],
  [/\/wrapped[_-]?bitcoin/i,8],[/\/wbtc/i,8],[/\/staked[_-]?ether/i,18],
  [/\/dai$/i,18],[/\/shiba[_-]?inu/i,18],[/\/chainlink/i,18],[/\/uni[_-]?swap/i,18],
];
// Backwards-compatible decimals lookup. Prefers TOKEN_METADATA (live CAL data),
// falls back to TOKEN_DECIMALS_PATTERNS regex (offline-friendly for the most common tokens).
function getTokenDecimals(tokenId,parentCid){
  return getTokenInfo(tokenId,parentCid).decimals;
}
function cvGetRateMap(appJson){
  return appJson?.raw?.countervalues||appJson?.data?.countervalues||{};
}
function cvFiatCurrency(appJson){
  return appJson?.raw?.settings?.counterValue||appJson?.data?.settings?.counterValue||'USD';
}
function cvLatestRate(appJson,currencyId){
  const rm=cvGetRateMap(appJson);
  const fiat=cvFiatCurrency(appJson);
  const key=fiat+' '+currencyId;
  const dates=rm[key];
  if(!dates)return null;
  const sorted=Object.keys(dates).sort();
  if(!sorted.length)return null;
  const latestDate=sorted[sorted.length-1];
  return{rate:dates[latestDate],date:latestDate};
}
function cvRateOnDate(appJson,currencyId,dateStr){
  const rm=cvGetRateMap(appJson);
  const fiat=cvFiatCurrency(appJson);
  const key=fiat+' '+currencyId;
  const dates=rm[key];
  if(!dates)return null;
  if(dates[dateStr])return dates[dateStr];
  const allDates=Object.keys(dates).sort();
  if(!allDates.length)return null;
  let nearest=allDates[0];
  for(const d of allDates){if(d<=dateStr)nearest=d;else break;}
  return dates[nearest];
}
function cvFiatValue(appJson,currencyId,rawBalance){
  if(!rawBalance||rawBalance==='0'||rawBalance===0)return null;
  const ri=cvLatestRate(appJson,currencyId);
  if(!ri)return null;
  const dec=DECIMALS[currencyId]||18;
  const humanBal=parseFloat(rawBalance)/Math.pow(10,dec);
  if(isNaN(humanBal)||!isFinite(humanBal))return null;
  return humanBal*ri.rate;
}
function cvTokenFiatValue(appJson,tokenId,rawBalance,parentCid){
  if(!rawBalance||rawBalance==='0'||rawBalance===0)return null;
  const ri=cvLatestRate(appJson,tokenId);
  if(!ri)return null;
  const dec=getTokenDecimals(tokenId,parentCid);
  const humanBal=parseFloat(rawBalance)/Math.pow(10,dec);
  if(isNaN(humanBal)||!isFinite(humanBal))return null;
  return humanBal*ri.rate;
}
function cvFmtFiat(value,appJson){
  if(value==null)return null;
  const fiat=cvFiatCurrency(appJson);
  const sym=fiat==='USD'?'$':fiat==='EUR'?'€':fiat==='GBP'?'£':fiat+' ';
  return sym+value.toLocaleString(undefined,{maximumFractionDigits:2,minimumFractionDigits:2});
}

function fmtBal(raw,currencyId,ticker){
  if(raw==null||raw==='')return null;
  const d=DECIMALS[currencyId]||0;
  try{
    const s=String(raw);
    if(d===0)return s+(ticker?' '+ticker:'');
    const neg=s.startsWith('-');
    const abs=neg?s.slice(1):s;
    const padded=abs.padStart(d+1,'0');
    const whole=padded.slice(0,padded.length-d);
    const frac=padded.slice(padded.length-d).replace(/0+$/,'');
    const formatted=frac?whole+'.'+frac:whole;
    return(neg?'-':'')+Number(formatted).toLocaleString(undefined,{maximumFractionDigits:8})+(ticker?' '+ticker:'');
  }catch{return String(raw);}
}

      if(!entry||now-entry.ts>=TOKEN_CACHE_TTL)continue;
      TOKEN_METADATA[id]=entry.data;
      if(entry.data.contractAddress)TOKEN_CONTRACTS[id]=entry.data.contractAddress;
    }
  }catch{}
})();
function _writeTokenCache(updates){
  try{
    const c=localStorage.getItem(TOKEN_CACHE_KEY);
    const cache=c?JSON.parse(c):{};
    const now=Date.now();
    for(const[id,data] of Object.entries(updates))cache[id]={ts:now,data};
    localStorage.setItem(TOKEN_CACHE_KEY,JSON.stringify(cache));
  }catch{}
}
// Fetch a single token's metadata from CAL (returns null on miss/error, never throws)
async function _fetchOneTokenMeta(tokenId){
  if(TOKEN_METADATA_INFLIGHT.has(tokenId))return TOKEN_METADATA_INFLIGHT.get(tokenId);
  const p=(async()=>{
    try{
      const url=`https://crypto-assets-service.api.ledger.com/v1/tokens?id=${encodeURIComponent(tokenId)}&limit=1&output=id,name,ticker,contract_address,decimals,delisted`;
      const r=await fetch(url);
      if(!r.ok)return null;
      const arr=await r.json();
      const t=Array.isArray(arr)?arr[0]:null;
      if(!t||!t.contract_address)return null;
      return{
        contractAddress:t.contract_address,
        ticker:t.ticker||'',
        name:t.name||'',
        decimals:typeof t.decimals==='number'?t.decimals:18,
        delisted:!!t.delisted,
      };
    }catch{return null;}
  })();
  TOKEN_METADATA_INFLIGHT.set(tokenId,p);
  p.finally(()=>TOKEN_METADATA_INFLIGHT.delete(tokenId));
  return p;
}
/* Lazy per-token metadata fetcher (CAL service).
   Input: array of tokenIds (e.g. ['ethereum/erc20/usd__coin', ...]).
   Output: Promise<boolean> — resolves true if any new token was added (so the
     caller can re-render). Already-cached tokens are skipped. Failed lookups
     are not cached (will retry next expand).                                  */
async function fetchTokenMetadata(tokenIds){
  if(!Array.isArray(tokenIds)||!tokenIds.length)return false;
  const toFetch=[...new Set(tokenIds)].filter(id=>id&&!TOKEN_METADATA[id]);
  if(!toFetch.length)return false;
  const results=await Promise.allSettled(toFetch.map(id=>_fetchOneTokenMeta(id).then(data=>({id,data}))));
  const fresh={};
  let added=0;
  for(const r of results){
    if(r.status!=='fulfilled'||!r.value.data)continue;
    const{id,data}=r.value;
    TOKEN_METADATA[id]=data;
    TOKEN_CONTRACTS[id]=data.contractAddress;
    fresh[id]=data;
    added++;
  }
  if(added>0)_writeTokenCache(fresh);
  return added>0;
}
// Strip a Ledger tokenId slug down to a display-friendly tail: drop the trailing
// `_0x<40hex>` contract-suffix that newer slugs carry, collapse `__`/`_` to spaces.
// Returns the cleaned, lower-cased tail (e.g. "usds_stablecoin_0xdc..." → "usds stablecoin").
function _tokenSlugTail(tokenId){
  return(tokenId.split('/').pop()||'')
    .replace(/_0x[a-fA-F0-9]{40}$/,'')
    .replace(/__/g,' ')
    .replace(/_/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
// Title-case helper for slug fallbacks ("usds stablecoin" → "Usds Stablecoin").
function _titleCaseSlug(s){
  return s.split(' ').filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');
}
/* Ledger token-icon CDN (https://crypto-icons.ledger.com/index.json).
   The index is a flat map: { "ethereum/erc20/usd_coin": {icon:"USDC.png"}, ... }.
   We fetch once per session, cache the {tokenId → filename} mapping in localStorage
   for 24h (cache key `ldt_icons_v1`; bump the suffix if the cached shape changes).
   Normalization: SyncSuccess events sometimes use the legacy `usd__coin` form while

const ICON_CACHE_KEY='ldt_icons_v1',ICON_CACHE_TTL=86400000;
let ICON_INDEX=null;             // {tokenId → filename} or null while pending/failed
let _ICON_INDEX_PROMISE=null;    // dedupe concurrent loads
// Hydrate from localStorage on script load
(()=>{
  try{
    const c=localStorage.getItem(ICON_CACHE_KEY);
    if(!c)return;
    const{ts,map}=JSON.parse(c);
    if(!ts||!map||Date.now()-ts>=ICON_CACHE_TTL)return;
    ICON_INDEX=map;
  }catch{}
})();
async function fetchIconIndex(){
  if(ICON_INDEX)return ICON_INDEX;
  if(_ICON_INDEX_PROMISE)return _ICON_INDEX_PROMISE;
  _ICON_INDEX_PROMISE=(async()=>{
    try{
      const r=await fetch('https://crypto-icons.ledger.com/index.json');
      if(!r.ok)return null;
      const j=await r.json();
      // Compress: keep only {tokenId → filename}, drop any unused fields
      const map={};
      for(const[k,v] of Object.entries(j||{})){
        if(v&&typeof v.icon==='string')map[k]=v.icon;
      }
      ICON_INDEX=map;
      try{localStorage.setItem(ICON_CACHE_KEY,JSON.stringify({ts:Date.now(),map}));}catch{}
      return map;
    }catch{return null;}
    finally{_ICON_INDEX_PROMISE=null;}
  })();
  return _ICON_INDEX_PROMISE;
}
// Returns a CDN URL for the token's icon, or null if not in the index.
// Caller is responsible for rendering a letter-circle fallback on null AND on <img> 404.
function getTokenIconUrl(tokenId){
  if(!ICON_INDEX||!tokenId)return null;
  let f=ICON_INDEX[tokenId];
  if(!f){
    const norm=tokenId.replace(/__/g,'_');
    if(norm!==tokenId)f=ICON_INDEX[norm];
  }
  return f?`https://crypto-icons.ledger.com/${f}`:null;
}
// Resolve token info, in order: TOKEN_METADATA (authoritative) → regex patterns → defaults.
// Sync — reads from in-memory registry; callers ensure fetchTokenMetadata has been awaited.
function getTokenInfo(tokenId,parentCid){
  if(!tokenId)return{decimals:18,ticker:'',name:'',contractAddress:null,delisted:false};
  const meta=TOKEN_METADATA[tokenId];
  if(meta)return{decimals:meta.decimals,ticker:meta.ticker,name:meta.name,contractAddress:meta.contractAddress,delisted:meta.delisted};
  let dec=18;
  for(const[pat,d] of TOKEN_DECIMALS_PATTERNS){if(pat.test(tokenId)){dec=d;break;}}
  if(parentCid==='solana')dec=9;
  const tail=_tokenSlugTail(tokenId);
  return{decimals:dec,ticker:tail.toUpperCase(),name:_titleCaseSlug(tail),contractAddress:null,delisted:false};
}

function classifyDiag(dg){
  const t=((dg&&dg.t)||'').toLowerCase();
  const c=(dg&&dg.c)||'unknown';
  if(c==='hardware'){
    if(t.includes('rejected')||t.includes('refused'))return 'activity';
    if(t.includes('blind signing'))return 'activity';
    if(t.includes('firmware update failed')||t.includes('mcu already'))return 'app';
    return 'connection';
  }
  if(c==='server')return 'server';
  if(c==='software'){
    if(t.includes('sync')||t.includes('price data')||t.includes('chart data')||t.includes('staking info')||t.includes('bridge init')||t.includes('account already'))return 'sync';
    if(t.includes('insufficient')||t.includes('invalid address')||t.includes('nonce')||t.includes('gas estimation')||t.includes('speed-up')||t.includes('swap rate')||t.includes('deserialization')||t.includes('undelegation')||t.includes('congestion'))return 'activity';
    if(t.includes('out of date')||t.includes('installation failed')||t.includes('password')||t.includes('invalid instruction')||t.includes('camera'))return 'app';
    return 'sync';
  }
  return 'sync';
}

function errUrl(dg){const match=ERR_DB.find(r=>r.t===dg.t&&r.u);return match?match.u:null;}

// Stable, code-like identifier for an error class, derived from its diagnosis title.
// The KB has no explicit pattern-code field — dg.t (the title) is the pattern identity
// (errPatternFilter keys on it). This slug is used for tile subtitles, "Find similar",
// and as the TICKET_REPLIES key. e.g. "API rate limited (429)" -> "api_rate_limited_429".
function patternCode(dg){if(!dg||!dg.t)return'unknown';return dg.t.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40);}

  account_sync_failed:`Hi,\n\nThanks for reaching out. We can see one or more of your accounts didn't finish synchronising.\n\nThis is almost always temporary. Please try:\n1. Checking your internet connection.\n2. Restarting Ledger Live.\n3. Waiting a few minutes and letting your accounts re-sync.\n\nYour funds are safe on the blockchain regardless of what Ledger Live displays — syncing only affects what's shown on screen. Let me know if the accounts don't recover after a restart.\n\nBest regards,`,
  api_rate_limited_429:`Hi,\n\nThanks for your patience. Our logs indicate the app briefly hit a rate limit while fetching data, which can happen during periods of heavy activity.\n\nThis clears on its own. Please close Ledger Live completely, wait 2–3 minutes, then reopen it and allow your accounts to sync. No action is needed on the device itself, and your funds are unaffected.\n\nLet me know if you still see issues after that.\n\nBest regards,`,
  ledger_api_unavailable:`Hi,\n\nThanks for reaching out. It looks like Ledger Live had trouble reaching our servers during this session.\n\nThis is typically a temporary connectivity issue. Please:\n1. Confirm your internet connection is working.\n2. Restart Ledger Live.\n3. If you use a VPN, firewall, or proxy, try temporarily disabling it and reconnecting.\n\nYou can also check our service status page for any ongoing incidents. Let me know if the problem continues.\n\nBest regards,`,
  bridge_init_error:`Hi,\n\nThanks for the report. Ledger Live had trouble starting the internal component that talks to your device.\n\nPlease try:\n1. Fully quitting Ledger Live (make sure it isn't still running in the background) and reopening it.\n2. Making sure no other application (e.g. Ledger Live on another window, or a browser wallet) is using the device at the same time.\n3. Restarting your computer if it persists.\n\nLet me know if that clears it up.\n\nBest regards,`,
  address_rejected_on_device:`Hi,\n\nThanks for getting in touch. The logs show a receive address was declined on the device rather than confirmed.\n\nThis simply means the address verification step was cancelled. When you're ready to receive funds, please:\n1. Open the relevant coin app on your device.\n2. In Ledger Live, choose Receive and follow the prompt.\n3. When the address appears on your device screen, review it and press to Approve/confirm.\n\nNothing is wrong with your device or funds — the step just needs to be confirmed. Let me know if you have any questions.\n\nBest regards,`,
  action_cancelled_on_device:`Hi,\n\nThanks for reaching out. Our logs show the last action was cancelled on the device.\n\nIf that was intentional, no further action is needed. If you meant to go ahead, please retry the operation in Ledger Live and, when prompted, review the details on your device screen and confirm/approve them. Nothing is charged or moved unless you approve it on the device.\n\nLet me know if you'd like a hand walking through it.\n\nBest regards,`,
  app_not_found_on_device:`Hi,\n\nThanks for the details. It looks like the app required for this coin isn't installed on your device.\n\nTo add it:\n1. Open Ledger Live and go to My Ledger.\n2. Connect and unlock your device, and allow Ledger Manager if prompted.\n3. Search for the coin's app (e.g. Bitcoin, Ethereum) and install it.\n4. Return to your accounts and try again.\n\nLet me know if the app doesn't appear in the catalogue and I'll help further.\n\nBest regards,`,
  insufficient_balance:`Hi,\n\nThanks for reaching out. The transaction couldn't be completed because the account balance wasn't enough to cover the amount plus network fees.\n\nPlease note that blockchain network fees are taken on top of the amount you send, so the account needs a little extra to cover them. Try lowering the amount slightly, or topping up the account, then attempt the transaction again.\n\nLet me know if the numbers still don't add up and we'll take a closer look.\n\nBest regards,`,
  enable_blind_signing_contract_data:`Hi,\n\nThanks for getting in touch. This transaction interacts with a smart contract, which requires a setting to be enabled on the device first.\n\nPlease:\n1. Open the Ethereum (or relevant network) app on your device.\n2. Go to Settings within that app.\n3. Enable "Blind signing" (also shown as "Contract data").\n4. Return to Ledger Live and retry the transaction.\n\nOnly enable this for transactions you initiated and trust. Let me know if you can't find the setting.\n\nBest regards,`,
};
