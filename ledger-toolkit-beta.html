              {[
                {l:'HTTP calls',n:netEntries.length,sub:hosts.length+' host'+(hosts.length!==1?'s':''),c:'var(--bi-cat-3)',fg:'#0a0a0a'},
                {l:'Failures',n:errRequests.length,sub:serverErr+' server · '+clientErr+' client',c:errRequests.length>0?'#D94747':'var(--bi-bg-card)',fg:errRequests.length>0?'#fff':'var(--bi-fg-3)',muted:errRequests.length===0},
                {l:'Server errors (5xx)',n:serverErr,sub:'500–599',c:'#E88A4A',fg:'#0a0a0a',muted:serverErr===0},
                {l:'Client errors (4xx)',n:clientErr,sub:'400–499',c:'#F0B93E',fg:'#0a0a0a',muted:clientErr===0},
              ].map((b,i)=>(
                <div key={b.l} className="bi-tile-pop" style={{'--i':i,background:b.c,color:b.fg,padding:'12px 14px',borderRadius:2,opacity:b.muted?0.45:1,border:b.muted?'1px solid var(--bi-border)':'none'}}>
                  <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between'}}>
                    <span style={{fontSize:10,fontWeight:700,letterSpacing:'0.14em',textTransform:'uppercase',opacity:0.85}}>{b.l}</span>
                    <span className="mono" style={{fontSize:28,fontWeight:700,letterSpacing:'-0.02em',lineHeight:1}}>{b.n.toLocaleString()}</span>
                  </div>
                  <div style={{fontSize:11,fontWeight:500,opacity:0.85,marginTop:4}}>{b.sub}</div>
                </div>
              ))}
            </div>

            {netEntries.length===0?(
              <div className="bi-card bi-mount-up" style={{'--i':1,flex:1,display:'flex',alignItems:'center',justifyContent:'center',textAlign:'center',padding:40}}>
                <div>
                  <div style={{fontSize:32,marginBottom:10,color:'var(--bi-fg-4)'}}>🌐</div>
                  <div style={{fontSize:16,color:'var(--bi-fg-1)',fontWeight:600,marginBottom:6}}>No network requests in this session</div>
                  <div style={{fontSize:12,color:'var(--bi-fg-3)',maxWidth:380,margin:'0 auto',lineHeight:1.5,marginBottom:14}}>This is normal for short sessions or logs exported before a sync completed.</div>
                  <span onClick={()=>setSection('timeline')} className="bi-link">View Timeline →</span>
                </div>
              </div>
            ):(
              <div style={{display:'grid',gridTemplateColumns:'320px 1fr',gap:10,flex:1,minHeight:0}}>
                {/* Hosts card */}
                <div className="bi-card bi-mount-up" style={{'--i':1,padding:0,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}}>
                  <div className="bi-card-hd">
                    <div>
                      <div className="bi-title">Hosts</div>
                      <div className="bi-sub">{hosts.length} unique · sorted by volume</div>
                    </div>
                  </div>
                  <div style={{flex:1,overflow:'auto',padding:'8px 0',minHeight:0}}>
                    {hosts.slice(0,30).map((h,i)=>{
                      const col=palette[i%palette.length];
                      return <div key={h.host} className="bi-tr" style={{'--i':Math.min(i,12),'--bi-row-pad':'14px',padding:'5px 14px',display:'flex',alignItems:'center',gap:8,fontSize:11,borderBottom:i<Math.min(hosts.length,30)-1?'1px solid var(--bi-border)':'none'}}>
                        <span style={{width:8,height:8,borderRadius:2,background:col,flexShrink:0}}/>
                        <span className="mono" style={{color:'var(--bi-fg-1)',fontSize:10,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={h.host}>{h.host}</span>
                        <div style={{width:50,height:5}}>
                          <div className="bi-hbar" style={{height:5}}>
                            <span className="bi-hbar-fill" style={{background:col,'--pct':((h.count/hostMax)*100)+'%','--i':i+1}}/>
                          </div>
                        </div>
                        <span className="mono" style={{minWidth:32,textAlign:'right',color:'var(--bi-fg-1)',fontWeight:600}}>{h.count}</span>
                        <span className="mono" style={{minWidth:24,textAlign:'right',color:h.errors>0?'#D94747':'var(--bi-fg-4)'}}>{h.errors||'—'}</span>
                      </div>;
                    })}
                  </div>
                </div>

                {/* Call log */}
                <div className="bi-card bi-mount-up" style={{'--i':2,padding:0,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}}>
                  <div className="bi-card-hd">
                    <div>
                      <div className="bi-title">Call log</div>
                      <div className="bi-sub">{Math.min(500,netEntries.length)} of {netEntries.length}</div>
                    </div>
                  </div>
                  <div style={{flex:1,overflow:'auto',minHeight:0}}>
                    {netEntries.slice(0,500).map((e,idx)=>{
                      let method=sGet(e,'data.method','');
                      let url=e.message||'';
                      if(!method){
                        const m=url.match(/^(get|post|put|patch|delete|head)\s+(https?:\/\/\S+)/i);
                        if(m){method=m[1].toUpperCase();url=m[2];}
                        else method='GET';
                      }
                      const body=sGet(e,'data.body','');
                      let parsed=null;if(body){try{parsed=JSON.parse(body);}catch{}}
                      const status=e.status||e.statusCode||e.code||(e.data&&(e.data.status||e.data.statusCode||e.data.code));
                      const isErr=status&&Number(status)>=400;
                      const codeColor=!status?'var(--bi-fg-4)':Number(status)<400?'var(--bi-positive)':Number(status)===429?'#E88A4A':'#D94747';
                      const isUrl=url.startsWith('https://');
                      return <div key={e.logIndex||idx} className="bi-tr" style={{'--i':Math.min(idx,12),'--bi-row-pad':'14px',padding:'7px 14px',display:'flex',alignItems:'center',gap:10,fontSize:11,borderBottom:'1px solid var(--bi-border)'}}>
                        <span className="mono" style={{fontSize:10,color:'var(--bi-fg-3)',minWidth:72}}>{fmtTime(e.timestamp||e.date)}</span>
                        <span className="mono" style={{fontSize:10,fontWeight:600,color:'var(--bi-cat-1)',minWidth:42}}>{method}</span>
                        <div style={{flex:1,overflow:'hidden',minWidth:0}}>
                          {isUrl?<a href={url} target="_blank" rel="noopener noreferrer" className="mono" style={{color:'var(--bi-fg-1)',textDecoration:'none',fontSize:11,display:'block',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{url}</a>:<span className="mono" style={{fontSize:11,color:'var(--bi-fg-1)',display:'block',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{url}</span>}
                          {parsed&&parsed.method&&<div className="mono" style={{fontSize:9,color:'var(--bi-fg-3)',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>→ {parsed.method}({parsed.params?.[0]?trunc(typeof parsed.params[0]==='string'?parsed.params[0]:JSON.stringify(parsed.params[0]),60):''})</div>}
                        </div>
                        {status&&<span className="mono" style={{fontWeight:600,color:codeColor,minWidth:34,textAlign:'right'}}>{status}</span>}
                      </div>;
                    })}
                    {netEntries.length>500&&<div style={{padding:12,textAlign:'center',color:'var(--bi-fg-3)',fontSize:11}}>Showing 500 of {netEntries.length}</div>}
                  </div>
                </div>
              </div>
            )}
          </div>;
        })()}

        {/* APDU */}
        {section==='apdu'&&(()=>{
          function decodeApduStatus(hex,dir){
            if(!hex||dir==='in')return null;
            const sw=hex.replace(/\s/g,'').slice(-4).toLowerCase();
            const swMap={'9000':{label:'OK',color:'var(--bi-positive)'},'6985':{label:'Rejected',color:'#D94747'},'6982':{label:'Locked',color:'#E88A4A'},'6a82':{label:'App not open',color:'#E88A4A'},'6700':{label:'Bad length',color:'#E88A4A'},'6d00':{label:'Bad INS',color:'#E88A4A'},'6e00':{label:'Wrong app',color:'#E88A4A'},'6f00':{label:'Tech error',color:'#D94747'},'5515':{label:'Locked',color:'#E88A4A'}};
            return swMap[sw]||{label:`0x${sw.toUpperCase()}`,color:'var(--bi-fg-3)'};
          }

          if(logData.apdu.length===0)return <div className="bi-overview" style={{padding:'12px 16px',gap:10}}>
            <div className="bi-card bi-mount-up" style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',textAlign:'center',padding:40}}>
              <div>
                <div style={{fontSize:32,marginBottom:10,color:'var(--bi-fg-4)'}}>📡</div>
                <div style={{fontSize:16,color:'var(--bi-fg-1)',fontWeight:600,marginBottom:6}}>No device communication data</div>
                <div style={{fontSize:12,color:'var(--bi-fg-3)',maxWidth:380,margin:'0 auto',lineHeight:1.5,marginBottom:14}}>Device was not connected during this session. Ask the customer to connect, reproduce the issue, and export new logs.</div>
                <span onClick={()=>setSection('overview')} className="bi-link">Back to Overview →</span>
              </div>
            </div>
          </div>;

          const rejections=logData.apdu.filter(a=>{if(!a.hex||a.dir==='in')return false;const sw=a.hex.replace(/\s/g,'').slice(-4).toLowerCase();return sw&&sw!=='9000';});
          const txCount=logData.apdu.filter(a=>a.dir!=='in').length;
          const rxCount=logData.apdu.filter(a=>a.dir==='in').length;
          const swCounts={};
          for(const a of logData.apdu){
            if(a.dir!=='in'||!a.hex)continue;
            const sw=a.hex.replace(/\s/g,'').slice(-4).toLowerCase();
            swCounts[sw]=(swCounts[sw]||0)+1;
          }
          const distinctSw=Object.keys(swCounts).length;
          const topReject=Object.entries(swCounts).filter(([sw])=>sw!=='9000').sort((a,b)=>b[1]-a[1])[0];
          const codeNames={'6985':'Rejected by user','6982':'Security status','6700':'Wrong length','6e00':'INS unsupported','5515':'Device locked','6a82':'File not found','6d00':'Bad INS','6f00':'Tech error'};

          // ── Selected frame (default to last rejection if available, else last frame) ──
          const effectiveApdu=selectedApdu!=null?logData.apdu.find(a=>a.idx===selectedApdu):(rejections[0]||logData.apdu[logData.apdu.length-1]);

          // Decode the selected frame
          const decodeFrame=(a)=>{
            if(!a||!a.hex)return null;
            const raw=a.hex.replace(/\s/g,'').toLowerCase();
            if(a.dir==='in'){
              const sw=raw.slice(-4);
              const data=raw.slice(0,-4);
              return{dir:'rx',sw,swDecode:decodeApduStatus(a.hex,'out'),data,raw,totalBytes:raw.length/2};
            }
            // TX frame
            const cla=raw.slice(0,2);
            const ins=raw.slice(2,4);
            const p1=raw.slice(4,6);
            const p2=raw.slice(6,8);
            const lc=raw.slice(8,10);
            const data=raw.slice(10);
            const insNames={'01':'GET_VERSION','02':'INIT','03':'GET_FIRMWARE_INFO','04':'GET_BATTERY','40':'GET_PUBLIC_KEY','41':'SIGN','42':'GET_APP_AND_VERSION','d2':'GET_APP_AND_VERSION','c0':'OPEN_APP','b0':'GET_APP_AND_VERSION','f0':'INSTALL'};
            const claNames={'e0':'Bitcoin/Eth app','b0':'Manager','d0':'Boot/MCU','f0':'Boot'};
            return{dir:'tx',cla,ins,p1,p2,lc,data,raw,totalBytes:raw.length/2,insName:insNames[ins.toLowerCase()]||null,claName:claNames[cla.toLowerCase()]||null};
          };
          const decoded=decodeFrame(effectiveApdu);

          // Find paired frame (tx ↔ rx)
          const pairedFrame=(()=>{
            if(!effectiveApdu||!effectiveApdu.idx)return null;
            const idx=logData.apdu.findIndex(a=>a.idx===effectiveApdu.idx);
            if(idx<0)return null;
            const offset=effectiveApdu.dir==='in'?-1:1;
            const pair=logData.apdu[idx+offset];
            return pair&&pair.dir!==effectiveApdu.dir?pair:null;
          })();

          return <div className="bi-overview" style={{padding:'12px 16px 16px',gap:10}}>

            {/* KPI tiles */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(4, 1fr)',gap:10,flexShrink:0}}>
              {[
                {l:'Frames',n:logData.apdu.length,sub:'tx '+txCount+' · rx '+rxCount,c:'var(--bi-cat-1)',fg:'#0a0a0a'},
                {l:'Rejections',n:rejections.length,sub:rejections.length>0&&topReject?`top: ${topReject[0]} — ${codeNames[topReject[0]]||'unknown'}`:'none',c:rejections.length>0?'#D94747':'var(--bi-bg-card)',fg:rejections.length>0?'#fff':'var(--bi-fg-3)',muted:rejections.length===0},
                {l:'Status words',n:distinctSw,sub:swCounts['9000']?`9000 OK · ${swCounts['9000'].toLocaleString()}×`:'none observed',c:'#F0B93E',fg:'#0a0a0a',muted:distinctSw<=1},
                {l:'Signed tx',n:logData.apdu.filter(a=>(a.hex||'').toLowerCase().includes('e004')).length,sub:'SIGN_TX commands',c:'var(--bi-cat-7)',fg:'#0a0a0a',muted:true},
              ].map((b,i)=>(
                <div key={b.l} className="bi-tile-pop" style={{'--i':i,background:b.c,color:b.fg,padding:'12px 14px',borderRadius:2,opacity:b.muted?0.45:1,border:b.muted?'1px solid var(--bi-border)':'none'}}>
                  <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between'}}>
                    <span style={{fontSize:10,fontWeight:700,letterSpacing:'0.14em',textTransform:'uppercase',opacity:0.85}}>{b.l}</span>
                    <span className="mono" style={{fontSize:28,fontWeight:700,letterSpacing:'-0.02em',lineHeight:1}}>{b.n.toLocaleString()}</span>
                  </div>
                  <div style={{fontSize:11,fontWeight:500,opacity:0.85,marginTop:4,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{b.sub}</div>
                </div>
              ))}
            </div>

            {rejections.length>0&&topReject&&<div className="bi-slide-down" style={{background:'#E88A4A12',border:'1px solid #E88A4A40',borderLeft:'3px solid #E88A4A',borderRadius:2,padding:'8px 14px',fontSize:12,color:'#F2BCBC',flexShrink:0}}>
              <strong style={{color:'#fff'}}>{rejections.length} device rejection{rejections.length>1?'s':''}.</strong> Most common: <span className="mono">{topReject[0]}</span> — {codeNames[topReject[0]]||'unknown condition'}.
            </div>}

            {/* Two-col: frame stream + decoded detail */}
            <div style={{display:'grid',gridTemplateColumns:'1.4fr 1fr',gap:10,flex:1,minHeight:0}}>

              {/* Frame stream */}
              <div className="bi-card bi-mount-up" style={{'--i':1,padding:0,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}}>
                <div className="bi-card-hd">
                  <div>
                    <div className="bi-title">Frame stream</div>
                    <div className="bi-sub">{Math.min(500,logData.apdu.length)} of {logData.apdu.length} · click for decoded view</div>
                  </div>
                  <span onClick={()=>{copyText(logData.apdu.map(a=>[a.dir.toUpperCase(),fmtTime(a.ts),a.hex||''].join('\t')).join('\n'));setApduExportCopied(true);setTimeout(()=>setApduExportCopied(false),2000);}} className="bi-link">{apduExportCopied?'✓ Copied':'Export APDUs →'}</span>
                </div>
                <div style={{flex:1,overflow:'auto',minHeight:0}}>
                  {logData.apdu.slice(0,500).map((a,i)=>{
                    const status=decodeApduStatus(a.hex,a.dir);
                    const isIn=a.dir==='in';
                    const isError=status&&!isIn&&status.label!=='OK'&&!status.label.startsWith('0x');
                    const isSelected=effectiveApdu&&effectiveApdu.idx===a.idx;
                    return <div key={i} className="bi-tr mono" onClick={()=>setSelectedApdu(a.idx)}
                      style={{'--i':Math.min(i,12),'--bi-row-pad':'14px',padding:'6px 14px',display:'flex',alignItems:'center',gap:10,fontSize:11,borderBottom:'1px solid var(--bi-border)',borderLeft:isSelected?'2px solid var(--bi-orange)':(isIn?'2px solid var(--bi-cat-1)':isError?'2px solid #D94747':'2px solid var(--bi-cat-3)'),background:isSelected?'rgba(232,90,26,0.08)':(isError?'#D9474708':'transparent')}}>
                      <span style={{fontSize:9,fontWeight:700,letterSpacing:'0.08em',color:isIn?'var(--bi-cat-1)':'var(--bi-cat-3)',minWidth:46}}>{isIn?'← RX':'→ TX'}</span>
                      <span style={{color:'var(--bi-fg-3)',fontSize:10,minWidth:72}}>{fmtTime(a.ts)}</span>
                      <span style={{minWidth:100,fontWeight:status?700:500,fontSize:status?11:10,color:status?status.color:'var(--bi-fg-3)'}}>{status?status.label:(isIn?'rx':'tx')}</span>
                      <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:isIn?'var(--bi-fg-2)':'var(--bi-fg-1)',opacity:0.85}}>{a.hex||'—'}</span>
                    </div>;
                  })}
                  {logData.apdu.length>500&&<div style={{padding:12,textAlign:'center',color:'var(--bi-fg-3)',fontSize:11}}>Showing 500 of {logData.apdu.length}</div>}
                </div>
              </div>

              {/* Decoded detail */}
              <div className="bi-card bi-slide-down" style={{padding:0,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}}>
                <div className="bi-card-hd">
                  <div>
                    <div className="bi-title">{decoded?`Frame #${effectiveApdu.idx||'—'} · decoded`:'Decoded view'}</div>
                    <div className="bi-sub">{decoded?`${decoded.dir==='tx'?'TX':'RX'} · ${decoded.totalBytes} bytes · ${effectiveApdu?fmtTime(effectiveApdu.ts):'—'}`:'click any frame to decode'}</div>
                  </div>
                  {effectiveApdu&&<span onClick={()=>copyText(effectiveApdu.hex)} className="bi-link">Copy hex →</span>}
                </div>
                {!decoded?<div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:24,fontSize:12,color:'var(--bi-fg-3)',textAlign:'center'}}>Select a frame on the left.</div>:
                <div style={{flex:1,overflow:'auto',padding:'12px 14px',display:'flex',flexDirection:'column',gap:12,minHeight:0}}>
                  {/* Raw hex */}
                  <div>
                    <div className="bi-sublabel" style={{marginBottom:4}}>Raw hex</div>
                    <pre style={{fontFamily:'var(--bi-font-mono)',fontSize:11,color:'var(--bi-fg-2)',background:'var(--bi-bg-page)',border:'1px solid var(--bi-border)',borderRadius:2,padding:'8px 10px',whiteSpace:'pre-wrap',lineHeight:1.6,margin:0,maxHeight:120,overflow:'auto'}}>{effectiveApdu.hex}</pre>
                  </div>

                  {/* Decoded fields */}
                  <div>
                    <div className="bi-sublabel" style={{marginBottom:4}}>Decoded</div>
                    <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
                      <tbody>
                        {decoded.dir==='tx'?<>
                          <tr><td style={{padding:'3px 0',color:'var(--bi-fg-3)'}}>CLA</td><td className="mono" style={{textAlign:'right',color:'var(--bi-fg-1)'}}>0x{decoded.cla.toUpperCase()}{decoded.claName?<span style={{color:'var(--bi-fg-3)',fontWeight:400,marginLeft:6}}>{decoded.claName}</span>:''}</td></tr>
                          <tr><td style={{padding:'3px 0',color:'var(--bi-fg-3)'}}>INS</td><td className="mono" style={{textAlign:'right',color:'var(--bi-fg-1)'}}>0x{decoded.ins.toUpperCase()}{decoded.insName?<span style={{color:'var(--bi-cat-3)',fontWeight:600,marginLeft:6}}>{decoded.insName}</span>:''}</td></tr>
                          <tr><td style={{padding:'3px 0',color:'var(--bi-fg-3)'}}>P1</td><td className="mono" style={{textAlign:'right',color:'var(--bi-fg-1)'}}>0x{decoded.p1.toUpperCase()}</td></tr>
                          <tr><td style={{padding:'3px 0',color:'var(--bi-fg-3)'}}>P2</td><td className="mono" style={{textAlign:'right',color:'var(--bi-fg-1)'}}>0x{decoded.p2.toUpperCase()}</td></tr>
                          {decoded.lc&&<tr><td style={{padding:'3px 0',color:'var(--bi-fg-3)'}}>Lc</td><td className="mono" style={{textAlign:'right',color:'var(--bi-fg-1)'}}>0x{decoded.lc.toUpperCase()} ({parseInt(decoded.lc,16)} bytes)</td></tr>}
                          {decoded.data&&<tr><td style={{padding:'3px 0',color:'var(--bi-fg-3)',verticalAlign:'top'}}>Data</td><td className="mono" style={{textAlign:'right',color:'var(--bi-fg-1)',fontSize:10,wordBreak:'break-all'}}>{decoded.data.length>80?decoded.data.slice(0,80)+'…':decoded.data}</td></tr>}
                        </>:<>
                          <tr><td style={{padding:'3px 0',color:'var(--bi-fg-3)'}}>Direction</td><td className="mono" style={{textAlign:'right',color:'var(--bi-cat-1)',fontWeight:600}}>RX (device → app)</td></tr>
                          {decoded.data&&<tr><td style={{padding:'3px 0',color:'var(--bi-fg-3)',verticalAlign:'top'}}>Payload</td><td className="mono" style={{textAlign:'right',color:'var(--bi-fg-1)',fontSize:10,wordBreak:'break-all'}}>{decoded.data.length>80?decoded.data.slice(0,80)+'…':decoded.data||'(empty)'}</td></tr>}
                          <tr><td style={{padding:'3px 0',color:'var(--bi-fg-3)'}}>Status word</td><td className="mono" style={{textAlign:'right',color:decoded.swDecode?.color||'var(--bi-fg-1)',fontWeight:700}}>0x{decoded.sw.toUpperCase()}{decoded.swDecode?<span style={{marginLeft:6}}>· {decoded.swDecode.label}</span>:''}</td></tr>
                        </>}
                      </tbody>
                    </table>
                  </div>

                  {/* Paired frame */}
                  {pairedFrame&&<div>
                    <div className="bi-sublabel" style={{marginBottom:4}}>Paired with {pairedFrame.dir==='in'?'reply':'command'}</div>
                    <div onClick={()=>setSelectedApdu(pairedFrame.idx)} className="bi-tr mono" style={{'--bi-row-pad':'10px',padding:'6px 10px',background:'var(--bi-bg-page)',border:'1px solid var(--bi-border)',borderRadius:2,fontSize:10,color:'var(--bi-fg-2)',display:'flex',alignItems:'center',gap:8,cursor:'pointer'}}>
                      <span style={{fontSize:9,fontWeight:700,color:pairedFrame.dir==='in'?'var(--bi-cat-1)':'var(--bi-cat-3)'}}>{pairedFrame.dir==='in'?'← RX':'→ TX'}</span>
                      <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{pairedFrame.hex}</span>
                      <span style={{color:'var(--bi-orange)'}}>open →</span>
                    </div>
                  </div>}

                  {/* Context */}
                  <div>
                    <div className="bi-sublabel" style={{marginBottom:4}}>Context</div>
                    <div style={{fontSize:11,color:'var(--bi-fg-2)',lineHeight:1.5}}>
                      {decoded.dir==='tx'?(decoded.insName?<>App sent <span className="mono" style={{color:'var(--bi-fg-1)'}}>{decoded.insName}</span> to the device.{decoded.claName?' Handled by '+decoded.claName+'.':''}</>:'App sent a command to the device.'):
                      (decoded.swDecode?.label==='OK'?'Device replied successfully.':decoded.swDecode?<>Device replied with status <span className="mono" style={{color:decoded.swDecode.color,fontWeight:600}}>{decoded.swDecode.label}</span>.</>:'Device replied.')}
                    </div>
                  </div>
                </div>}
              </div>
            </div>
          </div>;
        })()}
        {/* Raw JSON */}
        {section==='raw'&&(()=>{
          let treeData=null;
          if(logData.rawText){
            try{treeData=JSON.parse(logData.rawText);}catch{}
            if(!treeData)treeData=logData.entries;
          }

          if(!treeData)return <div className="bi-overview" style={{padding:'12px 16px',gap:10}}>
            <div className="bi-card bi-mount-up" style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',textAlign:'center',padding:40}}>
              <div>
                <div style={{fontSize:28,marginBottom:10,color:'var(--bi-fg-4)',fontFamily:'var(--bi-font-mono)'}}>{'{ }'}</div>
                <div style={{fontSize:16,color:'var(--bi-fg-1)',fontWeight:600,marginBottom:6}}>No raw data available</div>
                <div style={{fontSize:12,color:'var(--bi-fg-3)',maxWidth:380,margin:'0 auto',lineHeight:1.5}}>The uploaded file could not be parsed as JSON. Try re-exporting from Ledger Wallet → Settings → Help → Export logs.</div>
              </div>
            </div>
          </div>;

          const isArray=Array.isArray(treeData);
          const topKeys=isArray?null:Object.keys(treeData);
          const countNodes=(v,depth=0,acc={n:0,d:0})=>{
            acc.n++;if(depth>acc.d)acc.d=depth;
            if(v&&typeof v==='object'){for(const k in v){if(Object.prototype.hasOwnProperty.call(v,k))countNodes(v[k],depth+1,acc);}}
            return acc;
          };
          let stats={n:0,d:0};
          if(logData.rawText&&logData.rawText.length<5000000){stats=countNodes(treeData);}
          const fileBytes=logData.rawText?logData.rawText.length:0;
          const fileSize=fileBytes>1024*1024?(fileBytes/1024/1024).toFixed(1)+' MB':fileBytes>1024?(fileBytes/1024).toFixed(0)+' KB':fileBytes+' B';

          // Search match count (case-insensitive substring across stringified form)
          let matchCount=0;
          if(rawSearch&&rawSearch.length>=2&&logData.rawText){
            const needle=rawSearch.toLowerCase();
            const hay=logData.rawText.toLowerCase();
            let pos=0;
            while((pos=hay.indexOf(needle,pos))!==-1){matchCount++;pos+=needle.length;if(matchCount>9999)break;}
          }

          return <div className="bi-overview" style={{padding:'12px 16px 16px',gap:10}}>

            {/* KPI tiles */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(4, 1fr)',gap:10,flexShrink:0}}>
              {[
                {l:'Top-level',n:isArray?treeData.length:topKeys.length,sub:isArray?'array entries':'object keys',c:'var(--bi-cat-3)',fg:'#0a0a0a'},
                {l:'Total nodes',n:stats.n||(isArray?treeData.length:0),sub:stats.n>0?'measured':'large file — skipped',c:'var(--bi-cat-1)',fg:'#0a0a0a',muted:!stats.n},
                {l:'Max depth',n:stats.d||0,sub:stats.d>0?`level ${stats.d}`:'—',c:'var(--bi-cat-4)',fg:'#0a0a0a',muted:!stats.d},
                {l:'File size',n:fileSize,sub:(isArray?treeData.length:0).toLocaleString()+' entries',c:'var(--bi-cat-7)',fg:'#0a0a0a'},
              ].map((b,i)=>(
                <div key={b.l} className="bi-tile-pop" style={{'--i':i,background:b.c,color:b.fg,padding:'12px 14px',borderRadius:2,opacity:b.muted?0.5:1}}>
                  <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between'}}>
                    <span style={{fontSize:10,fontWeight:700,letterSpacing:'0.14em',textTransform:'uppercase',opacity:0.85}}>{b.l}</span>
                    <span className="mono" style={{fontSize:typeof b.n==='string'?22:28,fontWeight:700,letterSpacing:'-0.02em',lineHeight:1}}>{typeof b.n==='number'?b.n.toLocaleString():b.n}</span>
                  </div>
                  <div style={{fontSize:11,fontWeight:500,opacity:0.85,marginTop:4}}>{b.sub}</div>
                </div>
              ))}
            </div>

            <div className="bi-card bi-mount-up" style={{'--i':1,padding:0,flex:1,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}}>
              <div className="bi-card-hd">
                <div style={{display:'flex',alignItems:'center',gap:14,flex:1}}>
                  <div>
                    <div className="bi-title">JSON tree</div>
                    <div className="bi-sub">click values to copy path · click keys to expand</div>
                  </div>
                  <div style={{flex:1,maxWidth:340,position:'relative'}}>
                    <input value={rawSearch} onChange={e=>setRawSearch(e.target.value)} placeholder="Search keys, values, addresses…" className="mono" style={{width:'100%',padding:'5px 12px',paddingRight:rawSearch?28:12,background:'var(--bi-bg-card-alt)',border:'1px solid var(--bi-border)',borderRadius:2,color:'var(--bi-fg-1)',fontSize:11,boxSizing:'border-box',outline:'none'}}/>
                    {rawSearch&&<button onClick={()=>setRawSearch('')} style={{position:'absolute',right:6,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:'var(--bi-fg-3)',cursor:'pointer',fontSize:13,padding:2,lineHeight:1}}>✕</button>}
                  </div>
                </div>
                <span onClick={()=>{copyText(logData.rawText);}} className="bi-link">Copy raw text →</span>
              </div>
              <div style={{flex:1,overflow:'auto',padding:'10px 16px',minHeight:0}}>
                <JTTree data={treeData} searchTerm={rawSearch}/>
              </div>
              {rawSearch&&rawSearch.length>=2&&<div style={{padding:'7px 14px',borderTop:'1px solid var(--bi-border)',background:'var(--bi-bg-strip)',display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:11,color:'var(--bi-fg-2)',flexShrink:0}}>
                <span><span className="mono" style={{color:'var(--bi-orange)',fontWeight:700}}>{matchCount.toLocaleString()}{matchCount>=9999?'+':''}</span> matches for <span className="mono" style={{color:'var(--bi-fg-1)'}}>{rawSearch}</span></span>
                <span style={{color:'var(--bi-fg-3)',fontSize:10}}>{matchCount===0?'no matches in raw text':'expand nodes to navigate · matched values highlighted'}</span>
              </div>}
            </div>
          </div>;
        })()}
      </div>
      </div>}
    </div>
  {logData&&viewMode==='customer'&&<CustomerView logData={logData} appJson={appJson} onAppJson={setAppJson} liveBalances={liveBalances} liveTokenBalances={liveTokenBalances} versionCheck={versionCheck} firmwareCheck={firmwareCheck} appVersionCheck={appVersionCheck}/>}
  {logData&&viewMode==='sfyl'&&<SFYLView logData={logData} sfylTxs={sfylTxs} sfylMarked={sfylMarked} setSfylMarked={setSfylMarked} onRetry={sfylRetry} sfylTrace={sfylTrace} onTrace={sfylTraceRun} sfylCompromise={sfylCompromise} onClassify={sfylClassifyRun} sfylLegal={sfylLegal} setSfylLegal={setSfylLegal}/>}
  {guideOpen&&<div onClick={()=>setGuideOpen(null)} style={{position:'fixed',inset:0,zIndex:9999,background:'rgba(0,0,0,0.7)',display:'flex',alignItems:'center',justifyContent:'center',animation:'fadeIn 0.15s ease'}}>
    <div onClick={e=>e.stopPropagation()} style={{width:'min(900px, 90vw)',height:'85vh',background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,display:'flex',flexDirection:'column',overflow:'hidden',boxShadow:'0 24px 80px rgba(0,0,0,0.6)'}}>
      <div style={{display:'flex',alignItems:'center',padding:'12px 20px',borderBottom:`1px solid ${T.border}`,flexShrink:0,gap:12}}>
        <span style={{fontSize:14,fontWeight:700,color:T.text,flex:1}}>{guideOpen==='agent'?'Agent Guide':'Technical Reference'}</span>
        <input value={guideSearch} onChange={e=>setGuideSearch(e.target.value)} placeholder="Search..." style={{padding:'6px 12px',borderRadius:6,border:`1px solid ${T.border}`,background:T.panel,color:T.text,fontSize:12,width:200,fontFamily:"sans-serif"}}/>
        <button onClick={()=>setGuideOpen(null)} style={{width:28,height:28,borderRadius:6,border:`1px solid ${T.border}`,background:'transparent',color:T.muted,fontSize:14,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700}} onMouseEnter={e=>{e.currentTarget.style.background='rgba(228,0,70,0.15)';e.currentTarget.style.color=T.error;}} onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.color=T.muted;}}>✕</button>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'0'}}>
        {(()=>{
          const raw=guideOpen==='agent'?GUIDE_AGENT:GUIDE_TECHNICAL;
          let html=raw;
          if(guideSearch.length>=2){const esc=guideSearch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const re=new RegExp(`(${esc})`,'gi');html=html.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,text)=>{if(tag)return tag;return text.replace(re,'<mark style="background:rgba(187,176,255,0.35);color:#fff;padding:1px 2px;border-radius:2px">$1</mark>');});}
          return <div className="guide-embed" dangerouslySetInnerHTML={{__html:html}}/>;
        })()}
      </div>
    </div>
  </div>}
  </div>

}

class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={hasError:false,error:null,errorInfo:null};}
  static getDerivedStateFromError(error){return{hasError:true,error};}
  componentDidCatch(error,errorInfo){
    this.setState({errorInfo});
    console.error('ErrorBoundary caught:',error,errorInfo);
  }
  render(){
    if(this.state.hasError){
      const errMsg=this.state.error?.message||'Unknown error';
      const stack=this.state.error?.stack||'';
      const componentStack=this.state.errorInfo?.componentStack||'';
      const fullReport=`Error: ${errMsg}\n\nStack:\n${stack}\n\nComponent Stack:\n${componentStack}`;
      return<div style={{minHeight:'100vh',background:'#1A1A1D',color:'#FFFFFF',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Inter,sans-serif',textAlign:'center',padding:24}}>
        <div style={{maxWidth:600}}>
          <div style={{fontSize:24,marginBottom:12}}>⚠️</div>
          <div style={{fontSize:16,fontWeight:600,marginBottom:8}}>Something went wrong</div>
          <div style={{fontSize:13,color:'#949494',marginBottom:16}}>Copy the error details below and share them so we can fix this.</div>
          <div style={{background:'#242528',border:'1px solid rgba(255,255,255,0.06)',borderRadius:8,padding:16,textAlign:'left',marginBottom:16,maxHeight:200,overflowY:'auto'}}>
            <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:'#E40046',lineHeight:1.6,wordBreak:'break-word',whiteSpace:'pre-wrap'}}>{errMsg}</div>
            {componentStack&&<div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:'#949494',lineHeight:1.5,marginTop:8,wordBreak:'break-word',whiteSpace:'pre-wrap'}}>{componentStack.trim().split('\n').slice(0,8).join('\n')}</div>}
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'center'}}>
            <button onClick={()=>{try{navigator.clipboard.writeText(fullReport);}catch{}}} style={{padding:'8px 20px',borderRadius:6,border:'1px solid rgba(255,255,255,0.06)',background:'#242528',color:'#BBB0FF',fontWeight:600,fontSize:13,cursor:'pointer'}}>Copy Error</button>
            <button onClick={()=>window.location.reload()} style={{padding:'8px 20px',borderRadius:6,border:'none',background:'#BBB0FF',color:'#000',fontWeight:600,fontSize:13,cursor:'pointer'}}>Reload</button>
          </div>
        </div>
      </div>;
    }
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
