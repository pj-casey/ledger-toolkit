              :logToks.map((tk,ti)=>{

              })}
            </div>}
            {enriched&&displayOps.length>0&&(()=>{
              const groups={};
              displayOps.forEach((op,oi)=>{
                const dk=op.date?op.date.slice(0,10):'Unknown';

              const renderOp=({op,oi})=>{
                const opType=(op.type||'').toUpperCase();
                const ds=txDirStyle(opType);
                const isIn=opType==='IN'||opType==='REWARD'||opType==='CLAIM_REWARD'||opType==='NFT_IN';
                const amtColor=isIn?'#4FC46B':opType==='OUT'||opType==='FEES'?'#EA4335':'#FFFFFF';
                const sign=isIn?'+':opType==='OUT'||opType==='FEES'?'-':'';

                const txUrl=op.hash&&TX_EXPLORERS[acct.cid]?TX_EXPLORERS[acct.cid](op.hash):null;
                const isFailed=op.hasFailed||op.extra?.failed||(opType.includes('FAILED'));
                const opDateStr=op.date?op.date.slice(0,10):null;
                const opRate=opDateStr?cvRateOnDate(appJson,acct.cid,opDateStr):null;
                const opDec=DECIMALS[acct.cid]||18;
                const opHuman=op.value!=null?parseFloat(op.value)/Math.pow(10,opDec):null;
                const opFiat=opHuman!=null&&opRate!=null?opHuman*opRate:null;
                const opFiatStr=opFiat!=null?sign+cvFmtFiat(opFiat,appJson):null;
                const opLabel=OP_LABELS[opType]||opType;
                const opTime=op.date?fmtTime(op.date).slice(0,5):'';
                const amtStr=opHuman!=null?sign+opHuman.toLocaleString(undefined,{maximumFractionDigits:8})+' '+ch.ticker:null;
                return <div key={oi} style={{display:'grid',gridTemplateColumns:'40px 1fr auto',alignItems:'start',gap:8,padding:'10px 0',borderBottom:'1px solid rgba(255,255,255,0.04)',background:isFailed?'rgba(234,67,53,0.03)':'transparent',borderLeft:isFailed?'2px solid rgba(234,67,53,0.4)':'2px solid transparent',paddingLeft:isFailed?8:0}}>
                  <div style={{width:32,height:32,borderRadius:'50%',background:ds.bg,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:2}}>
                    <span style={{fontSize:13,fontWeight:700,color:ds.color}}>{ds.arrow}</span>

                  <div style={{minWidth:0}}>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      <span style={{fontSize:13,fontWeight:600,color:'#FFFFFF'}}>{opLabel}</span>
                      {isFailed&&<span style={{fontSize:9,padding:'1px 5px',borderRadius:3,background:'rgba(234,67,53,0.2)',color:'#EA4335',fontWeight:700}}>FAILED</span>}
                    </div>
                    <div style={{fontSize:11,color:'#8A8A8E',marginTop:2}}>{opTime}{op.fee&&fmtBal(op.fee,acct.cid,null)?' · Fee: '+fmtBal(op.fee,acct.cid,null):''}</div>
                    {counterparty&&<div style={{fontSize:11,color:'#8A8A8E',fontFamily:MF,marginTop:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:300}}>
                      {txUrl?<a href={txUrl} target="_blank" rel="noopener noreferrer" style={{color:'#8A8A8E',textDecoration:'none'}}>{trunc(counterparty,32)}</a>:<CVCopyText text={trunc(counterparty,32)} full={counterparty} mono={true}/>}
                    </div>}

                  <div style={{textAlign:'right',flexShrink:0,minWidth:120}}>
                    {amtStr&&<div style={{fontSize:13,fontWeight:600,color:amtColor,fontFamily:MF}}>{amtStr}</div>}
                    {opFiatStr&&<div style={{fontSize:11,color:amtColor==='#4FC46B'?'rgba(79,196,107,0.6)':amtColor==='#EA4335'?'rgba(234,67,53,0.6)':'#8A8A8E',marginTop:1}}>{opFiatStr}</div>}
                    {!amtStr&&<div style={{fontSize:12,color:'#8A8A8E'}}>—</div>}
                  </div>
                </div>;
              };
              return <div style={{padding:'16px 32px'}}>
                <div style={{fontSize:11,fontWeight:600,color:'#8A8A8E',letterSpacing:'0.06em',marginBottom:12}}>Latest Operations ({acct.ajOps})</div>
                {acct.ajPendingOps&&acct.ajPendingOps.length>0&&<div style={{marginBottom:12}}>
                  <div style={{fontSize:11,fontWeight:600,color:T.warning,letterSpacing:'0.06em',marginBottom:8}}>⏳ Pending ({acct.ajPendingOps.length})</div>
                  {acct.ajPendingOps.map((op,pi)=>{
                    const opType=(op.type||'').toUpperCase();
                    const opLabel=OP_LABELS[opType]||opType;
                    return <div key={'pending-'+pi} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 10px',borderBottom:'1px solid rgba(255,189,66,0.15)',background:'rgba(255,189,66,0.04)',borderLeft:'2px solid rgba(255,189,66,0.4)',marginBottom:2}}>
                      <div style={{width:28,height:28,borderRadius:'50%',background:'rgba(255,189,66,0.15)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                        <span style={{fontSize:13,fontWeight:700,color:T.warning}}>⏳</span>
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:'flex',alignItems:'center',gap:6}}>
                          <span style={{fontSize:13,fontWeight:500,color:T.warning}}>{fmtBal(op.value,acct.cid,ch.ticker)||'—'}</span>
                          <span style={{fontSize:9,padding:'1px 5px',borderRadius:3,background:'rgba(255,189,66,0.2)',color:T.warning,fontWeight:700}}>PENDING</span>
                        </div>
                        <div style={{fontSize:11,color:'#8A8A8E',marginTop:2}}>{opLabel} · {fmtDate(op.date)} {fmtTime(op.date)}</div>
                      </div>
                      {op.hash&&<span style={{fontSize:11,color:'#8A8A8E',fontFamily:MF}}><CVCopyText text={trunc(op.hash,10)} full={op.hash} mono={true}/></span>}
                    </div>;
                  })}
                </div>}
                {ajOps.length>50&&<div style={{fontSize:11,color:'#8A8A8E',marginBottom:8}}>Showing 50 of {ajOps.length}</div>}
                {Object.entries(groups).map(([dk,ops])=>(
                  <div key={dk}>
                    <div style={{fontSize:12,fontWeight:600,color:'#FFFFFF',padding:'12px 0 6px',borderBottom:'1px solid rgba(255,255,255,0.06)',marginBottom:4}}>
                      {dk!=='Unknown'?new Date(dk+'T12:00:00').toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'numeric'}):dk}
                    </div>
                    {ops.map(renderOp)}
                  </div>
                ))}
              </div>;
            })()}
            {enriched&&acct.ajSwapHistory&&acct.ajSwapHistory.length>0&&<div style={{padding:'16px 32px',borderTop:'1px solid rgba(255,255,255,0.06)'}}>
              <div style={{fontSize:11,fontWeight:600,color:'#8A8A8E',letterSpacing:'0.06em',marginBottom:12}}>Swap History ({acct.ajSwapHistory.length})</div>
              {acct.ajSwapHistory.map((sw,si)=>(
                <div key={si} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',borderBottom:si<acct.ajSwapHistory.length-1?'1px solid rgba(255,255,255,0.04)':'none'}}>
                  <div style={{width:28,height:28,borderRadius:'50%',background:'rgba(187,176,255,0.12)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    <span style={{fontSize:12,color:'#BBB0FF'}}>⇄</span>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,color:'#FFFFFF'}}>{sw.provider||'Unknown'}</div>
                    <div style={{fontSize:11,color:'#8A8A8E'}}>{sw.status||'—'}{sw.swapId?' · ID: '+sw.swapId.slice(0,12):''}</div>
                  </div>
                  <SwapStatusCheck sw={sw}/>
                </div>
              ))}
            </div>}
            {acctErrs.length>0&&<div style={{padding:'16px 32px'}}>
              <div style={{fontSize:11,fontWeight:600,color:'#EA4335',letterSpacing:'0.06em',marginBottom:8}}>Related Issues ({acctErrs.length})</div>
              {acctErrs.map((err,i)=><div key={i} style={{fontSize:12,color:'#EA4335',padding:'6px 0',borderBottom:i<acctErrs.length-1?'1px solid rgba(234,67,53,0.1)':'none'}}>{err.dg?.t||err.msg||'Unknown error'}</div>)}
            </div>}
          </div>;
        })()
      )}
      {cvSection==='portfolio'&&<CVPortfolio enrichedAccts={enrichedAccts} liveBalances={liveBalances} onSelectAcct={idx=>{setSelectedAcct(idx);setCvSection('accounts');}} setCvSection={setCvSection} appJson={appJson}/>}
      {cvSection==='earn'&&<CVEarn enrichedAccts={enrichedAccts} appJson={appJson} onSelectAcct={idx=>{setSelectedAcct(idx);setCvSection('accounts');}}/>}
      {cvSection==='myLedger'&&<CVMyLedger logData={logData} appJson={appJson} versionCheck={versionCheck} firmwareCheck={firmwareCheck} appVersionCheck={appVersionCheck}/>}
      {cvSection==='agentInsights'&&<CVAgentInsights

        versionCheck={versionCheck} firmwareCheck={firmwareCheck} appVersionCheck={appVersionCheck}
        appJson={appJson}
        onViewAccount={idx=>{setSelectedAcct(idx);setCvSection('accounts');}}
        onViewPortfolio={()=>setCvSection('portfolio')}
        onViewMyLedger={()=>setCvSection('myLedger')}
      />}
    </div>
  </div>;
}

/* ═══ MAIN APP ═══ */
const TABS=['Overview','Timeline','Accounts','Errors','Network'];

function JTNode({keyName,value,path,depth,expanded,onToggle,searchTerm,onCopyPath,matchPaths,currentMatchIndex}){
  const type=value===null?'null':Array.isArray(value)?'array':typeof value;
  const isExpandable=type==='object'||type==='array';
  const isExpanded=isExpandable&&expanded.has(path);
  const entries=isExpandable?(type==='array'?value.map((v,i)=>[String(i),v]):Object.entries(value)):[];
  const matchesSearch=searchTerm&&(
    (keyName&&String(keyName).toLowerCase().includes(searchTerm))||
    (!isExpandable&&String(value).toLowerCase().includes(searchTerm))
  );
  const matchIndex=matchPaths?matchPaths.indexOf(path):-1;
  const isCurrentMatch=matchIndex>=0&&matchIndex===currentMatchIndex;
  const renderValue=()=>{
    if(value===null)return<span style={{color:T.muted,fontStyle:'italic'}}>null</span>;
    if(type==='boolean')return<span style={{color:T.error}}>{String(value)}</span>;
    if(type==='number')return<span style={{color:T.warning}}>{String(value)}</span>;
    if(type==='string'){const display=value.length>120?value.slice(0,120)+'…':value;return<span style={{color:T.success}}>"{display}"</span>;}
    return null;
  };
  const badge=isExpandable&&!isExpanded?<span style={{color:T.muted,fontSize:11,marginLeft:4}}>{type==='array'?`[${value.length} items]`:`{${Object.keys(value).length} keys}`}</span>:null;
  const openBracket=isExpandable&&isExpanded?<span style={{color:T.muted}}>{type==='array'?'[':'{'}</span>:null;
  const closeBracket=isExpandable&&isExpanded?<div style={{paddingLeft:depth>0?20:0}}><span style={{color:T.muted}}>{type==='array'?']':'}'}</span></div>:null;
  const[hovered,setHovered]=useState(false);
  return<div>
    <div className="jt-row" id={matchIndex>=0?'jt-match-'+matchIndex:undefined}
      style={{paddingLeft:depth*20,background:isCurrentMatch?'rgba(187,176,255,0.25)':matchesSearch?'rgba(187,176,255,0.08)':'transparent',borderLeft:isCurrentMatch?'2px solid #BBB0FF':'2px solid transparent',transition:I.fast}}
      onMouseEnter={()=>setHovered(true)} onMouseLeave={()=>setHovered(false)}>
      {isExpandable
        ?<span className="jt-arrow" onClick={()=>onToggle(path)} style={{cursor:'pointer',userSelect:'none',color:T.muted,display:'inline-block',width:16,textAlign:'center',transition:I.fast,transform:isExpanded?'rotate(90deg)':'none'}}>▶</span>
        :<span style={{display:'inline-block',width:16}}/>
      }
      {keyName!==null&&(()=>{const isIndex=/^\d+$/.test(keyName);return<><span style={{color:isIndex?T.muted:T.primary}}>{isIndex?keyName:`"${keyName}"`}</span><span style={{color:T.muted}}>: </span></>;})()}
      {isExpandable?(isExpanded?openBracket:badge):renderValue()}
      {hovered&&path&&<>
        <span className="jt-copy-path" onClick={e=>{e.stopPropagation();onCopyPath(path);}} title={`Copy path: ${path}`}>📋</span>
        <span className="jt-copy-path" onClick={e=>{e.stopPropagation();try{navigator.clipboard.writeText(isExpandable?JSON.stringify(value,null,2):String(value??''));}catch{}}} title="Copy value" style={{fontSize:11}}>⎘</span>
      </>}
    </div>
    {isExpanded&&(()=>{
      const capped=entries.length>500;
      const display=capped?entries.slice(0,500):entries;
      return<>
        {display.map(([k,v],i)=>(
          <JTNode key={k+i} keyName={k} value={v}
            path={type==='array'?`${path}[${k}]`:`${path}.${k}`}
            depth={depth+1} expanded={expanded} onToggle={onToggle}
            searchTerm={searchTerm} onCopyPath={onCopyPath}
            matchPaths={matchPaths} currentMatchIndex={currentMatchIndex}/>
        ))}
        {capped&&<div style={{paddingLeft:(depth+1)*20+16,color:T.muted,fontSize:11,fontStyle:'italic',padding:'4px 12px 4px '+(((depth+1)*20)+16)+'px'}}>… and {entries.length-500} more items</div>}
      </>;
    })()}
    {closeBracket}
  </div>;
}

function JTTree({data}){
  const[expanded,setExpanded]=useState(()=>new Set());
  const[search,setSearch]=useState('');
  const[copiedPath,setCopiedPath]=useState('');
  const[matchPaths,setMatchPaths]=useState([]);
  const[currentMatch,setCurrentMatch]=useState(0);
  const scrollContainerRef=useRef(null);
  const searchLower=search.toLowerCase();
  const toggle=useCallback(path=>{
    setExpanded(prev=>{const next=new Set(prev);if(next.has(path))next.delete(path);else next.add(path);return next;});
  },[]);
  const expandToLevel=useCallback((maxDepth)=>{
    const paths=new Set();
    const walk=(val,path,depth)=>{
      if(depth>=maxDepth)return;
      if(val===null||typeof val!=='object')return;
      paths.add(path);
      if(Array.isArray(val)){val.forEach((v,i)=>walk(v,`${path}[${i}]`,depth+1));}
      else{Object.entries(val).forEach(([k,v])=>walk(v,`${path}.${k}`,depth+1));}
    };
    walk(data,'$',0);
    setExpanded(paths);
  },[data]);
  const collapseAll=useCallback(()=>setExpanded(new Set()),[]);
  const expandAll=useCallback(()=>expandToLevel(20),[expandToLevel]);
  const handleCopyPath=useCallback(path=>{
    const clean=path.replace(/^\$\.?/,'').replace(/^\$/,'');
    copyText(clean||'(root)');
    setCopiedPath(path);
    setTimeout(()=>setCopiedPath(''),1500);
  },[]);
  const goNextMatch=useCallback(()=>{
    if(matchPaths.length===0)return;
    setCurrentMatch(i=>(i+1)%matchPaths.length);
  },[matchPaths]);
  const goPrevMatch=useCallback(()=>{
    if(matchPaths.length===0)return;
    setCurrentMatch(i=>(i-1+matchPaths.length)%matchPaths.length);
  },[matchPaths]);
  useEffect(()=>{
    if(!searchLower){setMatchPaths([]);setCurrentMatch(0);return;}
    const paths=[];
    const walk=(val,key,path)=>{
      if(paths.length>=200)return;
      const keyMatch=key&&String(key).toLowerCase().includes(searchLower);
      const valMatch=(val===null||typeof val!=='object')&&String(val).toLowerCase().includes(searchLower);
      if(keyMatch||valMatch)paths.push(path);
      if(val!==null&&typeof val==='object'){
        if(Array.isArray(val)){val.forEach((v,i)=>walk(v,String(i),`${path}[${i}]`));}
        else{Object.entries(val).forEach(([k,v])=>walk(v,k,`${path}.${k}`));}
      }
    };
    walk(data,null,'$');
    setMatchPaths(paths);
    setCurrentMatch(0);
    if(paths.length>0){
      const toExpand=new Set();
      for(const p of paths){
        let current='';
        const parts=p.match(/[^.\[\]]+|\[\d+\]/g)||[];
        for(let i=0;i<parts.length-1;i++){
          const part=parts[i];
          if(part.startsWith('[')){current=current+part;}
          else{current=current?current+'.'+part:'$';}
          toExpand.add(current);
        }
        toExpand.add('$');
      }
      setExpanded(toExpand);
    }
  },[searchLower,data]);
  useEffect(()=>{
    if(matchPaths.length===0)return;
    const timer=setTimeout(()=>{
      const el=document.getElementById('jt-match-'+currentMatch);
      if(el&&scrollContainerRef.current){el.scrollIntoView({behavior:'smooth',block:'center'});}
    },50);
    return()=>clearTimeout(timer);
  },[currentMatch,matchPaths]);
  return<div>
    <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
      <div style={{position:'relative',flex:'1 1 200px',maxWidth:320}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search keys and values..." className="mono"
          style={{width:'100%',padding:'8px 12px',background:T.bg,border:`1px solid ${T.border}`,borderRadius:6,color:T.text,fontSize:12,boxSizing:'border-box',paddingRight:matchPaths.length>0?100:search?80:12}}
          onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();if(e.shiftKey)goPrevMatch();else goNextMatch();}}}/>
        {search&&matchPaths.length>0&&(
          <span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',display:'flex',alignItems:'center',gap:4}}>
            <span style={{fontSize:10,color:T.success}}>{currentMatch+1}/{matchPaths.length}{matchPaths.length>=200?'+':''}</span>
            <button onClick={e=>{e.preventDefault();goPrevMatch();}} style={{background:'transparent',border:'none',color:T.muted,cursor:'pointer',padding:'0 2px',fontSize:12,lineHeight:1}}>▲</button>
            <button onClick={e=>{e.preventDefault();goNextMatch();}} style={{background:'transparent',border:'none',color:T.muted,cursor:'pointer',padding:'0 2px',fontSize:12,lineHeight:1}}>▼</button>
          </span>
        )}
        {search&&matchPaths.length===0&&(
          <span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',fontSize:10,color:T.muted}}>0 matches</span>
        )}
      </div>
      <div style={{display:'flex',gap:4}}>
        <button onClick={collapseAll} style={{padding:'6px 10px',borderRadius:6,border:`1px solid ${T.border}`,background:'transparent',color:T.muted,fontSize:10,fontWeight:600,cursor:'pointer'}} onMouseEnter={e=>{e.currentTarget.style.borderColor=T.primary;e.currentTarget.style.color=T.primary;}} onMouseLeave={e=>{e.currentTarget.style.borderColor=T.border;e.currentTarget.style.color=T.muted;}}>Collapse</button>
        <button onClick={()=>expandToLevel(1)} style={{padding:'6px 10px',borderRadius:6,border:`1px solid ${T.border}`,background:'transparent',color:T.muted,fontSize:10,fontWeight:600,cursor:'pointer'}} onMouseEnter={e=>{e.currentTarget.style.borderColor=T.primary;e.currentTarget.style.color=T.primary;}} onMouseLeave={e=>{e.currentTarget.style.borderColor=T.border;e.currentTarget.style.color=T.muted;}}>Level 1</button>
        <button onClick={()=>expandToLevel(2)} style={{padding:'6px 10px',borderRadius:6,border:`1px solid ${T.border}`,background:'transparent',color:T.muted,fontSize:10,fontWeight:600,cursor:'pointer'}} onMouseEnter={e=>{e.currentTarget.style.borderColor=T.primary;e.currentTarget.style.color=T.primary;}} onMouseLeave={e=>{e.currentTarget.style.borderColor=T.border;e.currentTarget.style.color=T.muted;}}>Level 2</button>
        <button onClick={()=>expandToLevel(3)} style={{padding:'6px 10px',borderRadius:6,border:`1px solid ${T.border}`,background:'transparent',color:T.muted,fontSize:10,fontWeight:600,cursor:'pointer'}} onMouseEnter={e=>{e.currentTarget.style.borderColor=T.primary;e.currentTarget.style.color=T.primary;}} onMouseLeave={e=>{e.currentTarget.style.borderColor=T.border;e.currentTarget.style.color=T.muted;}}>Level 3</button>
        <button onClick={expandAll} style={{padding:'6px 10px',borderRadius:6,border:`1px solid ${T.border}`,background:'transparent',color:T.muted,fontSize:10,fontWeight:600,cursor:'pointer'}} onMouseEnter={e=>{e.currentTarget.style.borderColor=T.primary;e.currentTarget.style.color=T.primary;}} onMouseLeave={e=>{e.currentTarget.style.borderColor=T.border;e.currentTarget.style.color=T.muted;}}>All</button>
      </div>
      {copiedPath&&<span style={{fontSize:10,color:T.success,fontWeight:600}}>Path copied!</span>}
    </div>
    <div style={{background:T.panel,border:`1px solid ${T.border}`,borderRadius:8,overflow:'hidden'}}>
      <div ref={scrollContainerRef} style={{maxHeight:'75vh',overflowY:'auto',overflowX:'auto',padding:'12px 0'}}>
        <div className="mono" style={{fontSize:12,lineHeight:1.7}}>
          <JTNode keyName={null} value={data} path="$" depth={0} expanded={expanded} onToggle={toggle} searchTerm={searchLower} onCopyPath={handleCopyPath} matchPaths={matchPaths} currentMatchIndex={currentMatch}/>
        </div>
      </div>
    </div>
  </div>;
}

function buildDeviceAppsLines(logData, isFull) {
  const req = logData?.requiredApps;
  if (!req || !req.length) return [];
  const da = logData.deviceApps;
  const lines = [];
  if (da?.source === 'manager-result') {
    lines.push(`DEVICE APPS (${req.length} required)`);
    for (const r of req) {
      const inst = da.installed.find(i => i.name.toLowerCase() === r.appName.toLowerCase());
      const pad = r.appName.padEnd(16);
      if (!inst) {
        lines.push(`  ${pad}  —         ✕ not installed`);
      } else if (inst.updated) {
        lines.push(`  ${pad}  ${(inst.version||'').padEnd(10)}  ✓ up to date`);
      } else {
        lines.push(`  ${pad}  ${(inst.version||'').padEnd(10)}  ⚠ outdated (${inst.availableVersion} available)`);
      }
    }
    if (isFull) {
      const rn = new Set(req.map(r => r.appName.toLowerCase()));
      const others = da.installed.filter(i => !rn.has(i.name.toLowerCase()));
      if (others.length > 0) lines.push(`  Other on device: ${others.map(a => `${a.name} ${a.version}`).join(', ')}`);
    }
    if(da.installed.length>0)lines.push(`  ${da.installed.length} apps installed`);
  } else if (da?.source === 'apdu-only') {
    lines.push(`DEVICE APPS (${req.length} required)`);
    for (const r of req) {
      const found = da.openedApps.find(a => a.name.toLowerCase() === r.appName.toLowerCase());
      const pad = r.appName.padEnd(16);
      lines.push(found
        ? `  ${pad}  ${(found.version||'').padEnd(10)}  (detected)`
        : `  ${pad}  —         not detected`);
    }
    lines.push('  Note: Only apps open during session were detected. Full data requires My Ledger.');
  } else if (da?.source === 'catalog-only') {
    const cat=da.appCatalog||{};
    const si=da.sessionInstalls||[];
    lines.push(`DEVICE APPS (${req.length} required — catalog data)`);
    for (const r of req) {
      const catEntry=cat[r.appName.toLowerCase()];
      const sessInst=si.find(s=>s.name.toLowerCase()===r.appName.toLowerCase());
      const pad=r.appName.padEnd(16);
      if(sessInst){
        lines.push(`  ${pad}  ${(sessInst.version||'').padEnd(10)}  ✓ installed this session`);
      } else if(catEntry){
        lines.push(`  ${pad}  ${('latest '+catEntry.version).padEnd(10)}  (available)`);
      } else {
        lines.push(`  ${pad}  —         required`);
      }
    }
    const extraInstalls=si.filter(s=>!req.find(r=>r.appName.toLowerCase()===s.name.toLowerCase()));
    if(extraInstalls.length>0)lines.push(`  Also installed: ${extraInstalls.map(s=>`${s.name} v${s.version}`).join(', ')}`);
  } else {
    lines.push(`DEVICE APPS (${req.length} required — none detected, device not connected)`);
    lines.push(`  ${req.map(r => r.appName).join(', ')}`);
  }
  lines.push('');
  return lines;
}

function fmtAcctLine(a,short,liveBalances,isMobile){
  const addr=short?(a.addr.length>20?a.addr.slice(0,20)+'...':a.addr):(a.addr.length>30?a.addr.slice(0,16)+'...'+a.addr.slice(-8):a.addr);
  const lb=liveBalances?liveBalances[a.id]:null;
  const balStr=lb&&lb.status==='ok'&&lb.bal!=null&&lb.bal>0
    ?`${lb.bal.toLocaleString('en-US',{maximumFractionDigits:6})} ${a.ch.ticker}${lb.fiat!=null?' ('+fmtFiat(lb.fiat)+')':''}`
    :null;
  const opsStr=!isMobile&&a.ops>0?`${a.ops} ops`:null;
  return '  '+[a.ch.name,balStr,opsStr,addr].filter(Boolean).join(' — ');
}

const dropItemStyle={display:'block',width:'100%',padding:'8px 12px 8px 15px',background:'none',border:'none',borderBottom:'1px solid rgba(255,255,255,0.06)',borderLeft:'3px solid transparent',color:'#FFFFFF',cursor:'pointer',textAlign:'left',fontSize:12,transition:I.fast};
function buildIncidentLines(logData,ledgerStatus){
  if(!ledgerStatus?.incidents||!logData.entries.length)return[];
  const sessionStart=new Date(logData.entries[0]?.timestamp).getTime();
  const sessionEnd=new Date(logData.entries[logData.entries.length-1]?.timestamp).getTime();
  if(!sessionStart||!sessionEnd)return[];
  const overlapping=ledgerStatus.incidents.filter(inc=>{
    const s=new Date(inc.created_at).getTime();
    const e=inc.resolved_at?new Date(inc.resolved_at).getTime():Date.now();
    return s<=sessionEnd&&e>=sessionStart;
  });
  if(!overlapping.length)return[];
  return['⚠ INCIDENTS DURING SESSION:',...overlapping.map(inc=>`  ${inc.name} (${inc.impact}) — ${inc.resolved_at?'resolved '+new Date(inc.resolved_at).toLocaleString():inc.status}`),''];
}
function worstAspectRatio(row,rowValue,sideLength,totalValue,container){
  const area=(container.w*container.h)*(rowValue/totalValue);
  const rowThickness=area/sideLength;
  let worst=0;
  for(const item of row){const itemLength=sideLength*(item.value/rowValue);const ratio=Math.max(itemLength/rowThickness,rowThickness/itemLength);worst=Math.max(worst,ratio);}
  return worst;
}
function squarify(items,container){
  const totalValue=items.reduce((s,item)=>s+item.value,0);
  if(totalValue===0||items.length===0)return[];
  const rects=[];let remaining=[...items];let currentContainer={...container};
  while(remaining.length>0){
    const isWide=currentContainer.w>=currentContainer.h;
    const sideLength=isWide?currentContainer.h:currentContainer.w;
    const remainingValue=remaining.reduce((s,item)=>s+item.value,0);
    let row=[remaining[0]];let rowValue=remaining[0].value;
    for(let i=1;i<remaining.length;i++){
      const testRow=[...row,remaining[i]];const testValue=rowValue+remaining[i].value;
      if(worstAspectRatio(testRow,testValue,sideLength,remainingValue,currentContainer)<=worstAspectRatio(row,rowValue,sideLength,remainingValue,currentContainer)){row=testRow;rowValue=testValue;}
      else break;
    }
    const rowFraction=rowValue/remainingValue;
    const rowThickness=isWide?currentContainer.w*rowFraction:currentContainer.h*rowFraction;
    let offset=0;
    for(const item of row){
      const itemFraction=item.value/rowValue;const itemLength=sideLength*itemFraction;
      if(isWide){rects.push({...item,x:currentContainer.x,y:currentContainer.y+offset,w:rowThickness,h:itemLength});}
      else{rects.push({...item,x:currentContainer.x+offset,y:currentContainer.y,w:itemLength,h:rowThickness});}
      offset+=itemLength;
    }
    if(isWide){currentContainer.x+=rowThickness;currentContainer.w-=rowThickness;}
    else{currentContainer.y+=rowThickness;currentContainer.h-=rowThickness;}
    remaining=remaining.slice(row.length);
  }
  return rects;
}
function buildSummaryText(logData,liveBalances,ledgerStatus,versionCheck,firmwareCheck,appVersionCheck){

    '','SESSION ACTIVITY',

    '=================================',
  ].filter(l=>l!==undefined).join('\n');
}
function buildFullText(logData,liveBalances,ledgerStatus,versionCheck,firmwareCheck,appVersionCheck){

function buildCustomerText(logData,liveBalances){

function buildErrorText(logData){
  const errs=logData.errs;
  if(errs.length===0)return '=== Error Summary ===\n\nNo errors detected.\n===================';
  const lines=['=== Error Summary ===',''];
  for(const e of errs){
    const dg=diagnose(e.raw);
    lines.push(`[${(dg.s||'?').toUpperCase()}] ${dg.t}`);
    lines.push(`  Action: ${llText(dg.a,logData.dev)}`);
    lines.push(`  Category: ${dg.c} · Entry #${e.li} · ${fmtTime(e.ts)}`);

// ── Motion helpers (DESIGN.md §7). Every one respects prefers-reduced-motion. ──
const prefersReducedMotion=()=>{try{return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);}catch{return false;}};
// Count-up: eases a displayed number from its previous value to `target` over `dur` ms
// (easeOutCubic ≈ brand ease), re-firing whenever `target` changes. No animation on first mount
// or when value is unchanged; jumps straight to the final value under reduced motion.
const useCountUp=(target,{dur=400,fmt=(v=>String(Math.round(v)))}={})=>{
  const[val,setVal]=useState(target||0);
  const fromRef=useRef(target||0);
  const rafRef=useRef(0);
  useEffect(()=>{
    const to=target||0;
    if(prefersReducedMotion()||dur<=0){fromRef.current=to;setVal(to);return;}
    const from=fromRef.current;
    if(from===to){setVal(to);return;}
    const t0=performance.now();
    cancelAnimationFrame(rafRef.current);
    const tick=now=>{
      const p=Math.min(1,(now-t0)/dur);
      const e=1-Math.pow(1-p,3);
      setVal(from+(to-from)*e);
      if(p<1)rafRef.current=requestAnimationFrame(tick);
      else fromRef.current=to;
    };
    rafRef.current=requestAnimationFrame(tick);
    return()=>cancelAnimationFrame(rafRef.current);
  },[target,dur]);
  return fmt(val);
};
// Component wrapper so count-up can be dropped into the Overview IIFE (which can't call hooks directly).
const CountUp=({value,dur=400,fmt,className,style})=>{const txt=useCountUp(value,{dur,fmt});return <span className={className} style={style}>{txt}</span>;};
// One-shot neutral settle: true for ~one cycle when status flips loading→ok
// (suppressed under reduced motion). opts.slow → 700ms arrival flash (.bi-settle-slow);
// default 420ms stays for interaction feedback. opts.group → batch through a
// useSettleBatch controller so >5 near-simultaneous arrivals become ONE group flash
// instead of a strobe (Q2). Nothing flashes on first paint (prev must be 'loading').
const useSettleFlash=(status,opts={})=>{
  const {slow=false,group=null}=opts;
  const prev=useRef(status);
  const[flash,setFlash]=useState(false);
  const mounted=useRef(true);
  useEffect(()=>()=>{mounted.current=false;},[]);
  useEffect(()=>{
    if(prev.current==='loading'&&status==='ok'&&!prefersReducedMotion()){
      prev.current=status;
      const dur=slow?700:420;
      const fire=()=>{if(!mounted.current)return;setFlash(true);setTimeout(()=>{if(mounted.current)setFlash(false);},dur);};
      if(group&&group.report)group.report(fire);   // defer to the batch coordinator
      else fire();
      return;
    }
    prev.current=status;
  },[status]);
  return flash;
};
// Q2 batching coordinator. A container calls this and passes the returned object to
// each child's useSettleFlash({group}). Collects every arrival flash in a 300ms
// window from the first report: >5 ⇒ suppress per-cell flashes and flash the
// container ONCE; ≤5 ⇒ let each cell flash itself.
const useSettleBatch=containerRef=>{
  const st=useRef({pending:[],timer:null});
  const flush=useCallback(()=>{
    const pending=st.current.pending;st.current.pending=[];st.current.timer=null;
    if(pending.length>5){
      const el=containerRef.current;
      if(el){el.classList.remove('bi-settle-slow');void el.offsetWidth;el.classList.add('bi-settle-slow');
        el.addEventListener('animationend',()=>el.classList.remove('bi-settle-slow'),{once:true});}
    }else{pending.forEach(fn=>{try{fn();}catch(e){}});}
  },[containerRef]);
  const report=useCallback(fn=>{
    st.current.pending.push(fn);
    if(!st.current.timer)st.current.timer=setTimeout(flush,300);
  },[flush]);
  useEffect(()=>()=>{if(st.current.timer)clearTimeout(st.current.timer);},[]);
  return useMemo(()=>({report}),[report]);
};
// Q3 — FLIP list motion. On a sort/filter change (deps), children tagged with
// data-flip-key slide from their old Y to their new Y simultaneously (translateY
// only, straight lines, no stagger). Guards: reduced motion, first render,
// >60 rows, survivors only, nonzero deltas, viewport-intersecting only.
const useFlipList=(listRef,deps)=>{
  const prev=useRef(null);
  const prevDeps=useRef(null);
  const depsKey=JSON.stringify(deps);
  // Runs every commit (no dep array) so the "before" baseline stays fresh even
  // across balance-driven re-renders; it only ANIMATES when the sort/filter deps
  // actually change, so the first change after entering the tab has a baseline.
  React.useLayoutEffect(()=>{
    const el=listRef.current;
    if(!el){prev.current=null;prevDeps.current=depsKey;return;}
    const kids=Array.from(el.querySelectorAll('[data-flip-key]'));
    if(kids.length>60){prev.current=null;prevDeps.current=depsKey;return;}   // too many rows → don't track/animate
    const nowRects=new Map();kids.forEach(k=>nowRects.set(k.getAttribute('data-flip-key'),k.getBoundingClientRect()));
    const first=prev.current;
    const depsChanged=prevDeps.current!==null&&prevDeps.current!==depsKey;
    prev.current=nowRects;prevDeps.current=depsKey;
    if(!first||!depsChanged||prefersReducedMotion())return;
    const vh=window.innerHeight||document.documentElement.clientHeight||0;
    kids.forEach(k=>{
      const key=k.getAttribute('data-flip-key');
      const f=first.get(key);if(!f)return;    // survivors only (skip entering rows)
      const l=nowRects.get(key);
      const dy=f.top-l.top;
      if(!dy)return;                           // nonzero deltas only
      if(l.bottom<0||l.top>vh)return;          // only rows intersecting the viewport
      try{k.animate([{transform:'translateY('+dy+'px)'},{transform:'translateY(0)'}],{duration:200,easing:'cubic-bezier(0.2,0,0,1)'});}catch(e){}
    });
  });
};
// E1/E5 — LANDING FLASH: mark a navigation destination with the orange ~1.2s
// one-shot (see .bi-landing). Reduced motion → no-op. Safe on already-visible
// destinations (no scroll needed).
const landingFlash=el=>{
  if(!el||prefersReducedMotion())return;
  el.classList.remove('bi-landing');void el.offsetWidth;el.classList.add('bi-landing');
  el.addEventListener('animationend',()=>el.classList.remove('bi-landing'),{once:true});
};
// Session/file "seen once" ledgers. _critSeen (E2) is cleared on every file load;
// _shortcutSeen (E5) persists for the whole session (page load = session).
const _critSeen=new Set();
const _shortcutSeen=new Set();
// Q4 — grid expand/collapse wrapper. Animates BOTH directions (grid-template-rows
// 0fr↔1fr) with content mounted only while open or during the ~200ms collapse
// window, so collapsed rows cost nothing. instant→switch with no animation
// (panels with >600px of content). Reduced motion → instant via the CSS collapse.
const Expando=({open,children,style,instant=false})=>{
  // Content must be present in the SAME commit that adds .bi-exp-open, else the 1fr
  // track first resolves against an empty inner (→0px) and won't recover. So render
  // children synchronously whenever open; only DELAY unmount during the collapse.
  const[closing,setClosing]=useState(false);
  const prevOpen=useRef(open);
  useEffect(()=>{
    if(!open&&prevOpen.current){
      if(instant||prefersReducedMotion()){setClosing(false);}
      else{setClosing(true);const t=setTimeout(()=>setClosing(false),210);prevOpen.current=open;return()=>clearTimeout(t);}
    }
    prevOpen.current=open;
  },[open,instant]);
  const showContent=open||closing;
  return <div className={'bi-exp'+(open&&!instant?' bi-exp-open':'')} style={instant?{...style,display:open?'block':'none'}:style}>
    <div className="bi-exp-inner">{showContent?children:null}</div>
  </div>;
};

function App(){

    // running IS reactMounted; the timer enforces ≥400ms of total splash wall-clock.

    const markEl=document.querySelector('[data-splash-target]');
    const tagEl=document.querySelector('[data-splash-tag]');
    const nameEl=document.querySelector('[data-splash-name]');

    const assignHeaderNames=()=>{
      if(markEl)markEl.style.viewTransitionName='logo-mark';
      if(tagEl)tagEl.style.viewTransitionName='brand-tag';
      if(nameEl)nameEl.style.viewTransitionName='brand-name';
    };
    // Test 5: no leftover view-transition-name side effects after the flight.
    const clearHeaderNames=()=>{
      if(markEl)markEl.style.viewTransitionName='';
      if(tagEl)tagEl.style.viewTransitionName='';
      if(nameEl)nameEl.style.viewTransitionName='';
    };
    const playStrip=()=>{
      try{
        strip=document.createElement('div');
        strip.id='splash-strip';
        document.body.appendChild(strip);
        void strip.offsetWidth;               // reflow so the wipe starts from scaleX(0)
        strip.classList.add('wipe');
        strip.addEventListener('animationend',()=>{if(strip)strip.remove();},{once:true});
      }catch(e){}
    };

    // §4 FLIP fallback (engines without startViewTransition, e.g. older Firefox).
    const flipFallback=()=>{
      try{
        const pairs=[
          [splash.querySelector('#splash-logo'),markEl],
          [splash.querySelector('#splash-title .tag'),tagEl],
          [splash.querySelector('#splash-title .name'),nameEl]
        ];
        // Measure the splash rects BEFORE removing it.
        const measured=pairs.map(([from,to])=>(from&&to)?[from.getBoundingClientRect(),to]:null);
        splash.remove();
        let ok=false;
        measured.forEach(m=>{
          if(!m)return;

          const sx=fromRect.width/toRect.width, sy=fromRect.height/toRect.height;
          to.animate(
            [{transformOrigin:'top left',transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')'},
             {transformOrigin:'top left',transform:'none'}],
            {duration:450,easing:'cubic-bezier(0.2,0,0,1)',fill:'both'}
          );

                      <span className="mono" style={{fontSize:9,color,fontWeight:s.ok?600:400,letterSpacing:'0.04em'}}>{text}</span>
                    </div>;
                  })}

              </div>
            </div>
          </div>;
        })()}
        {/* ── Focus banner (when an account is focused) ── */}
        {focusedAcct&&(()=>{
          const acct=logData.accts.find(a=>a.addr===focusedAcct.addr&&a.cid===focusedAcct.cid);

          const lb=liveBalances?.[acct.id];
          const errCount=logData.errs.filter(e=>acct.addr&&acct.addr.length>8&&((e.msg||'')+' '+JSON.stringify(e.raw||'')).toLowerCase().includes(acct.addr.toLowerCase())).length;
          let eUrl=null;try{eUrl=acct.ch.url?.(acct.addr);}catch{}

          return <div className="bi-slide-down" style={{display:'flex',alignItems:'center',gap:14,padding:'8px 20px',background:c+'10',borderBottom:'1px solid '+c+'30',borderLeft:'3px solid '+c,flexShrink:0,fontFamily:'Inter',fontSize:12}}>
            <span style={{fontSize:9,fontWeight:700,letterSpacing:'0.14em',color:c,textTransform:'uppercase'}}>Focused</span>
            <div style={{display:'flex',alignItems:'center',gap:8,minWidth:0}}>
              <span style={{width:8,height:8,borderRadius:2,background:c,flexShrink:0}}/>
              <span style={{color:'#F4F4F5',fontWeight:600}}>{acct.ch.name}</span>
              <span className="mono" style={{color:'#8A8A90',fontSize:11,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:240}}>{acct.addr?acct.addr.slice(0,16)+'…'+acct.addr.slice(-6):acct.cid?.slice(0,24)||'—'}</span>
            </div>

              {lb&&lb.fiat>0&&<span><span style={{color:'#8A8A90'}}>Fiat </span><span className="mono" style={{color:'#4FBFE8',fontWeight:600}}>{fmtFiat(lb.fiat)}</span></span>}
              <span><span style={{color:'#8A8A90'}}>Ops </span><span className="mono" style={{color:acct.ops>0?'#F4F4F5':'#8A8A90',fontWeight:600}}>{acct.ops||0}</span></span>
              {errCount>0&&<span><span style={{color:'#8A8A90'}}>Errors </span><span className="mono" style={{color:'#D94747',fontWeight:700}}>{errCount}</span></span>}
            </div>
            <span style={{flex:1}}/>
            <div style={{display:'flex',gap:6,flexShrink:0}}>
              {errCount>0&&<span onClick={()=>{setErrAcctFilter(acct.addr);setSection('errors');}} style={{padding:'4px 10px',borderRadius:2,background:'rgba(217,71,71,0.10)',border:'1px solid rgba(217,71,71,0.30)',color:'#D94747',fontSize:11,fontWeight:600,cursor:'pointer'}}>⚠ {errCount} error{errCount!==1?'s':''} →</span>}
              <span onClick={()=>{setTlAcctFilter({addr:acct.addr,cid:acct.cid,ticker:acct.ch.ticker,name:acct.ch.name,color:acct.ch.color});setSection('timeline');}} style={{padding:'4px 10px',borderRadius:2,background:'#1C1C20',border:'1px solid rgba(255,255,255,0.07)',color:'#C8C8CC',fontSize:11,fontWeight:500,cursor:'pointer'}}>Timeline →</span>
              {hasExp&&<a href={eUrl} target="_blank" rel="noopener noreferrer" style={{padding:'4px 10px',borderRadius:2,background:'#1C1C20',border:'1px solid rgba(255,255,255,0.07)',color:'#C8C8CC',fontSize:11,fontWeight:500,textDecoration:'none'}}>Explorer ↗</a>}
              <span onClick={()=>setFocusedAcct(null)} style={{padding:'4px 8px',borderRadius:2,background:'transparent',border:'1px solid rgba(255,255,255,0.07)',color:'#8A8A90',fontSize:11,cursor:'pointer'}} onMouseEnter={e=>{e.currentTarget.style.color=c;e.currentTarget.style.borderColor=c+'40';}} onMouseLeave={e=>{e.currentTarget.style.color='#8A8A90';e.currentTarget.style.borderColor='rgba(255,255,255,0.07)';}}>✕</span>
            </div>
          </div>;
        })()}
        <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column',background:focusedAcct?`linear-gradient(135deg, ${focusedAcct.color}06 0%, ${focusedAcct.color}02 30%, transparent 60%)`:'transparent',transition:'background 0.4s ease','--focus-color':focusedAcct?focusedAcct.color+'12':'transparent'}}>
        {/* Context Ribbon */}
        {(selectedErr!=null&&section==='errors')&&(()=>{
          const ribbonErr=selectedErr!=null?logData.errs.find(e=>e.li===selectedErr):null;
          const ribbonDg=ribbonErr?diagnose(ribbonErr.raw):null;
          const ribbonSv=ribbonDg?SEV[ribbonDg.s]||SEV.low:null;
          const accentColor=ribbonSv?ribbonSv.c:'#E85A1A';
          return <div style={{display:'flex',alignItems:'center',gap:6,padding:'4px 16px',borderBottom:`1px solid ${accentColor}30`,background:accentColor+'14',fontSize:12,flexShrink:0,minHeight:32}}>
            {ribbonDg&&<span onClick={()=>{setSection('errors');setSelectedErr(ribbonErr.li);}} style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 8px',borderRadius:2,cursor:'pointer',fontWeight:600,background:ribbonSv.c+'15',color:ribbonSv.c,border:`1px solid ${ribbonSv.c}25`,maxWidth:300,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
              {ribbonDg.t}
            </span>}
            {ribbonErr&&<span onClick={()=>{jumpTo(ribbonErr.li);}} style={{padding:'2px 6px',borderRadius:2,cursor:'pointer',color:'#8A8A90',fontFamily:MF,fontSize:10,background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.07)'}} onMouseEnter={e=>{e.currentTarget.style.borderColor='#E85A1A';e.currentTarget.style.color='#E85A1A';}} onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(255,255,255,0.07)';e.currentTarget.style.color='#8A8A90';}}>

            </span>}
            <span style={{flex:1}}/>
            <span onClick={()=>{setSelectedErr(null);}} style={{padding:'2px 8px',borderRadius:2,cursor:'pointer',fontSize:10,fontWeight:600,color:'#8A8A90',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.07)',display:'inline-flex',alignItems:'center',gap:3}} onMouseEnter={e=>{e.currentTarget.style.borderColor='#E85A1A';e.currentTarget.style.color='#E85A1A';}} onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(255,255,255,0.07)';e.currentTarget.style.color='#8A8A90';}}>✕ Clear</span>
          </div>;
        })()}
        {/* Overview */}
        {section==='overview'&&(()=>{
          const d=logData.dev;const da=logData.deviceApps;const req=logData.requiredApps||[];
          const accts=logData.accts||[];const errs=logData.errs||[];const ents=logData.entries||[];

          // ── Severity counts ──
          const sevHigh=errs.filter(e=>e.dg?.s==='high').length;
          const sevMed=errs.filter(e=>e.dg?.s==='medium').length;
          const sevLow=errs.filter(e=>e.dg?.s==='low').length;
          const errTotal=errs.length;
          const sevBreak=[sevHigh&&sevHigh+' critical',sevMed&&sevMed+(sevMed>1?' warnings':' warning'),sevLow&&sevLow+(sevLow>1?' notices':' notice')].filter(Boolean).join(' · ');

          // ── Firmware ──
          const fwLive=firmwareCheck?.status==='ok';
          const fwHasMgr=da?.source==='manager-result'&&!!da.firmware;
          const fwVerified=fwLive||fwHasMgr;
          const fwLatestVer=fwLive?(firmwareCheck.latest||null):(fwHasMgr?da.firmware.version:null);
          const fwOutdated=fwLive?firmwareCheck.outdated:(fwHasMgr?da.firmware.version!==d.fw:false);
          // d.fw can be a raw path-like fallback (e.g. "nanox/2.7.1/iotex/…") from a URL param — show the
          // semver segment in the quad, keep the full raw string in the tooltip.
          const fwDisplay=d.fw?(d.fw.includes('/')?(d.fw.match(/\d+\.\d+(?:\.\d+)?/)?.[0]||d.fw):d.fw):null;

          // ── Required apps state ──
          let appsOk=0,appsMissing=0,appsOutdated=0;
          const appList=[];
          if(da?.source==='manager-result'&&Array.isArray(da.installed)&&req.length>0){
            req.forEach(r=>{
              const inst=da.installed.find(i=>i.name&&i.name.toLowerCase()===r.appName.toLowerCase());
              if(!inst){appsMissing++;appList.push({n:r.appName,v:null,state:'missing',color:r.chains?.[0]?.color});}
              else if(!inst.updated){appsOutdated++;appList.push({n:r.appName,v:inst.version,state:'outdated',color:r.chains?.[0]?.color});}
              else{appsOk++;appList.push({n:r.appName,v:inst.version,state:'ok',color:r.chains?.[0]?.color});}
            });
          }

          // ── Sync state per account ──
          const noSyncOverall=accts.length>0&&!accts.some(a=>a.dur!=null||a.bal!=null);
          const syncedAccts=accts.filter(a=>a.dur!=null||a.bal!=null||(liveBalances[a.id]?.status==='ok'));
          const syncedCount=syncedAccts.length;

          // ── Fiat totals ──
          let totalFiat=0;
          const acctFiats={};
          for(const a of accts){
            const lb=liveBalances[a.id];
            const f=lb?.fiat||0;
            acctFiats[a.id]=f;
            totalFiat+=f;
          }

          // ── Chain aggregation (for portfolio treemap) ──
          const byChain={};
          for(const a of accts){
            const k=a.ch.name;
            if(!byChain[k])byChain[k]={name:k,color:a.ch.color,ticker:a.ch.ticker,fiat:0,ops:0,count:0,hasUnsynced:false};
            byChain[k].fiat+=acctFiats[a.id]||0;
            byChain[k].ops+=a.ops||0;
            byChain[k].count++;
            if(a.dur==null&&a.bal==null&&!(liveBalances[a.id]?.status==='ok'))byChain[k].hasUnsynced=true;
          }
          const chains=Object.values(byChain).sort((a,b)=>(b.fiat-a.fiat)||(b.ops-a.ops));
          const chainsFiatTotal=chains.reduce((s,c)=>s+(c.fiat||0),0);
          // Visual floor for empty-fiat chains so they still appear in the treemap
          const chainsForTm=chains.map(c=>({...c,_w:Math.max(c.fiat,chainsFiatTotal>0?chainsFiatTotal*0.04:c.ops||1)}));
          const tmTotal=chainsForTm.reduce((s,c)=>s+c._w,0)||1;

          // ── Top accounts (sorted by fiat then ops) ──
          const topAccts=[...accts].sort((a,b)=>((acctFiats[b.id]||0)-(acctFiats[a.id]||0))||((b.ops||0)-(a.ops||0))).slice(0,6);

          // ── Verdict ──
          const vsev=sevHigh>0?'critical':(sevMed>0||fwOutdated||appsMissing>0)?'warning':sevLow>0?'notice':noSyncOverall?'info':'ok';
          const vc={critical:'#D94747',warning:'#E88A4A',notice:'#5B9FE8',info:'#8A8A90',ok:'#4FBFE8'}[vsev];
          const vLabel={critical:'Needs attention',warning:'Review',notice:'Notice',info:'No sync data',ok:'Clean session'}[vsev];
          const vMsgParts=[];
          if(sevHigh>0)vMsgParts.push(<><strong>{sevHigh} critical</strong>{sevMed>0?` · ${sevMed} warning${sevMed>1?'s':''}`:''}</>);
          else if(sevMed>0)vMsgParts.push(<><strong>{sevMed} warning{sevMed>1?'s':''}</strong></>);
          else if(sevLow>0)vMsgParts.push(<><strong>{sevLow} informational event{sevLow>1?'s':''}</strong> logged (routine)</>);
          else if(noSyncOverall)vMsgParts.push(<><strong>No sync captured</strong> — addresses only, balances unavailable</>);
          else vMsgParts.push(<><strong>No issues detected</strong> · {ents.length.toLocaleString()} events processed</>);
          if(fwOutdated)vMsgParts.push(<> · firmware <span style={{color:'#E88A4A'}}>{d.fw} → {fwLatestVer||'?'}</span></>);
          if(appsMissing>0)vMsgParts.push(<> · <span style={{color:'#D94747'}}>{appsMissing} app{appsMissing>1?'s':''} missing</span></>);

          // ── Timeline bins for the bottom-right card ──
          const tlBins=24;
          const tlBuckets=Array.from({length:tlBins},()=>({total:0,network:0,action:0,apdu:0,error:0,other:0}));
          if(ents.length>1){
            const t0=new Date(ents[0].timestamp||ents[0].date).getTime();
            const t1=new Date(ents[ents.length-1].timestamp||ents[ents.length-1].date).getTime();
            const span=Math.max(1,t1-t0);
            for(const e of ents){
              const t=new Date(e.timestamp||e.date).getTime();
              const i=Math.min(tlBins-1,Math.floor(((t-t0)/span)*tlBins));
              const b=tlBuckets[i];if(!b)continue;b.total++;
              const tp=e.type||'';
              if(tp==='network')b.network++;
              else if(tp==='action')b.action++;
              else if(tp==='hw'||tp==='apdu'||tp.startsWith('hw/'))b.apdu++;
              else b.other++;
            }
            // Overlay errors
            for(const er of errs){
              const t=new Date(er.ts).getTime();
              const i=Math.min(tlBins-1,Math.max(0,Math.floor(((t-t0)/span)*tlBins)));
              if(tlBuckets[i])tlBuckets[i].error++;
            }
          }
          const tlMax=Math.max(1,...tlBuckets.map(b=>b.total));

          // ── Key events (first error of each severity + session bookends), sorted chronologically ──
          //    Severity is conveyed by dot color, so we present moments in time order, not severity order.
          const startTs=ents.length?new Date(ents[0].timestamp||ents[0].date).getTime():0;
          const endTs=ents.length?new Date(ents[ents.length-1].timestamp||ents[ents.length-1].date).getTime():0;
          const keyEvents=[];
          if(ents.length){keyEvents.push({t:fmtTime(ents[0].timestamp||ents[0].date,{ms:false}),_ts:startTs,l:'Session start',c:'var(--bi-fg-3)'});}
          for(const sev of ['high','medium','low']){
            const e=errs.find(x=>x.dg?.s===sev);
            if(e){keyEvents.push({t:fmtTime(e.ts,{ms:false}),_ts:new Date(e.ts).getTime(),l:e.dg.t||'Issue detected',c:sev==='high'?'var(--bi-rank-4)':sev==='medium'?'var(--bi-rank-3)':'var(--bi-cat-3)',sev});}
            if(keyEvents.length>=5)break;
          }
          // Swap has no timestamp of its own — pin it just before Session end.
          if(logData.activity?.swapBrowsed){keyEvents.push({t:'',_ts:endTs-1,l:logData.activity.swapExecuted?'Swap executed':'Swap browsed',c:'var(--bi-cat-1)'});}
          if(ents.length){keyEvents.push({t:fmtTime(ents[ents.length-1].timestamp||ents[ents.length-1].date,{ms:false}),_ts:endTs,l:'Session end',c:'var(--bi-fg-3)'});}
          keyEvents.sort((a,b)=>a._ts-b._ts);

          // ── Network stats ──
          const netErr=ents.filter(e=>e.type==='network-error').length;
          const netCalls=ents.filter(e=>e.type==='network').length+netErr;
          const apduCount=logData.apdu?.length||0;

          // ── Helper components — hoisted to module scope as OvQuad/OvSwatch/OvDot/OvHBar/OvSevPip/OvCard.
          //    Local aliases keep call sites short; the imports are stable identities so the Overview
          //    subtree no longer remounts on every re-render (which was re-firing entry animations
          //    every time live data arrived or focus toggled).
          const Quad=OvQuad,Swatch=OvSwatch,Dot=OvDot,HBar=OvHBar,SevPip=OvSevPip,Card=OvCard;

          return <div className="bi-overview" style={{padding:'12px 16px 16px',gap:12}}>

            {/* ── Verdict ribbon — hidden when an account is focused; the focus banner + Customer Setup quadrants carry the verdict context for that account ── */}
            {!focusedAcct&&<div className="bi-slide-down" style={{background:'var(--bi-bg-card)',border:'1px solid var(--bi-border)',borderLeft:'3px solid '+vc,borderRadius:2,padding:'8px 14px',display:'flex',alignItems:'center',gap:14,flexShrink:0}}>
              {/* HARD RULE: this check-draw delight exists ONLY for the ok ("Clean session") verdict.
                  Never add celebratory/playful motion to critical/warning verdicts, nor anywhere a
                  drain / seed-compromise finding renders. Do not "extend" this to other states. */}
              {vsev==='ok'&&<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true" style={{flexShrink:0}}><path d="M3 8.5 L6.5 12 L13 4.5" stroke="var(--bi-positive)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="bi-check-draw" style={{'--bi-check-len':18}}/></svg>}
              <span className={vsev==='critical'?'bi-pulse-once':''} style={{fontSize:9,fontWeight:700,letterSpacing:'0.14em',color:vc,textTransform:'uppercase',background:vc+'15',border:'1px solid '+vc+'50',padding:'3px 8px',borderRadius:2}}>{vLabel}</span>
              <span style={{color:'var(--bi-fg-1)',fontSize:13,flex:1}}>{vMsgParts}</span>
              <span style={{display:'flex',gap:6}}>
                {sevHigh+sevMed>0&&<span onClick={()=>setSection('errors')} style={{fontSize:11,color:'#fff',padding:'5px 12px',background:'var(--bi-orange)',borderRadius:2,cursor:'pointer',fontWeight:600}}>Investigate →</span>}
                {sevHigh+sevMed===0&&accts.length>0&&<span onClick={()=>setSection('accounts')} style={{fontSize:11,color:'var(--bi-fg-2)',padding:'5px 12px',background:'var(--bi-bg-card-alt)',border:'1px solid var(--bi-border)',borderRadius:2,cursor:'pointer'}}>View accounts →</span>}
              </span>
            </div>}

            {/* ── 3-column grid ── */}
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12,flex:1,minHeight:0}}>

              {/* ═══════ Col 1 — Customer setup quadrants ═══════ */}
              <Card i={0}>
                <div className="bi-card-hd">
                  <div>
                    <div className="bi-title">Customer setup</div>
                    <div className="bi-sub">{d.platform||'desktop'} · Ledger Wallet {d.appVer||'—'}</div>
                  </div>
                  <OvCopyChip value={d.userId}/>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gridTemplateRows:'1fr 1fr',flex:1,minHeight:0}}>
                  <Quad title="Device" right={d.modelName?'detected':'not in log'} rightColor={d.modelName?'var(--bi-positive)':'var(--bi-fg-4)'}>
                    <div style={{display:'flex',alignItems:'baseline',gap:8}}>
                      <span className="bi-kpi">{d.modelName||'—'}</span>
                    </div>
                    <div className="mono" style={{fontSize:10,color:'var(--bi-fg-3)',marginTop:4}}>{d.targetId?'target 0x'+d.targetId.toString(16):'—'}</div>
                    <div style={{fontSize:11,color:'var(--bi-fg-3)',marginTop:4}}>{d.os} {d.osVer} · {d.lang||'—'}</div>
                    {d.mev&&<div style={{fontSize:11,color:'var(--bi-fg-3)',marginTop:2}}>MEV protect: <span style={{color:'var(--bi-fg-1)'}}>{d.mev}</span></div>}
                  </Quad>
                  <Quad title="Firmware" right={firmwareCheck?.status==='loading'?'checking…':fwOutdated?'1 release behind':(fwVerified?'on latest':'unverified')} rightColor={firmwareCheck?.status==='loading'?'var(--bi-fg-4)':fwOutdated?'var(--bi-rank-3)':(fwVerified?'var(--bi-positive)':'var(--bi-fg-4)')} borderLeft>
                    <div style={{display:'flex',alignItems:'baseline',gap:8,minWidth:0}}>
                      <span className="bi-kpi" title={d.fw||''} style={{color:fwOutdated?'var(--bi-rank-3)':'var(--bi-fg-1)',display:'inline-block',maxWidth:'100%',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{fwDisplay||'—'}</span>
                      {fwOutdated&&fwLatestVer&&<>
                        <span style={{color:'var(--bi-fg-3)',fontSize:16,flexShrink:0}}>→</span>
                        <span className="mono" style={{color:'var(--bi-fg-1)',fontWeight:600,fontSize:16,flexShrink:0}}>{fwLatestVer}</span>
                      </>}
                    </div>
                    {(firmwareCheck?.status==='loading'||fwVerified)&&<div style={{fontSize:11,color:'var(--bi-fg-3)',marginTop:4}}>
                      {firmwareCheck?.status==='loading'?'Checking manager…':fwLive?'verified vs manager.api.live.ledger.com':'from manager response'}
                    </div>}
                    {d.commit&&<div className="mono" title="Ledger Wallet build commit" style={{fontSize:10,color:'var(--bi-fg-3)',marginTop:4}}>LW commit {d.commit}</div>}
                  </Quad>
                  <Quad title="Required apps" right={da?.source==='manager-result'&&req.length>0?`${appsOk}/${req.length}`:'—'} rightColor={da?.source!=='manager-result'?'var(--bi-fg-4)':appsMissing>0?'var(--bi-rank-4)':appsOutdated>0?'var(--bi-rank-3)':appsOk===req.length&&req.length>0?'var(--bi-positive)':'var(--bi-fg-4)'} borderTop>
                    {appList.length>0?<div style={{display:'flex',flexDirection:'column',gap:3,marginTop:2,maxHeight:120,overflow:'auto'}}>
                      {appList.slice(0,8).map((a,i)=>{
                        const col=a.state==='ok'?'var(--bi-positive)':a.state==='missing'?'var(--bi-rank-4)':'var(--bi-rank-3)';
                        return <div key={a.n} className="bi-tr" style={{'--i':i,'--bi-row-pad':'0px',display:'flex',alignItems:'center',gap:8,fontSize:11,padding:'2px 0'}}>
                          <Dot color={col}/>
                          <span style={{color:'var(--bi-fg-1)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.n}</span>
                          <span className="mono" style={{color:'var(--bi-fg-2)',fontSize:10}}>{a.v||'—'}</span>
                          <span style={{fontSize:9,color:col,minWidth:54,textAlign:'right',letterSpacing:'0.02em'}}>{a.state==='ok'?'latest':a.state==='missing'?'missing':'outdated'}</span>
                        </div>;
                      })}
                      {appList.length>8&&<div style={{fontSize:10,color:'var(--bi-fg-3)',marginTop:2,fontStyle:'italic'}}>+{appList.length-8} more</div>}
                    </div>:<div style={{fontSize:11,color:'var(--bi-fg-3)',marginTop:8}}>{req.length===0?'No accounts → no apps required':'Manager catalog unavailable — manager data requires a live Ledger connection during the session; offline or interrupted sessions won\'t capture it.'}</div>}
                  </Quad>
                  <Quad title="Sync coverage" right={accts.length>0?`${syncedCount}/${accts.length}`:'—'} rightColor={syncedCount===0?'var(--bi-rank-4)':syncedCount<accts.length?'var(--bi-rank-3)':'var(--bi-positive)'} borderTop borderLeft>
                    <div style={{display:'flex',flexDirection:'column',gap:3,marginTop:2,maxHeight:120,overflow:'auto'}}>
                      {Object.values(byChain).slice(0,6).map((c,i)=>{

                          <span style={{fontSize:12,color:'var(--bi-fg-1)',fontWeight:500,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.dg?.t||(e.msg||'').slice(0,80)}</span>

                        </div>
                        {(()=>{const cat=e.dg?.c&&e.dg.c!=='unknown'?e.dg.c:null;const m=e.msg?e.msg.slice(0,80):'';if(!cat&&!m)return null;return <div style={{fontSize:11,color:'var(--bi-fg-3)',marginTop:1,paddingLeft:65,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{cat?cat+(m?' · '+m:''):m}</div>;})()}
                      </div>;

                {/* Activity card */}
                <Card i={2}>
                  <div className="bi-card-hd">
                    <div>
                      <div className="bi-title">Activity &amp; infrastructure</div>
                      <div className="bi-sub">network · device · status</div>
                    </div>
                  </div>
                  <div style={{flex:1,display:'grid',gridTemplateColumns:'1fr 1fr',gap:0,minHeight:0}}>
                    <div style={{padding:'8px 12px 10px',borderRight:'1px solid var(--bi-border)',cursor:'pointer'}} onClick={()=>setSection('network')}>
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                        <span className="bi-sublabel">Network</span>
                        <span className="bi-link">Open →</span>
                      </div>
                      <div style={{display:'flex',alignItems:'baseline',gap:6,marginTop:4}}>
                        <CountUp className="bi-kpi" style={{fontSize:22}} value={netCalls} fmt={v=>Math.round(v).toLocaleString()}/>
                        <span style={{fontSize:11,color:'var(--bi-fg-3)'}}>calls</span>
                      </div>
                      <div style={{fontSize:11,color:netErr>0?'var(--bi-rank-3)':'var(--bi-fg-3)',marginTop:4}}>{netErr} failed</div>
                    </div>
                    <div style={{padding:'8px 12px 10px',cursor:'pointer'}} onClick={()=>setSection('apdu')}>
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
