function CVPortfolio({enrichedAccts,liveBalances,onSelectAcct,setCvSection,appJson}){
  const accts=enrichedAccts||[];
  const chainCount=[...new Set(accts.map(a=>a.cid))].length;
  const hasAppJson=accts.some(a=>a.enriched);
  if(!hasAppJson){
    return <div style={{padding:'40px 32px',textAlign:'center'}}>
      <div style={{fontSize:32,marginBottom:16,opacity:0.3}}>📊</div>
      <div style={{fontSize:16,fontWeight:600,color:'#FFFFFF',marginBottom:8}}>Customer portfolio not available</div>
      <div style={{fontSize:13,color:'#8A8A8E',maxWidth:400,margin:'0 auto',lineHeight:1.6}}>Load the customer's <strong style={{color:'#FFFFFF'}}>app.json</strong> to see their portfolio as they see it. This file contains their synced balances, account names, and transaction history.</div>
      <div style={{fontSize:12,color:'#8A8A8E',marginTop:16,opacity:0.6}}>Ask the customer to export from Ledger Wallet → Settings → Help → View user data</div>
    </div>;
  }
  const hasCVRates=appJson&&Object.keys(cvGetRateMap(appJson)).length>0;
  const chainGroups={};
  accts.forEach((a,i)=>{
    if(!a.enriched||!a.ajBalance)return;
    const key=a.cid;
    const dec=DECIMALS[a.cid]||18;
    const rawBal=parseFloat(a.ajBalance)||0;
    const humanBal=rawBal/Math.pow(10,dec);
    const fiatVal=hasCVRates?cvFiatValue(appJson,a.cid,a.ajBalance):null;
    if(!chainGroups[key]){
      const ri=hasCVRates?cvLatestRate(appJson,a.cid):null;
      chainGroups[key]={ch:a.ch,cid:a.cid,bal:0,fiat:0,hasFiat:false,accts:[],firstIdx:i,rateInfo:ri};
    }
    chainGroups[key].bal+=humanBal;
    if(fiatVal!=null){chainGroups[key].fiat+=fiatVal;chainGroups[key].hasFiat=true;}
    chainGroups[key].accts.push({a,i,humanBal,fiatVal});
  });
  const chainAlloc=Object.values(chainGroups).filter(g=>g.bal>0).sort((a,b)=>{
    if(a.hasFiat&&b.hasFiat)return b.fiat-a.fiat;
    if(a.hasFiat)return-1;
    if(b.hasFiat)return 1;
    return b.bal-a.bal;
  });
  const zeroChains=Object.values(chainGroups).filter(g=>g.bal===0);
  const noDataAccts=accts.filter(a=>!a.enriched||!a.ajBalance);
  const totalFiat=chainAlloc.reduce((s,g)=>g.hasFiat?s+g.fiat:s,0);
  const hasTotalFiat=chainAlloc.some(g=>g.hasFiat);
  const latestRateDate=(()=>{
    if(!hasCVRates)return null;
    const rm=cvGetRateMap(appJson);
    const allDates=Object.values(rm).flatMap(d=>typeof d==='object'?Object.keys(d):[]).filter(k=>/^\d{4}-\d{2}/.test(k));
    if(!allDates.length)return null;
    return allDates.sort()[allDates.length-1];
  })();
  return <div>
    <div className="cv-content-header">
      <div style={{fontSize:14,color:'#8A8A8E',fontWeight:500,marginBottom:4}}>Portfolio balance</div>
      {hasTotalFiat
        ?<div style={{fontSize:36,fontWeight:700,color:'#FFFFFF',lineHeight:1.1,marginBottom:6}}>{cvFmtFiat(totalFiat,appJson)}</div>
        :<div style={{fontSize:36,fontWeight:700,color:'#FFFFFF',lineHeight:1.1,marginBottom:6}}>{accts.length} accounts</div>}
      <div style={{fontSize:13,color:'#8A8A8E',display:'flex',alignItems:'center',gap:10}}>
        <span>{accts.length} account{accts.length!==1?'s':''} · {chainCount} chain{chainCount!==1?'s':''} · from app.json</span>
        {latestRateDate&&<span style={{fontFamily:MF,fontSize:10,color:'rgba(187,176,255,0.5)',background:'rgba(187,176,255,0.06)',borderRadius:4,padding:'2px 6px'}}>rates as of {latestRateDate}</span>}
      </div>
    </div>
    <div style={{padding:'0 32px'}}>
      <div style={{fontSize:16,fontWeight:600,color:'#FFFFFF',marginBottom:16}}>Asset allocation ({chainAlloc.length})</div>
      <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1.5fr 1.5fr 1fr',gap:0,paddingBottom:8,borderBottom:'1px solid rgba(255,255,255,0.06)',marginBottom:0}}>
        {['Asset','Price','Allocation','Balance','Value'].map(h=><div key={h} style={{fontSize:11,color:'#8A8A8E',fontWeight:600,letterSpacing:'0.06em',paddingBottom:8}}>{h}</div>)}
      </div>
      {chainAlloc.map(grp=>{
        const ch=grp.ch;
        const iconUrl=chainIconUrl(grp.cid);
        const acctCount=grp.accts.length;
        const allocPct=hasTotalFiat&&grp.hasFiat&&totalFiat>0?(grp.fiat/totalFiat*100):null;
        return <div key={grp.cid} style={{display:'grid',gridTemplateColumns:'2fr 1fr 1.5fr 1.5fr 1fr',alignItems:'center',padding:'14px 0',borderBottom:'1px solid rgba(255,255,255,0.06)',cursor:'pointer',transition:'background 150ms ease'}}
          onClick={()=>{if(acctCount===1){setCvSection('accounts');onSelectAcct(grp.accts[0].i);}else{setCvSection('accounts');}}}
          onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.03)'}
          onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:32,height:32,borderRadius:'50%',background:ch.color||'#333',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,overflow:'hidden'}}>
              {iconUrl?<img src={iconUrl} alt={ch.ticker} style={{width:20,height:20,objectFit:'contain'}} onError={e=>e.target.style.display='none'}/>:<span style={{fontSize:10,fontWeight:700,color:'#fff'}}>{(ch.ticker||'?').slice(0,3)}</span>}
            </div>
            <div>
              <span style={{fontSize:14,fontWeight:500,color:'#FFFFFF'}}>{ch.name}</span>
              {acctCount>1&&<div style={{fontSize:11,color:'#8A8A8E'}}>{acctCount} accounts</div>}
            </div>
          </div>
          <div style={{fontSize:12,color:'#8A8A8E',fontFamily:MF}}>{grp.rateInfo?cvFmtFiat(grp.rateInfo.rate,appJson)+'/'+(ch.ticker||'?'):'—'}</div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:12,color:allocPct!=null?'#FFFFFF':'#8A8A8E',flexShrink:0,minWidth:36}}>{allocPct!=null?allocPct.toFixed(1)+'%':'—'}</span>
            {allocPct!=null&&<div style={{flex:1,height:4,borderRadius:2,background:'rgba(255,255,255,0.08)',overflow:'hidden',minWidth:32,maxWidth:80}}><div style={{width:allocPct+'%',height:'100%',borderRadius:2,background:ch.color||'#BBB0FF'}}/></div>}
          </div>
          <div style={{fontSize:13,color:'#FFFFFF',fontFamily:MF}}>{grp.bal.toLocaleString(undefined,{maximumFractionDigits:6})} {ch.ticker}</div>
          <div style={{fontSize:13,color:grp.hasFiat?'#FFFFFF':'#8A8A8E'}}>{grp.hasFiat?cvFmtFiat(grp.fiat,appJson):'—'}</div>
        </div>;
      })}
      {(zeroChains.length+noDataAccts.length)>0&&<div style={{padding:'14px 0',color:'#8A8A8E',fontSize:12}}>
        {zeroChains.length>0&&<span>{zeroChains.reduce((s,g)=>s+g.accts.length,0)} empty account{zeroChains.reduce((s,g)=>s+g.accts.length,0)!==1?'s':''}</span>}
        {noDataAccts.length>0&&<span>{zeroChains.length>0?' · ':''}{noDataAccts.length} without balance data</span>}
      </div>}
      {(()=>{
        const recentlyUsed=appJson?.raw?.discover?.recentlyUsed;
        if(!Array.isArray(recentlyUsed)||recentlyUsed.length===0)return null;
        const hist=appJson.raw.discover?.currentAccountHist||{};
        const fmtDAppName=id=>id.split('-').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
        const shown=recentlyUsed.slice(0,8);
        return(
          <div style={{marginTop:24,paddingTop:16,borderTop:'1px solid rgba(255,255,255,0.06)'}}>
            <div style={{fontSize:16,fontWeight:600,color:'#FFFFFF',marginBottom:12}}>Recent dApp activity</div>
            {shown.map((entry,i)=>{
              const histKey=Object.keys(hist).find(k=>k.includes(entry.id));
              const acctId=histKey?hist[histKey]:null;
              return(
                <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',borderBottom:i<shown.length-1?'1px solid rgba(255,255,255,0.04)':'none'}}>
                  <div style={{width:28,height:28,borderRadius:'50%',background:'rgba(255,255,255,0.06)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    <span style={{fontSize:11}}>🔗</span>
                  </div>
                  <span style={{flex:1,fontSize:13,fontWeight:500,color:'#FFFFFF'}}>{fmtDAppName(entry.id)}</span>
                  <span style={{fontSize:11,color:'#8A8A8E'}}>{entry.usedAt?new Date(entry.usedAt).toLocaleDateString():''}</span>
                </div>
              );
            })}
          </div>
        );
      })()}
      <div style={{height:32}}/>
    </div>
  </div>;
}

function CVMyLedger({logData,appJson,versionCheck,firmwareCheck,appVersionCheck}){
  const[appsTab,setAppsTab]=useState('installed');
  const dev=logData.dev||{};
  const da=logData.deviceApps;

  // Extract device data from app.json settings
  const ajSettings=appJson?.raw?.settings||appJson?.settings||{};
  const lastDevice=ajSettings.lastSeenDevice||{};
  const lastDeviceInfo=lastDevice.deviceInfo||{};
  const deviceModelList=ajSettings.devicesModelList||[];

  // Merge device info: prefer log data, fall back to app.json
  const modelId=dev.modelId||lastDevice.modelId||ajSettings.preferredDeviceModel||null;
  const modelName=dev.modelName||DN[modelId]||(modelId?modelId.replace(/([A-Z])/g,' $1').trim():null)||'Unknown Device';
  const firmware=dev.fw||lastDeviceInfo.version||lastDeviceInfo.seVersion||null;
  const mcuVersion=lastDeviceInfo.mcuVersion||null;
  const bootloaderVersion=lastDeviceInfo.bootloaderVersion||null;
  const onboarded=lastDeviceInfo.onboarded;
  const devMode=ajSettings.developerMode===true;
  const llVersion=ajSettings.lastUsedVersion||dev.appVer||null;
  const appLang=ajSettings.language||dev.lang||null;

  const appBarColors=['#6B8AFF','#FF8C42','#4ADE80','#FF4D6D','#FBBF24','#C084FC','#4FC3F7','#FF5300'];
  const chainForApp=name=>{
    const key=name.toLowerCase();
    return CHAINS[key]||Object.values(CHAINS).find(c=>(c.name||'').toLowerCase()===key||(c.ticker||'').toLowerCase()===key)||null;
  };
  const modelDisplayName=id=>DN[id]||(id?id.replace(/([A-Z])/g,' $1').trim():'Unknown');

  // Installed apps: prefer da, fall back to lastDevice.apps
  const installedApps=React.useMemo(()=>{
    let apps=[];
    if(da){
      if(da.source==='manager-result')apps=da.installed||[];
      else if(da.source==='apdu-only')apps=da.openedApps||[];
      else if(da.source==='catalog-only')apps=da.sessionInstalls||[];
    }
    if(apps.length===0&&lastDevice.apps&&lastDevice.apps.length>0){
      apps=lastDevice.apps.map(a=>typeof a==='string'?{name:a}:{name:a.name||a,version:a.version||null});
    }
    // Enrich with catalog bytes when available
    if(versionCheck?.status==='ok'&&versionCheck.apps){
      apps=apps.map(app=>{
        if(app.bytes)return app;
        const cat=versionCheck.apps.find(c=>c.name.toLowerCase()===app.name.toLowerCase());
        if(cat&&cat.bytes)return{...app,bytes:cat.bytes};
        return app;
      });
    }
    // Fallback: look up common app sizes by name
    apps=apps.map(app=>{
      if(app.bytes)return app;
      const knownSize=COMMON_APP_SIZES[app.name.toLowerCase()];
      if(knownSize)return{...app,bytes:knownSize};
      return app;
    });
    return apps;
  },[da,lastDevice.apps,versionCheck]);

  return <div>
    <div className="cv-content-header">
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
        <span style={{fontSize:20,fontWeight:700,color:'#FFFFFF'}}>{modelName}</span>
        {(onboarded===true||dev.fw)&&<span style={{fontSize:12,color:'#4FC46B',display:'flex',alignItems:'center',gap:4}}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          Ledger Genuine check
        </span>}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:4}}>
        <span style={{fontSize:13,color:'#8A8A8E'}}>OS version</span>
        <span style={{fontSize:12,background:'rgba(255,255,255,0.08)',borderRadius:4,padding:'2px 8px',fontFamily:MF,color:'#FFFFFF'}}>{firmware||'?'}</span>
        {firmwareCheck?.status==='ok'&&(firmwareCheck.outdated
          ?<span style={{fontSize:12,background:'rgba(255,189,66,0.12)',borderRadius:4,padding:'2px 8px',color:T.warning}}>⬆ Update: {firmwareCheck.latest}</span>
          :<span style={{fontSize:12,color:'#4FC46B'}}>✓ Up to date</span>)}
        {firmwareCheck?.status==='loading'&&<span style={{fontSize:12,color:'#8A8A8E'}}>Checking firmware…</span>}
      </div>
      <div style={{fontSize:12,color:'#8A8A8E',marginBottom:2}}>
        {llLabel(dev)}: {llVersion||'?'}
        {appVersionCheck?.status==='ok'&&(appVersionCheck.outdated?<span style={{color:T.warning,marginLeft:6}}>⬆ {appVersionCheck.latest} available</span>:<span style={{color:'#4FC46B',marginLeft:6}}>✓ Latest</span>)}
      </div>
      {appLang&&<div style={{fontSize:12,color:'#8A8A8E',marginBottom:2}}>Language: {appLang}</div>}
      {(mcuVersion||bootloaderVersion)&&<div style={{fontSize:11,color:'rgba(255,255,255,0.25)',fontFamily:MF}}>{[mcuVersion&&'MCU: '+mcuVersion,bootloaderVersion&&'Bootloader: '+bootloaderVersion].filter(Boolean).join(' · ')}</div>}
    </div>
    {devMode&&<div style={{background:'rgba(255,189,66,0.08)',border:'1px solid rgba(255,189,66,0.2)',borderRadius:8,padding:'14px 20px',margin:'0 32px 16px',display:'flex',alignItems:'flex-start',gap:10}}>
      <span style={{fontSize:16,flexShrink:0}}>ⓘ</span>
      <span style={{fontSize:13,color:T.warning,lineHeight:1.5}}>The experimental setting "Developer mode" may show unreleased OS and apps, leading to compatibility issues. You can disable it in settings.</span>
    </div>}
    {installedApps.length>0&&<div style={{padding:'0 32px 24px'}}>
      <div style={{fontSize:11,color:'#8A8A8E',fontWeight:600,letterSpacing:'0.06em',marginBottom:8}}>Storage</div>
      {(()=>{
        const appsWithBytes=installedApps.filter(a=>a.bytes>0);
        const appsWithoutBytes=installedApps.filter(a=>!a.bytes);
        const totalBytes=appsWithBytes.reduce((s,a)=>s+a.bytes,0);
        const hasAnyBytes=appsWithBytes.length>0;
        const estimatedUnknown=appsWithoutBytes.length*57344;
        const totalEstimated=totalBytes+estimatedUnknown;
        const hasPartial=appsWithoutBytes.length>0&&appsWithBytes.length>0;
        const hasNone=appsWithBytes.length===0;
        const capacity=DEVICE_CAPACITY[modelId]||DEVICE_CAPACITY.nanoX;
        const fmtKB=b=>b>=1024*1024?(b/1024/1024).toFixed(2)+' MB':Math.round(b/1024)+' KB';
        const approx=hasPartial||hasNone;
        const displayTotal=approx?totalEstimated:totalBytes;
        const freeDisplay=Math.max(0,capacity-displayTotal);
        return <>
          {hasAnyBytes&&<div style={{display:'flex',gap:16,fontSize:12,color:'#FFFFFF',marginBottom:8,flexWrap:'wrap'}}>
            <span>Used <strong>{approx?'~':''}{fmtKB(displayTotal)}</strong></span>
            <span>Capacity <strong>{fmtKB(capacity)}</strong></span>
            <span>Apps <strong>{installedApps.length}</strong></span>
            <span><strong>{approx?'~':''}{fmtKB(freeDisplay)}</strong> free</span>
          </div>}
          <div style={{height:24,borderRadius:6,background:'rgba(255,255,255,0.06)',display:'flex',overflow:'hidden',boxShadow:'inset 0 1px 3px rgba(0,0,0,0.3)'}}>
            {hasAnyBytes
              ?<>
                {appsWithBytes.map((app,idx)=>{
                  const ch=chainForApp(app.name);
                  const color=ch?.color||appBarColors[idx%appBarColors.length];
                  const pct=(app.bytes/capacity)*100;
                  return <div key={app.name} style={{height:'100%',width:pct+'%',minWidth:2,background:color+'CC',borderRight:'1px solid rgba(0,0,0,0.25)'}} title={app.name+' — '+Math.round(app.bytes/1024)+' KB'}/>;
                })}
                {appsWithoutBytes.length>0&&<div style={{height:'100%',width:(estimatedUnknown/capacity*100)+'%',minWidth:2,background:'rgba(255,255,255,0.15)',borderRight:'1px solid rgba(0,0,0,0.25)'}} title={appsWithoutBytes.length+' app'+(appsWithoutBytes.length!==1?'s':'')+' (size estimated)'}/>}
              </>
              :<div style={{width:Math.min(95,installedApps.length*5)+'%',height:'100%',display:'flex'}}>
                {installedApps.map((app,idx)=>{
                  const ch=chainForApp(app.name);
                  const color=ch?.color||appBarColors[idx%appBarColors.length];
                  return <div key={app.name} style={{height:'100%',flex:1,background:color+'CC',borderRight:'1px solid rgba(0,0,0,0.25)'}} title={app.name}/>;
                })}
              </div>
            }
          </div>
          <div style={{fontSize:11,color:'#8A8A8E',marginTop:4}}>
            {installedApps.length} app{installedApps.length!==1?'s':''} installed
            {hasPartial&&` · ${appsWithoutBytes.length} size${appsWithoutBytes.length!==1?'s':''} estimated`}
            {hasNone&&' · sizes unavailable'}
          </div>
        </>;
      })()}
    </div>}
    {deviceModelList.length>1&&<div style={{padding:'0 32px 16px'}}>
      <div style={{fontSize:11,color:'#8A8A8E',fontWeight:600,letterSpacing:'0.06em',marginBottom:10}}>Paired devices</div>
      <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
        {deviceModelList.map((mid,i)=>{
          const isLast=mid===(lastDevice.modelId||modelId);
          return <div key={i} style={{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',borderRadius:6,background:isLast?'rgba(187,176,255,0.1)':'rgba(255,255,255,0.04)',border:`1px solid ${isLast?'rgba(187,176,255,0.25)':'rgba(255,255,255,0.06)'}`}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={isLast?'#BBB0FF':'#8A8A8E'} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="18" r="1.5" fill={isLast?'#BBB0FF':'#8A8A8E'}/></svg>
            <span style={{fontSize:12,color:isLast?'#FFFFFF':'#8A8A8E',fontWeight:isLast?600:400}}>{modelDisplayName(mid)}</span>
            {isLast&&<span style={{fontSize:10,color:'#BBB0FF',fontFamily:MF}}>last used</span>}
          </div>;
        })}
      </div>
    </div>}
    <div style={{padding:'0 32px'}}>
      <div style={{display:'flex',gap:0,marginBottom:16,borderBottom:'1px solid rgba(255,255,255,0.06)'}}>
        {[['installed','Apps installed'],['catalog','App catalog']].map(([tab,label])=>(
          <button key={tab} onClick={()=>setAppsTab(tab)} style={{padding:'8px 16px',border:'none',background:'transparent',color:appsTab===tab?'#FFFFFF':'#8A8A8E',fontSize:13,fontWeight:appsTab===tab?600:400,cursor:'pointer',borderBottom:appsTab===tab?'2px solid #BBB0FF':'2px solid transparent',marginBottom:-1,transition:'color 150ms ease'}}>
            {label}
          </button>
        ))}
      </div>
      {appsTab==='installed'&&(installedApps.length===0
        ?<div style={{padding:'24px 0',color:'#8A8A8E',fontSize:13}}>No device app data available. This information is extracted when the customer accesses My Ledger in the app.</div>
        :installedApps.map((app,i)=>{
          const ch=chainForApp(app.name);
          const iconUrl=chainIconUrl(ch?.id||null);
          const cat=versionCheck?.status==='ok'?versionCheck.apps?.find(a=>a.name.toLowerCase()===app.name.toLowerCase()):null;
          const ticker=ch?.ticker||null;
          return <div key={app.name+i} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 0',borderBottom:i<installedApps.length-1?'1px solid rgba(255,255,255,0.06)':'none'}}>
            <div style={{width:36,height:36,borderRadius:'50%',background:ch?.color||'rgba(255,255,255,0.08)',display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',flexShrink:0}}>
              {iconUrl?<img src={iconUrl} alt={app.name} style={{width:22,height:22,objectFit:'contain'}} onError={e=>e.target.style.display='none'}/>:<span style={{fontSize:10,fontWeight:700,color:'#fff'}}>{app.name.slice(0,3).toUpperCase()}</span>}
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:14,fontWeight:500,color:'#FFFFFF'}}>{app.name}{ticker?<span style={{color:'#8A8A8E',fontWeight:400}}> ({ticker})</span>:''}</div>
              <div style={{fontSize:11,color:'#8A8A8E',marginTop:2}}>{[app.version,'Ledger',app.bytes?Math.round(app.bytes/1024)+' KB':null].filter(Boolean).join(' · ')}</div>
              <div style={{fontSize:11,color:'#4FC46B',marginTop:1,display:'flex',alignItems:'center',gap:3}}>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#4FC46B" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                Ledger Wallet supported
              </div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              {cat?(cat.outdated?<span style={{fontSize:12,color:T.warning}}>⬆ {cat.latest}</span>:<span style={{fontSize:12,color:'#4FC46B'}}>✓ Installed</span>):<span style={{fontSize:12,color:'#8A8A8E'}}>Installed</span>}
            </div>
          </div>;
        })
      )}
      {appsTab==='catalog'&&(!versionCheck||versionCheck.status==='loading'
        ?<div style={{padding:'24px 0',color:'#8A8A8E',fontSize:13}}>Loading app catalog…</div>
        :versionCheck.status!=='ok'||!versionCheck.apps?.length
          ?<div style={{padding:'24px 0',color:'#8A8A8E',fontSize:13}}>App catalog unavailable. Device may not have been connected during session.</div>
          :versionCheck.apps.map((app,i)=>{
            const ch=chainForApp(app.name);
            const iconUrl=chainIconUrl(ch?.id||null);
            return <div key={app.name+i} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 0',borderBottom:i<versionCheck.apps.length-1?'1px solid rgba(255,255,255,0.06)':'none'}}>
              <div style={{width:36,height:36,borderRadius:'50%',background:ch?.color||'rgba(255,255,255,0.08)',display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',flexShrink:0}}>
                {iconUrl?<img src={iconUrl} alt={app.name} style={{width:22,height:22,objectFit:'contain'}} onError={e=>e.target.style.display='none'}/>:<span style={{fontSize:10,fontWeight:700,color:'#fff'}}>{app.name.slice(0,3).toUpperCase()}</span>}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:500,color:'#FFFFFF'}}>{app.name}</div>
                <div style={{fontSize:11,color:'#8A8A8E',fontFamily:MF,marginTop:2}}>{app.latest||'?'}</div>
              </div>
              <div style={{textAlign:'right',flexShrink:0}}>
                {app.installed?<span style={{fontSize:12,color:app.outdated?T.warning:'#4FC46B'}}>{app.outdated?'⬆ Update':'✓ Installed'}</span>:<span style={{fontSize:12,color:'#8A8A8E'}}>Available</span>}
              </div>
            </div>;
          })
      )}
      {(logData.requiredApps||[]).length>0&&<div style={{marginTop:24,paddingTop:16,borderTop:'1px solid rgba(255,255,255,0.06)'}}>
        <div style={{fontSize:11,color:'#8A8A8E',fontWeight:600,letterSpacing:'0.06em',marginBottom:12}}>Required by accounts</div>
        {logData.requiredApps.map((ra,i)=>{
          const ch=chainForApp(ra.appName)||ra.chains?.[0];
          const iconUrl=ch?chainIconUrl(ch.id||ch.cid||null):null;
          const cat=versionCheck?.apps?.find(a=>a.name.toLowerCase()===ra.appName.toLowerCase());
          return <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',borderBottom:i<logData.requiredApps.length-1?'1px solid rgba(255,255,255,0.04)':'none'}}>
            <div style={{width:24,height:24,borderRadius:'50%',background:ch?.color||'rgba(255,255,255,0.06)',display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',flexShrink:0}}>
              {iconUrl?<img src={iconUrl} alt={ra.appName} style={{width:14,height:14,objectFit:'contain'}} onError={e=>e.target.style.display='none'}/>:<span style={{fontSize:8,fontWeight:700,color:'#fff'}}>{ra.appName.slice(0,3).toUpperCase()}</span>}
            </div>
            <span style={{fontSize:13,color:'#FFFFFF',flex:1}}>{ra.appName}</span>
            {ra.chains&&ra.chains.length>0&&<span style={{fontSize:11,color:'#8A8A8E'}}>{[...new Set(ra.chains.map(c=>c.ticker))].join(', ')}</span>}
            {cat?(cat.outdated?<span style={{fontSize:11,color:T.warning}}>⬆ Outdated</span>:cat.installed?<span style={{fontSize:11,color:'#4FC46B'}}>✓</span>:<span style={{fontSize:11,color:T.error}}>Missing</span>):null}
          </div>;
        })}
      </div>}
      <div style={{height:32}}/>
    </div>
  </div>;
}

/* ─── CVEarn ─────────────────────────────────────────────────────────────── */
const STAKING_APY={
  solana:{min:5,max:7,label:'~5-7%'},cosmos:{min:15,max:20,label:'~15-20%'},
  polkadot:{min:10,max:12,label:'~10-12%'},tezos:{min:4,max:6,label:'~5%'},
  tron:{min:3,max:5,label:'~3-5%'},near:{min:8,max:12,label:'~8-12%'},
  cardano:{min:3,max:5,label:'~3-5%'},algorand:{min:5,max:7,label:'~5-7%'},
  ethereum:{min:3,max:4,label:'~3-3.5%'},
};
const STAKING_TYPE={
  solana:'Delegation',cosmos:'Delegation',polkadot:'Nomination',
  tezos:'Baking (delegation)',tron:'Freeze + Vote',near:'Staking',
  cardano:'Delegation',algorand:'Governance',ethereum:'Liquid/Pooled',
};
const LST_PATTERNS=[
  {match:'steth',name:'Lido Staked ETH',ticker:'stETH',provider:'Lido'},
  {match:'coinbase_wrapped_staked_eth',name:'Coinbase Staked ETH',ticker:'cbETH',provider:'Coinbase'},
  {match:'jupiter_staked_sol',name:'Jupiter Staked SOL',ticker:'JupSOL',provider:'Jupiter'},
  {match:'lombard_staked_bitcoin',name:'Lombard Staked BTC',ticker:'LBTC',provider:'Lombard'},
  {match:'lc_staked_shared_eth',name:'Liquid Collective Staked ETH',ticker:'LsETH',provider:'Liquid Collective'},
  {match:'aave_ethereum_lido_weth',name:'Aave Lido WETH',ticker:'aWETH',provider:'Aave/Lido'},
  {match:'reth',name:'Rocket Pool ETH',ticker:'rETH',provider:'Rocket Pool'},
  {match:'staked_matic',name:'Staked MATIC',ticker:'stMATIC',provider:'Lido'},
];
const EARN_OP_LABELS={DELEGATE:'Delegated',UNDELEGATE:'Undelegated',STAKE:'Staked',UNSTAKE:'Unstaked',FREEZE:'Frozen',VOTE:'Voted',BOND:'Bonded',UNBOND:'Unbonded',NOMINATE:'Nominated',WITHDRAW_UNBONDED:'Withdrawn',WITHDRAW_UNSTAKED:'Withdrawn',REWARD:'Reward',CLAIM_REWARD:'Claimed reward'};

function CVEarn({enrichedAccts,appJson,onSelectAcct}){
  const[expandedAcct,setExpandedAcct]=useState(null);
  const[earnTab,setEarnTab]=useState('rewards');

  const positions=React.useMemo(()=>{
    const pos=[];
    (enrichedAccts||[]).forEach((a,idx)=>{
      if(!a.enriched||!a.ajBalance)return;
      const dec=DECIMALS[a.cid]||18;
      const total=parseFloat(a.ajBalance)/Math.pow(10,dec);
      const spendable=a.ajSpendable!=null?parseFloat(a.ajSpendable)/Math.pow(10,dec):total;
      const staked=total-spendable;
      if(Math.abs(staked)<0.000001)return;
      const ticker=a.ch.ticker;
      const fiatVal=cvFiatValue(appJson,a.cid,a.ajBalance);
      const stakedFiat=fiatVal!=null?(staked/total)*fiatVal:null;
      const apy=STAKING_APY[a.cid]||null;
      const stakingType=STAKING_TYPE[a.cid]||'Staking';
      const ops=(a.ajOperations||[]).filter(op=>['DELEGATE','UNDELEGATE','STAKE','UNSTAKE','FREEZE','VOTE','BOND','UNBOND','NOMINATE','WITHDRAW_UNBONDED','WITHDRAW_UNSTAKED','REWARD','CLAIM_REWARD'].includes((op.type||'').toUpperCase())).map(op=>({...op,type:(op.type||'').toUpperCase()}));
      const rewardOps=ops.filter(op=>op.type==='REWARD'||op.type==='CLAIM_REWARD');
      const totalReward=rewardOps.reduce((s,op)=>s+parseFloat(op.value||0),0)/Math.pow(10,dec);
      const rewardFiat=totalReward>0&&fiatVal!=null&&total>0?totalReward*(fiatVal/total):null;
      const validators=[];
      const seen=new Set();
      ops.forEach(op=>{
        if(['DELEGATE','STAKE','NOMINATE'].includes(op.type)){
          (op.recipients||[]).forEach(r=>{if(r&&!seen.has(r)){seen.add(r);validators.push(r);}});
          const sa=op.extra?.stake?.address;
          if(sa&&!seen.has(sa)){seen.add(sa);validators.push(sa);}
        }
        if(op.type==='VOTE'&&op.extra?.votes){
          op.extra.votes.forEach(v=>{if(v.address&&!seen.has(v.address)){seen.add(v.address);validators.push(v.address);}});
        }
      });
      const stakeDates=ops.filter(op=>['DELEGATE','STAKE','FREEZE','BOND'].includes(op.type)).map(op=>op.date).filter(Boolean).sort();
      const sinceDate=stakeDates.length>0?stakeDates[0].slice(0,10):null;
      pos.push({idx,id:a.id,displayName:a.displayName,cid:a.cid,ch:a.ch,ticker,total,spendable,staked,stakedFiat,apy,stakingType,rewardOps,totalReward,rewardFiat,validators:validators.slice(0,5),sinceDate,ops:ops.slice(0,20)});
    });
    return pos;
  },[enrichedAccts,appJson]);

  const lstPositions=React.useMemo(()=>{
    const lst=[];
    (enrichedAccts||[]).forEach((a,idx)=>{
      if(!a.enriched)return;
      (a.ajSubAccounts||[]).forEach(sub=>{
        const tid=(sub.tokenId||sub.id||'').toLowerCase();
        const bal=sub.balance||'0';
        if(bal==='0'||bal===0)return;
        const matched=LST_PATTERNS.find(p=>tid.includes(p.match));
        if(!matched)return;
        const tDec=getTokenDecimals(sub.tokenId||'',a.cid);
        const tHuman=parseFloat(bal)/Math.pow(10,tDec);
        if(tHuman<0.000001)return;
        const tFiat=cvTokenFiatValue(appJson,sub.tokenId||'',bal,a.cid);
        lst.push({parentName:a.displayName,parentIdx:idx,parentCid:a.cid,parentCh:a.ch,...matched,balance:tHuman,fiat:tFiat});
      });
    });
    return lst;
  },[enrichedAccts,appJson]);

  const totalStakedFiat=positions.reduce((s,p)=>s+(p.stakedFiat||0),0);
  const totalRewardFiat=positions.reduce((s,p)=>s+(p.rewardFiat||0),0);
  const lstTotalFiat=lstPositions.reduce((s,l)=>s+(l.fiat||0),0);
  const chainCount=[...new Set(positions.map(p=>p.cid))].length;
  const hasPositions=positions.length>0||lstPositions.length>0;

  if(!hasPositions)return <div style={{padding:'60px 32px',textAlign:'center'}}>
    <div style={{fontSize:32,marginBottom:16,opacity:0.3}}>🥩</div>
    <div style={{fontSize:16,fontWeight:600,color:'#FFFFFF',marginBottom:8}}>No staking positions found</div>
    <div style={{fontSize:13,color:'#8A8A8E',maxWidth:400,margin:'0 auto',lineHeight:1.6}}>
      This customer hasn't staked any assets, or the staking data isn't available in the app.json export.
      <br/><br/>
      Staking is available for SOL, ATOM, DOT, XTZ, TRX, NEAR, ADA, and ALGO directly in Ledger Wallet. ETH liquid staking is available via Lido, Kiln, and Coinbase.
    </div>
  </div>;

  return <div>
    {/* Tab bar */}
    <div style={{padding:'0 32px',borderBottom:'2px solid rgba(255,255,255,0.06)',display:'flex'}}>
      {['rewards','opportunities'].map(t=><div key={t} onClick={()=>setEarnTab(t)} style={{padding:'14px 24px',fontSize:14,fontWeight:600,cursor:'pointer',borderBottom:earnTab===t?'2px solid #FFFFFF':'2px solid transparent',marginBottom:-2,color:earnTab===t?'#FFFFFF':'#8A8A8E',transition:'color 150ms'}}>
        {t==='rewards'?'My rewards':'Earn opportunities'}
      </div>)}
    </div>

    {earnTab==='rewards'&&<div style={{padding:'0 32px'}}>
      {/* Summary cards */}
      <div style={{display:'flex',gap:16,marginTop:20,marginBottom:24}}>
        <div style={{flex:1,background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.06)',borderRadius:8,padding:'16px 20px'}}>
          <div style={{height:20,borderRadius:4,display:'flex',overflow:'hidden',marginBottom:12}}>
            {(()=>{
              const chains=[...new Set(positions.map(p=>p.cid))];
              const tot=positions.reduce((s,p)=>s+(p.stakedFiat||0),0)||1;
              return chains.map(cid=>{
                const cf=positions.filter(p=>p.cid===cid).reduce((s,p)=>s+(p.stakedFiat||0),0);
                const ch=positions.find(p=>p.cid===cid)?.ch;
                return <div key={cid} style={{height:'100%',width:(cf/tot*100)+'%',minWidth:2,background:(ch?.color||'#666')+'CC'}} title={`${ch?.name||cid}: ${cvFmtFiat(cf,appJson)||''}`}/>;
              });
            })()}
          </div>
          <div style={{fontSize:13,color:'#8A8A8E',marginBottom:4}}>Total deposited</div>
          <div style={{fontSize:28,fontWeight:700,color:'#FFFFFF'}}>{totalStakedFiat>0?cvFmtFiat(totalStakedFiat,appJson):positions.length+' positions'}</div>
          <div style={{fontSize:12,color:'#8A8A8E',marginTop:2}}>{positions.length} asset{positions.length!==1?'s':''} · {chainCount} chain{chainCount!==1?'s':''}</div>
        </div>
        <div style={{flex:1,background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.06)',borderRadius:8,padding:'16px 20px'}}>
          <div style={{fontSize:13,color:'#8A8A8E',marginBottom:4}}>Total rewards</div>
          <div style={{fontSize:28,fontWeight:700,color:'#4FC46B'}}>{totalRewardFiat>0?'+'+cvFmtFiat(totalRewardFiat,appJson):positions.some(p=>p.totalReward>0)?positions.filter(p=>p.totalReward>0).map(p=>'+'+p.totalReward.toFixed(4)+' '+p.ticker).join(', '):'No reward data'}</div>
          <div style={{fontSize:12,color:'#8A8A8E',marginTop:2}}>{(()=>{const earliest=positions.map(p=>p.sinceDate).filter(Boolean).sort();return earliest.length>0?'Since '+earliest[0]:'Reward operations not available for all chains';})()}</div>

      <div style={{display:'grid',gridTemplateColumns:'2.5fr 1.5fr 1fr 1.5fr',padding:'8px 0',borderBottom:'1px solid rgba(255,255,255,0.06)',fontSize:10,color:'#8A8A8E',fontWeight:600,letterSpacing:'0.06em',fontFamily:MF}}>

        const iconUrl=chainIconUrl(p.cid);

            onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.02)'}

              {p.validators.map((v,i)=>{

                  {(v.includes('figment')||v.includes('ledger'))&&<span style={{fontSize:9,color:'#BBB0FF',padding:'1px 5px',borderRadius:3,background:'rgba(187,176,255,0.1)'}}>Ledger</span>}
                </div>;

            <div style={{display:'flex',gap:16,flexWrap:'wrap',marginBottom:10}}>
              <div style={{fontSize:11,color:'#8A8A8E'}}>Total: <span style={{color:'#FFFFFF',fontFamily:MF}}>{p.total.toLocaleString(undefined,{maximumFractionDigits:6})} {p.ticker}</span></div>
              <div style={{fontSize:11,color:'#8A8A8E'}}>Available: <span style={{color:'#4FC46B',fontFamily:MF}}>{p.spendable.toLocaleString(undefined,{maximumFractionDigits:6})} {p.ticker}</span></div>
              {p.sinceDate&&<div style={{fontSize:11,color:'#8A8A8E'}}>Since: <span style={{color:'#FFFFFF'}}>{p.sinceDate}</span></div>}
            </div>
            {p.ops.length>0&&<div style={{marginBottom:8}}>
              <div style={{fontSize:10,fontWeight:700,color:'#8A8A8E',letterSpacing:'0.06em',marginBottom:6,fontFamily:MF}}>Recent activity ({p.ops.length})</div>
              {p.ops.slice(0,8).map((op,i)=>{

                return <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'4px 0',fontSize:11}}>
                  <span style={{color:isReward?'#4FC46B':isUnstake?T.warning:'#8A8A8E',fontWeight:600,minWidth:80}}>{opLabel}</span>
                  {val>0.000001&&<span style={{color:'#FFFFFF',fontFamily:MF}}>{val.toLocaleString(undefined,{maximumFractionDigits:6})} {p.ticker}</span>}
                  <span style={{color:'#8A8A8E',marginLeft:'auto'}}>{op.date?op.date.slice(0,10):''}</span>
                </div>;

      {/* Liquid staking tokens */}
      {lstPositions.length>0&&<div style={{marginTop:24,marginBottom:12}}>
        <div style={{fontSize:16,fontWeight:600,color:'#FFFFFF',marginBottom:4}}>Liquid staking tokens</div>

        {lstPositions.map((l,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 0',borderBottom:i<lstPositions.length-1?'1px solid rgba(255,255,255,0.04)':'none'}}>
          <div style={{width:32,height:32,borderRadius:'50%',background:l.parentCh.color||'#333',display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',flexShrink:0}}>
