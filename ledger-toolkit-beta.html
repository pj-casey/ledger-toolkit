          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:500,color:'#FFFFFF'}}>{l.name}<span style={{color:'#8A8A8E',fontWeight:400}}> ({l.ticker})</span></div>
            <div style={{fontSize:11,color:'#8A8A8E'}}>via {l.provider} · {l.parentName}</div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:13,fontWeight:600,color:'#FFFFFF',fontFamily:MF}}>{l.balance.toLocaleString(undefined,{maximumFractionDigits:6})}</div>
            {l.fiat!=null&&<div style={{fontSize:11,color:'#8A8A8E'}}>{cvFmtFiat(l.fiat,appJson)}</div>}
          </div>
        </div>)}
      </div>}

      <div style={{marginTop:20,marginBottom:24,padding:'10px 14px',borderRadius:6,background:'rgba(255,255,255,0.02)',border:'1px solid rgba(255,255,255,0.04)',fontSize:10,color:'rgba(255,255,255,0.3)',lineHeight:1.6}}>
        APY rates are estimates based on publicly available data and may vary. Rewards are not guaranteed. Actual returns depend on validator performance, network conditions, and commission rates. Data shown reflects the customer's app.json export — rewards that auto-compound (SOL, DOT) may not appear as discrete operations.
      </div>
    </div>}

    {earnTab==='opportunities'&&<div style={{padding:'40px 32px',textAlign:'center'}}>
      <div style={{fontSize:32,marginBottom:16,opacity:0.3}}>🔍</div>
      <div style={{fontSize:16,fontWeight:600,color:'#FFFFFF',marginBottom:8}}>Earn opportunities</div>
      <div style={{fontSize:13,color:'#8A8A8E',maxWidth:440,margin:'0 auto',lineHeight:1.6}}>
        The customer can explore staking opportunities in Ledger Wallet → Earn tab.
        <div style={{marginTop:12,textAlign:'left',display:'inline-block'}}>
          {[['Ledger by Figment','SOL, ATOM, DOT, NEAR (native delegation)'],['Kiln','ETH pooled staking (min 0.001 ETH)'],['Lido','ETH → stETH (liquid staking)'],['Coinbase','ETH → cbETH (US users)'],['Yield.xyz','AVAX, DOT, TRX, POL, BNB, CRO'],['Native','XTZ, TRX, ATOM, ALGO, DOT (in-app delegation)']].map(([name,desc])=>
            <div key={name} style={{padding:'4px 0'}}>• <strong style={{color:'#fff'}}>{name}</strong> — {desc}</div>
          )}
        </div>
      </div>
    </div>}
  </div>;
}

// E2 — a single findings-list row. A severity:'red' finding gets a noticeable
// entrance (rise + fade, then ONE red-tinted flash) the FIRST time it appears per
// file load. The decision is frozen at mount via useMemo([]) so frequent parent
// re-renders (balances arriving) never truncate or re-fire the animation. Green/
// amber rows are unchanged.
const CVFindingRow=({f,s,isSel,onClick})=>{
  const enter=React.useMemo(()=>{
    if(f.severity!=='red'||prefersReducedMotion()||_critSeen.has(f.id))return '';
    _critSeen.add(f.id);return 'bi-crit-enter';
  },[]);
  return <div className={enter} onClick={onClick}
    style={{display:'flex',alignItems:'center',gap:8,padding:'9px 14px',cursor:'pointer',borderBottom:'1px solid rgba(255,255,255,0.04)',background:isSel?s.color+'0F':'transparent',borderLeft:isSel?`2px solid ${s.color}`:'2px solid transparent',transition:'background 120ms'}}>
    <div style={{width:7,height:7,borderRadius:'50%',background:s.dot,flexShrink:0}}/>
    <div style={{flex:1,minWidth:0}}>
      <div style={{display:'flex',alignItems:'center',gap:4}}>
        <div style={{fontSize:12,fontWeight:isSel?600:400,color:isSel?'#FFFFFF':'#C0C0C0',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',flex:1}}>{f.title}</div>
        {f.hasStaking&&<span style={{fontSize:9,flexShrink:0}} title="Has staked/frozen funds">🥩</span>}
      </div>
      {f.kind==='account'&&(f.badges||[]).length>0&&<div style={{display:'flex',gap:3,marginTop:2,flexWrap:'wrap'}}>
        {f.badges.map(b=><span key={b} style={{fontSize:9,padding:'1px 5px',borderRadius:2,background:s.color+'1A',color:s.color,fontWeight:700}}>{b}</span>)}
      </div>}
    </div>
  </div>;
};
function CVAgentInsights({logData,liveBalances,liveTokenBalances,enrichedAccts,versionCheck,firmwareCheck,appVersionCheck,appJson,onViewAccount,onViewPortfolio,onViewMyLedger}){
  const[selectedId,setSelectedId]=useState(null);
  const[copiedId,setCopiedId]=useState(null);
  const[viewMode,setViewMode]=useState('issues');
  const errs=logData.errs||[];
  const highCount=errs.filter(e=>e.dg?.s==='high').length;
  const medCount=errs.filter(e=>e.dg?.s==='medium').length;
  const lowCount=errs.filter(e=>e.dg?.s==='low').length;
  const q=logData.quality;
  const act=logData.activity||{};
  const dev=logData.dev||{};
  const lb=liveBalances||{};
  const lbVals=Object.values(lb);
  const fetchedCount=lbVals.filter(v=>v?.status==='ok'&&v.bal!=null).length;
  const acctCount=Math.max(logData.accts?.length||0,(enrichedAccts||[]).length);
  const hasAppJson=(enrichedAccts||[]).some(a=>a.enriched&&a.ajBalance!=null);
  const ajSettings=appJson?.raw?.settings||appJson?.settings||{};
  const snapshotDate=React.useMemo(()=>{
    if(!appJson)return null;
    const rm=cvGetRateMap(appJson);
    const allDates=Object.values(rm).flatMap(d=>typeof d==='object'?Object.keys(d):[]).filter(k=>/^\d{4}-\d{2}/.test(k));
    if(!allDates.length)return null;
    return allDates.sort()[allDates.length-1];
  },[appJson]);
  const daysSinceSnapshot=snapshotDate?Math.round((Date.now()-new Date(snapshotDate+'T12:00:00').getTime())/(1000*60*60*24)):null;
  // ── Unified findings engine ─────────────────────────────────────────────────
  const findings=React.useMemo(()=>{
    const f=[];
    // ── Per-account findings ──────────────────────────────────────────────────
    (enrichedAccts||[]).forEach((a,idx)=>{
      if(!a.enriched||a.ajBalance==null)return;
      const dec=DECIMALS[a.cid]||18;
      const cust=parseFloat(a.ajBalance)/Math.pow(10,dec);
      const custSpendable=a.ajSpendable!=null&&a.ajSpendable!==a.ajBalance?parseFloat(a.ajSpendable)/Math.pow(10,dec):null;
      const hasStaking=custSpendable!=null&&Math.abs(cust-custSpendable)>0.000001;
      const stakedAmount=hasStaking?cust-custSpendable:0;
      const compareBalance=hasStaking?custSpendable:cust;
      const lbEntry=liveBalances[a.id];
      const live=lbEntry?.bal!=null?lbEntry.bal:null;
      const hasBoth=compareBalance!=null&&live!=null;
      const delta=hasBoth?live-compareBalance:null;
      const pct=hasBoth&&compareBalance>0?Math.abs(delta)/compareBalance*100:0;
      const isMismatch=hasBoth&&pct>0.01;
      const pendingCount=(a.ajPendingOps||[]).length;
      const failedCount=(a.ajOperations||[]).filter(op=>op.hasFailed||op.status==='failed').length;
      const hasLogErrs=a.addr&&a.addr.length>4&&errs.some(e=>(e.det||e.msg||'').includes(a.addr));
      const isIssue=isMismatch||pendingCount>0||failedCount>0||hasLogErrs;
      if(!isIssue&&viewMode!=='all')return;
      const custFiatVal=cvFiatValue(appJson,a.cid,a.ajBalance);
      const custSpendFiatVal=hasStaking&&a.ajSpendable!=null?cvFiatValue(appJson,a.cid,a.ajSpendable):custFiatVal;
      const custRate=cvLatestRate(appJson,a.cid);
      const liveFiatAtCustRate=(live!=null&&custRate?.rate)?live*custRate.rate:null;
      const liveMarketFiat=lbEntry?.fiat!=null?lbEntry.fiat:null;
      const ticker=a.ch.ticker;
      // Drain classification: balance dropped >90% AND customer had real value (>$50 fiat or >0.001 crypto)
      const custFiatForDrain=cvFiatValue(appJson,a.cid,a.ajBalance)||0;
      // Staking guard: if sub-accounts hold ≥50% of account fiat value, the "missing" main balance
      // likely became liquid staking tokens (stETH, rETH, etc.) — not a drain.
      // Note: native-chain staking (Cosmos/Solana) is already handled by hasStaking → compareBalance=custSpendable.
      const subAcctFiatSum=(a.ajSubAccounts||[]).reduce((s,t)=>
        s+(t.balance&&parseFloat(t.balance)>0?cvTokenFiatValue(appJson,t.tokenId||'',t.balance,a.cid)||0:0),0);
      const isDrained=hasBoth&&delta<0&&compareBalance>0&&(live/compareBalance)<0.1
        &&(custFiatForDrain>50||compareBalance>0.001)
        &&subAcctFiatSum<custFiatForDrain*0.5;
      const badges=[];
      if(isDrained)badges.push('DRAINED');
      else if(isMismatch)badges.push('CHANGED');
      if(pendingCount>0)badges.push(`${pendingCount} PENDING`);
      if(failedCount>0)badges.push(`${failedCount} FAILED`);
      if(hasLogErrs&&!isMismatch&&pendingCount===0&&failedCount===0)badges.push('LOG ERRORS');
      const severity=isIssue?(isMismatch||pendingCount>0?'red':'amber'):'green';
      const title=isDrained?`DRAINED — ${a.displayName}`:isMismatch?`Balance changed — ${a.displayName}`:pendingCount>0?`Pending transaction${pendingCount>1?'s':''} — ${a.displayName}`:failedCount>0?`${failedCount} failed tx — ${a.displayName}`:hasLogErrs?`Log errors — ${a.displayName}`:`${a.displayName} — ✓ match`;
      const statusLabel=lbEntry?.status==='loading'?'···':!live?'no live data':isMismatch?(delta>0?'▲ on-chain higher':'▼ on-chain lower'):hasBoth?'✓ match':'—';
      const acctErrs=a.addr&&a.addr.length>4?errs.filter(e=>(e.det||e.msg||'').includes(a.addr)).slice(0,2):[];
      f.push({
        id:`acct-${a.id}`,kind:'account',severity,title,acctIdx:idx,
        custBal:cust!=null?cust.toLocaleString(undefined,{maximumFractionDigits:6})+' '+ticker:null,
        custFiat:cvFmtFiat(custFiatVal,appJson),
        liveBal:live!=null?live.toLocaleString(undefined,{maximumFractionDigits:6})+' '+ticker:lbEntry?.status==='loading'?'···':null,
        liveFiat:liveFiatAtCustRate!=null?cvFmtFiat(liveFiatAtCustRate,appJson):null,
        liveMarketFiat:liveMarketFiat!=null?cvFmtFiat(liveMarketFiat,appJson):null,
        delta:delta!=null&&Math.abs(delta)>=0.000001?(delta>0?'+':'')+delta.toLocaleString(undefined,{maximumFractionDigits:6})+' '+ticker:hasBoth?'0':null,
        deltaFiat:custSpendFiatVal!=null&&liveFiatAtCustRate!=null?cvFmtFiat(liveFiatAtCustRate-custSpendFiatVal,appJson):null,
        statusLabel,badges,
        snapshotDate,daysSinceSnapshot,
        rateLabel:custRate?.rate?`@ $${custRate.rate.toFixed(2)}/${ticker}`:null,
        hasStaking,
        stakedAmount:hasStaking?stakedAmount.toLocaleString(undefined,{maximumFractionDigits:6})+' '+ticker:null,
        custSpendableBal:custSpendable!=null?custSpendable.toLocaleString(undefined,{maximumFractionDigits:6})+' '+ticker:null,
        custTotalBal:cust.toLocaleString(undefined,{maximumFractionDigits:6})+' '+ticker,
        detail:isDrained?`This account appears to have been drained. The customer's app shows ${cust.toFixed(4)} ${ticker}${custFiatForDrain>0?' ('+cvFmtFiat(custFiatForDrain,appJson)+')':''} but the blockchain now has ${live!=null?live.toFixed(4):0} ${ticker}. This is a ${((1-live/compareBalance)*100).toFixed(0)}% loss.${daysSinceSnapshot!=null?' Data is '+daysSinceSnapshot+' day'+(daysSinceSnapshot!==1?'s':'')+' old.':''}`:isMismatch?(hasStaking?`This account has ${stakedAmount.toFixed(4)} ${ticker} staked/frozen. Comparing only the available ${custSpendable.toFixed(4)} ${ticker} to the live balance of ${live.toFixed(4)} ${ticker}.${Math.abs(delta)>0.000001?' The available balance has changed — this could be normal activity since the export or a sync issue.':' The available balance matches on-chain.'}`:`The customer's app shows ${cust.toFixed(4)} ${ticker} (as of ${snapshotDate||'export'}) but the blockchain currently has ${live.toFixed(4)} ${ticker}.${daysSinceSnapshot!=null&&daysSinceSnapshot>0?` The data is ${daysSinceSnapshot} day${daysSinceSnapshot!==1?'s':''} old — differences may be from normal transactions since the export.`:''} If the customer reports seeing a wrong balance without having transacted, this may indicate a sync issue.`):pendingCount>0?`This account has ${pendingCount} unconfirmed transaction${pendingCount!==1?'s':''} that may be stuck.`:failedCount>0?`This account has ${failedCount} failed transaction${failedCount!==1?'s':''} in its history.`:hasLogErrs?'Log errors reference this account\'s address.':(hasStaking?`Balance matches on-chain. This account has ${stakedAmount.toFixed(4)} ${ticker} staked/frozen — the comparison uses available balance only.`:'Balance matches on-chain.'),
        action:isDrained?'ESCALATE immediately. Do NOT advise the customer to continue using this seed phrase. If multiple accounts are drained, the recovery phrase is likely compromised. Guide the customer to: (1) Stop using all accounts on this seed, (2) Set up a new device with a new seed, (3) File a police report, (4) Report to ic3.gov (US) or equivalent.':isMismatch?`${daysSinceSnapshot!=null&&daysSinceSnapshot>1?'Data is '+daysSinceSnapshot+' days old. ':''}Ask the customer if they made transactions since the export. If not, this is a sync issue — guide them to force-sync: My Accounts → swipe down to refresh. If it persists, clear app cache.`:pendingCount>0?'Check if transaction is visible on chain explorer. Customer may need to speed up or cancel.':failedCount>0?'Review failed transactions in account detail for context.':'No action needed.',
        navigate:{type:'account',idx},
        copyText:`${a.displayName} (${a.ch.name})\n  Address: ${a.addr||'—'}\n  Customer sees: ${cust!=null?cust.toFixed(6)+' '+ticker:'—'}${custFiatVal!=null?' ('+cvFmtFiat(custFiatVal,appJson)+')':''}${hasStaking?' [staked: '+stakedAmount.toFixed(6)+' '+ticker+', available: '+custSpendable.toFixed(6)+' '+ticker+']':''}\n  On-chain: ${live!=null?live.toFixed(6)+' '+ticker:'—'}${liveFiatAtCustRate!=null?' ('+cvFmtFiat(liveFiatAtCustRate,appJson)+' at customer rate)':''}\n  Delta (vs available): ${delta!=null?delta.toFixed(6):'—'}\n  Status: ${isIssue?badges.join(', '):'OK'}${snapshotDate?'\n  Snapshot: '+snapshotDate:''}`,
        evidence:[
          ...(a.ajSubAccounts||[]).slice(0,3).map(s=>({label:(s.tokenId||'').split('/').pop().replace(/__/g,' ').replace(/_/g,' '),detail:s.balance?(parseFloat(s.balance)/Math.pow(10,getTokenDecimals(s.tokenId||'',a.cid))).toLocaleString(undefined,{maximumFractionDigits:4}):'0'})),
          ...acctErrs.map(e=>({label:'Log error',detail:e.dg?.t||e.msg||'Unknown'})),
          ...(a.ajBlockHeight!=null?[{label:'Last synced block',detail:Number(a.ajBlockHeight).toLocaleString()}]:[]),
        ],
        _subAccounts:a.ajSubAccounts||[],_pendingOps:a.ajPendingOps||[],_failedCount:failedCount,_blockHeight:a.ajBlockHeight,_acctCid:a.cid,_isDrained:isDrained,_ajOps:a.ajOperations||[],_addr:a.addr||'',_displayName:a.displayName||a.ch.name,_ch:a.ch,_custFiatForDrain:custFiatForDrain,
      });
    });
    // ── Drain summary finding (cross-account aggregation) ─────────────────────
    const drainedFindings=f.filter(x=>x._isDrained);
    if(drainedFindings.length>0){
      // Extract drain transactions from each drained account's operations
      const drainAccts=drainedFindings.map(df=>{
        const ops=(df._ajOps||[]);
        const dec=DECIMALS[df._acctCid]||18;
        // Find OUT operations — these are the drain transactions
        const outOps=ops.filter(op=>op.type==='OUT'||op.type==='FEES').map(op=>({
          hash:op.hash,date:op.date,type:op.type,
          value:op.value!=null?parseFloat(op.value)/Math.pow(10,dec):0,
          valueFiat:op.value!=null&&op.date?(()=>{const r=cvRateOnDate(appJson,df._acctCid,op.date.slice(0,10));return r!=null?(parseFloat(op.value)/Math.pow(10,dec))*r:null;})():null,
          recipients:op.recipients||[],
          senders:op.senders||[],
          txUrl:op.hash&&TX_EXPLORERS[df._acctCid]?TX_EXPLORERS[df._acctCid](op.hash):null,
        })).sort((a,b)=>new Date(b.date)-new Date(a.date));
        // Token sub-account drains
        const tokenDrains=(df._subAccounts||[]).filter(s=>{
          const tb=s.balance?parseFloat(s.balance):0;
          return tb===0&&(s.operationsCount>0||(s.operations||[]).length>0);
        }).map(s=>{
          const nm=(s.tokenId||'').split('/').pop().replace(/__/g,' ').replace(/_/g,' ');
          const tokenOuts=(s.operations||[]).filter(op=>op.type==='OUT').map(op=>({
            hash:op.hash,date:op.date,recipients:op.recipients||[],
            txUrl:op.hash&&TX_EXPLORERS[df._acctCid]?TX_EXPLORERS[df._acctCid](op.hash):null,
          }));
          return{name:nm,tokenId:s.tokenId,ops:tokenOuts};
        });
        return{
          acctIdx:df.acctIdx,cid:df._acctCid,ch:df._ch,addr:df._addr,
          displayName:df._displayName,custFiat:df._custFiatForDrain,
          custBal:df.custBal,liveBal:df.liveBal,delta:df.delta,
          outOps:outOps.slice(0,20),tokenDrains,
        };
      });
      // Aggregate recipient addresses across all drained accounts
      const recipientMap={};
      for(const da of drainAccts){
        for(const op of da.outOps){
          for(const r of op.recipients){
            if(!r||r.length<8)continue;
            const key=r.toLowerCase();
            if(!recipientMap[key])recipientMap[key]={addr:r,chains:[],totalFiat:0,txCount:0};
            recipientMap[key].chains.push({cid:da.cid,ch:da.ch,hash:op.hash,value:op.value,valueFiat:op.valueFiat,date:op.date,txUrl:op.txUrl});
            if(op.valueFiat)recipientMap[key].totalFiat+=op.valueFiat;
            recipientMap[key].txCount++;
          }
        }
        // Token drain recipients
        for(const td of da.tokenDrains){
          for(const op of td.ops){
            for(const r of op.recipients){
              if(!r||r.length<8)continue;
              const key=r.toLowerCase();
              if(!recipientMap[key])recipientMap[key]={addr:r,chains:[],totalFiat:0,txCount:0};
              recipientMap[key].chains.push({cid:da.cid,ch:da.ch,hash:op.hash,date:op.date,txUrl:op.txUrl,tokenName:td.name});
              recipientMap[key].txCount++;
            }
          }
        }
      }
      const recipients=Object.values(recipientMap).sort((a,b)=>b.txCount-a.txCount||b.totalFiat-a.totalFiat);
      // Filter out the customer's own addresses (they appear as senders in drain OUTs)
      const customerAddrs=new Set(drainAccts.map(da=>da.addr.toLowerCase()).filter(Boolean));
      const attackerRecipients=recipients.filter(r=>!customerAddrs.has(r.addr.toLowerCase()));
      // Total loss calculation
      const totalLossFiat=drainedFindings.reduce((s,df)=>s+(df._custFiatForDrain||0),0);
      const chainSummary=[...new Set(drainAccts.map(da=>da.ch.name))];
      // Time window of drain operations
      const allDrainDates=drainAccts.flatMap(da=>da.outOps.map(op=>op.date)).filter(Boolean).sort();
      const drainEarliest=allDrainDates[0]||null;
      const drainLatest=allDrainDates[allDrainDates.length-1]||null;
      const drainWindowMs=drainEarliest&&drainLatest?new Date(drainLatest)-new Date(drainEarliest):0;
      const drainWindowLabel=drainWindowMs<3600000?Math.round(drainWindowMs/60000)+' minutes':drainWindowMs<86400000?Math.round(drainWindowMs/3600000)+' hours':Math.round(drainWindowMs/86400000)+' days';
      const isSeedCompromise=drainedFindings.length>=2;
      const totalTokenDrains=drainAccts.reduce((s,da)=>s+da.tokenDrains.length,0);
      // Build copy report
      const copyLines=[
        '══════════════════════════════════════',
        isSeedCompromise?'⚠ SEED COMPROMISE — MULTI-CHAIN DRAIN':'⚠ DRAIN DETECTED',
        '══════════════════════════════════════',
        '',
        `Total estimated loss: ${cvFmtFiat(totalLossFiat,appJson)||'$'+totalLossFiat.toFixed(2)}`,
        `Accounts affected: ${drainedFindings.length} across ${chainSummary.length} chain${chainSummary.length!==1?'s':''}`,
        `Chains: ${chainSummary.join(', ')}`,
        drainEarliest?`Drain window: ${drainEarliest.slice(0,10)} to ${drainLatest.slice(0,10)} (${drainWindowLabel})`:'',
        totalTokenDrains>0?`Tokens drained: ${totalTokenDrains} token${totalTokenDrains!==1?'s':''} also emptied`:'',
        `Snapshot date: ${snapshotDate||'unknown'}`,
        `User ID: ${dev.userId||'unknown'}`,
        `Device: ${dev.modelName||'unknown'} · FW ${dev.fw||'unknown'}`,
        '',
        '── DRAINED ACCOUNTS ──',
        '',
      ];
      for(const da of drainAccts){
        copyLines.push(`${da.displayName} (${da.ch.name})`);
        copyLines.push(`  Address: ${da.addr}`);
        copyLines.push(`  Before: ${da.custBal}${da.custFiat>0?' ('+cvFmtFiat(da.custFiat,appJson)+')':''}`);
        copyLines.push(`  Now: ${da.liveBal||'0'}`);
        if(da.outOps.length>0){
          copyLines.push(`  Drain transactions:`);
          for(const op of da.outOps.slice(0,10)){
            copyLines.push(`    ${op.date?op.date.slice(0,10):''} ${op.type} ${op.value.toFixed(6)} ${da.ch.ticker} → ${(op.recipients[0]||'?')}${op.txUrl?' '+op.txUrl:''}`);
          }
        }
        if(da.tokenDrains.length>0){
          copyLines.push(`  Tokens drained: ${da.tokenDrains.map(t=>t.name).join(', ')}`);
        }
        copyLines.push('');
      }
      if(attackerRecipients.length>0){
        copyLines.push('── FUNDS SENT TO ──');
        copyLines.push('');
        for(const r of attackerRecipients.slice(0,15)){
          const chainsUsed=[...new Set(r.chains.map(c=>c.ch.name))];
          const addrUrl=r.chains[0]?.ch?.url?r.chains[0].ch.url(r.addr):null;
          copyLines.push(`${r.addr}`);
          copyLines.push(`  ${r.txCount} transaction${r.txCount!==1?'s':''} from ${chainsUsed.join(', ')}${r.totalFiat>0?' · ~'+cvFmtFiat(r.totalFiat,appJson):''}`);
          if(addrUrl)copyLines.push(`  Explorer: ${addrUrl}`);
          copyLines.push('');
        }
      }
      copyLines.push('══════════════════════════════════════');
      f.unshift({
        id:'drain-alert',kind:'drain',severity:'red',
        title:isSeedCompromise?`SEED COMPROMISE — ${drainedFindings.length} accounts drained across ${chainSummary.length} chain${chainSummary.length!==1?'s':''}`:`DRAIN DETECTED — ${drainAccts[0].displayName}`,
        detail:isSeedCompromise?`${drainedFindings.length} accounts across ${chainSummary.join(', ')} have been emptied. Estimated loss: ${cvFmtFiat(totalLossFiat,appJson)||'$'+totalLossFiat.toFixed(2)}. Multiple chains drained indicates the recovery phrase is compromised — all accounts derived from this seed should be considered at risk.`:`${drainAccts[0].displayName} appears drained. Balance went from ${drainAccts[0].custBal} to ${drainAccts[0].liveBal||'~0'}. Estimated loss: ${cvFmtFiat(totalLossFiat,appJson)||'$'+totalLossFiat.toFixed(2)}.`,
        action:isSeedCompromise?'ESCALATE immediately. The recovery phrase is compromised. ALL accounts on this seed are at risk. Guide customer: (1) Do NOT use this seed phrase or any accounts on it, (2) Set up a NEW device with a NEW seed, (3) Transfer any remaining funds from new addresses only, (4) File a police report, (5) Report to ic3.gov (US) or local equivalent. Preserve this drain report for law enforcement.':'ESCALATE. Guide the customer to stop using this account. If other accounts on the same seed are intact, this may be a single-chain exploit (e.g., malicious approval). Check token approvals on revoke.cash. If multiple chains are affected, treat as seed compromise.',
        navigate:null,
        copyText:copyLines.filter(Boolean).join('\n'),
        evidence:attackerRecipients.slice(0,5).map(r=>{
          const chainsUsed=[...new Set(r.chains.map(c=>c.ch.ticker))];
          return{label:`→ ${r.addr.slice(0,8)}…${r.addr.slice(-6)}`,detail:`${r.txCount} tx from ${chainsUsed.join(',')}${r.totalFiat>0?' · ~'+cvFmtFiat(r.totalFiat,appJson):''}`};
        }),
        _drainAccts:drainAccts,_attackerRecipients:attackerRecipients,_totalLossFiat:totalLossFiat,
        _isSeedCompromise:isSeedCompromise,_chainSummary:chainSummary,
        _drainWindowLabel:drainWindowLabel,_drainEarliest:drainEarliest,_drainLatest:drainLatest,
        _totalTokenDrains:totalTokenDrains,
      });
    }
    // ── System findings ───────────────────────────────────────────────────────
    // Countervalue drift
    if(hasAppJson&&fetchedCount>0){
      const drifts=[];
      const seenCids=new Set();
      (enrichedAccts||[]).forEach(a=>{
        if(!a.enriched||!a.ajBalance||a.ajBalance==='0'||seenCids.has(a.cid))return;
        seenCids.add(a.cid);
        const custRate=cvLatestRate(appJson,a.cid);
        const lbEntry=liveBalances[a.id];
        if(!custRate?.rate||!lbEntry?.bal||!lbEntry?.fiat||lbEntry.bal<=0)return;
        const marketRate=lbEntry.fiat/lbEntry.bal;
        const pctDrift=Math.abs(marketRate-custRate.rate)/custRate.rate*100;
        if(pctDrift>2)drifts.push({cid:a.cid,ticker:a.ch.ticker,custRate:custRate.rate,marketRate,pctDrift,date:custRate.date||'?'});
      });
      if(drifts.length>0){
        const top=drifts.sort((a,b)=>b.pctDrift-a.pctDrift);
        const names=top.slice(0,3).map(d=>`${d.ticker} ${d.pctDrift.toFixed(1)}%`).join(', ');
        f.push({id:'cv-drift',kind:'system',severity:top[0].pctDrift>10?'red':'amber',
          title:`Countervalue drift on ${drifts.length} asset${drifts.length!==1?'s':''}: ${names}`,
          detail:`The customer's cached fiat prices are out of date. Their ${top[0].ticker} rate is $${top[0].custRate.toFixed(2)} (from ${top[0].date}) but the current market rate is $${top[0].marketRate.toFixed(2)}. This means their portfolio total and per-account fiat values may be inaccurate.`,
          action:'Fiat values update automatically when the customer opens the app and it syncs. No manual action needed — but be aware their displayed USD values may differ from current market prices.',
          navigate:{type:'portfolio'},
          copyText:`Countervalue drift detected:\n${top.map(d=>`  ${d.ticker}: customer sees $${d.custRate.toFixed(2)}, market is $${d.marketRate.toFixed(2)} (${d.pctDrift.toFixed(1)}% drift)`).join('\n')}\nNote: fiat values update on app restart.`,
          evidence:top.slice(0,4).map(d=>({label:d.ticker,detail:`$${d.custRate.toFixed(2)} cached → $${d.marketRate.toFixed(2)} market (${d.pctDrift.toFixed(1)}%)`}))
        });
      }
    }
    // Token-level countervalue drift (mirrors cv-drift but for ERC-20 sub-accounts).
    // Live token prices come from DexScreener; we only consider pairs above the
    // drift liquidity floor to suppress noise from thin DEX pools.
    if(hasAppJson&&liveTokenBalances&&Object.keys(liveTokenBalances).length>0){
      const tokenDrifts=[];
      const seenTokenIds=new Set();
      (enrichedAccts||[]).forEach(a=>{
        if(!a.enriched)return;
        const acctTokens=liveTokenBalances[a.id]?.tokens||{};
        (a.ajSubAccounts||[]).forEach(sub=>{
          const tid=sub.tokenId||'';
          if(!tid||seenTokenIds.has(tid))return;
          if(!sub.balance||sub.balance==='0'||parseFloat(sub.balance)<=0)return;
          const liveTok=acctTokens[tid];
          if(!liveTok||liveTok.price==null)return;
          if((liveTok.liquidity||0)<DEXSCREENER_DRIFT_LIQUIDITY_FLOOR)return;
          const cached=cvLatestRate(appJson,tid);
          if(!cached?.rate||cached.rate<=0)return;
          const pct=Math.abs(liveTok.price-cached.rate)/cached.rate*100;
          if(pct<=2)return;
          seenTokenIds.add(tid);
          const info=getTokenInfo(tid,a.cid);
          tokenDrifts.push({tokenId:tid,ticker:info.ticker||(tid.split('/').pop()||'token').toUpperCase(),custRate:cached.rate,marketRate:liveTok.price,pctDrift:pct,date:cached.date||'?',parentTicker:a.ch.ticker});
        });
      });
      if(tokenDrifts.length>0){
        const top=tokenDrifts.sort((a,b)=>b.pctDrift-a.pctDrift);
        const names=top.slice(0,3).map(d=>`${d.ticker} ${d.pctDrift.toFixed(1)}%`).join(', ');
        f.push({id:'cv-drift-tokens',kind:'system',severity:top[0].pctDrift>10?'red':'amber',
          title:`Token countervalue drift on ${tokenDrifts.length} token${tokenDrifts.length!==1?'s':''}: ${names}`,
          detail:`The customer's cached fiat rates for ERC-20 tokens are out of date. ${top[0].ticker} (on ${top[0].parentTicker}) is cached at $${top[0].custRate.toFixed(4)} from ${top[0].date} but the live market rate is $${top[0].marketRate.toFixed(4)}. Token portfolio values may be inaccurate.`,
          action:'Token fiat rates update when the customer opens the app and it syncs. No manual action needed — but token USD totals shown in the app may differ from current market prices.',
          navigate:{type:'portfolio'},
          copyText:`Token countervalue drift detected:\n${top.map(d=>`  ${d.ticker} on ${d.parentTicker}: customer sees $${d.custRate.toFixed(4)}, market is $${d.marketRate.toFixed(4)} (${d.pctDrift.toFixed(1)}% drift)`).join('\n')}\nNote: token rates update on app restart.`,
          evidence:top.slice(0,4).map(d=>({label:d.ticker,detail:`$${d.custRate.toFixed(4)} cached → $${d.marketRate.toFixed(4)} market (${d.pctDrift.toFixed(1)}%)`}))
        });
      }
    }
    // Firmware
    if(firmwareCheck?.status==='ok'){
      if(firmwareCheck.outdated){
        f.push({id:'firmware',kind:'system',severity:'red',
          title:`Firmware outdated — ${firmwareCheck.current} → ${firmwareCheck.latest}`,
          detail:`The customer's device is running firmware ${firmwareCheck.current}. The latest is ${firmwareCheck.latest}. Outdated firmware can cause app incompatibilities and missing features.`,
          action:'Guide the customer to update: open Ledger Live/Wallet → My Ledger → Update firmware.',
          navigate:{type:'myLedger'},
          copyText:`Firmware outdated: current ${firmwareCheck.current}, latest ${firmwareCheck.latest}. Recommend updating via My Ledger.`,
          evidence:[{label:'Current',detail:firmwareCheck.current},{label:'Latest',detail:firmwareCheck.latest}]
        });
      } else {
        f.push({id:'firmware',kind:'system',severity:'green',title:`Firmware up to date (${firmwareCheck.current})`,detail:'Device firmware is current.',action:'No action needed.',navigate:{type:'myLedger'},copyText:`Firmware current: ${firmwareCheck.current}`,evidence:[]});
      }
    }
    // App versions
    if(versionCheck?.status==='ok'&&versionCheck.apps){
      const outdatedApps=versionCheck.apps.filter(a=>a.outdated);
      const missingApps=versionCheck.apps.filter(a=>a.required&&!a.installed);
      if(outdatedApps.length>0||missingApps.length>0){
        const issues=[...missingApps.map(a=>`${a.name} (missing)`), ...outdatedApps.map(a=>`${a.name} (${a.installed}→${a.latest})`)];
        f.push({id:'app-versions',kind:'system',severity:'amber',
          title:`${outdatedApps.length+missingApps.length} device app${outdatedApps.length+missingApps.length!==1?'s':''} need attention`,
          detail:`${outdatedApps.length} outdated, ${missingApps.length} missing. Outdated coin apps can cause signing errors or connectivity issues.`,
          action:'Guide the customer to open My Ledger in Ledger Wallet to update apps. The device must be connected.',
          navigate:{type:'myLedger'},
          copyText:`Device app issues:\n${issues.map(i=>`  - ${i}`).join('\n')}`,
          evidence:issues.slice(0,5).map(i=>({label:'App',detail:i}))
        });
      } else {
        f.push({id:'app-versions',kind:'system',severity:'green',title:`All ${versionCheck.apps.filter(a=>a.installed).length} device apps up to date`,detail:'No app update issues detected.',action:'No action needed.',navigate:{type:'myLedger'},copyText:'Device apps: all current.',evidence:[]});
      }
    }
    // Desktop/mobile app version
    if(appVersionCheck?.status==='ok'){
      if(appVersionCheck.outdated){
        f.push({id:'app-version',kind:'system',severity:'amber',
          title:`${llLabel(dev)} outdated — ${appVersionCheck.current} → ${appVersionCheck.latest}`,
          detail:`The customer is running an older version of the Ledger app. Some fixes and features require the latest version.`,
          action:'Ask the customer to update the Ledger app from the official download page or their app store.',
          navigate:null,
          copyText:`Ledger app outdated: ${appVersionCheck.current} → ${appVersionCheck.latest}`,
          evidence:[{label:'Current',detail:appVersionCheck.current},{label:'Latest',detail:appVersionCheck.latest}]
        });
      } else {
        f.push({id:'app-version',kind:'system',severity:'green',title:`${llLabel(dev)} up to date (${appVersionCheck.current})`,detail:'The customer is running the latest version.',action:'No action needed.',navigate:null,copyText:`${llLabel(dev)} current: ${appVersionCheck.current}`,evidence:[]});
      }
    }
    // Developer mode
    if(ajSettings.developerMode===true){
      f.push({id:'devmode',kind:'system',severity:'amber',
        title:'Developer mode is enabled',
        detail:'Developer mode shows experimental/unreleased apps and firmware. This can cause compatibility issues and unexpected behaviour.',
        action:'Confirm with the customer whether they intentionally enabled developer mode. If not, guide them to disable it in Settings → Experimental features.',
        navigate:null,
        copyText:'Developer mode is ON. May cause compatibility issues.',
        evidence:[{label:'Setting',detail:'developerMode: true'}]
      });
    }
    // Log errors
    if(highCount>0||medCount>0){
      const topErr=errs.find(e=>e.dg?.s==='high')||errs.find(e=>e.dg?.s==='medium');
      f.push({id:'log-errors',kind:'system',severity:'amber',
        title:highCount>0?`${highCount} critical + ${medCount} warning log error${errs.length!==1?'s':''}`:`${medCount} warning log error${medCount!==1?'s':''}`,
        detail:`The log contains ${highCount} critical, ${medCount} warning, and ${lowCount} informational events. Switch to Diagnostic mode for full error analysis.`,
        action:'Use the mode toggle at the top of the page to switch to Diagnostic mode → Issues tab for full error analysis with breadcrumbs and timeline context.',
        navigate:null,
        copyText:`Log errors: ${highCount} critical, ${medCount} warning, ${lowCount} info. Top issue: ${topErr?.dg?.t||'Unknown'}.`,
        evidence:errs.filter(e=>e.dg?.s==='high'||e.dg?.s==='medium').slice(0,3).map(e=>({label:e.dg?.s||'?',detail:e.dg?.t||e.msg||'Unknown'}))
      });
    } else if(errs.length===0){
      f.push({id:'log-errors',kind:'system',severity:'green',title:'No log errors detected',detail:'The session log contains no errors.',action:'No action needed.',navigate:null,copyText:'Log: clean session, no errors.',evidence:[]});
    }
    // Data confidence
    const dataIssues=[];
    if(fetchedCount===0&&acctCount>0)dataIssues.push('No live balances fetched');
    if(versionCheck?.status==='error')dataIssues.push('App catalog unavailable');
    if(firmwareCheck?.status==='error')dataIssues.push('Firmware check failed');
    if(dataIssues.length>0){
      f.push({id:'data-confidence',kind:'system',severity:'amber',
        title:`${dataIssues.length} data source${dataIssues.length!==1?'s':''} unavailable`,
        detail:`Some live data could not be fetched: ${dataIssues.join(', ')}. Findings may be incomplete.`,
        action:'Results are based on log data only. Network issues or an older device firmware may prevent some checks.',
        navigate:null,
        copyText:`Data confidence issues: ${dataIssues.join(', ')}`,
        evidence:dataIssues.map(d=>({label:'Unavailable',detail:d}))
      });
    } else if(fetchedCount>0){
      f.push({id:'data-confidence',kind:'system',severity:'green',title:`${fetchedCount}/${acctCount} live balances fetched`,detail:'Live balance data is available for comparison.',action:'No action needed.',navigate:null,copyText:`Data: ${fetchedCount}/${acctCount} balances live.`,evidence:[]});
    }
    // Sort: red → amber → green
    const order={red:0,amber:1,green:2};
    f.sort((a,b)=>order[a.severity]-order[b.severity]);
    return f;
  },[enrichedAccts,liveBalances,liveTokenBalances,firmwareCheck,versionCheck,appVersionCheck,appJson,errs,highCount,medCount,lowCount,fetchedCount,acctCount,hasAppJson,viewMode,snapshotDate,daysSinceSnapshot]);

  const redCount=findings.filter(f=>f.severity==='red').length;
  const amberCount=findings.filter(f=>f.severity==='amber').length;
  const greenCount=findings.filter(f=>f.severity==='green').length;
  const issueCount=findings.filter(f=>f.severity!=='green').length;
  const totalAcctCount=(enrichedAccts||[]).filter(a=>a.enriched&&a.ajBalance!=null).length;
  const displayFindings=viewMode==='issues'?findings.filter(f=>f.severity!=='green'):findings;
  const selectedFinding=findings.find(f=>f.id===selectedId)||null;

  const customerTotal=(enrichedAccts||[]).reduce((s,a)=>{
    if(!a.enriched||a.ajBalance==null)return s;
    return s+(cvFiatValue(appJson,a.cid,a.ajBalance)||0);
  },0);
  const onchainTotal=(enrichedAccts||[]).reduce((s,a)=>{
    const lb=liveBalances[a.id];
    if(!lb?.bal||!a.enriched||!a.cid)return s;
    const rate=cvLatestRate(appJson,a.cid);
    if(!rate?.rate)return s;
    return s+lb.bal*rate.rate;
  },0);
  const onchainMarketTotal=(enrichedAccts||[]).reduce((s,a)=>s+((liveBalances[a.id])?.fiat||0),0);
  const portfolioDelta=onchainTotal-customerTotal;
  const fmtFiat=v=>cvFmtFiat(v,appJson)||('$'+v.toLocaleString(undefined,{maximumFractionDigits:2}));

  React.useEffect(()=>{
    if(displayFindings.length>0&&!displayFindings.find(f=>f.id===selectedId)){
      setSelectedId(displayFindings[0].id);
    }
  },[displayFindings]);

  const handleNavigate=nav=>{
    if(!nav)return;
    if(nav.type==='account'&&onViewAccount&&nav.idx>=0)onViewAccount(nav.idx);
    if(nav.type==='portfolio'&&onViewPortfolio)onViewPortfolio();
    if(nav.type==='myLedger'&&onViewMyLedger)onViewMyLedger();
  };

  const sc=f=>({red:{color:'#EA4335',bg:'rgba(234,67,53,0.06)',border:'rgba(234,67,53,0.25)',dot:'#EA4335'},amber:{color:T.warning,bg:'rgba(255,189,66,0.06)',border:'rgba(255,189,66,0.2)',dot:T.warning},green:{color:'#4FC46B',bg:'rgba(79,196,107,0.04)',border:'rgba(79,196,107,0.12)',dot:'#4FC46B'}}[f.severity]||{color:'#8A8A8E',bg:'transparent',border:'rgba(255,255,255,0.06)',dot:'#8A8A8E'});

  const renderDetail=f=>{
    if(!f)return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100%',color:'#8A8A8E',fontSize:13}}>Select a finding to view details.</div>;
    const s=sc(f);
    // ── Drain finding detail panel ────────────────────────────────────────────
    if(f.kind==='drain'){
      const da=f._drainAccts||[];
      const ar=f._attackerRecipients||[];
      return <div style={{height:'100%',overflowY:'auto',padding:'20px 24px'}}>
        {/* Header */}
        <div style={{padding:'14px 18px',borderRadius:8,background:'rgba(234,67,53,0.08)',border:'1px solid rgba(234,67,53,0.25)',marginBottom:16}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
            <span style={{fontSize:18}}>🚨</span>
            <span style={{fontSize:16,fontWeight:800,color:'#EA4335',letterSpacing:'-0.02em'}}>{f._isSeedCompromise?'SEED COMPROMISE':'DRAIN DETECTED'}</span>
          </div>
          <div style={{fontSize:28,fontWeight:800,color:'#FFFFFF',fontFamily:MF,lineHeight:1.2,marginBottom:4}}>
            {cvFmtFiat(f._totalLossFiat,appJson)||'$'+f._totalLossFiat.toFixed(2)}
          </div>
          <div style={{fontSize:12,color:'#EA4335',fontWeight:600}}>
            estimated loss · {da.length} account{da.length!==1?'s':''} · {(f._chainSummary||[]).join(', ')}
            {f._totalTokenDrains>0?` · ${f._totalTokenDrains} token${f._totalTokenDrains!==1?'s':''} emptied`:''}
          </div>
          {f._drainEarliest&&<div style={{fontSize:11,color:'#8A8A8E',marginTop:4,fontFamily:MF}}>
            Drain window: {f._drainEarliest.slice(0,10)} → {f._drainLatest.slice(0,10)} ({f._drainWindowLabel})
          </div>}
        </div>
        {/* Action box */}
        <div style={{padding:'12px 14px',borderRadius:6,background:'rgba(234,67,53,0.06)',border:'1px solid rgba(234,67,53,0.2)',marginBottom:16}}>
          <div style={{fontSize:10,color:'#EA4335',fontWeight:700,marginBottom:5}}>⚠ ESCALATION REQUIRED</div>
          <div style={{fontSize:13,color:'#FFFFFF',lineHeight:1.6}}>→ {f.action}</div>
        </div>
        {/* Staking chain warning — post-export staking can look like a drain */}
        {(()=>{
          const stakingDrains=(f._drainAccts||[]).filter(a=>STAKING_APY[a.cid]);
          if(stakingDrains.length===0)return null;
          const chainNames=[...new Set(stakingDrains.map(a=>a.ch.name))];
          const typeLabels=[...new Set(stakingDrains.map(a=>STAKING_TYPE[a.cid]||'staking'))];
          return <div style={{padding:'10px 14px',borderRadius:6,background:'rgba(255,189,66,0.06)',border:'1px solid rgba(255,189,66,0.2)',marginBottom:16,display:'flex',alignItems:'flex-start',gap:8}}>
            <span style={{fontSize:14,flexShrink:0}}>🥩</span>
            <div>
              <div style={{fontSize:11,fontWeight:700,color:T.warning,marginBottom:3}}>Staking verification needed</div>
              <div style={{fontSize:12,color:'#8A8A8E',lineHeight:1.6}}>
                <strong style={{color:'#FFFFFF'}}>{chainNames.join(', ')}</strong> support{chainNames.length===1?'s':''} native {typeLabels.join(' / ').toLowerCase()}. If the customer staked funds after exporting their data, the balance drop may be from delegation — not theft. <strong style={{color:'#FFFFFF'}}>Verify on the block explorer</strong> before escalating. Staked funds appear at the same address on most explorers.
                {stakingDrains.some(a=>a.cid==='solana')&&<span style={{display:'block',marginTop:4,color:T.warning,fontSize:11}}><strong>Solana note:</strong> Staked SOL uses separate stake accounts that won't appear in the main account balance. Check the "Stake Accounts" tab on the Solana explorer.</span>}
              </div>
            </div>
          </div>;
        })()}
        {/* ── Fund flow diagram ──────────────────────────────────────────────── */}
        {da.length>0&&ar.length>0&&(()=>{
          // Build flow edges: source account → destination address with amounts
          const flows=[];
          for(const acct of da){
            const recipTotals={};
            for(const op of acct.outOps){
              for(const r of op.recipients){
                if(!r||r.length<8)continue;
                const key=r.toLowerCase();
                if(!recipTotals[key])recipTotals[key]={addr:r,total:0,totalFiat:0,txCount:0,lastTxUrl:null,lastDate:null};
                recipTotals[key].total+=op.value;
                if(op.valueFiat)recipTotals[key].totalFiat+=op.valueFiat;
                recipTotals[key].txCount++;
                if(!recipTotals[key].lastTxUrl)recipTotals[key].lastTxUrl=op.txUrl;
                if(!recipTotals[key].lastDate||op.date>recipTotals[key].lastDate)recipTotals[key].lastDate=op.date;
              }
            }
            // Token drain flows
            for(const td of acct.tokenDrains){
              for(const op of td.ops){
                for(const r of op.recipients){
                  if(!r||r.length<8)continue;
                  const key=r.toLowerCase();
                  if(!recipTotals[key])recipTotals[key]={addr:r,total:0,totalFiat:0,txCount:0,lastTxUrl:null,lastDate:null,hasTokens:true};
                  recipTotals[key].txCount++;
                  recipTotals[key].hasTokens=true;
                  if(!recipTotals[key].lastTxUrl)recipTotals[key].lastTxUrl=op.txUrl;
                }
              }
            }
            // Filter out self-transfers (customer's own addresses)
            const customerAddrsLower=new Set(da.map(d=>d.addr.toLowerCase()).filter(Boolean));
            const outgoing=Object.values(recipTotals).filter(r=>!customerAddrsLower.has(r.addr.toLowerCase())).sort((a,b)=>b.totalFiat-a.totalFiat||b.total-a.total);
            if(outgoing.length>0){
              flows.push({acct,destinations:outgoing});
            }
          }
          if(flows.length===0)return null;
          // Collect all unique destination addresses for the right column
          const destMap={};
          for(const fl of flows){
            for(const d of fl.destinations){
              const key=d.addr.toLowerCase();
              if(!destMap[key])destMap[key]={addr:d.addr,sources:[],totalFiat:0,txCount:0};
              destMap[key].sources.push({cid:fl.acct.cid,ch:fl.acct.ch,name:fl.acct.displayName,amount:d.total,fiat:d.totalFiat,ticker:fl.acct.ch.ticker,txCount:d.txCount,txUrl:d.lastTxUrl,hasTokens:d.hasTokens});
              destMap[key].totalFiat+=d.totalFiat;
              destMap[key].txCount+=d.txCount;
            }
          }
          const destinations=Object.values(destMap).sort((a,b)=>b.sources.length-a.sources.length||b.totalFiat-a.totalFiat);
          // Render the flow diagram
          return <div style={{marginBottom:16}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
              <span style={{fontSize:11,fontWeight:700,color:'#EA4335'}}>Fund flow</span>
              <span style={{fontSize:9,color:'#8A8A8E',fontFamily:MF}}>victim → attacker</span>
            </div>
            <div style={{background:'rgba(0,0,0,0.2)',borderRadius:8,padding:'12px 14px',border:'1px solid rgba(234,67,53,0.15)'}}>
              {destinations.slice(0,8).map((dest,di)=>{
                const isMultiSource=dest.sources.length>1;
                const addrUrl=dest.sources[0]?.ch?.url?dest.sources[0].ch.url(dest.addr):null;
                return <div key={di} style={{marginBottom:di<Math.min(destinations.length,8)-1?12:0}}>
                  {/* Flow rows: each source account → this destination */}
                  {dest.sources.map((src,si)=>{
                    const iconUrl=chainIconUrl(src.cid);
                    return <div key={si} style={{display:'flex',alignItems:'center',gap:0,marginBottom:si<dest.sources.length-1?4:0}}>
                      {/* Left: source account */}
                      <div style={{flex:'0 0 38%',display:'flex',alignItems:'center',gap:6,padding:'6px 10px',borderRadius:6,background:src.ch.color+'12',border:`1px solid ${src.ch.color}25`,minWidth:0}}>
                        <div style={{width:16,height:16,borderRadius:'50%',background:src.ch.color||'#333',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,overflow:'hidden'}}>
                          {iconUrl?<img src={iconUrl} alt="" style={{width:11,height:11,objectFit:'contain'}} onError={e=>e.target.style.display='none'}/>:<span style={{fontSize:6,fontWeight:700,color:'#fff'}}>{src.ticker}</span>}
                        </div>
                        <div style={{minWidth:0,flex:1}}>
                          <div style={{fontSize:10,fontWeight:600,color:'#FFFFFF',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{src.name}</div>
                          {src.amount>0&&<div style={{fontSize:9,color:src.ch.color,fontFamily:MF,fontWeight:600}}>{src.amount.toFixed(4)} {src.ticker}{src.fiat>0?' · '+cvFmtFiat(src.fiat,appJson):''}</div>}
                          {src.hasTokens&&!src.amount&&<div style={{fontSize:9,color:T.primary}}>+ tokens</div>}
                        </div>
                      </div>
                      {/* Center: arrow with tx link */}
                      <div style={{flex:'0 0 24%',display:'flex',alignItems:'center',justifyContent:'center',padding:'0 6px'}}>
                        <div style={{flex:1,height:1,background:`linear-gradient(90deg, ${src.ch.color}40, rgba(234,67,53,0.4))`}}/>
                        <div style={{display:'flex',alignItems:'center',gap:3,padding:'0 6px',flexShrink:0}}>
                          {src.txUrl?<a href={src.txUrl} target="_blank" rel="noopener noreferrer" style={{fontSize:8,color:'#8A8A8E',textDecoration:'none',fontFamily:MF,display:'flex',alignItems:'center',gap:2}} onMouseEnter={e=>e.currentTarget.style.color=T.primary} onMouseLeave={e=>e.currentTarget.style.color='#8A8A8E'}>{src.txCount>1?src.txCount+'tx':'tx'} ↗</a>:<span style={{fontSize:8,color:'#8A8A8E',fontFamily:MF}}>{src.txCount>1?src.txCount+'tx':'→'}</span>}
                        </div>
                        <div style={{flex:1,height:1,background:'rgba(234,67,53,0.4)'}}/>
                        <span style={{color:'rgba(234,67,53,0.6)',fontSize:10,marginLeft:2,flexShrink:0}}>▸</span>
                      </div>
                      {/* Right: destination (only show on first row if multi-source) */}
                      {si===0?<div style={{flex:'0 0 38%',padding:'6px 10px',borderRadius:6,background:'rgba(234,67,53,0.06)',border:`1px solid rgba(234,67,53,${isMultiSource?'0.3':'0.15'})`,minWidth:0,position:'relative'}}>
                        <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:2}}>
                          <span style={{fontFamily:MF,fontSize:9,color:'#FFFFFF',wordBreak:'break-all',flex:1}}>{dest.addr.slice(0,6)}…{dest.addr.slice(-4)}</span>
                          <CopyBtn text={dest.addr}/>
                          {addrUrl&&<a href={addrUrl} target="_blank" rel="noopener noreferrer" style={{fontSize:8,color:'#EA4335',textDecoration:'none',flexShrink:0,fontWeight:600}} onMouseEnter={e=>e.currentTarget.style.textDecoration='underline'} onMouseLeave={e=>e.currentTarget.style.textDecoration='none'}>↗</a>}
                        </div>
                        {dest.totalFiat>0&&<div style={{fontSize:10,color:'#EA4335',fontFamily:MF,fontWeight:700}}>~{cvFmtFiat(dest.totalFiat,appJson)}</div>}
                        {isMultiSource&&<div style={{fontSize:8,color:'#EA4335',marginTop:1,fontWeight:600}}>← {dest.sources.length} chains converge</div>}
                      </div>:<div style={{flex:'0 0 38%',padding:'6px 10px',minWidth:0}}>
                        {/* Empty placeholder for alignment — arrow points to destination block above */}
                        <div style={{borderLeft:'2px solid rgba(234,67,53,0.15)',height:8,marginLeft:'auto',width:1}}/>
                      </div>}
                    </div>;
                  })}
                  {/* Separator between destination groups */}
                  {di<Math.min(destinations.length,8)-1&&<div style={{height:1,background:'rgba(255,255,255,0.04)',margin:'8px 0 0'}}/>}
                </div>;
              })}
            </div>
            <div style={{fontSize:9,color:'#8A8A8E',marginTop:6,display:'flex',alignItems:'center',gap:4}}>
              <span>Click ↗ on any address to verify on the block explorer</span>
              {destinations.some(d=>d.sources.length>1)&&<span style={{color:'#EA4335'}}>· Multi-chain convergence = likely same attacker</span>}
            </div>
          </div>;
        })()}
        {/* Funds sent to — attacker addresses */}
        {ar.length>0&&<div style={{marginBottom:16}}>
          <div style={{fontSize:12,fontWeight:700,color:'#EA4335',marginBottom:8,display:'flex',alignItems:'center',gap:6}}>
            <span>Funds sent to</span>
            <span style={{fontSize:10,fontWeight:400,color:'#8A8A8E'}}>({ar.length} address{ar.length!==1?'es':''})</span>
          </div>
          {ar.slice(0,10).map((r,ri)=>{
            const chainsUsed=[...new Set(r.chains.map(c=>c.ch.name))];
            const addrUrl=r.chains[0]?.ch?.url?r.chains[0].ch.url(r.addr):null;
            return <div key={ri} style={{background:'rgba(234,67,53,0.04)',border:'1px solid rgba(234,67,53,0.15)',borderRadius:6,padding:'10px 12px',marginBottom:6}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                <span style={{fontFamily:MF,fontSize:12,color:'#FFFFFF',wordBreak:'break-all',flex:1}}>{r.addr}</span>
                <CopyBtn text={r.addr}/>
                {addrUrl&&<a href={addrUrl} target="_blank" rel="noopener noreferrer" style={{color:'#EA4335',fontSize:10,fontWeight:600,textDecoration:'none',flexShrink:0,display:'inline-flex',alignItems:'center',gap:3}} onMouseEnter={e=>e.currentTarget.style.textDecoration='underline'} onMouseLeave={e=>e.currentTarget.style.textDecoration='none'}>Explorer ↗</a>}
              </div>
              <div style={{fontSize:11,color:'#8A8A8E'}}>
                {r.txCount} tx from {chainsUsed.join(', ')}{r.totalFiat>0?' · ~'+cvFmtFiat(r.totalFiat,appJson):''}
              </div>
              {r.chains.slice(0,5).map((c,ci)=>(
                <div key={ci} style={{fontSize:10,color:'#8A8A8E',fontFamily:MF,marginTop:3,display:'flex',alignItems:'center',gap:6}}>
                  <span style={{width:6,height:6,borderRadius:'50%',background:c.ch.color||'#666',flexShrink:0}}/>
                  <span>{c.ch.name}</span>
                  {c.date&&<span>{c.date.slice(0,10)}</span>}
                  {c.tokenName&&<span style={{color:T.primary}}>{c.tokenName}</span>}
                  {c.txUrl&&<a href={c.txUrl} target="_blank" rel="noopener noreferrer" style={{color:'#8A8A8E',textDecoration:'none',fontSize:9}} onMouseEnter={e=>e.currentTarget.style.color=T.primary} onMouseLeave={e=>e.currentTarget.style.color='#8A8A8E'}>tx ↗</a>}
                </div>
              ))}
              {r.chains.length>5&&<div style={{fontSize:9,color:'#8A8A8E',marginTop:3}}>+{r.chains.length-5} more transactions</div>}
            </div>;
          })}
        </div>}
        {/* Per-account drain breakdown */}
        <div style={{marginBottom:16}}>
          <div style={{fontSize:12,fontWeight:700,color:'#FFFFFF',marginBottom:8}}>Drained accounts</div>
          {da.map((acct,ai)=>{
            const ch=acct.ch||DC;
            const iconUrl=chainIconUrl(acct.cid);
            return <div key={ai} style={{background:'rgba(0,0,0,0.15)',borderRadius:6,padding:'10px 14px',marginBottom:6,borderLeft:`3px solid ${ch.color||'#666'}`}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                <div style={{width:20,height:20,borderRadius:'50%',background:ch.color||'#333',display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',flexShrink:0}}>
                  {iconUrl?<img src={iconUrl} alt="" style={{width:14,height:14,objectFit:'contain'}} onError={e=>e.target.style.display='none'}/>:<span style={{fontSize:7,fontWeight:700,color:'#fff'}}>{ch.ticker}</span>}
                </div>
                <span style={{fontSize:13,fontWeight:600,color:'#FFFFFF',flex:1}}>{acct.displayName}</span>
                <span style={{fontSize:11,color:'#EA4335',fontFamily:MF,fontWeight:600}}>{acct.custBal} → {acct.liveBal||'0'}</span>
              </div>
              {acct.addr&&<div style={{fontSize:10,fontFamily:MF,color:'#8A8A8E',marginBottom:6,display:'flex',alignItems:'center',gap:4}}>
                <span style={{wordBreak:'break-all'}}>{acct.addr}</span>
                <CopyBtn text={acct.addr}/>
              </div>}
              {acct.outOps.length>0&&<div style={{borderTop:'1px solid rgba(255,255,255,0.06)',paddingTop:6}}>
                <div style={{fontSize:9,color:'#8A8A8E',marginBottom:4,fontWeight:600}}>Outgoing transactions ({acct.outOps.length})</div>
                {acct.outOps.slice(0,5).map((op,oi)=>(
                  <div key={oi} style={{display:'flex',alignItems:'center',gap:6,padding:'3px 0',fontSize:10,fontFamily:MF,color:'#8A8A8E'}}>
                    <span style={{color:'#EA4335',fontWeight:600,flexShrink:0}}>{op.date?op.date.slice(0,10):''}</span>
                    <span style={{color:'#FFFFFF'}}>{op.value.toFixed(4)} {ch.ticker}</span>
                    {op.valueFiat!=null&&<span style={{color:'#8A8A8E'}}>({cvFmtFiat(op.valueFiat,appJson)})</span>}
                    <span style={{color:'#8A8A8E'}}>→ {(op.recipients[0]||'?').slice(0,12)}…</span>
                    {op.txUrl&&<a href={op.txUrl} target="_blank" rel="noopener noreferrer" style={{color:'#8A8A8E',textDecoration:'none',marginLeft:'auto',flexShrink:0}} onMouseEnter={e=>e.currentTarget.style.color=T.primary} onMouseLeave={e=>e.currentTarget.style.color='#8A8A8E'}>tx ↗</a>}
                  </div>
                ))}
                {acct.outOps.length>5&&<div style={{fontSize:9,color:'#8A8A8E',marginTop:2}}>+{acct.outOps.length-5} more</div>}
              </div>}
              {acct.tokenDrains.length>0&&<div style={{marginTop:6,fontSize:10,color:T.primary}}>
                Tokens drained: {acct.tokenDrains.map(t=>t.name).join(', ')}
              </div>}
            </div>;
          })}
        </div>
        {/* Copy button */}
        <div style={{display:'flex',gap:8}}>
          <button onClick={()=>{copyText(f.copyText);setCopiedId(f.id);setTimeout(()=>setCopiedId(null),2000);}} style={{flex:1,padding:'10px 16px',borderRadius:6,border:'1px solid rgba(234,67,53,0.3)',background:'rgba(234,67,53,0.08)',color:'#EA4335',fontSize:12,fontWeight:700,cursor:'pointer',textAlign:'center'}}>
            {copiedId===f.id?'✓ Copied drain report':'Copy drain report for escalation'}
          </button>
        </div>
        {f.detail&&<div style={{fontSize:12,color:'#8A8A8E',lineHeight:1.6,marginTop:14,padding:'10px 0',borderTop:'1px solid rgba(255,255,255,0.06)'}}>{f.detail}</div>}
      </div>;
    }
    // ── Standard finding detail (existing code, unchanged) ─────────────────────
    return <div style={{height:'100%',overflowY:'auto',padding:'20px 24px'}}>
      <div style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:16}}>
        <div style={{width:10,height:10,borderRadius:'50%',background:s.dot,flexShrink:0,marginTop:4}}/>
        <div style={{flex:1}}>
          <div style={{fontSize:15,fontWeight:700,color:'#FFFFFF',lineHeight:1.35,marginBottom:4}}>{f.title}</div>
          {f.kind==='account'&&(f.badges||[]).length>0&&<div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
            {f.badges.map(b=><span key={b} style={{fontSize:10,padding:'2px 7px',borderRadius:3,background:s.color+'22',color:s.color,fontWeight:700,letterSpacing:'0.04em'}}>{b}</span>)}
          </div>}
        </div>
        <div style={{display:'flex',gap:6,flexShrink:0}}>
          {f.navigate&&<button onClick={()=>handleNavigate(f.navigate)} style={{fontSize:11,padding:'4px 10px',borderRadius:4,border:'1px solid rgba(255,255,255,0.12)',background:'transparent',color:'#8A8A8E',cursor:'pointer'}}>View ↗</button>}
          <button onClick={()=>{copyText(f.copyText);setCopiedId(f.id);setTimeout(()=>setCopiedId(null),1500);}} style={{fontSize:11,padding:'4px 10px',borderRadius:4,border:'1px solid rgba(255,255,255,0.08)',background:'rgba(255,255,255,0.04)',color:copiedId===f.id?'#4FC46B':'#8A8A8E',cursor:'pointer'}}>{copiedId===f.id?'✓ Copied':'Copy'}</button>
        </div>
      </div>
      {f.kind==='account'&&f.hasStaking&&(()=>{
        const stakingLabel=cid=>{if(cid==='ripple'||cid==='stellar')return 'Network reserve';if(cid==='tron')return 'Frozen (bandwidth/energy)';return 'Staked / Delegated';};
        return <div style={{padding:'10px 14px',marginBottom:12,borderRadius:8,background:'rgba(187,176,255,0.06)',border:'1px solid rgba(187,176,255,0.15)'}}>
          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}>
            <span style={{fontSize:13}}>🥩</span>
            <span style={{fontSize:12,fontWeight:600,color:'#BBB0FF'}}>{stakingLabel(f._acctCid)}</span>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,fontSize:11,fontFamily:MF}}>
            <div>
              <div style={{fontSize:9,color:'#8A8A8E',marginBottom:2}}>Total balance</div>
              <div style={{color:'#FFFFFF'}}>{f.custTotalBal}</div>
            </div>
            <div>
              <div style={{fontSize:9,color:'#8A8A8E',marginBottom:2}}>{['ripple','stellar'].includes(f._acctCid)?'Reserved':'Staked / Frozen'}</div>
              <div style={{color:'#BBB0FF'}}>{f.stakedAmount}</div>
            </div>
            <div>
              <div style={{fontSize:9,color:'#8A8A8E',marginBottom:2}}>Available</div>
              <div style={{color:'#4FC46B'}}>{f.custSpendableBal}</div>
            </div>
          </div>
          <div style={{fontSize:11,color:'#8A8A8E',marginTop:8,lineHeight:1.5}}>
            The comparison below uses the <strong style={{color:'#FFFFFF'}}>available</strong> balance (not {['ripple','stellar'].includes(f._acctCid)?'reserved':'staked'}). {['ripple','stellar'].includes(f._acctCid)?'Network reserves are protocol-required minimums, not spendable funds.':f._acctCid==='tron'?'Frozen TRX is locked for bandwidth/energy and won\'t appear in the live balance.':'Staked funds are locked on-chain and won\'t appear in the live balance check.'}{f._acctCid==='solana'?' Solana staking uses separate stake accounts — the live balance only reflects the main account.':''}
          </div>
        </div>;
      })()}
      {f.kind==='account'&&f.custBal&&(()=>{
        const custNum=parseFloat(f.hasStaking&&f.custSpendableBal?f.custSpendableBal:f.custBal)||0;
        const liveNum=parseFloat(f.liveBal)||0;
        const maxVal=Math.max(custNum,liveNum,0.000001);
        const custPct=Math.min((custNum/maxVal)*100,100);
        const livePct=Math.min((liveNum/maxVal)*100,100);
        if(maxVal===0.000001&&custNum===0&&liveNum===0)return null;
        const chainGrad=f.severity==='red'?'linear-gradient(90deg,rgba(234,67,53,0.4),rgba(234,67,53,0.7))':f.severity==='amber'?'linear-gradient(90deg,rgba(255,189,66,0.4),rgba(255,189,66,0.6))':'linear-gradient(90deg,rgba(79,196,107,0.4),rgba(79,196,107,0.6))';

          <div style={{fontSize:9,color:'#8A8A8E',letterSpacing:'0.04em',marginBottom:4,fontFamily:MF}}>{f.hasStaking?'Available (excl. staked)':'Customer sees'}{f.snapshotDate?` (${f.snapshotDate})`:''}</div>
          <div style={{fontSize:13,color:'#FFFFFF',fontFamily:MF,fontWeight:600}}>{f.hasStaking&&f.custSpendableBal?f.custSpendableBal:f.custBal||'—'}</div>
          {f.custFiat&&<div style={{fontSize:10,color:'#8A8A8E',marginTop:2}}>{f.custFiat}{f.rateLabel&&<span style={{fontSize:8,color:'rgba(255,255,255,0.25)',marginLeft:4}}>{f.rateLabel}</span>}</div>}
        </div>
        {/* On-chain now */}
        <div style={{padding:'10px 12px',borderRight:'1px solid rgba(255,255,255,0.05)'}}>
          <div style={{fontSize:9,color:'#8A8A8E',letterSpacing:'0.04em',marginBottom:4,fontFamily:MF}}>On-chain now</div>
          <div style={{fontSize:13,color:'#FFFFFF',fontFamily:MF,fontWeight:600}}>{f.liveBal||'—'}</div>
          {f.liveFiat&&<div style={{fontSize:10,color:'#8A8A8E',marginTop:2}}>{f.liveFiat}{f.rateLabel&&<span style={{fontSize:8,color:'rgba(255,255,255,0.25)',marginLeft:4}}>{f.rateLabel}</span>}</div>}
          {f.liveMarketFiat&&f.liveMarketFiat!==f.liveFiat&&<div style={{fontSize:9,color:'rgba(255,255,255,0.25)',marginTop:1}}>{f.liveMarketFiat} market</div>}
        </div>
        {/* Delta */}
        <div style={{padding:'10px 12px'}}>
          <div style={{fontSize:9,color:'#8A8A8E',letterSpacing:'0.04em',marginBottom:4,fontFamily:MF}}>Delta</div>
          <div style={{fontSize:13,color:f.severity==='green'?'#4FC46B':f.delta&&f.delta!=='0'?'#EA4335':'#8A8A8E',fontFamily:MF,fontWeight:600}}>{f.delta||'—'}</div>
          {f.deltaFiat&&<div style={{fontSize:10,color:'#8A8A8E',marginTop:2}}>{f.deltaFiat}</div>}
        </div>
      </div>}
      <div style={{fontSize:13,color:'#8A8A8E',lineHeight:1.7,marginBottom:14}}>{f.detail}</div>
      <div style={{padding:'12px 14px',borderRadius:6,background:s.bg,border:`1px solid ${s.border}`,marginBottom:14}}>
        <div style={{fontSize:10,color:s.color,fontWeight:700,marginBottom:5}}>Recommended action</div>
        <div style={{fontSize:13,color:'#FFFFFF',lineHeight:1.5}}>→ {f.action}</div>
      </div>
      {f.kind==='account'&&<>
        {(f._subAccounts||[]).length>0&&<div style={{marginBottom:12}}>
          <div style={{fontSize:10,fontWeight:700,color:'#8A8A8E',marginBottom:6}}>Tokens ({f._subAccounts.length})</div>
          {f._subAccounts.slice(0,5).map((sa,i)=>{
            const nm=(sa.tokenId||'').split('/').pop().replace(/__/g,' ').replace(/_/g,' ');
            const td=getTokenDecimals(sa.tokenId||'',f._acctCid||'');
            const th=sa.balance?parseFloat(sa.balance)/Math.pow(10,td):0;
            return <div key={i} style={{fontSize:12,color:'#8A8A8E',padding:'3px 0',borderBottom:'1px solid rgba(255,255,255,0.03)'}}>{nm}: <span style={{color:'#FFFFFF',fontFamily:MF}}>{th.toLocaleString(undefined,{maximumFractionDigits:4})}</span> · {sa.operationsCount||0} ops</div>;

      </div>
    </div>
    {/* Row 2 — Stat cards */}
    <div style={{flexShrink:0,display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,padding:'10px 20px',borderBottom:'1px solid rgba(255,255,255,0.05)'}}>
      <div style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.06)',borderRadius:6,padding:'8px 12px',display:'flex',alignItems:'center',gap:10}}>
        {(()=>{
          const total=Math.max(customerTotal,onchainTotal,0.01);
          const custAngle=Math.min((customerTotal/total)*360,360);
          const chainAngle=Math.min((onchainTotal/total)*360,360);
          const r=18,cx=22,cy=22,sw=6;
          const arc=(startDeg,endDeg,color)=>{
            if(endDeg-startDeg<0.5)return null;
            const startRad=(startDeg-90)*Math.PI/180;
            const endRad=(endDeg-90)*Math.PI/180;
            const x1=cx+r*Math.cos(startRad),y1=cy+r*Math.sin(startRad);
            const x2=cx+r*Math.cos(endRad),y2=cy+r*Math.sin(endRad);
            const largeArc=endDeg-startDeg>180?1:0;
            return <path d={`M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2}`} stroke={color} strokeWidth={sw} fill="none" strokeLinecap="round"/>;
          };
          const match=customerTotal>0&&onchainTotal>0&&Math.abs(portfolioDelta)/customerTotal<0.05;
          const chainColor=match?'rgba(79,196,107,0.6)':portfolioDelta<0?'rgba(234,67,53,0.6)':'rgba(79,196,107,0.6)';
          return <svg width="44" height="44" viewBox="0 0 44 44" style={{flexShrink:0}}>
            <circle cx={cx} cy={cy} r={r} stroke="rgba(255,255,255,0.06)" strokeWidth={sw} fill="none"/>
            {customerTotal>0&&arc(0,custAngle,'rgba(187,176,255,0.6)')}
            {onchainTotal>0&&arc(0,chainAngle,chainColor)}
            {!match&&customerTotal>0&&onchainTotal>0&&<text x={cx} y={cy+1} textAnchor="middle" dominantBaseline="middle" style={{fontSize:8,fill:'#EA4335',fontWeight:700,fontFamily:'sans-serif'}}>Δ</text>}
            {match&&<text x={cx} y={cy+1} textAnchor="middle" dominantBaseline="middle" style={{fontSize:9,fill:'#4FC46B',fontWeight:700,fontFamily:'sans-serif'}}>✓</text>}
          </svg>;
        })()}
        <div>
          <div style={{fontSize:9,color:'#8A8A8E',marginBottom:2}}>Portfolio</div>
          <div style={{fontSize:13,fontWeight:700,color:'#FFFFFF',fontFamily:MF}}>{customerTotal>0?fmtFiat(customerTotal):'—'}</div>
          <div style={{fontSize:10,color:portfolioDelta<-0.01?'#EA4335':portfolioDelta>0.01?'#4FC46B':'#8A8A8E'}}>
            {onchainTotal>0?(portfolioDelta>=0?'▲ ':'▼ ')+fmtFiat(Math.abs(portfolioDelta))+' on-chain':totalAcctCount+' acct'+(totalAcctCount!==1?'s':'')}
          </div>
          {onchainMarketTotal>0&&Math.abs(onchainMarketTotal-onchainTotal)>1&&<div style={{fontSize:9,color:'rgba(255,255,255,0.25)'}}>
            {fmtFiat(onchainMarketTotal)} at market
          </div>}
        </div>
      </div>
      <div style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.07)',borderRadius:6,padding:'8px 12px'}}>
        <div style={{fontSize:9,color:'#8A8A8E',marginBottom:4}}>Device</div>
        <div style={{fontSize:14,fontWeight:700,color:'#FFFFFF',marginBottom:2}}>{dev.modelId?DN[dev.modelId]||dev.modelId:'—'}</div>
        <div style={{fontSize:10,color:firmwareCheck?.outdated?T.warning:'#8A8A8E'}}>{firmwareCheck?.current?`FW ${firmwareCheck.current}`:`FW ${dev.fw||'—'}`}{firmwareCheck?.outdated?' ⬆':''}</div>
      </div>
      <div style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.07)',borderRadius:6,padding:'8px 12px'}}>
        <div style={{fontSize:9,color:'#8A8A8E',marginBottom:4}}>Live Data</div>
        <div style={{fontSize:14,fontWeight:700,color:fetchedCount>0?'#FFFFFF':'#8A8A8E',marginBottom:2}}>{fetchedCount}/{acctCount}</div>
        <div style={{fontSize:10,color:fetchedCount===acctCount&&acctCount>0?'#4FC46B':fetchedCount>0?T.warning:'#8A8A8E'}}>{fetchedCount===0?'None fetched':fetchedCount===acctCount?'All live':'Partial'}</div>
      </div>
      <div style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.07)',borderRadius:6,padding:'8px 12px'}}>
        <div style={{fontSize:9,color:'#8A8A8E',marginBottom:4}}>Customer</div>
        <div style={{fontSize:14,fontWeight:700,color:'#FFFFFF',marginBottom:2}}>{llLabel(dev)} {dev.appVer||'—'}</div>
        <div style={{fontSize:10,color:appVersionCheck?.outdated?T.warning:'#8A8A8E'}}>{hasAppJson?'app.json loaded':'no app.json'}{ajSettings.developerMode?' · dev mode':''}</div>
      </div>
    </div>
    {/* Row 2.5 — Health dots */}
    {(()=>{
      const accts=(enrichedAccts||[]).filter(a=>a.enriched&&a.ajBalance!=null);
      if(accts.length===0)return null;
      const matches=accts.filter(a=>{const lb=liveBalances[a.id];const dec=DECIMALS[a.cid]||18;const total=parseFloat(a.ajBalance)/Math.pow(10,dec);const sp=a.ajSpendable!=null&&a.ajSpendable!==a.ajBalance?parseFloat(a.ajSpendable)/Math.pow(10,dec):null;const c=sp!=null&&Math.abs(total-sp)>0.000001?sp:total;const l=lb?.bal;return c!=null&&l!=null&&(c===0||Math.abs(l-c)/c*100<=0.01);}).length;
      return <div style={{flexShrink:0,padding:'6px 20px',borderBottom:'1px solid rgba(255,255,255,0.05)',display:'flex',alignItems:'center',gap:6}}>
        <span style={{fontSize:9,color:'#8A8A8E',letterSpacing:'0.04em',fontWeight:600,fontFamily:MF,marginRight:2}}>Accounts</span>
        <div style={{display:'flex',gap:3,flexWrap:'wrap',flex:1}}>
          {accts.map((a,i)=>{
            const lbEntry=liveBalances[a.id];
            const dec=DECIMALS[a.cid]||18;
            const custTotal=parseFloat(a.ajBalance)/Math.pow(10,dec);
            const custSp=a.ajSpendable!=null&&a.ajSpendable!==a.ajBalance?parseFloat(a.ajSpendable)/Math.pow(10,dec):null;
            const cust=custSp!=null&&Math.abs(custTotal-custSp)>0.000001?custSp:custTotal;
            const live=lbEntry?.bal!=null?lbEntry.bal:null;
            const hasBoth=cust!=null&&live!=null;
            const pct=hasBoth&&cust>0?Math.abs(live-cust)/cust*100:0;
            const isMismatch=hasBoth&&pct>0.01;
            const hasPending=(a.ajPendingOps||[]).length>0;
            const hasFailedOps=(a.ajOperations||[]).some(op=>op.hasFailed||op.status==='failed');
            const dotColor=isMismatch?'#EA4335':hasPending||hasFailedOps?T.warning:hasBoth?'#4FC46B':lbEntry?.status==='loading'?'#8A8A8E':'rgba(255,255,255,0.15)';
            const findingId=`acct-${a.id}`;
            const isSel=selectedId===findingId;
            const status=isMismatch?'mismatch':hasPending?'pending':hasFailedOps?'failed ops':hasBoth?'match':'no data';
            return <div key={i}
              title={`${a.displayName}: ${status}`}
              onClick={()=>{const f=displayFindings.find(f=>f.id===findingId);if(f)setSelectedId(findingId);}}
              style={{width:isSel?10:7,height:isSel?10:7,borderRadius:'50%',background:dotColor,cursor:'pointer',transition:'all 120ms',outline:isSel?`2px solid ${dotColor}`:'none',outlineOffset:1,opacity:isSel?1:0.8,flexShrink:0}}
            />;
          })}
        </div>
        <span style={{fontSize:9,color:'#8A8A8E',fontFamily:MF,flexShrink:0}}>{matches}/{accts.length} ✓</span>
        {snapshotDate&&<span style={{fontSize:9,color:'rgba(187,176,255,0.4)',fontFamily:MF,flexShrink:0}}>snapshot {snapshotDate}</span>}
      </div>;
    })()}
    {!hasAppJson&&<div style={{flexShrink:0,margin:'6px 20px 0',padding:'6px 12px',borderRadius:5,background:'rgba(255,189,66,0.06)',border:'1px solid rgba(255,189,66,0.15)',fontSize:11,color:T.warning}}>
      <strong>Limited:</strong> Load customer's app.json to enable balance comparison.
    </div>}
    {/* Row 3 — Master-detail */}
    <div style={{flex:1,overflow:'hidden',minHeight:0,display:'flex'}}>
      {/* Left — findings list */}
      <div style={{width:'38%',flexShrink:0,borderRight:'1px solid rgba(255,255,255,0.06)',overflowY:'auto',padding:'6px 0',scrollbarWidth:'none'}}>
        {displayFindings.length===0&&<div style={{padding:'24px 16px',color:'#8A8A8E',fontSize:12,textAlign:'center'}}>No issues — all checks healthy.</div>}
        {displayFindings.map(f=><CVFindingRow key={f.id} f={f} s={sc(f)} isSel={selectedId===f.id} onClick={()=>setSelectedId(f.id)}/>)}
      </div>
      {/* Right — detail panel */}
      <div style={{flex:1,overflow:'hidden',minWidth:0}}>
        {renderDetail(selectedFinding)}
      </div>
    </div>
  </div>;
}


function CVCopyText({text,full,mono}){
  const[copied,setCopied]=useState(false);
  const copyVal=full||text;
  if(!text)return <span style={{color:T.muted}}>—</span>;
  return <span onClick={()=>{copyText(copyVal);setCopied(true);setTimeout(()=>setCopied(false),1500);}}
    style={{cursor:'pointer',fontFamily:mono?MF:'inherit',wordBreak:'break-all',position:'relative',padding:'2px 4px',margin:'-2px -4px',borderRadius:4}}
    title={copyVal}>
    {text}
    {copied&&<span style={{position:'absolute',top:-18,left:0,fontSize:9,color:T.success,fontWeight:700,fontFamily:"sans-serif"}}>Copied!</span>}
  </span>;
}

function CustomerView({logData,appJson,onAppJson,liveBalances,liveTokenBalances,versionCheck,firmwareCheck,appVersionCheck}){
  const[selectedAcct,setSelectedAcct]=useState(null);
  const[ajDragOver,setAjDragOver]=useState(false);
  const[summCopied,setSummCopied]=useState(false);
  const[bannerExpanded,setBannerExpanded]=useState(true);
  const[ajError,setAjError]=React.useState('');
  const[ajKey,setAjKey]=React.useState(0);
  const[cvSection,setCvSection]=useState('accounts');
  const[cvAcctSearch,setCvAcctSearch]=useState('');
  const[cvAcctSort,setCvAcctSort]=useState('balance');
  const[expandedTokens,setExpandedTokens]=useState({});
  const[expandedTokenOps,setExpandedTokenOps]=useState({});
  const cvFirst=appJson?.raw?.settings?.countervalueFirst||appJson?.settings?.countervalueFirst||false;
  useEffect(()=>{
    if(appJson&&!appJson.encrypted){
      setBannerExpanded(true);
      const t=setTimeout(()=>setBannerExpanded(false),3000);
      return()=>clearTimeout(t);
    }
  },[appJson]);
  const appJsonRef=useRef();
  const analytics=logData.analytics||{};
  const as=analytics.appStarts||{};
  const port=analytics.portfolio||{};
  const namedAccts=useMemo(()=>{
    const counts={};
    logData.accts.forEach(a=>{counts[a.ch.name]=(counts[a.ch.name]||0)+1;});
    const running={};
    return logData.accts.map(a=>{
      const base=a.ch.name;
      running[base]=(running[base]||0)+1;
      return{...a,displayName:counts[base]>1?`${base} ${running[base]}`:base};
    });
  },[logData.accts]);
  const appJsonMismatch=React.useMemo(()=>{
    if(!appJson||appJson.encrypted||!appJson.accounts||!appJson.accounts.length)return false;
    if(!logData.accts||!logData.accts.length)return false;
    const logIds=new Set(logData.accts.map(a=>a.id));
    const matchCount=appJson.accounts.filter(a=>logIds.has(a.id)).length;
    return matchCount===0;
  },[appJson,logData]);
  const enrichedAccts=useMemo(()=>{
    if(namedAccts.length>0){
      if(!appJson)return namedAccts;
      return namedAccts.map(a=>{
        const match=appJson.byId[a.id];
        if(!match)return a;
        return{...a,displayName:match.name||a.displayName,enriched:true,
          ajBalance:match.balance,ajSpendable:match.spendableBalance,
          ajOps:match.operationsCount,ajOperations:match.operations,
          ajSubAccounts:match.subAccounts,ajBlockHeight:match.blockHeight,
          ajStarred:match.starred,ajSwapHistory:match.swapHistory||a.swapHistory,
          ajPendingOps:match.pendingOperations||[],ajFreshAddressPath:match.freshAddressPath||''};
      });
    }
    if(appJson&&appJson.accounts.length>0){
      const counts={};
      appJson.accounts.forEach(a=>{const ch=getChain(a.currencyId);counts[ch.name]=(counts[ch.name]||0)+1;});
      const running={};
      return appJson.accounts.map(a=>{
        const cid=a.currencyId;
        const ch=getChain(cid);

              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <div style={{width:32,height:32,borderRadius:'50%',background:ch.color||'#333',display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',flexShrink:0}}>
                  {iconUrl?<img src={iconUrl} alt={ch.ticker} style={{width:20,height:20,objectFit:'contain'}} onError={e=>e.target.style.display='none'}/>:<span style={{fontSize:10,fontWeight:700,color:'#fff'}}>{(ch.ticker||'?').slice(0,3)}</span>}
                </div>
                <div>
                  <div style={{display:'flex',alignItems:'center',gap:6}}>

                  </div>
                  <div style={{fontSize:18,fontWeight:700,color:'#FFFFFF',marginTop:1}}>{acct.displayName}{acct.ajStarred&&<span style={{color:'#FFB800',fontSize:14,marginLeft:6}}>★</span>}</div>

            </div>
            <div style={{display:'flex',gap:8,padding:'12px 32px',borderBottom:'1px solid rgba(255,255,255,0.06)'}}>

            </div>
            {enriched&&acct.ajBalance!=null&&(()=>{
              const detFiat=cvFiatValue(appJson,acct.cid,acct.ajBalance);

              const detRate=cvLatestRate(appJson,acct.cid);
              const cryptoEl=<div style={{fontSize:cvFirst&&detFiatStr?16:28,fontWeight:700,color:cvFirst&&detFiatStr?'#8A8A8E':'#FFFFFF',marginBottom:4}}>{fmtBal(acct.ajBalance,acct.cid,ch.ticker)||'0 '+ch.ticker}</div>;
              const fiatEl=detFiatStr?<div style={{fontSize:cvFirst?28:20,fontWeight:cvFirst?700:400,color:cvFirst?'#FFFFFF':'#8A8A8E',marginBottom:4}}>{detFiatStr}</div>:null;
              return <div style={{padding:'16px 32px',borderBottom:'1px solid rgba(255,255,255,0.06)'}}>
                {cvFirst&&fiatEl?<>{fiatEl}{cryptoEl}</>:<>{cryptoEl}{fiatEl}</>}
                {detRate&&<div style={{fontSize:11,color:'rgba(187,176,255,0.5)',marginBottom:6,fontFamily:MF}}>✦ 1 {ch.ticker} = {cvFmtFiat(detRate.rate,appJson)} · rate from {detRate.date}</div>}
                {acct.ajSpendable!=null&&acct.ajSpendable!==acct.ajBalance&&(()=>{

                    {tHuman!=null&&<span style={{fontSize:12,color:'#FFFFFF',fontFamily:MF}}>{tHuman.toLocaleString(undefined,{maximumFractionDigits:4})}</span>}
                    {tFiatStr&&<span style={{fontSize:12,color:'#4FC46B'}}>{tFiatStr}</span>}
                    <span style={{fontSize:11,color:'#8A8A8E'}}>{s.operationsCount||0} ops</span>
                    {s.operations&&s.operations.length>0&&<span style={{fontSize:10,color:'rgba(187,176,255,0.5)',cursor:'pointer',userSelect:'none'}}

                  </div>
                  {s.operations&&s.operations.length>0&&expandedTokenOps[si]&&<div style={{marginBottom:8,paddingLeft:12,borderLeft:'1px solid rgba(255,255,255,0.06)'}}>
                    {s.operations.slice(0,20).map((top,toi)=>{
                      const topType=(top.type||'').toUpperCase();
                      const topLabel=OP_LABELS[topType]||topType;
                      const topDec=getTokenDecimals(tId,acct.cid);
                      const topHuman=top.value!=null?parseFloat(top.value)/Math.pow(10,topDec):null;
                      const topRate=top.date?cvRateOnDate(appJson,tId,top.date.slice(0,10)):null;
                      const topFiat=topHuman!=null&&topRate!=null?topHuman*topRate:null;
                      return <div key={toi} style={{display:'flex',alignItems:'center',gap:8,padding:'4px 0',fontSize:11}}>
                        <span style={{color:topType==='IN'?'#4FC46B':topType==='OUT'?'#EA4335':'#8A8A8E',fontWeight:600,minWidth:60}}>{topLabel}</span>
