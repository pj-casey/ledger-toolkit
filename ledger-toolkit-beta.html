*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0A0A0A;--panel:#0A0A0A;--border:rgba(255,255,255,0.12);--text:#FFFFFF;--muted:#A3A3A3;--primary:#D4A0FF;--success:#6EC85C;--error:#F04F52;--warning:#FF6E2A;--ov-fs-xs:clamp(9px,1.1vh,11px);--ov-fs-sm:clamp(10px,1.3vh,12px);--ov-fs-md:clamp(11px,1.4vh,13px);--ov-fs-lg:clamp(13px,1.6vh,16px);--ov-pad-row:clamp(2px,0.4vh,4px);--ov-pad-section:clamp(6px,1vh,12px);--ov-gap-chips:clamp(4px,0.5vh,6px);--ov-gap-rows:clamp(4px,0.6vh,8px);--ov-stat-num:clamp(28px,4vh,42px);--ov-stat-hero:clamp(56px,9vh,88px);--ov-stat-label:clamp(10px,1.2vh,13px);--display-font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;--transition-fast:150ms ease;--hover-bg:rgba(255,255,255,0.04);--hover-bg-strong:rgba(255,255,255,0.07);
/* --- New design system vars (declared in Phase 1, applied in Phase 2+) --- */
--ledger-bg: #0A0A0A;
--ledger-bg-alt: #131214;
--ledger-surface: #131214;
--ledger-surface-alt: #1E1E1E;
--ledger-fg1: #FFFFFF;
--ledger-fg2: #D9D9D9;
--ledger-fg3: #A3A3A3;
--ledger-border: rgba(255,255,255,0.12);
--ledger-border-strong: rgba(255,255,255,0.3);
--ledger-primary: #D4A0FF;
--ledger-success: #6EC85C;
--ledger-error: #F04F52;
--ledger-warning: #FF6E2A;
--ledger-focus-ring: #D4A0FF;
--ledger-grey-500: #A3A3A3;
--ledger-grey-600: #6A6A6A;
--ledger-purple-400: #C088FF;
--ledger-purple-500: #A76BE6;
--ledger-purple-700: #7E4EA5;

--ledger-radius-card-chamfer: 18px;
--ledger-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
--ledger-dur-fast: 120ms;
--ledger-dur-base: 200ms;
--ledger-dur-slow: 400ms}
body{background:var(--bg);color:var(--text)}

/* === Type Scale === */
body,#root{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;font-weight:400;line-height:1.6;letter-spacing:0.01em;}
.stat-value{font-family:var(--display-font) !important;font-size:var(--ov-stat-num) !important;font-weight:700 !important;line-height:1 !important;letter-spacing:-0.025em;}
.stat-hero{font-family:var(--display-font);font-size:var(--ov-stat-hero);font-weight:800;line-height:0.95;letter-spacing:-0.035em;}
h1,h2,.section-title{font-family:var(--display-font);font-size:18px;font-weight:700;line-height:1.2;letter-spacing:-0.015em;}
.card-header,h3{font-family:var(--display-font);font-size:15px;font-weight:700;line-height:1.25;letter-spacing:-0.01em;}
.wordmark{font-family:var(--display-font);font-weight:700;letter-spacing:-0.02em;line-height:1;}
.label,.tab-label{font-size:11px;font-weight:500;color:#8A8A8E;}
.mono,code,pre{font-family:'JetBrains Mono','SF Mono','Fira Code',Consolas,ui-monospace,monospace;font-size:12px;line-height:1.5;}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
input:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:-1px}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}

}

/* ── Micro-interactions ── */
/* Global button transitions */
button{transition:opacity 150ms ease,transform 150ms ease,background-color 150ms ease,border-color 150ms ease;}
button:active{transform:scale(0.98);}
/* Copy Summary button */
.copy-btn{transition:opacity 150ms ease,transform 150ms ease,background-color 200ms ease !important;}
.copy-btn:active{transform:scale(0.97);}
/* Stat value fade-in */
@keyframes statFadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.stat-value{animation:statFadeIn 300ms ease forwards;}
/* Drop zone icon pulse on drag hover */
@keyframes iconPulse{0%,100%{transform:scale(1);opacity:0.6;}50%{transform:scale(1.08);opacity:0.9;}}
.drop-icon-pulse{animation:iconPulse 1.5s ease-in-out infinite;}
/* Error detail expand/collapse — migrated off max-height to the grid technique (Q4). */
.error-detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows 200ms ease;overflow:hidden;}
.error-detail.open{grid-template-rows:1fr;}

/* ── SFYL Mode (Stage 1) ── */
.sfyl-acct-row{cursor:pointer;transition:background 100ms ease;}
.sfyl-acct-row:hover{background:rgba(255,255,255,0.04);}
.sfyl-tx-row{transition:background 100ms ease;}
.sfyl-tx-row:hover{background:rgba(255,255,255,0.03);}
/* ── SFYL Stage A (redesign) ── */
@keyframes sfylSuggestFlash{0%{background-color:rgba(255,189,66,0.22);}100%{background-color:transparent;}}
.sfyl-suggest-flash{animation:sfylSuggestFlash 1200ms var(--ledger-ease) both;}
.sfyl-cta{position:relative;padding:7px 18px;border:none;background:#D4A0FF;color:#0A0A0A;font-size:11px;font-weight:700;letter-spacing:0.01em;cursor:pointer;white-space:nowrap;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:filter 120ms var(--ledger-ease);}
.sfyl-cta:hover{filter:brightness(.92);}
.sfyl-cta:active{transform:translateY(1px);}

/* ── Customer View ── */
.cv-frame{display:flex;height:calc(100vh - 52px);overflow:hidden;font-family:'Inter',sans-serif;}
.cv-nav{width:240px;background:#1A1A1D;flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.06) transparent;border-right:1px solid rgba(255,255,255,0.06);}
.cv-nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:8px;cursor:pointer;color:#8A8A8E;font-size:14px;font-weight:500;transition:background 150ms ease;margin:2px 8px;}
.cv-nav-item:hover{background:rgba(255,255,255,0.04);}
.cv-nav-item.cv-nav-active{background:rgba(255,255,255,0.06);color:#FFFFFF;}
.cv-content{flex:1;overflow-y:auto;background:#1A1A1D;padding:0;}
.cv-content-header{padding:24px 32px 16px;position:sticky;top:0;z-index:10;background:#1A1A1D;}
.cv-acct-list-row{cursor:pointer;transition:background 120ms;}
.cv-acct-list-row:hover{background:rgba(255,255,255,0.03);}
.cv-dm-badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.5);margin-left:6px;vertical-align:middle;}
.cv-mode-toggle{display:flex;align-items:stretch;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;overflow:hidden;gap:0;}
.cv-mode-btn{padding:8px 20px;border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:0.03em;cursor:pointer;transition:background 150ms ease,color 150ms ease,box-shadow 150ms ease;position:relative;}
.cv-mode-btn:not(.cv-active):hover{background:rgba(255,255,255,0.06);color:#CCCCCC;}
.cv-mode-btn.cv-active{background:var(--primary);color:#000;box-shadow:0 0 12px rgba(187,176,255,0.25);}
/* Diagnostic chrome override — orange instead of purple. cv-active fallback for customer view. */
button.cv-mode-btn.cv-active[aria-pressed="true"][data-mode-bi="diagnostic"]{background:#E85A1A!important;color:#fff!important;box-shadow:none!important;}
/* ── Diagnostic card hover states ── */
.err-hover:hover{background:rgba(255,255,255,0.04);}
.acct-hover:hover{background:rgba(255,255,255,0.04);}
/* ── JSON Tree ── */

/* Boot splash — Ledger BI · Dark substrate, bracket-corner mark */
#splash{position:fixed;inset:0;z-index:9999;background:#0E0E10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;overflow:hidden;font-family:'Inter',-apple-system,sans-serif;transition:opacity 0.45s ease}
#splash-bg{display:none}
#splash-center{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#splash-glow{display:none}
/* Bracket-corner logomark */
#splash-logo{width:96px;height:96px;position:relative;opacity:0;transform:scale(0.92);animation:splashLogoIn 0.55s cubic-bezier(0.16,1,0.3,1) 0.05s forwards}
#splash-logo svg{display:none}
#splash-logo::before,#splash-logo::after,#splash-logo > i:nth-child(1),#splash-logo > i:nth-child(2){content:'';position:absolute;width:28px;height:28px;border-color:#F4F4F5;border-style:solid;border-width:0}
#splash-logo::before{top:0;left:0;border-top-width:3px;border-left-width:3px}
#splash-logo::after{top:0;right:0;border-top-width:3px;border-right-width:3px}
#splash-logo > i:nth-child(1){bottom:0;left:0;border-bottom-width:3px;border-left-width:3px}
#splash-logo > i:nth-child(2){bottom:0;right:0;border-bottom-width:3px;border-right-width:3px}
#splash-title{display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;animation:splashLogoIn 0.55s cubic-bezier(0.16,1,0.3,1) 0.18s forwards}
#splash-title .tag{color:#E85A1A;font-size:12px;font-weight:600;letter-spacing:0.06em}
#splash-title .name{font-size:24px;font-weight:700;letter-spacing:-0.01em;color:#F4F4F5}
#splash-title .sub{font-size:13px;color:#8A8A90}
/* Progress strip */
#splash-progress{width:280px;display:flex;flex-direction:column;gap:8px;opacity:0;animation:splashLogoIn 0.5s cubic-bezier(0.16,1,0.3,1) 0.32s forwards}
#splash-progress .bar{height:2px;background:#18181B;position:relative;overflow:hidden}
#splash-progress .bar > span{position:absolute;left:0;top:0;bottom:0;width:0;background:#E85A1A;animation:splashProgress 1.8s cubic-bezier(0.55,0.06,0.68,0.19) 0.32s forwards}
#splash-progress .meta{display:flex;justify-content:space-between;font-family:'JetBrains Mono','SF Mono',Consolas,monospace;font-size:10px;color:#8A8A90;letter-spacing:0.04em}
/* Boot log card — bottom strip */
#splash-log{position:fixed;bottom:24px;left:0;right:0;margin:0 auto;background:#18181B;border:1px solid rgba(255,255,255,0.07);border-radius:2px;padding:10px 14px;font-family:'JetBrains Mono','SF Mono',Consolas,monospace;font-size:10px;color:#8A8A90;display:flex;flex-direction:column;gap:2px;max-width:520px;width:calc(100% - 48px);opacity:0;animation:splashLogoIn 0.4s ease 0.45s forwards;z-index:2}
#splash-log div{opacity:0;transform:translateY(2px);animation:splashLineIn 0.18s ease forwards;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#splash-log div::before{content:'✓ ';color:#3FC0B5;font-weight:600;margin-right:4px}
#splash-log div:last-child::before{content:'› ';color:#C8C8CC}
#splash-header{display:none}
#splash.dismiss{opacity:0;pointer-events:none}
@keyframes splashLogoIn{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}
@keyframes splashLineIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
@keyframes splashProgress{0%{width:0}60%{width:62%}100%{width:96%}}

/* ══ Splash → app shared-element handoff (View Transitions API) ══
   The splash-side transition names live in STATIC CSS; the matching header
   counterparts receive their names only inside the transition callback (in JS),
   so a name is never present on both elements in the same frame — which would
   silently abort the transition. */
#splash-logo{view-transition-name:logo-mark}
#splash-title .tag{view-transition-name:brand-tag}
#splash-title .name{view-transition-name:brand-name}
::view-transition-group(logo-mark),
::view-transition-group(brand-tag),
::view-transition-group(brand-name){
  animation-duration:450ms;
  animation-timing-function:cubic-bezier(0.2,0,0,1);
}
/* Finish the old→new crossfade inside the first ~40% of the flight so the
   3px→2px bracket-stroke change (and the shrinking text) never reads as
   thinning / stretching mid-morph. */
::view-transition-old(logo-mark),::view-transition-new(logo-mark),
::view-transition-old(brand-tag),::view-transition-new(brand-tag),
::view-transition-old(brand-name),::view-transition-new(brand-name){
  animation-duration:180ms;
}

   TWO-TIER MOTION SYSTEM (see CLAUDE.md "Motion System"). Quiet tier =
   high-frequency, subtle, informative (100-300ms). Expressive tier =
   rare/navigational/critical, deliberately attention-grabbing. Every
   rule below is collapsed by the reduced-motion block that follows.
   ══════════════════════════════════════════════════════════════════ */
/* Q2 — slow neutral settle (700ms) for async values arriving after first paint.

.bi-settle-slow { animation: confirmFlash 700ms var(--ledger-ease); --confirm-bg: rgba(255,255,255,.10); border-radius: 2px; }

   inner element clips. transform/size only — no max-height guessing. */
.bi-exp { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 190ms ease; }
.bi-exp.bi-exp-open { grid-template-rows: 1fr; }

   states (nothing else competes for attention). */

.bi-breathe { animation: biBreathe 2400ms ease-in-out infinite; }
@keyframes biUnderlineSweep{ from { transform: scaleX(0); } to { transform: scaleX(1); } }
.bi-underline-sweep { position: relative; }
.bi-underline-sweep::after { content:''; position:absolute; left:0; right:0; bottom:-2px; height:1px; background:currentColor; opacity:0.45; transform:scaleX(0); transform-origin:left center; animation: biUnderlineSweep 600ms cubic-bezier(0.05,0.7,0.1,1) 300ms forwards; }
/* Q6 — live-activity pulse: slow opacity breathing ONLY while fetches are in flight. */

<h2 id="playbook">Investigation Playbook</h2>

<p>Start with the scenario that matches your customer's complaint.</p>

<h3 id="s-balance">"My balance is wrong / I'm missing funds"</h3>
<div class="card">
  <p><strong>Start here:</strong> Focus on the affected account — use the <strong>Focus Investigation</strong> button on the Overview or <strong>Shift+click</strong> the account's tile in Accounts. This filters every section to that account. Check <strong>Accounts</strong> for the live on-chain balance and fiat value — compare with what the customer reports.</p>
  <p><strong>Look for:</strong> Mismatches between live balance and what the customer sees. If the log has no sync data, accounts show an amber "no data" badge — the live balance is your only reference. Check the Portfolio card's Top accounts list on the Overview for funded accounts with fiat values.</p>
  <p><strong>For deeper investigation:</strong> Switch to <span class="badge badge-purple">Customer View</span> → load the customer's <kbd>app.json</kbd> for the balances their app was displaying. Compare app.json balances with the live balances shown in Diagnostic mode.</p>
  <p><strong>For Bitcoin, Litecoin, Dogecoin, Bitcoin Cash, or Zcash:</strong> Open the account in <strong>Accounts</strong> — if it stores an xpub, the tool shows an <strong>Xpub Scanner</strong>. Click "Scan" to derive individual addresses and check on-chain balances. This shows exactly where funds are, even if the app's sync is wrong.</p>
  <p><strong>For Cardano, TON, or Stacks:</strong> The tool derives explorer-ready addresses from the raw data in the log. Look for the "Derived Address" block when you expand the account — click the explorer link to verify the balance on-chain.</p>
  <p><strong>In Customer View:</strong> Load the customer's <kbd>app.json</kbd> and go to <strong>Agent Insights</strong>. The dashboard compares what the customer sees to live on-chain balances and flags discrepancies. Check the staking card — if the customer has staked funds, the "missing" balance is likely frozen, not lost. Use the <strong>Earn</strong> tab to see their staking positions and validator details.</p>
  <div class="warn">If app.json shows a different balance than the live on-chain balance, the local cache may be stale. Ask the customer to clear cache and resync.</div>
</div>

<h3 id="s-drain">"My account was drained / I think I was hacked"</h3>
<div class="card">
  <p><strong>Start here:</strong> Switch to <span class="badge badge-purple">Customer View</span> and load the customer's <kbd>app.json</kbd>. Go to <strong>Agent Insights</strong>. If accounts have been drained, a red <strong>DRAIN DETECTED</strong> or <strong>SEED COMPROMISE</strong> finding will appear at the top of the list automatically.</p>
  <p><strong>What you'll see:</strong> The drain finding shows total estimated loss, which accounts were emptied, and a <strong>fund flow diagram</strong> showing where the money went — victim accounts on the left, attacker addresses on the right, with transaction links between them. When multiple chains converge on the same destination address, it's highlighted as the attacker's collection wallet.</p>
  <p><strong>"Funds sent to" section:</strong> Lists every destination address that received the stolen funds. Each address has a <strong>copy button</strong> and a direct <strong>explorer link</strong> — click to verify on the blockchain. This is what law enforcement needs.</p>
  <p><strong>Copy the drain report:</strong> Click <strong>"Copy drain report for escalation"</strong> at the bottom of the drain detail panel. This produces a formatted report with: customer identity, each drained account with before/after balances, every drain transaction hash with explorer links, and all destination addresses. Paste it into your escalation ticket.</p>
  <p><strong>Escalation procedure:</strong> The tool provides specific guidance in the action box. For multi-chain drains (seed compromise): advise the customer to stop using the seed phrase immediately, set up a new device with a new seed, and file a police report.</p>
  <div class="warn">If the drain finding shows a staking warning (amber 🥩 box), verify on the block explorer before escalating — the balance drop may be from recent staking, not theft. The explorer link is right there in the finding.</div>
</div>

<h3 id="s-tx">"My transaction failed / is stuck"</h3>
<div class="card">
  <p><strong>Start here:</strong> Click the <strong>Errors</strong> tab in the top tab bar. Use the severity tiles at the top to focus — click <span class="badge badge-red">Critical</span> to filter to critical errors only; each tile's subtitle lists the error-code patterns in that bucket. Click a category chip (<span class="badge badge-muted">Hardware</span> / <span class="badge badge-muted">Software</span>) to narrow further.</p>
  <p><strong>Look for:</strong> The <strong>Investigation flow</strong> diagram groups errors by their shared trigger (network failure, APDU rejection, sync). Click a row to open it in the detail panel; switch the list between <strong>Grouped</strong> and <strong>Chronological</strong> to see one-per-diagnosis or every occurrence in time order.</p>
  <p><strong>Dig deeper:</strong> In the error detail panel, expand <strong>"What happened before"</strong> to see the 5 log entries leading up to the error. This shows you what triggered it. Use the action row — <strong>Filter timeline →</strong> (opens the Timeline around the error) or <strong>Open raw at this path →</strong> — to jump into full context.</p>
  <p><strong>Next:</strong> Check <strong>Affected account</strong> on the error card. Check <strong>Advanced → Network</strong> for failed API calls. If the error mentions device rejection, check <strong>Advanced → APDU</strong>.</p>
  <div class="tip">Patterns chips at the top of Errors (like "↻ Price data unavailable ×4") flag cascade events. Click one to filter to just that pattern. APDU codes <span class="mono">6985</span> or <span class="mono">6982</span> mean the device rejected the transaction — the user didn't approve on-screen.</div>
</div>

<h3 id="s-device">"My device won't connect / isn't recognized"</h3>
<div class="card">
  <p><strong>Start here:</strong> Look at the <strong>Overview</strong>'s <strong>Customer setup</strong> card. It surfaces the device model, firmware status, device apps, and developer mode. A red firmware row or missing required app is your first lead. The <strong>Activity &amp; infrastructure</strong> card shows network and APDU counts — 0 calls or 0 frames means no real session ever happened.</p>
  <p><strong>Look for:</strong> Device model and firmware version in Customer setup. Check if firmware is outdated — the tool shows "FW 2.6.1 ⬆ 2.7.0" when an update is needed.</p>
  <p><strong>Next:</strong> Open the <strong>Errors</strong> tab for hardware/USB errors. Open the <strong>APDU</strong> tab for device communication. If there's zero APDU data, the device never established a connection at all.</p>
  <div class="warn">No APDU data = no device communication during this session. Check USB cable, port, or Bluetooth before investigating software.</div>
</div>

<h3 id="s-crash">"The app crashes / won't open / is slow"</h3>
<div class="card">
  <p><strong>Start here:</strong> Check the <strong>Overview</strong>. The <strong>Issues by impact</strong> card shows the severity tile counts (Critical / Warning / Notice) and the top-six errors. The <strong>Activity &amp; infrastructure</strong> card surfaces the network call count and Ledger status banner.</p>
  <p><strong>Look for:</strong> Critical errors (red). On the <strong>Errors</strong> tab, check for Patterns chips at the top — "↻ Unexpected error ×6" means the same error is looping. The Investigation flow diagram shows whether problems share a trigger (cascade); switch the list to Chronological to see whether they cluster in time or spread across the session.</p>
  <p><strong>Next:</strong> Check the <strong>Network</strong> tab for server errors (5xx). Timeouts or connectivity failures point to a server-side issue, not the app. The Customer setup card on Overview also shows OS / platform if it was captured in the log.</p>
  <div class="tip">Green diagnosis but customer reports crashes? The log may not capture the crash. Ask them to reproduce and export logs <em>immediately after</em>.</div>
</div>

<h3 id="s-verify">I need to verify what the customer sees</h3>
<div class="card">
  <p><strong>Start here:</strong> Switch to <span class="badge badge-purple">Customer View</span> using the prominent toggle in the top bar.</p>
  <p><strong>Load app.json:</strong> Upload the customer's <kbd>app.json</kbd> via the banner. This populates all tabs with the customer's actual data — balances, transactions, staking positions, device info, and app versions.</p>
  <p><strong>Walk the tabs:</strong> Portfolio shows their total value and asset allocation. Accounts shows every account with full transaction history. Earn shows staking positions. My Ledger shows device storage and installed apps. Agent Insights compares their data to live on-chain reality.</p>
  <p><strong>Key investigation flows:</strong></p>
  <ul class="def-list">
    <li><strong>Balance dispute</strong> → Agent Insights → click the flagged account → see comparison + action</li>
    <li><strong>Staking issue</strong> → Earn tab → expand the position → check validator + operation timeline</li>
    <li><strong>Missing transactions</strong> → Accounts → click the account → scroll operations timeline</li>
    <li><strong>App/firmware issue</strong> → My Ledger → check versions, storage, installed apps</li>
  </ul>
</div>

<h3 id="s-general">General investigation (no specific complaint)</h3>
<div class="card">
  <p><strong>Start here:</strong> Read the <strong>Overview</strong> for the overall picture. The four bento cards (Customer setup, Issues by impact, Activity &amp; infrastructure, Portfolio) each link out to the dedicated tab via an "Open →" affordance. The Portfolio card's Top accounts list gives a quick read of funded accounts.</p>
  <p><strong>Recommended flow:</strong></p>
  <p><strong>Overview</strong> → device health + big picture<br>
     <strong>Errors</strong> → what went wrong and when<br>
     <strong>Accounts</strong> → what exists<br>
     <strong>Timeline</strong> → what happened in sequence<br>
     <strong>Network / APDU / Raw JSON</strong> → deeper data if needed</p>
  <p>Big picture first, problems second, context third.</p>
</div>


<div class="section-divider"></div>

<h3 id="timeline-strip">Timeline: Density, Swimlanes &amp; Event Log</h3>
<div class="card">
  <p>The <strong>Timeline</strong> tab has four stacked regions: an <strong>active-filters chip row</strong>, an <strong>event-density histogram</strong>, and — below — a <strong>swimlane panel</strong> (left) beside the <strong>event log</strong> (right). Each side scrolls independently.</p>
  <p><strong>Event density histogram:</strong> the session split into time buckets, drawn as stacked bars. Bar height = event count in that slice; the color segments are event types, using the same colors as the row badges. You read the session left to right: "gray startup, purple analytics, gold price fetching, orange sync burst, blue network calls." An inline legend in the header names the top series. <strong>Drag across the histogram to zoom</strong> — the brushed range narrows the swimlanes and log to that window; <strong>click</strong> to jump to the nearest entry. Hovering shows a datum line plus a tooltip (top types + a sample message). A row of <strong>error dots</strong> sits below the bars — red = critical, amber = warning — click a dot to jump to that error.</p>
  <p><strong>Active filters chips:</strong> a single row above the histogram is the one place that shows everything narrowing the view — <span class="mono">range</span> (the brush), <span class="mono">account</span>, <span class="mono">type</span>, and <span class="mono">search</span>. Each chip has a × to remove just that filter, plus <strong>Clear all</strong>. The row hides itself when nothing is filtering.</p>
  <p><strong>Swimlane panel:</strong> one lane per event type, with a tick for each event placed within the current brush (or the full session when unbrushed). Click a lane to filter the log to that type; hover a tick for its timestamp and sample. This is the per-type breakdown — it ignores the type/search filters on purpose so the lanes always show the full shape of the current time slice.</p>
  <p><strong>Event log:</strong> rich two-line rows — severity bar, mono millisecond timestamp, message, secondary metadata, a type badge, and account context. A search box filters by message/type, and a <strong>List / Grouped</strong> toggle collapses bursts of same-type events into expandable group headers (errors never collapse). <strong>Export →</strong> saves the currently filtered rows.</p>
  <p><strong>Account filtering:</strong> when <strong>Focus Mode</strong> is active (Shift+click a treemap tile or account row, or use the Focus button in the top bar), the log <em>dims</em> entries that don't match the focused account. To <em>filter</em> instead, click the Timeline → action in the Focus banner; that sets an explicit account filter and adds a removable chip to the active-filters row.</p>
  <div class="tip">Colors are consistent everywhere — histogram bars, swimlane ticks, row type badges, and error breadcrumbs all use the same map. Learn "bridge = orange" once and it holds across every view.</div>
</div>

<h3 id="issues-interactive">Errors: Tiles, Patterns &amp; Detail</h3>
<div class="card">
  <p><strong>Verdict header:</strong> a one-line count of diagnosed events with severity breakdown (critical / warning / notice / recurring) and a <strong>Copy summary</strong> button.</p>
  <p><strong>Severity tiles:</strong> four tiles — <span class="badge badge-red">Critical</span> <span class="badge badge-yellow">Warning</span> <span class="badge badge-purple">Notice</span> and Info. Each shows a count; the subtitle lists the <strong>error-code patterns</strong> in that bucket (top codes by frequency, then "+N"). Click a tile to filter the list to that severity. (Info is always 0 — the diagnostic KB has no info-level class yet.)</p>
  <p><strong>Patterns chips:</strong> when an error class recurs, a row of chips like "↻ Price data unavailable ×4" appears. Click one to filter the list to just that repeating pattern — cascades become obvious.</p>
  <p><strong>Category chips</strong> (Hardware, Software, Server) narrow by category and combine with the severity tiles: Critical + Hardware = only critical hardware errors.</p>
  <p><strong>Investigation flow:</strong> a trigger → error → account diagram correlates each diagnosed error with the events that preceded it (network failures, APDU rejections, sync activity) and the account it references. Click any node to jump to that error, section, or account.</p>
  <p><strong>List — Grouped / Chronological:</strong> a toggle at the top of the error list. <strong>Grouped</strong> (default) shows one row per diagnosis with a ×N repeat badge; <strong>Chronological</strong> shows every occurrence as its own row in time order.</p>
  <p><strong>Detail panel</strong> (right) is structured top-to-bottom:</p>
  <p style="padding-left:16px;color:var(--muted);font-size:13px;margin-bottom:10px">
    <strong style="color:var(--text)">What happened</strong> — plain-English diagnosis, the raw signature, and common causes<br>
    <strong style="color:var(--text)">Next step</strong> — the fix, rendered as a numbered list when it has multiple steps<br>
    <strong style="color:var(--text)">Raw payload</strong> — the error's raw JSON, pretty-printed; collapsed when long with an expand control<br>
    <strong style="color:var(--text)">What happened before</strong> — expand to see the 5 entries leading up to the error (type badges, messages, relative timestamps)
  </p>
  <p><strong>Action row:</strong> <strong>Filter timeline →</strong> (opens the Timeline brushed to a ±60s window around the error), <strong>Copy ticket reply</strong> (copies a draft customer-facing reply for common error classes — disabled with a tooltip when no template exists), <strong>Open raw at this path →</strong> (jumps to the Raw JSON tab and searches for the entry), and <strong>Find similar</strong> (filters the list to this error's pattern code).</p>
  <div class="warn">Copy ticket reply templates are drafts — read and adapt each one before sending; they still need CS-team sign-off.</div>
</div>

<h3 id="account-tiles">Accounts: treemap + row table</h3>
<div class="card">
  <p>The <strong>Accounts</strong> tab is a two-pane layout. On the left, a fiat-weighted treemap of every account (tiles colored by chain, with chain ticker + fiat label). On the right, a filter chip strip + the account row table.</p>
  <p><strong>Cross-highlight:</strong> Hover a treemap tile and the matching row in the right table is outlined and scrolled into view; hover a row and the matching tile gains an outline. A red dot at the top-right of a tile means errors are linked to that account.</p>
  <p><strong>Click</strong> a tile to inspect that account in the drill panel below. <strong>Shift+click</strong> activates <strong>Focus Mode</strong> — non-matching tiles, rows, and downstream sections dim; the focused tile pulses. The Focus banner at the top shows balance, fiat, ops, error count, plus Errors → / Timeline → / Explorer ↗ actions.</p>
  <p><strong>EVM chains:</strong> Ethereum and L2 chains (Polygon, Arbitrum, Base, etc.) share the same 0x address but appear as separate rows — use the Chain filter chip to narrow to one, and note that Focus Mode is chain-specific even for shared addresses.</p>
  <div class="tip">When you arrive at this tab via the focused-account flow, the row you came from flashes briefly and the table auto-scrolls to it.</div>
</div>

<h3 id="focus-mode">Account Focus Mode</h3>
<div class="card">
  <p>Focus Mode is your primary investigation tool. Most tickets center on one account — focus on it and every section becomes relevant to that account.</p>
  <p><strong>How to activate:</strong></p>
  <p style="padding-left:16px;color:var(--muted);font-size:13px;margin-bottom:10px">
    <strong style="color:var(--text)">Shift+click</strong> any tile in the Accounts treemap (or any row in the table)<br>
    <strong style="color:var(--text)">Focus button</strong> in the top bar — searchable picker over all accounts<br>
    <strong style="color:var(--text)">Affected account</strong> link on any error card in Errors
  </p>
  <p><strong>What happens:</strong> The Focus button in the top bar adopts the account's chain color and shows its ticker. A <strong>Focus banner</strong> slides in below the tab bar showing balance, fiat, ops count, error count, and three quick actions — <strong>Errors →</strong> (sets the errors-by-account filter), <strong>Timeline →</strong> (sets the timeline filter), and <strong>Explorer ↗</strong>. Across the rest of the app, content that doesn't match the focused account dims; matching content stays bright.</p>
  <p><strong>Adaptive Dimming:</strong> Errors / Timeline / Overview Issues / Overview Portfolio rows dim (~0.35 opacity) when they don't reference the focused account. Customer setup and Activity &amp; infrastructure cards on Overview are system-wide findings and never dim. On the Accounts tab, non-matching treemap tiles dim to ~0.18 opacity and the focused tile gently pulses.</p>
  <p><strong>Filter vs dim:</strong> Focus <em>dims</em> by default — you still see the full lists, just emphasized. To <em>filter</em> Errors or Timeline down to only the matched rows, click the corresponding action in the Focus banner.</p>
  <p><strong>EVM precision:</strong> For EVM chains sharing the same address (Ethereum + L2s like Polygon, Arbitrum, Base), focus is chain-specific. Focusing Ethereum dims Polygon and Arbitrum even though they share the address.</p>
  <p><strong>How to clear:</strong> Click the ✕ on the Focus banner, press <kbd>Escape</kbd>, or open the Focus button menu and choose Clear.</p>
</div>

<h3 id="xpub-scanner">Xpub Scanner (Bitcoin, Litecoin, Dogecoin, Bitcoin Cash, Zcash)</h3>
<div class="card">
  <p>When you expand an account that stores an extended public key (xpub, ypub, or zpub), the tool shows a <strong>Scan</strong> button. Clicking it derives individual addresses from the key, queries the blockchain for each one, and shows the balance and transaction count per address.</p>
  <p>This is your most powerful tool for "my balance is wrong" on UTXO chains. It shows exactly which addresses hold funds — even addresses the app's sync may have missed.</p>
  <p>The scanner walks the derivation path (receive and change chains), stopping when it hits a gap of unused addresses. Each address gets an explorer link so you can verify on-chain.</p>
  <div class="tip">The scanner queries live blockchain APIs, so it takes a few seconds per address. Litecoin, Dogecoin, and Zcash are slower due to rate limiting — the tool handles retries automatically.</div>
</div>

<h3 id="derived-addresses">Derived Addresses &amp; Token Explorer Links</h3>
<div class="card">
  <p><strong>Derived addresses:</strong> Some chains store raw credentials in logs that aren't directly searchable on an explorer. The tool converts them automatically:</p>
  <p style="padding-left:16px;color:var(--muted);font-size:13px;margin-bottom:10px">
    <strong style="color:var(--text)">Cardano</strong> — hex credential → <span class="mono">stake1...</span> bech32 address<br>
    <strong style="color:var(--text)">TON</strong> — 32-byte hash → <span class="mono">UQ...</span> user-friendly address<br>
    <strong style="color:var(--text)">Stacks</strong> — compressed pubkey → <span class="mono">SP...</span> c32check address
  </p>
  <p>Look for the blue "Derived Address" block when you expand one of these accounts. It includes a copy button and an explorer link. Always verify derived addresses with the customer — they're computed from log data, not confirmed on-chain.</p>
  <p><strong>Token tiles with live balance:</strong> When you expand an EVM account, each ERC-20 token sub-account renders as a tile showing the ticker, live on-chain balance (one Multicall3 call per chain), and live USD value (DexScreener). Tiles are clickable and link to the token on the correct block explorer. Coverage is broad across 19 EVM chains; tokens on Lukso, Moonbeam, and Kaia render with "no live price" because those chains lack DexScreener coverage. If a customer reports "my tokens are missing," the tile shows the on-chain truth — not what their cached app data says.</p>
</div>

<h3 id="raw-json-search">Raw JSON Progressive Search</h3>
<div class="card">
  <p>The Raw JSON viewer (under <strong>Advanced</strong>) has a search that works like Chrome DevTools. As you type, the tree automatically expands to reveal matching nodes and scrolls to the first one.</p>
  <p><strong>Navigation:</strong> The counter shows <span class="mono" style="color:var(--success)">1/47</span> — your position in the results. Use the <strong>▲▼</strong> buttons or press <kbd>Enter</kbd> to jump to the next match. <kbd>Shift</kbd>+<kbd>Enter</kbd> goes backward. The current match is highlighted with a purple left border; other matches have a subtle tint.</p>
  <p>The expand/collapse buttons (Collapse, Level 1/2/3, All) still work independently. Clearing the search collapses the tree back to its previous state.</p>
  <div class="tip">Use this when you need to find a specific error code, account ID, or data field in the raw log. It's much faster than scrolling through the Timeline for technical data.</div>
</div>

<h3 id="live-balances">Live On-Chain Balances</h3>
<div class="card">
  <p>The tool automatically fetches live blockchain balances for every account in the log — no app.json needed. As soon as you load a file, balances start appearing on each account card in the Accounts section with a green dollar value.</p>
  <p><strong>Coverage:</strong> 40+ chains including all EVM chains (Ethereum, Polygon, BSC, Arbitrum, etc.), Bitcoin, Litecoin, Dogecoin, Bitcoin Cash, Zcash, Solana, Tezos, XRP, Cardano, NEAR, Tron, TON, Cosmos, and more.</p>
  <p><strong>Portfolio total:</strong> The Overview's <strong>Portfolio</strong> card sums every funded account into one total (with the chain treemap above). The Top accounts list below the treemap shows the top funded accounts with fiat. The Accounts tab itself shows the chain treemap on the left + a fiat-sortable account table on the right.</p>
  <p><strong>Copy exports:</strong> All copy formats (Summary, Full, Customer) now include live balances and fiat values per account, plus a PORTFOLIO total line.</p>
  <p>Balances are fetched from public blockchain APIs and priced via CoinGecko. No API keys required. Accounts that show "live ···" are still loading. Xpub accounts (Bitcoin-family) use the existing Xpub Scanner for balance — live fetch doesn't apply to those.</p>
  <div class="tip">This is your fastest way to answer "is this a high-value customer?" — check the Portfolio card on Overview or the Accounts tab treemap. No app.json needed.</div>
</div>

<h3 id="mobile-logs">Mobile Log Support</h3>
<div class="card">
  <p>The tool supports logs from <strong>Ledger Wallet Mobile</strong> (iOS and Android). When a mobile log is loaded, a solid purple <strong>MOBILE</strong> badge appears next to the file name in the header — bold and unmissable.</p>
  <p><strong>What's different about mobile logs:</strong> They don't include sync data (operation counts, log balances, or sync duration). All accounts show "no data" badges instead of operation counts. The tool compensates by showing live blockchain balances for every account.</p>
  <p><strong>What works the same:</strong> Error detection, device info (when available), timeline, network requests, copy exports. The Overview and Issues section work identically.</p>
  <div class="warn">Mobile logs typically score 50–65 on log quality due to reduced metadata. This is expected — don't treat a low quality score as a problem on mobile.</div>
</div>

<h3 id="no-sync">No-Sync Visibility</h3>
<div class="card">
  <p>When a log has accounts but no sync data (common with mobile logs and some short sessions), the tool shows <strong>amber warnings everywhere</strong> so you don't mistake "no data" for "empty account."</p>
  <p><strong>What you'll see:</strong> An amber banner on the Overview, "no data" badges instead of "empty," and amber accents on the affected accounts in the row table. Live blockchain balances are fetched automatically and shown in the Accounts table and the Overview Top accounts popover. Accounts that show a green fiat value are confirmed live-funded; use the live balance as your reference even without sync data.</p>
  <p>Copy exports include a "⚠ NO SYNC DATA" warning at the top so recipients know the data source.</p>
  <div class="tip">When you see amber everywhere, it means the log didn't capture sync. The accounts are real — they just have no operation history in this log. Live balances tell you what's actually on-chain.</div>
</div>

<h3 id="discoverability">Discoverability Hints</h3>
<div class="card">
  <p>Small hint text appears below interactive elements to show available interactions:</p>
  <p style="padding-left:16px;color:var(--muted);font-size:13px;margin-bottom:10px">
    <strong style="color:var(--text)">Accounts treemap:</strong> "click to inspect · shift+click to focus"<br>
    <strong style="color:var(--text)">Timeline:</strong> "click a lane to filter · drag the histogram to zoom"<br>
    <strong style="color:var(--text)">Errors tiles &amp; chips:</strong> "click to filter · toggle Grouped / Chronological"
  </p>
  <p>These hints are always visible but unobtrusive (9px, muted, 50% opacity). New agents learn the interactions; experienced agents stop noticing them.</p>
  <p>In the Accounts tab, the layout adapts to your window. On a wide window, the account list and the detail panel sit side by side, both full height. On a narrower window they stack, with a thin drag handle between them — drag it up or down to resize, double-click to reset. The handle position is remembered across sessions and files.</p>
</div>

<h3 id="customer-view">Customer View — "See the customer's wallet"</h3>
<div class="card">
  <p>Customer View replicates the Ledger Wallet interface so you can see exactly what the customer sees. Switch to it using the <span class="badge badge-purple">Customer View</span> toggle in the top bar. Load the customer's <kbd>app.json</kbd> via the upload banner for full data.</p>
  <p><strong>Five tabs</strong> in the left sidebar, matching the real Ledger Wallet layout:</p>
  <ul class="def-list">
    <li><strong>Portfolio</strong> — total balance, asset allocation table (Asset, Price, Allocation bar, Balance, Value), recent dApp activity. Click any asset row to jump to that account.</li>
    <li><strong>Accounts</strong> — all accounts in a horizontal grid: icon, chain name, account name, ✓ checkmark, crypto balance, fiat value, star. Click any row to see account detail with full operations timeline, token balances, swap history, and staking split.</li>
    <li><strong>Earn</strong> — staking positions, deposited amounts, estimated APY, rewards earned, validator names, and liquid staking tokens (stETH, JupSOL, LBTC, etc.). Two sub-tabs: "My rewards" and "Earn opportunities."</li>
    <li><strong>My Ledger</strong> — device model, firmware version, storage bar showing app sizes, app catalog with version checks (installed, outdated, missing).</li>
    <li><strong>Agent Insights</strong> — diagnostic dashboard comparing what the customer sees to what's actually on-chain. Fixed-viewport master-detail layout. This is your primary investigation tool for balance and sync tickets.</li>
  </ul>
</div>

<h3 id="agent-insights-guide">Agent Insights — the diagnostic dashboard</h3>
<div class="card">
  <p>Agent Insights is a fixed-viewport dashboard at the bottom of the Customer View nav. It compares the customer's app.json data to live blockchain balances and flags discrepancies.</p>
  <p><strong>Layout:</strong> Stat cards across the top (Portfolio delta, Device, Data confidence, Customer settings), then a master-detail split below. Compact findings list on the left, full detail panel on the right.</p>
  <p><strong>How to use it:</strong></p>
  <ul class="def-list">
    <li><strong>Load app.json + wait for live balances</strong> — the tool fetches on-chain balances automatically. Agent Insights populates as data arrives.</li>
    <li><strong>Read top to bottom</strong> — red findings first, then amber, then green. The first red finding is auto-selected and its detail appears on the right.</li>
    <li><strong>Click any finding</strong> — the right panel shows the comparison grid (Customer sees vs On-chain), the recommended action, evidence trail, and copy button.</li>
    <li><strong>"View in Customer View ↗"</strong> — navigates to the specific account in the Accounts tab for deeper investigation.</li>
    <li><strong>"Copy to clipboard"</strong> — copies a formatted summary for pasting into your ticket.</li>
  </ul>
  <div class="tip">Agent Insights uses the customer's cached countervalue rate for BOTH columns in the comparison. This means the fiat delta purely reflects balance changes, not price movement. If you see a fiat difference, the crypto balance actually changed.</div>
  <p><strong>Drain detection:</strong> When an account's balance has dropped more than 90% and was worth real money, Agent Insights classifies it as <strong>DRAINED</strong> instead of "Balance changed." If two or more accounts are drained, a <strong>SEED COMPROMISE</strong> alert appears at the top of the findings list with a fund flow diagram, attacker addresses, and a one-click drain report for escalation. See the playbook entry <a href="#s-drain" style="color:var(--primary)">"My account was drained"</a> for the investigation workflow.</p>
</div>

<h3 id="staking-awareness">Staking awareness</h3>
<div class="card">
  <p>Many customers have staked or frozen funds. The tool detects this automatically when <kbd>balance ≠ spendableBalance</kbd> in the app.json and adjusts the comparison accordingly.</p>
  <p><strong>What you'll see:</strong> A purple 🥩 staking card in the Agent Insights detail panel showing "Total: 276.34 SOL · Staked: 276.12 SOL · Available: 0.21 SOL." The comparison uses the <strong>available</strong> balance (not total) against the live balance — preventing false alarms on staked funds.</p>
  <p><strong>Chain-specific labels:</strong></p>
  <ul class="def-list">
    <li><strong>SOL, ATOM, DOT, NEAR, ADA, ALGO</strong> — "Staked / Delegated"</li>
    <li><strong>TRX</strong> — "Frozen (bandwidth/energy)"</li>
    <li><strong>XRP, XLM</strong> — "Network reserve" (not staking — these are protocol-required minimums)</li>
  </ul>
  <p><strong>Solana note:</strong> Solana staking uses separate stake accounts. The live balance only reflects the main account, not stake accounts. The tool notes this explicitly so you don't mistake staked SOL for missing SOL.</p>
  <div class="warn">If a customer says "my balance is wrong" and they have staked funds, check the Earn tab first. The "missing" balance is almost certainly staked, not lost.</div>
</div>

<h3 id="earn-tab-guide">Earn tab — staking investigation</h3>
<div class="card">
  <p>The Earn tab shows all staking positions from the customer's app.json. Use it for "my staking isn't working," "I can't unstake," or "my rewards are wrong" tickets.</p>
  <p><strong>"My rewards" sub-tab:</strong> Total deposited (fiat + allocation bar), total rewards earned, and a table of deposited assets with account name, invested amount, estimated APY, and rewards.</p>
  <p><strong>Click any staking position</strong> to expand: validator names (NEAR shows readable names like "ledgerbyfigment.poolv1.near"), balance breakdown, and a timeline of staking operations (delegated, undelegated, withdrawn, rewards claimed).</p>
  <p><strong>Liquid staking tokens</strong> section below the table shows stETH, JupSOL, LBTC, cbETH and other LSTs the customer holds, with the provider name and parent account.</p>
  <p><strong>"Earn opportunities" sub-tab:</strong> Lists the staking providers available in Ledger Wallet (Ledger by Figment, Kiln, Lido, Coinbase, Yield.xyz) with which chains each supports.</p>
  <div class="tip">Estimated APY rates are labeled "~est." and come from Ledger's public documentation. Actual rates vary by validator and network conditions. Many chains auto-compound rewards without discrete reward operations — so "0 rewards" doesn't always mean the customer isn't earning.</div>
</div>

<h2 id="troubleshooting">Tips &amp; Troubleshooting</h2>

<h3>The file won't load</h3>
<p>Accepts <kbd>.json</kbd>, <kbd>.txt</kbd>, and <kbd>.log</kbd> files. Must be a Ledger Wallet log export. Large log files show a "Parsing log file..." indicator — give it a moment.</p>

<h3>I see 0 accounts</h3>
<p>Some logs don't include account data. Switch to <strong>Customer View</strong> and load the customer's <kbd>app.json</kbd> for full account information. The Accounts section will show a hint pointing you there.</p>

<h3>All errors say "Unexpected error"</h3>
<p>The error isn't in the tool's knowledge base (82 known patterns). Expand the error card's "Details" section for the raw data. Use <strong>Raw JSON</strong> search to find the error in the full log — the progressive search will take you right to it.</p>

<h3>Customer View is empty</h3>
<p>Make sure you've switched modes using the top bar toggle. If no accounts appear, load the customer's <kbd>app.json</kbd>. Agent Insights and the Earn tab require app.json data — they'll show empty states with guidance until it's loaded.</p>

<h3>App.json says "Ledger Sync encryption"</h3>
<p>The file is encrypted by Ledger Sync. The tool extracts what it can (settings, paired devices, token preferences) but can't read balances or transaction history.</p>

<h3>Diagnosis is green but customer has problems</h3>
<p>The tool only sees what's in the log. If the issue happened outside this session, it won't be captured. Ask the customer to reproduce and export logs immediately after.</p>

<h3>I loaded the wrong app.json</h3>
<p>Click ✕ on the green banner to remove it, then upload the correct file.</p>

<h3>Agent Insights shows many red alerts on staking chains</h3>
<p>This was a known issue that has been fixed. If you're seeing false "Balance changed" alerts on accounts with staked funds (SOL, TRX, NEAR, etc.), make sure you're on the latest version. The tool now compares the <strong>available</strong> balance (excluding staked) to the live balance.</p>

<h3>The xpub scanner is slow</h3>
<p>The scanner queries live blockchain APIs for each derived address. Bitcoin is fastest (~200ms per address). Litecoin, Dogecoin, and Zcash are slower (~650ms) and may hit rate limits — the tool retries automatically up to 5 times. You can stop a running scan at any time.</p>

<h3>Device apps show "Not installed"</h3>
<p>A red chip marked <strong>✕ AppName</strong> on the Overview means the app is required by the customer's accounts but wasn't found on their device. It may have been removed after a firmware update. Ask the customer to open <strong>Ledger Wallet → My Ledger</strong> to reinstall. Amber chips marked <strong>⚠</strong> mean the app is installed but outdated.</p>

<h3>Overview says "Manager catalog unavailable" / firmware reads "unverified"</h3>
<p>Device-management data (the firmware and app catalog) comes from a live connection to Ledger's backend <em>during the session</em> — it isn't available offline. If the session was offline or the connection dropped, the log won't contain manager data, so the Required apps quad can't confirm what's installed and the Firmware quad reads <strong>unverified</strong> rather than claiming "on latest". This is a missing-data state, not a fault. If you need app or firmware verification, ask the customer to reconnect with the device plugged in and re-export logs.</p>

<h3>Several errors fired at almost the same time</h3>
<p>Multiple errors within 1-2 seconds usually mean one problem triggered a chain reaction. The <strong>Investigation flow</strong> diagram groups errors by their shared trigger; switch the list to <strong>Chronological</strong> to see the exact order, click the first error, then expand <strong>"What happened before"</strong> to see what triggered it. Click the <span class="badge badge-red">Critical</span> tile to isolate the root cause — the rest are typically consequences.</p>

<h3>Live balances show "unsupported" or stay loading</h3>
<p>"Unsupported" means the chain doesn't have a public API the tool can query — this affects a few uncommon chains. If balances stay on "live ···" for more than 10 seconds, the blockchain API may be rate-limited or down. This doesn't affect the rest of the tool. Xpub accounts (Bitcoin-family) don't use live fetch — use the Xpub Scanner instead.</p>

<h3>Everything is amber / "no sync data"</h3>
<p>The log didn't capture sync information. This is normal for mobile logs and very short desktop sessions. The accounts are real — they just have no operation history in this log. Live blockchain balances are your primary reference. See the <a href="#no-sync" style="color:var(--primary)">No-Sync Visibility</a> section for details.</p>

</div>

<!-- ═══════════════ DATA PROCESSING ═══════════════ -->
<h2 id="data-processing">Data Processing</h2>

<h3 id="ingestion">Ingestion &amp; Parsing</h3>
<div class="card">
  <p>Accepts structured JSON log exports, plain text, and mixed-format files via drag-and-drop or file picker. Input extensions: <kbd>.json</kbd> <kbd>.txt</kbd> <kbd>.log</kbd></p>
  <p><strong>Three-tier parser:</strong> The parser attempts structured parsing first, falling back to a recovery parser for malformed JSON, and finally a brace scanner that extracts parseable JSON objects from corrupted or partially-truncated files. Handles UTF-8 BOM and normalizes top-level arrays vs. objects.</p>
  <p><strong>Mobile log synthesis:</strong> When <span class="mono">exportLogsMeta</span> is absent (mobile log format), the parser reconstructs metadata — platform, app version, and account IDs — from bridge schedule messages embedded in the event stream.</p>
  <p><strong>Post-parse normalization:</strong> All entries are chronologically sorted and assigned a stable <span class="mono">logIndex</span> used as the universal cross-reference key throughout the tool. Reverse-chronological mobile exports are detected and reversed before indexing.</p>
  <p>Tested with logs containing 15,000+ entries. All parsing runs client-side in the browser — no data is transmitted to any server during parsing.</p>
</div>

<h3 id="quality">Data Quality Assessment</h3>
<div class="card">
  <p>Automated quality scoring on a 0–100 scale evaluates log completeness across four independent dimensions:</p>
  <ul class="def-list">
    <li><strong>Metadata presence</strong> — device model, firmware version, OS, user ID, app version</li>
    <li><strong>Account data</strong> — sync durations, reported balances, operation counts</li>
    <li><strong>Error context</strong> — stack traces, payload data, query arguments attached to errors</li>
    <li><strong>Session integrity</strong> — timestamp consistency, entry count, event type diversity</li>
  </ul>
  <p><strong>Grade thresholds:</strong> Excellent (85+), Good (65+), Fair (40+), Poor (&lt;40). Each dimension contributes a weighted sub-score; the breakdown is available for granular assessment.</p>
  <p>Mobile log normalization adjusts expectations for platform-specific data gaps — mobile logs are not penalized for absent sync data that is structurally unavailable on that platform.</p>
  <div class="tip">Quality scoring enables objective comparison between log exports — a 90-score log from a 2-minute session provides more investigative surface than a 45-score log from a 30-minute session.</div>
</div>


<div class="section-divider"></div>

<!-- ═══════════════ DEVICE & HARDWARE ═══════════════ -->
<h2 id="device-analysis">Device &amp; Hardware Analysis</h2>

<h3 id="device-id">Device Identification</h3>
<div class="card">
  <p>Multi-source identification with automatic fallback chain. The extractor attempts each method in order, stopping when both <span class="mono">modelId</span> and <span class="mono">fw</span> are resolved:</p>
  <ol class="tech-list">
    <li><strong>Direct metadata fields</strong> — <span class="mono">d.modelId</span>, <span class="mono">d.modelName</span>, <span class="mono">d.deviceVersion</span> from <span class="mono">exportLogsMeta</span></li>
    <li><strong>Target ID bitmask analysis</strong> — applies <span class="mono">(targetId &amp; 0xFFFF0000) &gt;&gt;&gt; 0</span> against 6 known device masks. Same algorithm as <span class="mono">@ledgerhq/devices</span>. Scans <span class="mono">data.targetId</span>, <span class="mono">data.data.target_id</span>, and Manager API URL params. Primary identification method for Ledger Wallet 4.0+ logs.</li>
    <li><strong>Manager API response</strong> — reads <span class="mono">get_device_version</span> response <span class="mono">data.data.name</span> (e.g., "Nano S Plus")</li>
    <li><strong>Firmware path prefix</strong> — parses install paths such as <span class="mono">nanos+/1.5.1/...</span> to extract model and firmware. Covers <span class="mono">apex_p</span> / <span class="mono">apex</span> for Gen5 devices.</li>
    <li><strong>Device apps result backfill</strong> — extracts model from <span class="mono">actions-manager-event</span> payload when earlier methods are inconclusive</li>
  </ol>
  <p><strong>Supported devices:</strong> Nano S, Nano X, Nano S Plus, Stax, Flex (europa), Nano Gen5 (apex). Firmware version extraction includes update availability detection when the current firmware can be compared against the latest known release.</p>
  <p><strong>Software version-aware branding:</strong> Detects whether the session used "Ledger Live" (v2.x) or "Ledger Wallet" (v4.x) via <span class="mono">userAgent</span> parsing and version number analysis. All diagnostic text adjusts accordingly.</p>
</div>

<h3 id="apdu">Application Protocol Data Unit (APDU) Analysis</h3>
<div class="card">
  <p>Extracts device communication commands from log entries. Each APDU record includes command direction (sent to device / received from device), raw instruction byte, and status code.</p>
  <p><strong>Status code interpretation:</strong></p>
  <ul class="def-list">
    <li><span class="mono">9000</span> — Success</li>
    <li><span class="mono">6985</span> — Conditions not satisfied (user rejected on device)</li>
    <li><span class="mono">6982</span> — Security status not satisfied (device locked or PIN not entered)</li>
    <li>Additional codes are parsed from the error knowledge base and cross-referenced against known patterns</li>
  </ul>
  <p><strong>TLV parsing:</strong> GetAppAndVersion responses (instruction <span class="mono">B001</span>) are parsed as Tag-Length-Value structures to identify which applications were open on the device during the session.</p>
  <p>Rejection counting and summary generation per session. Supports both the legacy APDU format and the LLv4 Device Management Kit (DMK) logger format used in Ledger Wallet 4.0+.</p>
</div>

<h3 id="app-detection">Installed Application Detection</h3>
<div class="card">
  <p>Three detection methods with priority fallback:</p>
  <ol class="tech-list">
    <li><strong>Manager result</strong> — full installed app list with versions and update status from <span class="mono">actions-manager-event</span> responses. Source label: <span class="mono">manager-result</span>.</li>
    <li><strong>APDU TLV parsing</strong> — GetAppAndVersion exchanges identify the running application during the session. Source label: <span class="mono">apdu-only</span>. Single app only.</li>
    <li><strong>Catalog cross-reference</strong> — <span class="mono">hw</span> install events matched against <span class="mono">apps-by-target</span> API catalog data. Source label: <span class="mono">catalog-only</span>. Covers LLv4 sessions where manager result is unavailable.</li>
  </ol>
  <p><strong>Required app inference:</strong> Account currencies are mapped to the device applications they depend on (via a 46-entry <span class="mono">CURRENCY_TO_APP</span> map). Each inferred required app is compared against the detected installed set to produce status classifications: installed + current, installed + outdated, or not installed.</p>
  <p><strong>Chain enrichment:</strong> When 2 or more accounts require the same device app, the app row lists all dependent chain tickers. Missing or outdated apps are surfaced as visual indicators on account cards.</p>
</div>
